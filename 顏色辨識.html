<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數位色彩分析儀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #1a1a1a;
            color: #e5e5e5;
            touch-action: none; /* 防止拖曳時觸發瀏覽器預設行為 */
            overflow: hidden; /* 防止整個頁面捲動，我們使用內部捲動 */
        }
        
        /* 自定義捲軸樣式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #2a2a2a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #555; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #777; 
        }

        .canvas-bg {
            background-image: 
                linear-gradient(45deg, #2a2a2a 25%, transparent 25%), 
                linear-gradient(-45deg, #2a2a2a 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #2a2a2a 75%), 
                linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        /* 準心樣式 */
        .fixed-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 20;
            display: none; 
        }
        .fixed-crosshair::before, .fixed-crosshair::after {
            content: '';
            position: absolute;
            background-color: #00ff00;
            box-shadow: 0 0 3px rgba(0,0,0,0.9);
        }
        .fixed-crosshair::before { top: 19px; left: 0; width: 40px; height: 2px; }
        .fixed-crosshair::after { top: 0; left: 19px; width: 2px; height: 40px; }
        .crosshair-circle {
            position: absolute;
            top: 50%; left: 50%;
            width: 12px; height: 12px;
            transform: translate(-50%, -50%);
            border: 2px solid #00ff00;
            border-radius: 50%;
            background: rgba(0, 255, 0, 0.1);
            z-index: 21;
        }

        /* Tab 按鈕樣式 */
        .tab-btn {
            padding: 8px 16px;
            border-radius: 8px 8px 0 0;
            font-weight: bold;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
            opacity: 0.6;
        }
        .tab-btn.active {
            background-color: #2a2a2a;
            color: #60a5fa; /* blue-400 */
            border-bottom: 2px solid #60a5fa;
            opacity: 1;
        }
        
        /* 面板數據條動畫 */
        .bar-fill { transition: width 0.1s ease-out; }
    </style>
</head>
<body class="h-screen flex flex-col w-full">

    <!-- Header Section (Fixed Height) -->
    <header class="flex-none bg-[#111] border-b border-gray-800 z-30 shadow-md">
        <div class="pt-4 pb-2 px-4 text-center">
            <h2 class="text-2xl md:text-3xl font-black text-white leading-tight">
                數位色彩分析儀 (RGB Analyzer)<br>
                <span class="text-yellow-400 text-lg md:text-xl">---阿發老師設計</span>
            </h2>
        </div>
        
        <!-- Tabs Navigation -->
        <div class="flex justify-center gap-1 px-4 mt-2">
            <button id="btnDesktop" onclick="switchMode('desktop')" class="tab-btn active text-lg">
                🖥️ 電腦版面
            </button>
            <button id="btnMobile" onclick="switchMode('mobile')" class="tab-btn text-lg">
                📱 手機版面
            </button>
        </div>
    </header>

    <!-- Upload Bar (Compact) -->
    <div class="flex-none bg-[#2a2a2a] p-2 flex justify-center border-b border-gray-700 z-20">
        <label class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded-md cursor-pointer flex items-center shadow-lg transition text-sm md:text-base">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            拍攝 / 上傳圖片
            <input type="file" id="imageInput" accept="image/*" class="hidden">
        </label>
    </div>

    <!-- Main Workspace (Flex Container) -->
    <!-- layout-container 的 class 會根據模式切換而改變 -->
    <main id="layoutContainer" class="flex-1 flex overflow-hidden relative w-full bg-gray-900">
        
        <!-- Left/Top: Image Canvas Area -->
        <!-- min-h-0 is crucial for nested flex scrolling -->
        <div id="canvasArea" class="relative bg-black flex items-center justify-center overflow-hidden canvas-bg cursor-move">
            
            <!-- Canvas: 使用 CSS 控制大小，保持比例 -->
            <canvas id="mainCanvas" class="block max-w-full max-h-full object-contain" style="transform-origin: center;"></canvas>
            
            <!-- 固定準心 -->
            <div id="fixedCrosshair" class="fixed-crosshair">
                <div class="crosshair-circle"></div>
            </div>

            <!-- 空狀態提示 -->
            <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 bg-gray-900/90 pointer-events-none p-6 text-center z-10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span class="text-lg font-medium">請點擊上方藍色按鈕<br>上傳照片或開啟相機</span>
            </div>
        </div>

        <!-- Right/Bottom: Analysis Panel -->
        <div id="analysisPanel" class="bg-gray-800 border-gray-700 shadow-xl z-20 overflow-y-auto">
            <div class="p-4 h-full flex flex-col justify-center">
                
                <div class="flex flex-row items-center gap-4 mb-2">
                    <!-- Color Preview Circle -->
                    <div class="flex flex-col items-center">
                        <div id="colorPreview" class="w-16 h-16 md:w-20 md:h-20 rounded-full shadow-inner border-4 border-gray-600 bg-black transition-colors"></div>
                        <p id="hexValue" class="text-sm md:text-base font-mono font-bold text-white mt-1">#000000</p>
                    </div>

                    <!-- Header Text -->
                    <div class="flex-1">
                        <h3 class="text-base md:text-lg font-bold text-gray-200 border-b border-gray-600 pb-1 mb-1">光譜成分分析</h3>
                        <p class="text-xs text-gray-400">移動圖片以分析準心位置顏色</p>
                    </div>
                </div>

                <!-- RGB Bars -->
                <div class="space-y-3 w-full">
                    <!-- Red -->
                    <div>
                        <div class="flex justify-between text-xs mb-0.5">
                            <span class="text-red-400 font-bold">R (紅)</span>
                            <span id="valR" class="font-mono">0</span>
                        </div>
                        <div class="h-4 bg-gray-700 rounded-full overflow-hidden">
                            <div id="barR" class="h-full bg-red-600 bar-fill" style="width: 0%"></div>
                        </div>
                    </div>
                    <!-- Green -->
                    <div>
                        <div class="flex justify-between text-xs mb-0.5">
                            <span class="text-green-400 font-bold">G (綠)</span>
                            <span id="valG" class="font-mono">0</span>
                        </div>
                        <div class="h-4 bg-gray-700 rounded-full overflow-hidden">
                            <div id="barG" class="h-full bg-green-500 bar-fill" style="width: 0%"></div>
                        </div>
                    </div>
                    <!-- Blue -->
                    <div>
                        <div class="flex justify-between text-xs mb-0.5">
                            <span class="text-blue-400 font-bold">B (藍)</span>
                            <span id="valB" class="font-mono">0</span>
                        </div>
                        <div class="h-4 bg-gray-700 rounded-full overflow-hidden">
                            <div id="barB" class="h-full bg-blue-500 bar-fill" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- Luminance -->
                <div class="mt-3 pt-2 border-t border-gray-700 flex justify-between items-center">
                    <div>
                        <span class="text-xs md:text-sm text-gray-400 block">人眼感知亮度</span>
                        <span class="text-[10px] text-gray-500">Y = 0.299R + 0.587G + 0.114B</span>
                    </div>
                    <span id="valLum" class="text-xl text-yellow-400 font-bold font-mono">0</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        // DOM Elements
        const layoutContainer = document.getElementById('layoutContainer');
        const canvasArea = document.getElementById('canvasArea');
        const analysisPanel = document.getElementById('analysisPanel');
        const btnDesktop = document.getElementById('btnDesktop');
        const btnMobile = document.getElementById('btnMobile');
        
        const imageInput = document.getElementById('imageInput');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const fixedCrosshair = document.getElementById('fixedCrosshair');
        const emptyState = document.getElementById('emptyState');

        // Data Display Elements
        const colorPreview = document.getElementById('colorPreview');
        const hexValue = document.getElementById('hexValue');
        const valR = document.getElementById('valR');
        const valG = document.getElementById('valG');
        const valB = document.getElementById('valB');
        const barR = document.getElementById('barR');
        const barG = document.getElementById('barG');
        const barB = document.getElementById('barB');
        const valLum = document.getElementById('valLum');

        // State Variables
        let currentMode = 'desktop'; // 'desktop' or 'mobile'
        let img = new Image();
        let isImageLoaded = false;
        
        // Panning Variables
        let isDragging = false;
        let startX, startY;
        let currentTranslateX = 0;
        let currentTranslateY = 0;
        let previousTranslateX = 0;
        let previousTranslateY = 0;

        // --- 1. Layout Switching Logic ---

        function switchMode(mode) {
            currentMode = mode;
            
            // Reset Classes
            layoutContainer.className = 'flex-1 flex overflow-hidden relative w-full bg-gray-900';
            canvasArea.className = 'relative bg-black flex items-center justify-center overflow-hidden canvas-bg cursor-move';
            analysisPanel.className = 'bg-gray-800 border-gray-700 shadow-xl z-20 overflow-y-auto flex-none';

            if (mode === 'desktop') {
                // Desktop Styles: Row layout, Panel on right
                layoutContainer.classList.add('flex-row');
                canvasArea.classList.add('flex-1', 'h-full');
                analysisPanel.classList.add('w-80', 'h-full', 'border-l');
                
                // Toggle Button States
                btnDesktop.classList.add('active');
                btnMobile.classList.remove('active');
            } else {
                // Mobile Styles: Column layout, Panel on bottom
                layoutContainer.classList.add('flex-col');
                canvasArea.classList.add('flex-1', 'w-full', 'min-h-0'); // min-h-0 is key for flex shrink
                analysisPanel.classList.add('w-full', 'border-t');
                
                // Toggle Button States
                btnMobile.classList.add('active');
                btnDesktop.classList.remove('active');
            }

            // If image is loaded, re-center or adjust view if needed
            if (isImageLoaded) {
                // Optional: Reset position on mode switch for better UX
                // currentTranslateX = 0;
                // currentTranslateY = 0;
                // previousTranslateX = 0;
                // previousTranslateY = 0;
                // updateCanvasTransform();
                analyzeCenter();
            }
        }

        // Initialize Default Mode
        switchMode('desktop');


        // --- 2. Image Loading & Handling ---

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                img = new Image();
                img.onload = function() {
                    // Set canvas resolution to image natural resolution
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    // Draw image
                    ctx.drawImage(img, 0, 0);
                    
                    // UI Updates
                    emptyState.style.display = 'none';
                    fixedCrosshair.style.display = 'block';
                    isImageLoaded = true;
                    
                    // Reset Position
                    currentTranslateX = 0;
                    currentTranslateY = 0;
                    previousTranslateX = 0;
                    previousTranslateY = 0;
                    updateCanvasTransform();
                    
                    // Initial Analysis
                    analyzeCenter();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });


        // --- 3. Dragging (Panning) Logic ---

        function startDrag(e) {
            if (!isImageLoaded) return;
            isDragging = true;
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            startX = clientX;
            startY = clientY;
            
            canvasArea.style.cursor = 'grabbing';
        }

        function onDrag(e) {
            if (!isDragging) return;
            e.preventDefault(); 

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const deltaX = clientX - startX;
            const deltaY = clientY - startY;

            currentTranslateX = previousTranslateX + deltaX;
            currentTranslateY = previousTranslateY + deltaY;

            updateCanvasTransform();
            analyzeCenter();
        }

        function stopDrag() {
            if (!isDragging) return;
            isDragging = false;
            previousTranslateX = currentTranslateX;
            previousTranslateY = currentTranslateY;
            canvasArea.style.cursor = 'move';
        }

        // Bind events to canvasArea (the container)
        canvasArea.addEventListener('mousedown', startDrag);
        canvasArea.addEventListener('touchstart', startDrag, { passive: false });

        window.addEventListener('mousemove', onDrag);
        window.addEventListener('touchmove', onDrag, { passive: false });

        window.addEventListener('mouseup', stopDrag);
        window.addEventListener('touchend', stopDrag);


        // --- 4. Transform & Analysis Core ---

        function updateCanvasTransform() {
            canvas.style.transform = `translate(${currentTranslateX}px, ${currentTranslateY}px)`;
        }

        function analyzeCenter() {
            if (!isImageLoaded) return;

            // Goal: Find which pixel on the source image is currently at the center of the canvasArea
            
            // 1. Get Container Center (Screen coordinates relative to viewport, or just offset)
            const areaRect = canvasArea.getBoundingClientRect();
            const centerX = areaRect.width / 2;
            const centerY = areaRect.height / 2;

            // 2. We need to map this visual center back to the Image coordinate system.
            // visualX = (imageX * scale) + translateX + (containerWidth - imageScaledWidth)/2 ... it gets complex with object-fit.
            
            // Simpler approach: 
            // The canvas is centered by flexbox.
            // Let's get the bounding rect of the CANVAS element itself (which moves and scales).
            const canvasRect = canvas.getBoundingClientRect();

            // The 'visual' center of the container is at (areaRect.left + centerX, areaRect.top + centerY).
            // We want to know what this point corresponds to inside canvasRect.
            
            const containerCenterAbsX = areaRect.left + centerX;
            const containerCenterAbsY = areaRect.top + centerY;

            // Relative position inside the canvas element (in CSS pixels)
            const offsetX = containerCenterAbsX - canvasRect.left;
            const offsetY = containerCenterAbsY - canvasRect.top;

            // 3. Convert CSS pixels to Canvas Internal Resolution pixels
            // scaleFactor = InternalWidth / DisplayWidth
            const scaleX = canvas.width / canvasRect.width;
            const scaleY = canvas.height / canvasRect.height;

            const pixelX = Math.floor(offsetX * scaleX);
            const pixelY = Math.floor(offsetY * scaleY);

            // 4. Boundary Check
            if (pixelX >= 0 && pixelX < canvas.width && pixelY >= 0 && pixelY < canvas.height) {
                const pixel = ctx.getImageData(pixelX, pixelY, 1, 1).data;
                updateUI(pixel[0], pixel[1], pixel[2]);
            } else {
                updateUI(0, 0, 0); // Out of bounds = Black
            }
        }


        // --- 5. UI Updates ---

        function updateUI(r, g, b) {
            // Colors
            const rgbString = `rgb(${r}, ${g}, ${b})`;
            colorPreview.style.backgroundColor = rgbString;
            
            // Values
            valR.textContent = r;
            valG.textContent = g;
            valB.textContent = b;
            
            // Bars
            barR.style.width = (r / 255 * 100) + '%';
            barG.style.width = (g / 255 * 100) + '%';
            barB.style.width = (b / 255 * 100) + '%';
            
            // Hex
            const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
            hexValue.textContent = hex;
            
            // Luminance
            const lum = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
            valLum.textContent = lum;
        }

        // Window resize handling (update center analysis)
        window.addEventListener('resize', () => {
            if(isImageLoaded) analyzeCenter();
        });

    </script>
</body>
</html>
