<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光學實驗室：數位色彩分析儀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #1a1a1a;
            color: #e5e5e5;
            touch-action: manipulation; /* 改善觸控體驗 */
        }
        .canvas-container {
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            cursor: crosshair;
            overflow: hidden;
            border-radius: 8px;
            background-image: 
                linear-gradient(45deg, #2a2a2a 25%, transparent 25%), 
                linear-gradient(-45deg, #2a2a2a 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #2a2a2a 75%), 
                linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        #color-preview {
            transition: background-color 0.1s;
        }
        .bar-container {
            height: 24px;
            background: #333;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            margin-bottom: 8px;
        }
        .bar-fill {
            height: 100%;
            transition: width 0.2s ease-out;
        }
        .magnifier {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid white;
            border-radius: 50%;
            pointer-events: none;
            display: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 10;
            background-repeat: no-repeat;
            background-color: white; 
        }
        /* 十字準心 (放大鏡內的) */
        .magnifier::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(0,0,0,0.5);
            background: rgba(255,0,0,0.3);
        }
        
        /* 新增：畫布上的明顯準星 */
        .crosshair-marker {
            position: absolute;
            width: 24px;
            height: 24px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
            display: none; /* 初始隱藏 */
        }
        .crosshair-marker::before, .crosshair-marker::after {
            content: '';
            position: absolute;
            background-color: #00ff00; /* 亮綠色 */
            box-shadow: 0 0 2px rgba(0,0,0,0.8); /* 陰影增加對比 */
        }
        /* 橫線 */
        .crosshair-marker::before {
            top: 11px; left: 0; width: 24px; height: 2px;
        }
        /* 直線 */
        .crosshair-marker::after {
            top: 0; left: 11px; width: 2px; height: 24px;
        }
        /* 圓圈 */
        .crosshair-circle {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 2px solid #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 2px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4">

    <!-- Header -->
    <header class="text-center mb-6 max-w-2xl w-full">
        <h1 class="text-3xl font-bold text-blue-400 mb-2">光學實驗室</h1>
        <h2 class="text-xl text-gray-300">數位色彩分析儀 (RGB Analyzer)---阿發老師設計</h2>
    </header>

    <!-- Main Tool -->
    <main class="w-full max-w-2xl bg-gray-800 p-4 rounded-xl shadow-xl border border-gray-700">
        
        <!-- Controls -->
        <div class="flex gap-4 mb-4 justify-center">
            <label class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-lg cursor-pointer flex items-center transition shadow-lg w-full justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                拍攝 / 上傳圖片
                <!-- accept="image/*" 讓手機可以選擇相機或相簿 -->
                <input type="file" id="imageInput" accept="image/*" class="hidden">
            </label>
        </div>

        <!-- Canvas Area -->
        <div class="relative w-full flex justify-center mb-6">
            <div id="canvasWrapper" class="canvas-container relative inline-block">
                <canvas id="mainCanvas" class="max-w-full block"></canvas>
                <!-- 放大鏡 (跟隨游標) -->
                <div id="magnifier" class="magnifier"></div>
                <!-- 固定準星 (顯示當前選取點) -->
                <div id="crosshairMarker" class="crosshair-marker">
                    <div class="crosshair-circle"></div>
                </div>
                <div id="emptyState" class="absolute inset-0 flex items-center justify-center text-gray-500 bg-gray-900 pointer-events-none">
                    <span>請先上傳圖片以開始分析</span>
                </div>
            </div>
        </div>

        <!-- Analysis Results -->
        <div id="analysisPanel" class="bg-gray-900 rounded-lg p-5 border border-gray-700 hidden">
            <div class="flex flex-col md:flex-row gap-6">
                
                <!-- Color Preview Box -->
                <div class="flex flex-col items-center justify-center space-y-2">
                    <div id="colorPreview" class="w-24 h-24 rounded-full shadow-inner border-4 border-gray-700"></div>
                    <div class="text-center">
                        <p class="text-gray-400 text-sm">HEX 代碼</p>
                        <p id="hexValue" class="text-xl font-mono font-bold text-white">#000000</p>
                    </div>
                </div>

                <!-- RGB Data Visualization -->
                <div class="flex-1 space-y-3">
                    <h3 class="text-lg font-semibold text-gray-200 border-b border-gray-700 pb-1">光譜成分分析</h3>
                    
                    <!-- Red Channel -->
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-red-400 font-bold">R (紅光強度)</span>
                            <span id="valR" class="font-mono">0</span>
                        </div>
                        <div class="bar-container">
                            <div id="barR" class="bar-fill bg-red-600" style="width: 0%"></div>
                        </div>
                    </div>

                    <!-- Green Channel -->
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-green-400 font-bold">G (綠光強度)</span>
                            <span id="valG" class="font-mono">0</span>
                        </div>
                        <div class="bar-container">
                            <div id="barG" class="bar-fill bg-green-600" style="width: 0%"></div>
                        </div>
                    </div>

                    <!-- Blue Channel -->
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-blue-400 font-bold">B (藍光強度)</span>
                            <span id="valB" class="font-mono">0</span>
                        </div>
                        <div class="bar-container">
                            <div id="barB" class="bar-fill bg-blue-600" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <!-- Physics Insight: Luminance -->
                    <div class="mt-4 pt-2 border-t border-gray-700">
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-400">人眼感知亮度 (Luminance)</span>
                            <span id="valLum" class="text-yellow-400 font-bold font-mono">0</span>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">公式: Y = 0.299R + 0.587G + 0.114B (綠光貢獻最大)</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-8 text-gray-500 text-xs text-center">
        <p>設計者：動畫大師 | 適用於高中物理光學教學</p>
        <p>原理：HTML5 Canvas getImageData 像素讀取</p>
    </footer>

    <script>
        const imageInput = document.getElementById('imageInput');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const canvasWrapper = document.getElementById('canvasWrapper');
        const emptyState = document.getElementById('emptyState');
        const analysisPanel = document.getElementById('analysisPanel');
        const magnifier = document.getElementById('magnifier');
        const crosshairMarker = document.getElementById('crosshairMarker');

        // Result Elements
        const colorPreview = document.getElementById('colorPreview');
        const hexValue = document.getElementById('hexValue');
        const valR = document.getElementById('valR');
        const valG = document.getElementById('valG');
        const valB = document.getElementById('valB');
        const barR = document.getElementById('barR');
        const barG = document.getElementById('barG');
        const barB = document.getElementById('barB');
        const valLum = document.getElementById('valLum');

        let img = new Image();
        let isImageLoaded = false;

        // 1. 處理圖片上傳與繪製
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                img = new Image();
                img.onload = function() {
                    // 設定 Canvas 尺寸以符合圖片比例，但限制最大寬度以適應螢幕
                    const maxWidth = Math.min(800, window.innerWidth - 32); // 留一點邊距
                    const scale = maxWidth / img.width;
                    
                    canvas.width = maxWidth;
                    canvas.height = img.height * scale;

                    // 繪製圖片
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    // UI 更新
                    emptyState.style.display = 'none';
                    analysisPanel.classList.remove('hidden');
                    isImageLoaded = true;

                    // 分析中心點作為初始值
                    pickColor(canvas.width / 2, canvas.height / 2);
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // 2. 顏色拾取邏輯 (滑鼠/觸控)
        function handleInteraction(e) {
            if (!isImageLoaded) return;
            e.preventDefault(); // 防止手機上滾動

            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;

            if (e.type.includes('touch')) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            // 計算在 Canvas 內的座標
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            // 確保座標在範圍內
            if (x >= 0 && x <= canvas.width && y >= 0 && y <= canvas.height) {
                pickColor(x, y);
                updateMagnifier(clientX, clientY, x, y);
            }
        }

        function stopMagnifier() {
             magnifier.style.display = 'none';
        }

        // 綁定事件
        canvas.addEventListener('mousedown', (e) => {
            handleInteraction(e);
            canvas.addEventListener('mousemove', handleInteraction);
        });
        
        window.addEventListener('mouseup', () => {
            canvas.removeEventListener('mousemove', handleInteraction);
            stopMagnifier();
        });

        canvas.addEventListener('touchstart', (e) => {
            handleInteraction(e);
            canvas.addEventListener('touchmove', handleInteraction);
        }, { passive: false });

        window.addEventListener('touchend', () => {
            canvas.removeEventListener('touchmove', handleInteraction);
            stopMagnifier();
        });

        // 3. 核心物理運算：讀取像素並分析
        function pickColor(x, y) {
            // 獲取該座標的像素資料 (1x1 像素)
            // getImageData 返回陣列 [R, G, B, Alpha]
            const pixel = ctx.getImageData(x, y, 1, 1).data;
            const r = pixel[0];
            const g = pixel[1];
            const b = pixel[2];
            
            // 更新準星位置 (顯示當前選取的像素位置)
            crosshairMarker.style.left = x + 'px';
            crosshairMarker.style.top = y + 'px';
            crosshairMarker.style.display = 'block';

            updateUI(r, g, b);
        }

        // 4. 更新放大鏡
        function updateMagnifier(clientX, clientY, canvasX, canvasY) {
            magnifier.style.display = 'block';
            
            // 放大鏡跟隨游標，稍微偏移避免擋住手指
            magnifier.style.left = (clientX - 50) + 'px';
            magnifier.style.top = (clientY - 80) + 'px';

            // 設定放大鏡背景
            // 使用 background-image 顯示原始 canvas 的局部
            // 透過計算 background-position 來模擬放大效果
            const zoom = 2;
            magnifier.style.backgroundImage = "url('" + canvas.toDataURL() + "')";
            magnifier.style.backgroundSize = (canvas.width * zoom) + "px " + (canvas.height * zoom) + "px";
            
            const bgPosX = -(canvasX * zoom - magnifier.offsetWidth / 2);
            const bgPosY = -(canvasY * zoom - magnifier.offsetHeight / 2);
            
            magnifier.style.backgroundPosition = `${bgPosX}px ${bgPosY}px`;
        }

        // 5. 數據呈現與計算
        function updateUI(r, g, b) {
            // 背景預覽
            const rgbString = `rgb(${r}, ${g}, ${b})`;
            colorPreview.style.backgroundColor = rgbString;

            // 數值顯示
            valR.textContent = r;
            valG.textContent = g;
            valB.textContent = b;

            // 長條圖寬度 (相對於 255 的百分比)
            barR.style.width = (r / 255 * 100) + '%';
            barG.style.width = (g / 255 * 100) + '%';
            barB.style.width = (b / 255 * 100) + '%';

            // HEX 轉換
            const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
            hexValue.textContent = hex;

            // 亮度計算 (Luminance) - 這是物理學/人眼感知的重要部分
            // Rec. 601 標準
            const luminance = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
            valLum.textContent = luminance;
        }
    </script>
</body>
</html>
