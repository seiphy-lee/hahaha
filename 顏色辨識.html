<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數位色彩分析儀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #1a1a1a;
            color: #e5e5e5;
            touch-action: none; /* 防止拖曳時觸發瀏覽器預設行為(如下拉重整) */
            overflow-x: hidden;
        }
        .canvas-container {
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            cursor: move; /* 游標改為移動圖示 */
            overflow: hidden;
            border-radius: 8px;
            background-image: 
                linear-gradient(45deg, #2a2a2a 25%, transparent 25%), 
                linear-gradient(-45deg, #2a2a2a 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #2a2a2a 75%), 
                linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            /* 預設高度，載入圖片後會調整 */
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #mainCanvas {
            /* 讓 Canvas 可以被 transform 移動 */
            transform-origin: center;
            will-change: transform;
        }

        #color-preview {
            transition: background-color 0.1s;
        }
        .bar-container {
            height: 24px;
            background: #333;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            margin-bottom: 8px;
        }
        .bar-fill {
            height: 100%;
            transition: width 0.1s ease-out;
        }
        
        /* 修改：固定在容器正中央的準心 */
        .fixed-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            transform: translate(-50%, -50%);
            pointer-events: none; /* 讓點擊事件穿透到下方的 Canvas */
            z-index: 20;
            display: none; /* 初始隱藏，載入圖片後顯示 */
        }
        /* 準心的樣式設計 */
        .fixed-crosshair::before, .fixed-crosshair::after {
            content: '';
            position: absolute;
            background-color: #00ff00; /* 亮綠色 */
            box-shadow: 0 0 3px rgba(0,0,0,0.9);
        }
        /* 橫線 */
        .fixed-crosshair::before {
            top: 19px; left: 0; width: 40px; height: 2px;
        }
        /* 直線 */
        .fixed-crosshair::after {
            top: 0; left: 19px; width: 2px; height: 40px;
        }
        /* 中央小圈圈 */
        .crosshair-circle {
            position: absolute;
            top: 50%; left: 50%;
            width: 12px; height: 12px;
            transform: translate(-50%, -50%);
            border: 2px solid #00ff00;
            border-radius: 50%;
            background: rgba(0, 255, 0, 0.1);
            z-index: 21;
        }

    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4">

    <!-- Header Update -->
    <header class="text-center mb-6 max-w-4xl w-full">
        <!-- 移除「光學實驗室」h1，將主要標題放大 2 倍 (text-4xl/5xl) -->
        <h2 class="text-4xl md:text-5xl font-black text-white mb-2 leading-tight">
            數位色彩分析儀 (RGB Analyzer)<br>
            <!-- 阿發老師設計 改成黃色 -->
            <span class="text-yellow-400 text-3xl md:text-4xl">---阿發老師設計</span>
        </h2>
    </header>

    <!-- Main Tool -->
    <main class="w-full max-w-2xl bg-gray-800 p-4 rounded-xl shadow-xl border border-gray-700">
        
        <!-- Controls -->
        <div class="flex gap-4 mb-4 justify-center">
            <label class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-lg cursor-pointer flex items-center transition shadow-lg w-full justify-center text-xl">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                拍攝 / 上傳圖片
                <!-- accept="image/*" 讓手機可以選擇相機或相簿 -->
                <input type="file" id="imageInput" accept="image/*" class="hidden">
            </label>
        </div>

        <!-- Canvas Area -->
        <div class="relative w-full flex justify-center mb-6">
            <div id="canvasWrapper" class="canvas-container w-full">
                <!-- Canvas 初始是隱藏的，直到圖片載入 -->
                <canvas id="mainCanvas" class="block"></canvas>
                
                <!-- 固定在正中央的準心 -->
                <div id="fixedCrosshair" class="fixed-crosshair">
                    <div class="crosshair-circle"></div>
                </div>

                <div id="emptyState" class="absolute inset-0 flex items-center justify-center text-gray-400 bg-gray-900 pointer-events-none p-4 text-center">
                    <span class="text-lg">點擊上方按鈕上傳照片<br>拖曳移動照片以分析中心點顏色</span>
                </div>
            </div>
        </div>

        <!-- Analysis Results -->
        <div id="analysisPanel" class="bg-gray-900 rounded-lg p-5 border border-gray-700 hidden">
            <div class="flex flex-col md:flex-row gap-6">
                
                <!-- Color Preview Box -->
                <div class="flex flex-col items-center justify-center space-y-2">
                    <div id="colorPreview" class="w-24 h-24 rounded-full shadow-inner border-4 border-gray-700"></div>
                    <div class="text-center">
                        <p class="text-gray-400 text-sm">HEX 代碼</p>
                        <p id="hexValue" class="text-xl font-mono font-bold text-white">#000000</p>
                    </div>
                </div>

                <!-- RGB Data Visualization -->
                <div class="flex-1 space-y-3">
                    <h3 class="text-lg font-semibold text-gray-200 border-b border-gray-700 pb-1">光譜成分分析</h3>
                    
                    <!-- Red Channel -->
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-red-400 font-bold">R (紅光強度)</span>
                            <span id="valR" class="font-mono">0</span>
                        </div>
                        <div class="bar-container">
                            <div id="barR" class="bar-fill bg-red-600" style="width: 0%"></div>
                        </div>
                    </div>

                    <!-- Green Channel -->
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-green-400 font-bold">G (綠光強度)</span>
                            <span id="valG" class="font-mono">0</span>
                        </div>
                        <div class="bar-container">
                            <div id="barG" class="bar-fill bg-green-600" style="width: 0%"></div>
                        </div>
                    </div>

                    <!-- Blue Channel -->
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-blue-400 font-bold">B (藍光強度)</span>
                            <span id="valB" class="font-mono">0</span>
                        </div>
                        <div class="bar-container">
                            <div id="barB" class="bar-fill bg-blue-600" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <!-- Physics Insight: Luminance -->
                    <div class="mt-4 pt-2 border-t border-gray-700">
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-400">人眼感知亮度 (Luminance)</span>
                            <span id="valLum" class="text-yellow-400 font-bold font-mono">0</span>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">公式: Y = 0.299R + 0.587G + 0.114B (綠光貢獻最大)</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 移除原本的 Footer -->

    <script>
        const imageInput = document.getElementById('imageInput');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const canvasWrapper = document.getElementById('canvasWrapper');
        const emptyState = document.getElementById('emptyState');
        const analysisPanel = document.getElementById('analysisPanel');
        const fixedCrosshair = document.getElementById('fixedCrosshair');

        // Result Elements
        const colorPreview = document.getElementById('colorPreview');
        const hexValue = document.getElementById('hexValue');
        const valR = document.getElementById('valR');
        const valG = document.getElementById('valG');
        const valB = document.getElementById('valB');
        const barR = document.getElementById('barR');
        const barG = document.getElementById('barG');
        const barB = document.getElementById('barB');
        const valLum = document.getElementById('valLum');

        let img = new Image();
        let isImageLoaded = false;
        
        // 拖曳相關變數
        let isDragging = false;
        let startX, startY;
        let currentTranslateX = 0;
        let currentTranslateY = 0;
        let previousTranslateX = 0;
        let previousTranslateY = 0;

        // 1. 處理圖片上傳與初始繪製
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                img = new Image();
                img.onload = function() {
                    // 根據容器寬度調整 Canvas 大小
                    // 我們希望圖片能夠比較大，方便拖曳，所以這裡設定最小寬度為容器寬度
                    const containerWidth = canvasWrapper.clientWidth;
                    const scale = containerWidth / img.width;
                    
                    // 讓 Canvas 寬度至少填滿容器，如果需要更細緻的體驗可以把倍率調大
                    canvas.width = containerWidth; 
                    canvas.height = img.height * scale;

                    // 繪製圖片
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    // 重置位置
                    currentTranslateX = 0;
                    currentTranslateY = 0;
                    previousTranslateX = 0;
                    previousTranslateY = 0;
                    updateCanvasTransform();

                    // UI 更新
                    emptyState.style.display = 'none';
                    analysisPanel.classList.remove('hidden');
                    fixedCrosshair.style.display = 'block';
                    isImageLoaded = true;
                    
                    // 強制設定容器高度以符合初始圖片高度 (避免容器塌陷)
                    canvasWrapper.style.height = canvas.height + 'px';

                    // 立即分析正中央
                    analyzeCenter();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // 2. 拖曳邏輯 (滑鼠 + 觸控)
        
        // 開始拖曳
        function startDrag(e) {
            if (!isImageLoaded) return;
            isDragging = true;
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            startX = clientX;
            startY = clientY;
            
            canvasWrapper.style.cursor = 'grabbing';
        }

        // 拖曳中
        function onDrag(e) {
            if (!isDragging) return;
            e.preventDefault(); // 防止滾動頁面

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const deltaX = clientX - startX;
            const deltaY = clientY - startY;

            currentTranslateX = previousTranslateX + deltaX;
            currentTranslateY = previousTranslateY + deltaY;

            updateCanvasTransform();
            analyzeCenter(); // 拖曳時即時分析
        }

        // 結束拖曳
        function stopDrag() {
            if (!isDragging) return;
            isDragging = false;
            previousTranslateX = currentTranslateX;
            previousTranslateY = currentTranslateY;
            canvasWrapper.style.cursor = 'move';
        }

        // 綁定事件監聽器
        canvasWrapper.addEventListener('mousedown', startDrag);
        canvasWrapper.addEventListener('touchstart', startDrag, { passive: false });

        window.addEventListener('mousemove', onDrag);
        window.addEventListener('touchmove', onDrag, { passive: false });

        window.addEventListener('mouseup', stopDrag);
        window.addEventListener('touchend', stopDrag);
        window.addEventListener('mouseleave', stopDrag); // 滑鼠離開視窗

        // 更新 Canvas 的 CSS Transform
        function updateCanvasTransform() {
            canvas.style.transform = `translate(${currentTranslateX}px, ${currentTranslateY}px)`;
        }

        // 3. 核心運算：分析正中央的顏色
        function analyzeCenter() {
            if (!isImageLoaded) return;

            // 取得容器尺寸
            const wrapperRect = canvasWrapper.getBoundingClientRect();
            const centerX = wrapperRect.width / 2;
            const centerY = wrapperRect.height / 2;

            // 計算中心點對應到 Canvas 內部的座標
            // 公式：Canvas座標 = 容器中心點座標 - Canvas偏移量
            // 需要注意的是，因為 canvas 預設是置中的 (由 CSS display: flex)，
            // 其實偏移量是相對於 Canvas 自身原點的。
            // 簡化邏輯：
            // Canvas 的左上角在容器內的座標是 (WrapperWidth - CanvasWidth)/2 + TranslateX (假設 flex center)
            // 但我們直接看相對移動：
            // 當 TranslateX = 0, Canvas 正中央對準容器正中央
            
            const canvasCenterX = canvas.width / 2;
            const canvasCenterY = canvas.height / 2;
            
            // 螢幕中心點在 Canvas 上的座標 = Canvas中心 - 移動距離
            // 例如：向左移 (-100px)，代表我們想看右邊的內容，所以取樣點 X 應該是 CenterX + 100
            // 等等，向左移是 translateX 為負。
            // 如果 Canvas 往左移 (-50)，原本在中央的像素跑到左邊去了，
            // 此時螢幕中央對應到的 Canvas 像素應該是原本中央偏右的像素。
            // 所以：SampleX = CanvasCenter - TranslateX
            
            let sampleX = Math.round(canvasCenterX - currentTranslateX);
            let sampleY = Math.round(canvasCenterY - currentTranslateY);

            // 邊界檢查：如果移出範圍，就不取樣 (或顯示黑色)
            if (sampleX < 0 || sampleX >= canvas.width || sampleY < 0 || sampleY >= canvas.height) {
                // Out of bounds
                updateUI(0, 0, 0);
                return;
            }

            // 獲取像素資料
            const pixel = ctx.getImageData(sampleX, sampleY, 1, 1).data;
            updateUI(pixel[0], pixel[1], pixel[2]);
        }

        // 4. 數據呈現
        function updateUI(r, g, b) {
            // 背景預覽
            const rgbString = `rgb(${r}, ${g}, ${b})`;
            colorPreview.style.backgroundColor = rgbString;

            // 數值顯示
            valR.textContent = r;
            valG.textContent = g;
            valB.textContent = b;

            // 長條圖寬度
            barR.style.width = (r / 255 * 100) + '%';
            barG.style.width = (g / 255 * 100) + '%';
            barB.style.width = (b / 255 * 100) + '%';

            // HEX 轉換
            const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
            hexValue.textContent = hex;

            // 亮度計算
            const luminance = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
            valLum.textContent = luminance;
        }
    </script>
</body>
</html>
