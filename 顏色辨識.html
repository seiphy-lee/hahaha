<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數位色彩分析儀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #1a1a1a;
            color: #e5e5e5;
            touch-action: none;
            overflow: hidden;
        }
        
        /* 畫布背景紋理 */
        .canvas-bg {
            background-image: 
                linear-gradient(45deg, #2a2a2a 25%, transparent 25%), 
                linear-gradient(-45deg, #2a2a2a 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #2a2a2a 75%), 
                linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        /* 準心樣式 */
        .fixed-crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 40px; height: 40px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 20;
            display: none; 
        }
        .fixed-crosshair::before, .fixed-crosshair::after {
            content: '';
            position: absolute;
            background-color: #00ff00;
            box-shadow: 0 0 3px rgba(0,0,0,0.9);
        }
        .fixed-crosshair::before { top: 19px; left: 0; width: 40px; height: 2px; }
        .fixed-crosshair::after { top: 0; left: 19px; width: 2px; height: 40px; }
        .crosshair-circle {
            position: absolute;
            top: 50%; left: 50%;
            width: 12px; height: 12px;
            transform: translate(-50%, -50%);
            border: 2px solid #00ff00;
            border-radius: 50%;
            background: rgba(0, 255, 0, 0.1);
            z-index: 21;
        }
        
        /* 隱藏卷軸但保留功能 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 模式切換動畫 */
        .view-section {
            transition: opacity 0.3s ease;
        }
        .hidden-view {
            display: none !important;
            opacity: 0;
        }
    </style>
</head>
<body class="h-screen w-full relative bg-[#111]">

    <!-- 共用的檔案上傳 Input (隱藏) -->
    <input type="file" id="imageInput" accept="image/*" class="hidden">

    <!-- ========================================== -->
    <!-- 1. 登入首頁 (Landing View) -->
    <!-- ========================================== -->
    <div id="view-landing" class="view-section fixed inset-0 z-50 bg-[#111] flex flex-col items-center justify-center p-4">
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-5xl font-black text-white mb-4 leading-tight">
                數位色彩分析儀 (RGB Analyzer)<br>
                <span class="text-yellow-400 text-2xl md:text-3xl">---阿發老師設計</span>
            </h1>
        </div>
        
        <div class="flex flex-col md:flex-row gap-6 w-full max-w-4xl justify-center">
            <!-- 電腦版按鈕 -->
            <button onclick="switchMode('desktop')" class="group relative flex-1 bg-[#1a4b6e] hover:bg-[#23689b] text-white p-10 rounded-2xl shadow-2xl transition transform hover:scale-105 border-2 border-[#3381b0]">
                <div class="text-center">
                    <span class="text-6xl mb-4 block">🖥️</span>
                    <h2 class="text-3xl font-bold mb-2">電腦版面</h2>
                    <p class="text-blue-200">適合桌機、大螢幕操作</p>
                    <p class="text-blue-200 text-sm">詳細數據與圖表</p>
                </div>
            </button>
            
            <!-- 手機版按鈕 -->
            <button onclick="switchMode('mobile')" class="group relative flex-1 bg-[#1a6e4b] hover:bg-[#239b65] text-white p-10 rounded-2xl shadow-2xl transition transform hover:scale-105 border-2 border-[#33b074]">
                <div class="text-center">
                    <span class="text-6xl mb-4 block">📱</span>
                    <h2 class="text-3xl font-bold mb-2">手機版面</h2>
                    <p class="text-green-200">適合手機、平板操作</p>
                    <p class="text-green-200 text-sm">滿版畫面、大字體數據</p>
                </div>
            </button>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- 2. 電腦模式 (Desktop View) -->
    <!-- ========================================== -->
    <div id="view-desktop" class="view-section hidden-view h-full flex flex-col">
        <!-- Header -->
        <header class="flex-none bg-[#1a1a1a] border-b border-gray-800 p-3 flex justify-between items-center shadow-md z-30">
            <h2 class="text-xl font-bold text-white pl-4">
                數位色彩分析儀 <span class="text-yellow-400 text-sm">---阿發老師設計</span>
            </h2>
            <div class="flex gap-3">
                <button onclick="triggerUpload()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded shadow flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    上傳圖片
                </button>
                <button onclick="switchMode('landing')" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded shadow">
                    回首頁
                </button>
            </div>
        </header>

        <!-- Workspace -->
        <div class="flex-1 flex overflow-hidden">
            <!-- Canvas Container (Desktop) -->
            <div id="desktop-canvas-container" class="flex-1 relative bg-black flex items-center justify-center overflow-hidden canvas-bg cursor-move">
                <!-- Canvas 會透過 JS 移動到這裡 -->
                <div id="desktop-placeholder" class="text-gray-500">照片區</div>
            </div>

            <!-- Sidebar Panel -->
            <div class="w-80 bg-gray-800 border-l border-gray-700 shadow-xl overflow-y-auto z-20 flex-none">
                <div class="p-6 space-y-6">
                    <!-- Preview -->
                    <div class="flex flex-col items-center">
                        <div id="deskPreview" class="w-24 h-24 rounded-full shadow-inner border-4 border-gray-600 bg-black mb-2 transition-colors"></div>
                        <p id="deskHex" class="text-xl font-mono font-bold text-white">#000000</p>
                        <p class="text-gray-400 text-sm mt-1">光譜成分分析</p>
                    </div>

                    <!-- Bars -->
                    <div class="space-y-4">
                        <div>
                            <div class="flex justify-between text-sm mb-1"><span class="text-red-400 font-bold">R</span><span id="deskR" class="font-mono">0</span></div>
                            <div class="h-4 bg-gray-900 rounded-full overflow-hidden"><div id="deskBarR" class="h-full bg-red-600 transition-all duration-100" style="width: 0%"></div></div>
                        </div>
                        <div>
                            <div class="flex justify-between text-sm mb-1"><span class="text-green-400 font-bold">G</span><span id="deskG" class="font-mono">0</span></div>
                            <div class="h-4 bg-gray-900 rounded-full overflow-hidden"><div id="deskBarG" class="h-full bg-green-500 transition-all duration-100" style="width: 0%"></div></div>
                        </div>
                        <div>
                            <div class="flex justify-between text-sm mb-1"><span class="text-blue-400 font-bold">B</span><span id="deskB" class="font-mono">0</span></div>
                            <div class="h-4 bg-gray-900 rounded-full overflow-hidden"><div id="deskBarB" class="h-full bg-blue-500 transition-all duration-100" style="width: 0%"></div></div>
                        </div>
                    </div>

                    <!-- Luminance -->
                    <div class="pt-4 border-t border-gray-700">
                        <div class="flex justify-between items-end">
                            <span class="text-gray-400 text-sm">感知亮度</span>
                            <span id="deskLum" class="text-2xl text-yellow-400 font-bold font-mono">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- 3. 手機模式 (Mobile View) -->
    <!-- ========================================== -->
    <div id="view-mobile" class="view-section hidden-view h-full flex flex-col bg-[#102a43]">
        <!-- Top Bar (Compressed Height: p-1, py-1) -->
        <div class="flex-none p-1 flex gap-2 bg-[#243b53] border-b border-[#334e68] shadow-lg z-30">
            <button onclick="triggerUpload()" class="flex-1 bg-blue-600 active:bg-blue-700 text-white font-bold py-1 px-4 rounded-lg flex items-center justify-center text-base shadow">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                拍攝 / 上傳
            </button>
            <button onclick="switchMode('landing')" class="flex-none bg-[#00a846] active:bg-[#008f3b] text-white font-bold py-1 px-4 rounded-lg shadow whitespace-nowrap text-base">
                退出手機版面
            </button>
        </div>

        <!-- Stats Panel (Moved to Top, Below Buttons) -->
        <div class="flex-none bg-[#102a43] border-b-2 border-[#334e68] p-3 pb-3 z-30 shadow-md">
            <div class="flex items-center gap-4">
                <!-- Preview Circle -->
                <div class="flex flex-col items-center justify-center pl-2">
                    <div id="mobPreview" class="w-16 h-16 rounded-full border-4 border-[#bcccdc] bg-black shadow-lg"></div>
                    <div id="mobHex" class="text-[#bcccdc] font-mono text-xs font-bold mt-1 tracking-wider">#000000</div>
                </div>

                <!-- Numerical Stats -->
                <div class="flex-1 grid grid-cols-3 gap-2 text-center">
                    <div class="flex flex-col">
                        <!-- R, G, B 字體放大 2 倍 (text-sm -> text-3xl) -->
                        <span class="text-red-400 font-bold text-3xl">R</span>
                        <span id="mobR" class="text-white font-mono text-3xl font-bold drop-shadow-md">0</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-green-400 font-bold text-3xl">G</span>
                        <span id="mobG" class="text-white font-mono text-3xl font-bold drop-shadow-md">0</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-blue-400 font-bold text-3xl">B</span>
                        <span id="mobB" class="text-white font-mono text-3xl font-bold drop-shadow-md">0</span>
                    </div>
                </div>
            </div>
            
            <!-- Mobile Hints -->
            <div class="text-center mt-2">
                <p class="text-[#486581] text-xs">移動圖片以偵測準心顏色</p>
            </div>
        </div>

        <!-- Main Image Area (Full Screen, At Bottom) -->
        <div id="mobile-canvas-container" class="flex-1 relative bg-black flex items-center justify-center overflow-hidden canvas-bg w-full">
            <!-- Canvas 會透過 JS 移動到這裡 -->
            <div id="mobile-placeholder" class="text-gray-500 text-xl font-bold select-none">+<br>這裡是照片區</div>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- 共用元件：Canvas & 準心 -->
    <!-- ========================================== -->
    <!-- 這個 div 是一個載體，會根據模式被 appendChild 到 desktop-canvas-container 或 mobile-canvas-container -->
    <div id="shared-canvas-wrapper" class="absolute inset-0 flex items-center justify-center w-full h-full" style="display: none;">
        <canvas id="mainCanvas" class="block max-w-none" style="transform-origin: center;"></canvas>
        
        <!-- 固定準心 -->
        <div id="fixedCrosshair" class="fixed-crosshair">
            <div class="crosshair-circle"></div>
        </div>
    </div>


    <script>
        // State
        let currentMode = 'landing';
        let img = new Image();
        let isImageLoaded = false;
        
        // Panning State
        let isDragging = false;
        let startX, startY;
        let currentTranslateX = 0;
        let currentTranslateY = 0;
        let previousTranslateX = 0;
        let previousTranslateY = 0;

        // DOM Elements
        const viewLanding = document.getElementById('view-landing');
        const viewDesktop = document.getElementById('view-desktop');
        const viewMobile = document.getElementById('view-mobile');
        
        const desktopContainer = document.getElementById('desktop-canvas-container');
        const mobileContainer = document.getElementById('mobile-canvas-container');
        const sharedWrapper = document.getElementById('shared-canvas-wrapper');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const imageInput = document.getElementById('imageInput');
        
        const fixedCrosshair = document.getElementById('fixedCrosshair');
        
        // Desktop UI Refs
        const deskRefs = {
            preview: document.getElementById('deskPreview'),
            hex: document.getElementById('deskHex'),
            r: document.getElementById('deskR'),
            g: document.getElementById('deskG'),
            b: document.getElementById('deskB'),
            barR: document.getElementById('deskBarR'),
            barG: document.getElementById('deskBarG'),
            barB: document.getElementById('deskBarB'),
            lum: document.getElementById('deskLum')
        };

        // Mobile UI Refs
        const mobRefs = {
            preview: document.getElementById('mobPreview'),
            hex: document.getElementById('mobHex'),
            r: document.getElementById('mobR'),
            g: document.getElementById('mobG'),
            b: document.getElementById('mobB')
        };

        // --- 1. Mode Switching ---
        function switchMode(mode) {
            currentMode = mode;
            
            // Hide all first
            viewLanding.classList.add('hidden-view');
            viewDesktop.classList.add('hidden-view');
            viewMobile.classList.add('hidden-view');

            if (mode === 'landing') {
                viewLanding.classList.remove('hidden-view');
                // Hide canvas wrapper when in landing
                sharedWrapper.style.display = 'none';
            } 
            else if (mode === 'desktop') {
                viewDesktop.classList.remove('hidden-view');
                // Move canvas to desktop container
                document.getElementById('desktop-placeholder').style.display = 'none';
                desktopContainer.appendChild(sharedWrapper);
                sharedWrapper.style.display = isImageLoaded ? 'flex' : 'none';
                
                // Recalculate layout
                if(isImageLoaded) requestAnimationFrame(fitImageToContainer);
            } 
            else if (mode === 'mobile') {
                viewMobile.classList.remove('hidden-view');
                // Move canvas to mobile container
                document.getElementById('mobile-placeholder').style.display = 'none';
                mobileContainer.appendChild(sharedWrapper);
                sharedWrapper.style.display = isImageLoaded ? 'flex' : 'none';
                
                // Recalculate layout
                if(isImageLoaded) requestAnimationFrame(fitImageToContainer);
            }
        }

        function triggerUpload() {
            imageInput.click();
        }

        // --- 2. Image Handling ---
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                img = new Image();
                img.onload = function() {
                    // Set canvas resolution
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    isImageLoaded = true;
                    sharedWrapper.style.display = 'flex';
                    
                    // Hide placeholders
                    document.getElementById('desktop-placeholder').style.display = 'none';
                    document.getElementById('mobile-placeholder').style.display = 'none';
                    fixedCrosshair.style.display = 'block';

                    // Reset Pan
                    currentTranslateX = 0;
                    currentTranslateY = 0;
                    previousTranslateX = 0;
                    previousTranslateY = 0;
                    
                    // Initial Layout
                    fitImageToContainer();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
            // Reset input so same file can be selected again
            imageInput.value = '';
        });

        // Fit Image Logic:
        function fitImageToContainer() {
            if (!isImageLoaded) return;
            
            // Just center the canvas transform
            updateCanvasTransform();
            analyzeCenter();
        }

        // --- 3. Panning Logic ---
        function startDrag(e) {
            if (!isImageLoaded) return;
            isDragging = true;
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX;
            startY = clientY;
            
            sharedWrapper.style.cursor = 'grabbing';
        }

        function onDrag(e) {
            if (!isDragging) return;
            e.preventDefault(); 

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const deltaX = clientX - startX;
            const deltaY = clientY - startY;

            currentTranslateX = previousTranslateX + deltaX;
            currentTranslateY = previousTranslateY + deltaY;

            updateCanvasTransform();
            analyzeCenter();
        }

        function stopDrag() {
            if (!isDragging) return;
            isDragging = false;
            previousTranslateX = currentTranslateX;
            previousTranslateY = currentTranslateY;
            sharedWrapper.style.cursor = 'move';
        }

        // Attach listeners to the shared wrapper so it works in both containers
        sharedWrapper.addEventListener('mousedown', startDrag);
        sharedWrapper.addEventListener('touchstart', startDrag, { passive: false });
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('touchmove', onDrag, { passive: false });
        window.addEventListener('mouseup', stopDrag);
        window.addEventListener('touchend', stopDrag);

        function updateCanvasTransform() {
            canvas.style.transform = `translate(${currentTranslateX}px, ${currentTranslateY}px)`;
        }

        // --- 4. Analysis Logic ---
        function analyzeCenter() {
            if (!isImageLoaded) return;

            // Determine which container is active to get correct bounds
            const activeContainer = currentMode === 'desktop' ? desktopContainer : mobileContainer;
            const containerRect = activeContainer.getBoundingClientRect();
            
            // Visual Center of Container
            const centerX = containerRect.width / 2;
            const centerY = containerRect.height / 2;
            
            // Canvas Position relative to visual center
            
            const canvasCenterX = canvas.width / 2;
            const canvasCenterY = canvas.height / 2;
            
            const pixelX = Math.floor(canvasCenterX - currentTranslateX);
            const pixelY = Math.floor(canvasCenterY - currentTranslateY);

            // Boundary Check
            if (pixelX >= 0 && pixelX < canvas.width && pixelY >= 0 && pixelY < canvas.height) {
                const pixel = ctx.getImageData(pixelX, pixelY, 1, 1).data;
                updateUI(pixel[0], pixel[1], pixel[2]);
            } else {
                updateUI(0, 0, 0);
            }
        }

        // --- 5. UI Update ---
        function updateUI(r, g, b) {
            const rgbString = `rgb(${r}, ${g}, ${b})`;
            const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
            const lum = Math.round(0.299 * r + 0.587 * g + 0.114 * b);

            // Update Desktop UI
            if (currentMode === 'desktop') {
                deskRefs.preview.style.backgroundColor = rgbString;
                deskRefs.hex.textContent = hex;
                deskRefs.r.textContent = r;
                deskRefs.g.textContent = g;
                deskRefs.b.textContent = b;
                deskRefs.barR.style.width = (r/255*100) + '%';
                deskRefs.barG.style.width = (g/255*100) + '%';
                deskRefs.barB.style.width = (b/255*100) + '%';
                deskRefs.lum.textContent = lum;
            }

            // Update Mobile UI
            if (currentMode === 'mobile') {
                mobRefs.preview.style.backgroundColor = rgbString;
                mobRefs.hex.textContent = hex;
                mobRefs.r.textContent = r;
                mobRefs.g.textContent = g;
                mobRefs.b.textContent = b;
            }
        }

        // Window resize handling
        window.addEventListener('resize', () => {
            if(isImageLoaded) analyzeCenter();
        });

    </script>
</body>
</html>
