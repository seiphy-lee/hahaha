<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課堂共同評分系統 v2.2 (穩定版)</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 和 ReactDOM (UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- 引入 Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* 錯誤控制台樣式 */
        #global-error-box { display: none; position: fixed; top: 0; left: 0; width: 100%; padding: 20px; background: #fee2e2; color: #b91c1c; z-index: 9999; border-bottom: 2px solid #ef4444; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- 全域錯誤顯示區 (當白畫面時會顯示錯誤) -->
    <div id="global-error-box">
        <h3 class="font-bold text-lg">⚠️ 發生系統錯誤</h3>
        <pre id="global-error-msg" class="mt-2 text-sm whitespace-pre-wrap"></pre>
        <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">重新整理頁面</button>
    </div>

    <!-- React 根目錄 -->
    <div id="root"></div>

    <!-- 錯誤攔截腳本 -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            document.getElementById('global-error-box').style.display = 'block';
            document.getElementById('global-error-msg').innerText = 
                `錯誤訊息: ${message}\n位置: 第 ${lineno} 行\n請截圖此畫面給開發者。`;
            return false;
        };
    </script>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, query, where, getDocs, serverTimestamp, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        
        // --- 1. Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyCJLf_DTpyH635GHh2bvDV-US1SB3ffxJA",
            authDomain: "seiphy-2d96d.firebaseapp.com",
            projectId: "seiphy-2d96d",
            storageBucket: "seiphy-2d96d.firebasestorage.app",
            messagingSenderId: "1021000469423",
            appId: "1:1021000469423:web:56a1a7cdbcfdf21265fd5a",
            measurementId: "G-N5ERFCSDS7"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const SESSION_ID = "class_demo_session_v2";

        // --- 2. Icons ---
        const Icons = {
            Award: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>,
            User: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            Lock: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
            Play: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>,
            Square: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>,
            BarChart3: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
            AlertCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Key: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>,
            Trash2: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        };

        // --- 3. Main App ---
        function App() {
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const [sessionData, setSessionData] = React.useState(null);
            const [role, setRole] = React.useState(null); 
            const [errorMsg, setErrorMsg] = React.useState(null);
            
            const [showTeacherAuth, setShowTeacherAuth] = React.useState(false);
            const [teacherPwdInput, setTeacherPwdInput] = React.useState('');
            const [isSettingUpPwd, setIsSettingUpPwd] = React.useState(false);

            React.useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, u => {
                    setUser(u);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            React.useEffect(() => {
                if (!user) return;
                const unsub = onSnapshot(doc(db, 'sessions', SESSION_ID), (docSnap) => {
                    if (docSnap.exists()) {
                        setSessionData(docSnap.data());
                    } else {
                        // 初始化資料
                        const initialData = {
                            status: 'setup',
                            currentGroupId: null,
                            showResults: false,
                            criteria: [
                                { id: 'c1', name: '內容深度', max: 10 },
                                { id: 'c2', name: '表達技巧', max: 10 },
                                { id: 'c3', name: '投影片設計', max: 10 }
                            ],
                            groups: [],
                            students: [],
                            studentMappings: {}, 
                            teacherPassword: null
                        };
                        setDoc(doc(db, 'sessions', SESSION_ID), initialData);
                    }
                }, err => {
                    console.error(err);
                    setErrorMsg("無法讀取資料，請確認資料庫權限或網路連線。");
                });
                return () => unsub();
            }, [user]);

            const handleLogin = async () => {
                try {
                    setErrorMsg(null);
                    await signInWithPopup(auth, new GoogleAuthProvider());
                } catch (e) {
                    if (e.code === 'auth/unauthorized-domain') {
                        setErrorMsg(`網域未授權！請新增此網址到 Firebase: ${window.location.hostname}`);
                    } else {
                        setErrorMsg(`登入錯誤: ${e.message}`);
                    }
                }
            };

            const verifyTeacher = async () => {
                if (!teacherPwdInput) return;
                if (isSettingUpPwd) {
                    if (!/^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{10,}$/.test(teacherPwdInput)) {
                        setErrorMsg("密碼需至少10碼且含英數字"); return;
                    }
                    await setDoc(doc(db, 'sessions', SESSION_ID), { teacherPassword: teacherPwdInput }, { merge: true });
                } else {
                    if (teacherPwdInput !== sessionData?.teacherPassword) {
                        setErrorMsg("密碼錯誤"); return;
                    }
                }
                setRole('teacher');
                setShowTeacherAuth(false);
            };

            if (loading) return <div className="h-screen flex items-center justify-center">載入中...</div>;

            if (!user) {
                return (
                    <div className="h-screen flex items-center justify-center bg-gray-100 p-4">
                        <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center">
                            <Icons.Award />
                            <h1 className="text-2xl font-bold mt-4 mb-2">課堂共同評分系統 v2.2</h1>
                            <p className="text-gray-500 mb-6">請使用學校 Google 帳號登入</p>
                            {errorMsg && <div className="bg-red-50 text-red-600 p-3 rounded mb-4 text-sm text-left">{errorMsg}</div>}
                            <button onClick={handleLogin} className="w-full py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center justify-center gap-2">
                                <Icons.User /> Google 登入
                            </button>
                        </div>
                    </div>
                );
            }

            if (!role) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center bg-gray-50 p-4 gap-4">
                        <h2 className="text-xl font-bold mb-4">請選擇您的身份</h2>
                        <button onClick={() => setRole('student')} className="w-64 p-6 bg-white border-2 border-transparent hover:border-blue-500 rounded-xl shadow transition text-center">
                            <div className="flex justify-center text-blue-500 mb-2"><Icons.Users /></div>
                            <span className="font-bold text-lg">我是學生</span>
                        </button>
                        <button onClick={() => {
                            if (!sessionData?.teacherPassword) setIsSettingUpPwd(true);
                            else setIsSettingUpPwd(false);
                            setShowTeacherAuth(true);
                            setTeacherPwdInput('');
                            setErrorMsg(null);
                        }} className="w-64 p-6 bg-white border-2 border-transparent hover:border-purple-500 rounded-xl shadow transition text-center">
                            <div className="flex justify-center text-purple-500 mb-2"><Icons.Key /></div>
                            <span className="font-bold text-lg">我是老師</span>
                        </button>
                        <button onClick={() => auth.signOut()} className="mt-8 text-gray-500 underline">登出</button>

                        {showTeacherAuth && (
                            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                                <div className="bg-white p-6 rounded-xl w-full max-w-sm animate-fade-in">
                                    <h3 className="text-xl font-bold mb-4 flex gap-2 items-center"><Icons.Lock /> {isSettingUpPwd ? "設定管理密碼" : "輸入管理密碼"}</h3>
                                    {isSettingUpPwd && <p className="text-xs text-blue-600 mb-2">首次使用請設定 (至少10碼英數混合)</p>}
                                    <input type="password" value={teacherPwdInput} onChange={e=>setTeacherPwdInput(e.target.value)} className="w-full border p-2 rounded mb-2" placeholder="密碼" />
                                    {errorMsg && <p className="text-red-500 text-sm mb-2">{errorMsg}</p>}
                                    <div className="flex gap-2">
                                        <button onClick={()=>setShowTeacherAuth(false)} className="flex-1 bg-gray-100 py-2 rounded">取消</button>
                                        <button onClick={verifyTeacher} className="flex-1 bg-purple-600 text-white py-2 rounded">確認</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 pb-10">
                    <header className="bg-white shadow px-4 py-3 sticky top-0 z-20 flex justify-between items-center">
                        <div className="flex items-center gap-2 text-blue-600 font-bold">
                            <Icons.Award /> 評分系統 v2.2
                        </div>
                        <div className="flex items-center gap-3">
                            <span className="text-sm text-gray-600 truncate max-w-[100px]">{user.displayName}</span>
                            <button onClick={()=>signOut(auth)} className="text-gray-500"><Icons.LogOut /></button>
                        </div>
                    </header>
                    <main className="max-w-5xl mx-auto p-4">
                        {role === 'teacher' ? <TeacherDashboard session={sessionData} /> : <StudentView session={sessionData} user={user} />}
                    </main>
                </div>
            );
        }

        // --- Teacher Dashboard ---
        function TeacherDashboard({ session }) {
            const [tab, setTab] = React.useState('control'); 
            const [votes, setVotes] = React.useState([]);
            const [batchGroups, setBatchGroups] = React.useState('');
            const [batchStudents, setBatchStudents] = React.useState('');
            const [newCriName, setNewCriName] = React.useState('');
            const [newCriMax, setNewCriMax] = React.useState(10);

            React.useEffect(() => {
                const q = query(collection(db, 'sessions', SESSION_ID, 'votes'));
                const unsub = onSnapshot(q, snap => {
                    const data = [];
                    snap.forEach(d => data.push({id: d.id, ...d.data()}));
                    setVotes(data);
                });
                return () => unsub();
            }, []);

            const updateSession = (data) => setDoc(doc(db, 'sessions', SESSION_ID), data, { merge: true });

            if (!session) return <div className="p-10 text-center text-gray-500">正在讀取資料...</div>;

            const handleBatchGroups = async () => {
                const list = batchGroups.split('\n').map(s=>s.trim()).filter(s=>s);
                const newGroups = list.map(name => ({ id: `g${Date.now()}_${Math.random().toString(36).substr(2,5)}`, name }));
                await updateSession({ groups: [...(session.groups||[]), ...newGroups] });
                setBatchGroups('');
                alert(`已新增 ${newGroups.length} 個組別`);
            };

            const handleBatchStudents = async () => {
                const list = batchStudents.split('\n').map(s=>s.trim()).filter(s=>s);
                const currentSet = new Set(session.students || []);
                list.forEach(name => currentSet.add(name));
                await updateSession({ students: Array.from(currentSet) });
                setBatchStudents('');
                alert(`名單更新完成，目前共 ${currentSet.size} 人`);
            };

            const addCriteria = async () => {
                if(!newCriName) return;
                const newC = { id: `c_${Date.now()}`, name: newCriName, max: parseInt(newCriMax) };
                await updateSession({ criteria: [...(session.criteria||[]), newC] });
                setNewCriName('');
            };

            const removeCriteria = async (id) => {
                if(!confirm("確定刪除此評分項目？")) return;
                await updateSession({ criteria: session.criteria.filter(c => c.id !== id) });
            };

            const deleteVote = async (voteId) => {
                if(!confirm("確定刪除此筆評分？")) return;
                await deleteDoc(doc(db, 'sessions', SESSION_ID, 'votes', voteId));
            };

            const loggedInCount = Object.keys(session.studentMappings || {}).length;
            const currentGroupVotes = votes.filter(v => v.groupId === session.currentGroupId);
            
            const getGroupStats = (groupId) => {
                const groupVotes = votes.filter(v => v.groupId === groupId);
                let total = 0;
                groupVotes.forEach(v => {
                    let vSum = 0;
                    (session.criteria || []).forEach(c => vSum += (v.scores[c.id] || 0));
                    total += vSum;
                });
                return {
                    count: groupVotes.length,
                    avg: groupVotes.length ? (total / groupVotes.length).toFixed(1) : 0
                };
            };

            return (
                <div className="space-y-6">
                    <div className="flex bg-white rounded-lg p-1 shadow-sm overflow-x-auto">
                        {[{id: 'control', label: '控制台'}, {id: 'setup', label: '名單設定'}, {id: 'criteria', label: '評分標準'}, {id: 'monitor', label: '監控與修正'}]
                        .map(t => (
                            <button key={t.id} onClick={()=>setTab(t.id)} className={`flex-1 py-2 px-4 whitespace-nowrap text-sm font-bold rounded-md ${tab===t.id ? 'bg-blue-50 text-blue-700' : 'text-gray-500'}`}>
                                {t.label}
                            </button>
                        ))}
                    </div>

                    {tab === 'control' && (
                        <div className="bg-white rounded-xl shadow p-6 space-y-6">
                            <div className="flex justify-between items-center bg-gray-50 p-4 rounded-lg">
                                <div>
                                    <p className="text-gray-500 text-xs font-bold uppercase">目前登入學生</p>
                                    <p className="text-2xl font-bold text-blue-600">{loggedInCount} <span className="text-sm text-gray-400">/ {(session.students||[]).length}</span></p>
                                </div>
                                {session.currentGroupId && (
                                    <div>
                                        <p className="text-gray-500 text-xs font-bold uppercase text-right">評分進度</p>
                                        <p className="text-2xl font-bold text-green-600 text-right">{currentGroupVotes.length} <span className="text-sm text-gray-400">人已評</span></p>
                                    </div>
                                )}
                            </div>
                            <h3 className="font-bold text-lg border-b pb-2">報告流程控制</h3>
                            <div className="space-y-3">
                                {(session.groups||[]).length === 0 && <p className="text-gray-400 py-4 text-center">尚未設定組別</p>}
                                {(session.groups||[]).map(g => (
                                    <div key={g.id} className={`flex justify-between items-center p-4 border rounded-lg ${session.currentGroupId === g.id ? 'border-green-500 bg-green-50 ring-1 ring-green-500' : ''}`}>
                                        <span className="font-bold text-lg">{g.name}</span>
                                        {session.currentGroupId === g.id ? (
                                            <button onClick={()=>updateSession({currentGroupId: null})} className="px-4 py-2 bg-white border border-red-200 text-red-600 rounded font-bold hover:bg-red-50">停止評分</button>
                                        ) : (
                                            <button onClick={()=>updateSession({currentGroupId: g.id, showResults: false})} disabled={!!session.currentGroupId} className={`px-4 py-2 rounded font-bold ${session.currentGroupId ? 'bg-gray-100 text-gray-400' : 'bg-blue-600 text-white hover:bg-blue-700'}`}>開始評分</button>
                                        )}
                                    </div>
                                ))}
                            </div>
                            <div className="pt-4 border-t">
                                <button onClick={()=>updateSession({showResults: !session.showResults})} className={`w-full py-4 rounded-xl font-bold text-lg ${session.showResults ? 'bg-amber-100 text-amber-800' : 'bg-gray-800 text-white'}`}>
                                    {session.showResults ? '隱藏排行榜' : '公佈排行榜 (學生可見)'}
                                </button>
                            </div>
                        </div>
                    )}

                    {tab === 'setup' && (
                        <div className="grid md:grid-cols-2 gap-6">
                            <div className="bg-white rounded-xl shadow p-6">
                                <h3 className="font-bold text-lg mb-4 flex items-center gap-2"><Icons.Users/> 學生名單管理</h3>
                                <p className="text-xs text-gray-500 mb-2">請貼上全班姓名，一行一個名字</p>
                                <textarea className="w-full h-40 border p-2 rounded text-sm mb-2" placeholder="王小明&#10;李大華..." value={batchStudents} onChange={e=>setBatchStudents(e.target.value)}></textarea>
                                <button onClick={handleBatchStudents} className="w-full py-2 bg-blue-600 text-white rounded font-bold mb-4">更新學生名單</button>
                                <div className="bg-gray-50 p-3 rounded h-48 overflow-y-auto flex flex-wrap gap-2">
                                    {(session.students||[]).map(s => {
                                        const isRegistered = Object.values(session.studentMappings||{}).includes(s);
                                        return <span key={s} className={`text-xs px-2 py-1 rounded border ${isRegistered ? 'bg-green-100 text-green-700' : 'bg-white text-gray-600'}`}>{s}</span>;
                                    })}
                                </div>
                            </div>
                            <div className="bg-white rounded-xl shadow p-6">
                                <h3 className="font-bold text-lg mb-4 flex items-center gap-2"><Icons.Award/> 分組名單管理</h3>
                                <p className="text-xs text-gray-500 mb-2">請貼上組別名稱，一行一個</p>
                                <textarea className="w-full h-40 border p-2 rounded text-sm mb-2" placeholder="第一組...&#10;第二組..." value={batchGroups} onChange={e=>setBatchGroups(e.target.value)}></textarea>
                                <button onClick={handleBatchGroups} className="w-full py-2 bg-blue-600 text-white rounded font-bold mb-4">新增組別</button>
                                <div className="bg-gray-50 p-3 rounded h-48 overflow-y-auto space-y-2">
                                    {(session.groups||[]).map((g,i) => (
                                        <div key={g.id} className="text-sm bg-white p-2 rounded border flex justify-between">
                                            <span>{i+1}. {g.name}</span>
                                            <button onClick={async()=>{ if(confirm("刪除?")) await updateSession({ groups: session.groups.filter(x=>x.id!==g.id) }); }} className="text-red-400"><Icons.Trash2 /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {tab === 'criteria' && (
                        <div className="bg-white rounded-xl shadow p-6">
                            <h3 className="font-bold text-lg mb-6">評分標準設定</h3>
                            <div className="flex gap-4 mb-6 items-end bg-blue-50 p-4 rounded-lg">
                                <div className="flex-1">
                                    <label className="text-xs font-bold text-gray-500">項目名稱</label>
                                    <input type="text" value={newCriName} onChange={e=>setNewCriName(e.target.value)} className="w-full border p-2 rounded" />
                                </div>
                                <div className="w-24">
                                    <label className="text-xs font-bold text-gray-500">最高分</label>
                                    <input type="number" value={newCriMax} onChange={e=>setNewCriMax(e.target.value)} className="w-full border p-2 rounded" />
                                </div>
                                <button onClick={addCriteria} className="bg-blue-600 text-white px-6 py-2 rounded font-bold h-10">新增</button>
                            </div>
                            <div className="space-y-2">
                                {(session.criteria||[]).map(c => (
                                    <div key={c.id} className="flex justify-between items-center p-4 border rounded-lg bg-white">
                                        <div className="flex items-center gap-4">
                                            <span className="font-bold text-lg text-gray-700">{c.name}</span>
                                            <span className="text-xs bg-gray-100 px-2 py-1 rounded text-gray-500">0 ~ {c.max} 分</span>
                                        </div>
                                        <button onClick={()=>removeCriteria(c.id)} className="text-red-500 hover:bg-red-50 p-2 rounded"><Icons.Trash2/></button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {tab === 'monitor' && (
                        <div className="space-y-6">
                            <div className="bg-white rounded-xl shadow p-6">
                                <h3 className="font-bold text-lg mb-4">即時異常管理</h3>
                                <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                    {(session.groups||[]).map(g => {
                                        const stats = getGroupStats(g.id);
                                        return (
                                            <button key={g.id} onClick={()=>setTab(`group_${g.id}`)} className="text-left p-4 border rounded-xl hover:border-blue-500 hover:shadow-md transition bg-white">
                                                <div className="font-bold truncate">{g.name}</div>
                                                <div className="flex justify-between mt-2 text-sm">
                                                    <span className="text-gray-500">{stats.count} 筆評分</span>
                                                    <span className="font-bold text-blue-600">均分 {stats.avg}</span>
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {tab.startsWith('group_') && (
                        <GroupDetailView 
                            groupId={tab.replace('group_', '')} 
                            session={session} 
                            votes={votes} 
                            onBack={()=>setTab('monitor')}
                            onDelete={deleteVote}
                        />
                    )}
                </div>
            );
        }

        function GroupDetailView({ groupId, session, votes, onBack, onDelete }) {
            const group = session.groups.find(g => g.id === groupId);
            const groupVotes = votes
                .filter(v => v.groupId === groupId)
                .map(v => {
                    let total = 0;
                    (session.criteria||[]).forEach(c => total += (v.scores[c.id] || 0));
                    return { ...v, totalScore: total };
                })
                .sort((a, b) => b.totalScore - a.totalScore);

            return (
                <div className="bg-white rounded-xl shadow p-6">
                    <div className="flex items-center gap-4 mb-6 border-b pb-4">
                        <button onClick={onBack} className="text-gray-500 hover:text-gray-800">← 返回</button>
                        <h2 className="text-xl font-bold">{group?.name} - 詳細評分紀錄</h2>
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-gray-50 text-gray-500 uppercase">
                                <tr>
                                    <th className="p-3">學生姓名</th>
                                    <th className="p-3 text-right">總分</th>
                                    {(session.criteria||[]).map(c => <th key={c.id} className="p-3 text-right hidden md:table-cell">{c.name}</th>)}
                                    <th className="p-3 text-center">操作</th>
                                </div>
                            </thead>
                            <tbody>
                                {groupVotes.map(v => (
                                    <tr key={v.id} className="border-b hover:bg-gray-50">
                                        <td className="p-3 font-bold">{v.studentName || v.userName || "未知"}</td>
                                        <td className="p-3 text-right font-bold text-blue-600">{v.totalScore}</td>
                                        {(session.criteria||[]).map(c => <td key={c.id} className="p-3 text-right text-gray-500 hidden md:table-cell">{v.scores[c.id]}</td>)}
                                        <td className="p-3 text-center">
                                            <button onClick={()=>onDelete(v.id)} className="text-red-500 hover:bg-red-100 p-2 rounded"><Icons.Trash2/></button>
                                        </td>
                                    </tr>
                                ))}
                                {groupVotes.length === 0 && <tr><td colSpan="10" className="p-8 text-center text-gray-400">目前尚無評分</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function StudentView({ session, user }) {
            const [selectedName, setSelectedName] = React.useState('');
            const [hasVoted, setHasVoted] = React.useState(false);
            const [scores, setScores] = React.useState({});
            const [submitting, setSubmitting] = React.useState(false);

            const registeredName = session?.studentMappings?.[user.uid];

            React.useEffect(() => {
                if (registeredName && session?.currentGroupId) {
                    const q = query(collection(db, 'sessions', SESSION_ID, 'votes'), 
                        where('groupId', '==', session.currentGroupId), 
                        where('userId', '==', user.uid));
                    getDocs(q).then(snap => setHasVoted(!snap.empty));
                } else {
                    setHasVoted(false);
                    setScores({});
                }
            }, [session?.currentGroupId, user.uid, registeredName]);

            if (!session) return <div className="h-screen flex items-center justify-center text-gray-500">連結教室中...</div>;

            const handleRegister = async () => {
                if (!selectedName) return;
                const isTaken = Object.values(session.studentMappings || {}).includes(selectedName);
                if (isTaken) { alert("此姓名已被其他裝置綁定！"); return; }
                const update = {};
                update[`studentMappings.${user.uid}`] = selectedName;
                await updateDoc(doc(db, 'sessions', SESSION_ID), update);
            };

            const submitVote = async () => {
                if (session.criteria.some(c => scores[c.id] === undefined)) { alert("請完成所有評分項目！"); return; }
                setSubmitting(true);
                try {
                    await setDoc(doc(collection(db, 'sessions', SESSION_ID, 'votes')), {
                        userId: user.uid, studentName: registeredName, groupId: session.currentGroupId, scores, timestamp: serverTimestamp()
                    });
                    setHasVoted(true);
                } catch(e) { alert("送出失敗"); } finally { setSubmitting(false); }
            };

            if (!registeredName) {
                const availableStudents = (session.students || []).filter(name => !Object.values(session.studentMappings || {}).includes(name));
                return (
                    <div className="max-w-md mx-auto bg-white rounded-xl shadow p-8 text-center mt-10">
                        <Icons.User />
                        <h2 className="text-xl font-bold mt-4 mb-2">歡迎，請確認您的身分</h2>
                        {(session.students||[]).length === 0 ? (
                            <div className="text-red-500 bg-red-50 p-4 rounded text-sm">老師尚未建立學生名單，請通知老師。</div>
                        ) : (
                            <div className="space-y-4">
                                <select className="w-full p-3 border rounded-lg bg-gray-50" value={selectedName} onChange={e=>setSelectedName(e.target.value)}>
                                    <option value="">-- 請選擇您的姓名 --</option>
                                    {availableStudents.map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                                <button onClick={handleRegister} disabled={!selectedName} className="w-full py-3 bg-blue-600 text-white rounded-lg font-bold disabled:bg-gray-300">確認綁定</button>
                            </div>
                        )}
                    </div>
                );
            }

            if (session.showResults) return <ResultsBoard session={session} votes={[]} criteria={session.criteria} isAdmin={false} />;

            if (!session.currentGroupId) return (
                <div className="text-center py-20 bg-white rounded-xl shadow">
                    <div className="text-blue-600 font-bold mb-2 text-lg">嗨，{registeredName}</div>
                    <div className="text-gray-300 flex justify-center mb-4"><Icons.Lock /></div>
                    <h2 className="font-bold text-xl">等待評分開始...</h2>
                </div>
            );

            if (hasVoted) return (
                <div className="text-center py-20 bg-green-50 rounded-xl shadow">
                    <div className="text-green-600 flex justify-center mb-4"><Icons.CheckCircle /></div>
                    <h2 className="font-bold text-xl text-green-800">評分已送出！</h2>
                    <p className="text-green-600 mt-2">休息一下，等待下一組。</p>
                </div>
            );

            const currentGroup = session.groups.find(g => g.id === session.currentGroupId);
            return (
                <div className="bg-white rounded-xl shadow-lg p-6 space-y-8 animate-fade-in">
                    <div className="border-b pb-4">
                        <div className="text-gray-500 text-xs font-bold mb-1">評分者：{registeredName}</div>
                        <h2 className="text-2xl font-bold text-blue-800">正在評分：{currentGroup?.name}</h2>
                    </div>
                    {session.criteria.map(c => (
                        <div key={c.id} className="space-y-2">
                            <div className="flex justify-between">
                                <label className="font-bold text-lg text-gray-700">{c.name}</label>
                                <span className="text-xs bg-gray-100 px-2 py-1 rounded text-gray-500">最高 {c.max} 分</span>
                            </div>
                            <div className="flex items-center gap-4">
                                <input type="range" min="0" max={c.max} step="1" value={scores[c.id] || 0} onChange={e => setScores({...scores, [c.id]: parseInt(e.target.value)})} className="w-full h-4 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600" />
                                <div className="w-12 h-12 flex items-center justify-center bg-blue-50 text-blue-700 font-bold text-xl rounded-lg border border-blue-100 shadow-sm">{scores[c.id] || 0}</div>
                            </div>
                        </div>
                    ))}
                    <button onClick={submitVote} disabled={submitting} className="w-full py-4 bg-blue-600 text-white rounded-xl font-bold text-lg shadow hover:bg-blue-700 hover:shadow-lg transition-all active:scale-95 disabled:bg-gray-400">
                        {submitting ? '資料傳送中...' : '確認送出分數'}
                    </button>
                </div>
            );
        }

        function ResultsBoard({ session, votes, criteria, isAdmin }) {
            const [results, setResults] = React.useState([]);

            React.useEffect(() => {
                getDocs(query(collection(db, 'sessions', SESSION_ID, 'votes'))).then(snap => {
                    const allVotes = [];
                    snap.forEach(d => allVotes.push(d.data()));
                    const groupStats = {};
                    allVotes.forEach(v => {
                        if (!groupStats[v.groupId]) groupStats[v.groupId] = { total: 0, count: 0 };
                        let vTotal = 0;
                        (session.criteria||[]).forEach(c => vTotal += (v.scores[c.id] || 0));
                        groupStats[v.groupId].total += vTotal;
                        groupStats[v.groupId].count++;
                    });
                    const res = (session.groups||[]).map(g => ({
                        ...g, avg: groupStats[g.id]?.count ? (groupStats[g.id].total / groupStats[g.id].count).toFixed(2) : "0.00"
                    })).sort((a, b) => b.avg - a.avg);
                    setResults(res);
                });
            }, [session]);

            return (
                <div className="bg-white p-6 rounded-xl shadow border border-gray-100">
                    <h2 className="text-2xl font-bold mb-6 flex items-center gap-2 text-gray-800"><Icons.BarChart3 /> 最終排行榜</h2>
                    <div className="space-y-3">
                        {results.map((g, i) => (
                            <div key={g.id} className={`flex justify-between items-center p-4 rounded-xl transition-all ${i === 0 ? 'bg-yellow-50 border-2 border-yellow-300 transform scale-105' : 'border border-gray-100 bg-white'}`}>
                                <div className="flex items-center gap-4">
                                    <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg text-white shadow ${i===0?'bg-yellow-400':i===1?'bg-gray-400':i===2?'bg-orange-400':'bg-gray-200 text-gray-500'}`}>{i+1}</div>
                                    <span className={`text-lg ${i===0 ? 'font-bold text-gray-900' : 'text-gray-700'}`}>{g.name}</span>
                                </div>
                                <div className="text-right">
                                    <span className="text-3xl font-bold text-blue-600 block">{g.avg}</span>
                                    <span className="text-xs text-gray-400">平均總分</span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
