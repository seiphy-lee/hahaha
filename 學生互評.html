<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課堂共同評分系統 v2.3 (名單管理版)</title>
    <!-- 引入 Tailwind CSS (美化介面) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- 引入 Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .animate-fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="root"></div>

    <!-- 主程式碼 -->
    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, updateDoc, onSnapshot, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // --- Firebase 設定 ---
        const firebaseConfig = {
            apiKey: "AIzaSyCJLf_DTpyH635GHh2bvDV-US1SB3ffxJA",
            authDomain: "seiphy-2d96d.firebaseapp.com",
            projectId: "seiphy-2d96d",
            storageBucket: "seiphy-2d96d.firebasestorage.app",
            messagingSenderId: "1021000469423",
            appId: "1:1021000469423:web:56a1a7cdbcfdf21265fd5a",
            measurementId: "G-N5ERFCSDS7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const DEFAULT_CRITERIA = [
            { id: 'c1', name: '內容深度', weight: 30, max: 10 },
            { id: 'c2', name: '表達技巧', weight: 20, max: 10 },
            { id: 'c3', name: '投影片設計', weight: 20, max: 10 },
            { id: 'c4', name: '團隊合作', weight: 15, max: 10 },
            { id: 'c5', name: '時間控制', weight: 15, max: 10 },
        ];
        const SESSION_ID = "class_demo_session_v1";

        // --- Icons ---
        const Icons = {
            Award: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>,
            User: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            Lock: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
            Play: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>,
            Square: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>,
            BarChart3: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
            AlertCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Key: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        };

        function App() {
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const [sessionData, setSessionData] = React.useState(null);
            const [role, setRole] = React.useState(null);
            const [errorMsg, setErrorMsg] = React.useState(null);
            
            // 老師密碼相關狀態
            const [showTeacherAuth, setShowTeacherAuth] = React.useState(false); 
            const [teacherPwdInput, setTeacherPwdInput] = React.useState('');
            const [isSettingUpPwd, setIsSettingUpPwd] = React.useState(false); 

            React.useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            React.useEffect(() => {
                if (!user) return;
                const sessionRef = doc(db, 'sessions', SESSION_ID);
                const unsubscribe = onSnapshot(sessionRef, (docSnap) => {
                    if (docSnap.exists()) {
                        setSessionData(docSnap.data());
                    } else {
                        // 初始化資料
                        const initialData = {
                            status: 'setup', 
                            currentGroupId: null, 
                            showResults: false, 
                            criteria: DEFAULT_CRITERIA, 
                            groups: [],
                            students: [], // 新增：學生名單
                            studentMappings: {}, // 新增：uid 對應 學生姓名
                            teacherPassword: null 
                        };
                        setDoc(doc(db, 'sessions', SESSION_ID), initialData).catch(e => console.error(e));
                    }
                }, (error) => {
                    console.error("Session Error", error);
                    if(error.code === 'permission-denied') {
                        setErrorMsg("權限錯誤：請確認 Firestore 資料庫規則是否已設為 'Test Mode'。");
                    }
                });
                return () => unsubscribe();
            }, [user]);

            const handleLogin = async () => {
                setErrorMsg(null);
                const provider = new GoogleAuthProvider();
                try {
                    await signInWithPopup(auth, provider);
                } catch (error) {
                    console.error("Login failed", error);
                    let msg = `登入錯誤 (${error.code})：${error.message}`;
                    if (error.code === 'auth/unauthorized-domain') {
                        msg = `網域未授權！\n請複製此網址：${window.location.hostname}\n並將其新增至 Firebase Console -> Authentication -> Settings -> Authorized Domains。`;
                    }
                    setErrorMsg(msg);
                }
            };

            const handleTeacherClick = () => {
                if (sessionData && sessionData.teacherPassword) {
                    setIsSettingUpPwd(false);
                } else {
                    setIsSettingUpPwd(true);
                }
                setShowTeacherAuth(true);
                setTeacherPwdInput('');
                setErrorMsg(null);
            };

            const handleTeacherAuthSubmit = async () => {
                if (!teacherPwdInput) return;

                if (isSettingUpPwd) {
                    const isValid = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{10,}$/.test(teacherPwdInput);
                    if (!isValid) {
                        setErrorMsg("密碼格式不符：請輸入至少 10 碼，且包含英文與數字。");
                        return;
                    }
                    try {
                        await setDoc(doc(db, 'sessions', SESSION_ID), { teacherPassword: teacherPwdInput }, { merge: true });
                        setRole('teacher');
                        setShowTeacherAuth(false);
                    } catch (e) {
                        setErrorMsg("設定失敗，請檢查網路連線。");
                    }
                } else {
                    if (teacherPwdInput === sessionData.teacherPassword) {
                        setRole('teacher');
                        setShowTeacherAuth(false);
                    } else {
                        setErrorMsg("密碼錯誤，請重新輸入。");
                    }
                }
            };

            if (loading) return <div className="flex items-center justify-center h-screen">載入中...</div>;

            if (!user) {
                return (
                    <div className="flex flex-col items-center justify-center h-screen bg-gray-100 p-4">
                        <div className="bg-white p-8 rounded-xl shadow-lg max-w-md w-full text-center">
                            <div className="text-blue-600 mb-4 flex justify-center"><Icons.Award /></div>
                            <h1 className="text-2xl font-bold text-gray-800 mb-2">課堂共同評分系統</h1>
                            <p className="text-gray-500 mb-6">請使用學校 Google 帳號登入</p>
                            
                            {errorMsg && (
                                <div className="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg text-left text-sm text-red-700 whitespace-pre-wrap break-all">
                                    <div className="flex items-center gap-2 font-bold mb-1"><Icons.AlertCircle /> 錯誤</div>
                                    {errorMsg}
                                </div>
                            )}

                            <button onClick={handleLogin} className="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors">
                                <Icons.User /> Google 登入
                            </button>

                            <div className="mt-8 pt-4 border-t text-xs text-gray-400">
                                <p>目前網址: {window.location.hostname || '無法偵測'}</p>
                            </div>
                        </div>
                    </div>
                );
            }

            if (!role) {
                return (
                    <div className="flex flex-col items-center justify-center h-screen bg-gray-50 p-4">
                        <div className="max-w-md w-full grid gap-4">
                            <h2 className="text-xl font-bold text-center mb-4">請選擇您的身份</h2>
                            
                            <button onClick={() => setRole('student')} className="flex flex-col items-center p-6 bg-white border-2 border-transparent hover:border-blue-500 rounded-xl shadow-sm transition-all">
                                <div className="text-blue-500 mb-2"><Icons.Users /></div>
                                <span className="text-lg font-bold">我是學生</span>
                            </button>
                            
                            <button onClick={handleTeacherClick} className="flex flex-col items-center p-6 bg-white border-2 border-transparent hover:border-purple-500 rounded-xl shadow-sm transition-all">
                                <div className="text-purple-500 mb-2"><Icons.Key /></div>
                                <span className="text-lg font-bold">我是老師 (需密碼)</span>
                            </button>
                        </div>
                        <button onClick={() => auth.signOut()} className="mt-8 text-gray-500 hover:text-gray-700 underline">登出</button>

                        {showTeacherAuth && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                                <div className="bg-white rounded-xl p-6 max-w-sm w-full shadow-2xl animate-fade-in">
                                    <h3 className="text-xl font-bold mb-4 flex items-center gap-2">
                                        <Icons.Lock /> 
                                        {isSettingUpPwd ? "設定管理員密碼" : "輸入管理員密碼"}
                                    </h3>
                                    
                                    {isSettingUpPwd && (
                                        <div className="mb-4 text-sm text-gray-500 bg-blue-50 p-3 rounded">
                                            首次使用，請設定一組管理密碼。<br/>
                                            <span className="font-bold text-blue-700">規則：至少 10 碼，需包含英文與數字。</span>
                                        </div>
                                    )}

                                    <input 
                                        type="password" 
                                        value={teacherPwdInput}
                                        onChange={(e) => setTeacherPwdInput(e.target.value)}
                                        placeholder={isSettingUpPwd ? "設定新密碼" : "請輸入密碼"}
                                        className="w-full px-4 py-2 border rounded-lg mb-2 focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                    
                                    {errorMsg && <p className="text-red-500 text-sm mb-3">{errorMsg}</p>}

                                    <div className="flex gap-2 mt-4">
                                        <button onClick={() => { setShowTeacherAuth(false); setErrorMsg(null); }} className="flex-1 py-2 text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200">取消</button>
                                        <button onClick={handleTeacherAuthSubmit} className="flex-1 py-2 text-white bg-purple-600 rounded-lg hover:bg-purple-700 font-bold">確認</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 pb-10">
                    <header className="bg-white shadow-sm px-4 py-3 flex justify-between items-center sticky top-0 z-10">
                        <div className="flex items-center gap-2 text-blue-600">
                            <Icons.Award />
                            <span className="font-bold text-gray-800">課堂評分系統</span>
                            <span className={`px-2 py-0.5 rounded text-xs font-medium ${role === 'teacher' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}`}>
                                {role === 'teacher' ? '老師模式' : '學生模式'}
                            </span>
                        </div>
                        <div className="flex items-center gap-3">
                            <span className="text-sm text-gray-600 truncate max-w-[100px]">{user.displayName}</span>
                            <button onClick={() => signOut(auth)} className="p-2 hover:bg-gray-100 rounded-full text-gray-500"><Icons.LogOut /></button>
                        </div>
                    </header>
                    <main className="max-w-4xl mx-auto p-4">
                        {role === 'teacher' ? <TeacherDashboard session={sessionData} /> : <StudentView session={sessionData} user={user} />}
                    </main>
                </div>
            );
        }

        // --- Teacher Components ---
        function TeacherDashboard({ session }) {
            const [groups, setGroups] = React.useState([]);
            const [newGroupName, setNewGroupName] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('control');
            
            // 批次輸入狀態
            const [batchGroups, setBatchGroups] = React.useState('');
            const [batchStudents, setBatchStudents] = React.useState('');

            React.useEffect(() => {
                if (session) {
                    setGroups(session.groups || []);
                }
            }, [session]);

            const addGroup = async () => {
                if (!newGroupName.trim()) return;
                const newGroup = { id: `g${Date.now()}`, name: newGroupName };
                await setDoc(doc(db, 'sessions', SESSION_ID), { groups: [...groups, newGroup] }, { merge: true });
                setNewGroupName('');
            };

            const updateSession = (data) => setDoc(doc(db, 'sessions', SESSION_ID), data, { merge: true });

            // 批次處理函式
            const handleBatchGroups = async () => {
                const lines = batchGroups.split('\n').map(l => l.trim()).filter(l => l);
                if (lines.length === 0) return;
                const newGroups = lines.map(name => ({ id: `g${Date.now()}_${Math.random().toString(36).substr(2,9)}`, name }));
                const updatedGroups = [...(session.groups || []), ...newGroups];
                await updateSession({ groups: updatedGroups });
                setBatchGroups('');
                alert(`已成功新增 ${newGroups.length} 個組別`);
            };

            const handleBatchStudents = async () => {
                const lines = batchStudents.split('\n').map(l => l.trim()).filter(l => l);
                if (lines.length === 0) return;
                // 使用 Set 去除重複，並合併舊名單
                const currentStudents = new Set(session.students || []);
                lines.forEach(s => currentStudents.add(s));
                await updateSession({ students: Array.from(currentStudents) });
                setBatchStudents('');
                alert(`已更新學生名單，目前共 ${currentStudents.size} 位學生`);
            };

            if (!session) return <div>初始化中...</div>;

            return (
                <div className="space-y-6">
                    <div className="flex bg-white rounded-lg p-1 shadow-sm">
                        {['control', 'setup', 'list', 'results'].map(tab => (
                            <button key={tab} onClick={() => setActiveTab(tab)} 
                                className={`flex-1 py-2 text-sm font-medium rounded-md ${activeTab === tab ? 'bg-blue-50 text-blue-700' : 'text-gray-500'}`}>
                                {tab === 'control' ? '控制台' : tab === 'setup' ? '組別設定' : tab === 'list' ? '名單管理' : '結果統計'}
                            </button>
                        ))}
                    </div>

                    {/* 1. 控制台 */}
                    {activeTab === 'control' && (
                        <div className="bg-white rounded-xl shadow-sm p-6 space-y-4">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-xl font-bold">報告控制中心</h2>
                                <span className="text-sm text-gray-500 bg-gray-100 px-2 py-1 rounded">
                                    已登入學生: {Object.keys(session.studentMappings || {}).length} / {(session.students || []).length}
                                </span>
                            </div>
                            
                            {groups.length === 0 ? (
                                <p className="text-gray-500 text-center py-8">尚未設定組別，請先至「組別設定」頁面新增。</p>
                            ) : (
                                groups.map(g => (
                                    <div key={g.id} className={`flex justify-between items-center p-4 rounded-lg border ${session.currentGroupId === g.id ? 'border-green-500 bg-green-50' : 'border-gray-200'}`}>
                                        <h3 className="font-bold">{g.name}</h3>
                                        {session.currentGroupId === g.id ? 
                                            <button onClick={() => updateSession({ currentGroupId: null })} className="text-red-600 flex gap-2 font-bold bg-white px-3 py-1 rounded border border-red-200 shadow-sm"><Icons.Square /> 結束評分</button> :
                                            <button onClick={() => updateSession({ currentGroupId: g.id, showResults: false })} disabled={!!session.currentGroupId} className={`flex gap-2 font-bold px-3 py-1 rounded ${session.currentGroupId ? 'text-gray-400 bg-gray-100' : 'text-blue-600 bg-blue-50 hover:bg-blue-100'}`}><Icons.Play /> 開始評分</button>
                                        }
                                    </div>
                                ))
                            )}

                            <div className="pt-4 border-t mt-4">
                                <h3 className="text-sm font-bold text-gray-600 mb-2">結果公佈控制</h3>
                                <button onClick={() => updateSession({ showResults: !session.showResults })} className={`w-full py-3 rounded-lg font-bold transition-all ${session.showResults ? 'bg-amber-100 text-amber-800' : 'bg-gray-800 text-white hover:bg-gray-900'}`}>
                                    {session.showResults ? '隱藏學生端排行榜' : '公佈排行榜 (讓學生看到)'}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 2. 組別設定 (包含單筆與批次) */}
                    {activeTab === 'setup' && (
                        <div className="space-y-6">
                            <div className="bg-white rounded-xl shadow-sm p-6">
                                <h2 className="text-xl font-bold mb-4">單筆新增組別</h2>
                                <div className="flex gap-2 mb-4">
                                    <input type="text" value={newGroupName} onChange={e => setNewGroupName(e.target.value)} placeholder="輸入組別名稱 (例: 第1組-綠能科技)" className="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
                                    <button onClick={addGroup} className="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">新增</button>
                                </div>
                            </div>

                            <div className="bg-white rounded-xl shadow-sm p-6">
                                <h2 className="text-xl font-bold mb-2">批次新增組別</h2>
                                <p className="text-sm text-gray-500 mb-2">請在下方貼上組別列表，一行一個組別名稱。</p>
                                <textarea 
                                    className="w-full h-32 border rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                                    placeholder="第一組 - 報告主題A&#10;第二組 - 報告主題B&#10;..."
                                    value={batchGroups}
                                    onChange={(e) => setBatchGroups(e.target.value)}
                                ></textarea>
                                <button onClick={handleBatchGroups} className="mt-2 w-full bg-gray-800 text-white py-2 rounded-lg hover:bg-black transition-colors">
                                    確認批次新增
                                </button>
                            </div>

                            <div className="bg-white rounded-xl shadow-sm p-6">
                                <h3 className="font-bold mb-3">目前組別列表</h3>
                                <div className="space-y-2 max-h-60 overflow-y-auto">
                                    {groups.map((g, i) => (
                                        <div key={g.id} className="p-3 bg-gray-50 rounded border flex justify-between">
                                            <span>{i+1}. {g.name}</span>
                                            <span className="text-xs text-green-600 bg-green-100 px-2 py-0.5 rounded">已儲存</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 3. 名單管理 (新增分頁) */}
                    {activeTab === 'list' && (
                        <div className="space-y-6">
                            <div className="bg-white rounded-xl shadow-sm p-6">
                                <h2 className="text-xl font-bold mb-2">批次建立學生名單</h2>
                                <p className="text-sm text-gray-500 mb-2">請貼上全班學生姓名，一行一個名字。</p>
                                <textarea 
                                    className="w-full h-48 border rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                                    placeholder="王小明&#10;李大華&#10;陳雅婷&#10;..."
                                    value={batchStudents}
                                    onChange={(e) => setBatchStudents(e.target.value)}
                                ></textarea>
                                <button onClick={handleBatchStudents} className="mt-2 w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors">
                                    更新學生名單
                                </button>
                            </div>

                            <div className="bg-white rounded-xl shadow-sm p-6">
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="font-bold">目前學生名單 ({session.students?.length || 0}人)</h3>
                                    <span className="text-xs bg-gray-100 px-2 py-1 rounded">綠色代表已綁定裝置</span>
                                </div>
                                <div className="flex flex-wrap gap-2 max-h-60 overflow-y-auto p-1">
                                    {(session.students || []).map(s => {
                                        const isBound = Object.values(session.studentMappings || {}).includes(s);
                                        return (
                                            <span key={s} className={`text-sm px-3 py-1 rounded-full border ${isBound ? 'bg-green-100 text-green-800 border-green-200' : 'bg-white text-gray-600 border-gray-200'}`}>
                                                {s}
                                            </span>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'results' && <ResultsBoard session={session} groups={groups} criteria={DEFAULT_CRITERIA} isAdmin={true} />}
                </div>
            );
        }

        // --- Student Components ---
        function StudentView({ session, user }) {
            const [hasVoted, setHasVoted] = React.useState(false);
            const [scores, setScores] = React.useState({});
            const [submitting, setSubmitting] = React.useState(false);
            const [selectedName, setSelectedName] = React.useState(''); // 學生選的名字

            // 檢查該 user.uid 是否已經有綁定的名字
            const registeredName = session.studentMappings?.[user.uid];

            React.useEffect(() => {
                if (registeredName && session?.currentGroupId) {
                    const q = query(collection(db, 'sessions', SESSION_ID, 'votes'), where('groupId', '==', session.currentGroupId), where('userId', '==', user.uid));
                    getDocs(q).then(snap => setHasVoted(!snap.empty));
                } else {
                    setHasVoted(false);
                    setScores({});
                }
            }, [session, user, registeredName]);

            const handleNameRegister = async () => {
                if (!selectedName) return;
                // 再次檢查名字是否被搶走
                const currentMappings = session.studentMappings || {};
                if (Object.values(currentMappings).includes(selectedName)) {
                    alert("這個名字已經被其他裝置綁定了！請重新整理頁面。");
                    return;
                }
                
                // 寫入資料庫綁定
                const updateKey = `studentMappings.${user.uid}`;
                await updateDoc(doc(db, 'sessions', SESSION_ID), {
                    [updateKey]: selectedName
                });
            };

            const submitVote = async () => {
                if (session.criteria.some(c => scores[c.id] === undefined)) {
                    alert("請填寫所有項目！"); return;
                }
                setSubmitting(true);
                try {
                    await setDoc(doc(collection(db, 'sessions', SESSION_ID, 'votes')), {
                        userId: user.uid, 
                        userName: registeredName, // 這裡改用綁定的真實姓名
                        groupId: session.currentGroupId, 
                        scores, 
                        timestamp: serverTimestamp()
                    });
                    setHasVoted(true);
                } catch(e) { alert("送出失敗"); } finally { setSubmitting(false); }
            };

            // 1. 如果還沒綁定名字，顯示選單
            if (!registeredName) {
                // 找出還沒被綁定的名字
                const takenNames = Object.values(session.studentMappings || {});
                const availableNames = (session.students || []).filter(name => !takenNames.includes(name));

                return (
                    <div className="max-w-md mx-auto bg-white rounded-xl shadow p-8 mt-10">
                        <h2 className="text-xl font-bold mb-4 text-center">歡迎！請確認您的身分</h2>
                        <p className="text-gray-500 text-sm mb-6 text-center">請從下方選單選擇您的姓名以進入評分系統。</p>
                        
                        {(session.students || []).length === 0 ? (
                            <div className="text-center text-red-500 bg-red-50 p-4 rounded">
                                老師尚未建立學生名單，請稍候。
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <select 
                                    className="w-full p-3 border rounded-lg bg-white focus:ring-2 focus:ring-blue-500 outline-none"
                                    value={selectedName}
                                    onChange={(e) => setSelectedName(e.target.value)}
                                >
                                    <option value="">-- 請選擇您的姓名 --</option>
                                    {availableNames.map(name => (
                                        <option key={name} value={name}>{name}</option>
                                    ))}
                                </select>
                                <button 
                                    onClick={handleNameRegister}
                                    disabled={!selectedName}
                                    className="w-full py-3 bg-blue-600 text-white rounded-lg font-bold disabled:bg-gray-300 transition-colors"
                                >
                                    確認身分並進入
                                </button>
                            </div>
                        )}
                    </div>
                );
            }

            // 2. 已綁定，正常顯示評分介面
            if (session?.showResults) return <ResultsBoard session={session} groups={session.groups} criteria={session.criteria} isAdmin={false} />;
            if (!session?.currentGroupId) return (
                <div className="text-center py-20 bg-white rounded-xl shadow">
                    <div className="mb-4 text-blue-600 font-bold">嗨，{registeredName}</div>
                    <div className="text-gray-300 flex justify-center mb-4"><Icons.Lock /></div>
                    <h2 className="font-bold text-xl">等待評分開始...</h2>
                    <p className="text-gray-500 mt-2">老師尚未開始任何組別的評分</p>
                </div>
            );
            if (hasVoted) return <div className="text-center py-20 bg-green-50 rounded-xl shadow"><div className="text-green-600 flex justify-center mb-4"><Icons.CheckCircle /></div><h2 className="font-bold text-xl text-green-800">評分已送出！</h2><p className="text-green-600 mt-2">請稍候下一組報告</p></div>;

            return (
                <div className="bg-white rounded-xl shadow-lg p-6 space-y-6">
                    <div className="bg-blue-600 -mx-6 -mt-6 p-4 mb-6 text-white">
                        <div className="flex justify-between items-center mb-1">
                            <span className="text-xs opacity-80">正在評分</span>
                            <span className="text-xs bg-blue-500 px-2 py-0.5 rounded text-blue-100">{registeredName}</span>
                        </div>
                        <h2 className="text-2xl font-bold">{session.groups.find(g => g.id === session.currentGroupId)?.name}</h2>
                    </div>
                    {session.criteria.map(c => (
                        <div key={c.id}>
                            <div className="flex justify-between mb-2"><label className="font-bold text-gray-700">{c.name}</label><span className="text-xs text-gray-500 font-mono">權重: {c.weight}%</span></div>
                            <div className="flex items-center gap-4">
                                <input type="range" min="1" max={c.max} value={scores[c.id]||0} onChange={e => setScores({...scores, [c.id]: parseInt(e.target.value)})} className="w-full h-3 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600" />
                                <div className="w-10 h-10 flex items-center justify-center bg-blue-50 text-blue-700 font-bold rounded">{scores[c.id]||0}</div>
                            </div>
                        </div>
                    ))}
                    <button onClick={submitVote} disabled={submitting} className="w-full py-4 bg-blue-600 text-white rounded-xl font-bold shadow hover:bg-blue-700 transition-all">{submitting ? '處理中...' : '送出評分'}</button>
                </div>
            );
        }

        // --- Shared Results Component ---
        function ResultsBoard({ session, groups, criteria, isAdmin }) {
            const [results, setResults] = React.useState([]);

            React.useEffect(() => {
                getDocs(query(collection(db, 'sessions', SESSION_ID, 'votes'))).then(snap => {
                    const stats = {};
                    snap.forEach(d => {
                        const v = d.data();
                        if (!stats[v.groupId]) stats[v.groupId] = { sum: 0, count: 0 };
                        let wSum = 0;
                        criteria.forEach(c => wSum += (v.scores[c.id]||0) * (c.weight/100));
                        stats[v.groupId].sum += wSum;
                        stats[v.groupId].count++;
                    });
                    setResults(groups.map(g => ({
                        ...g, avg: stats[g.id]?.count ? (stats[g.id].sum / stats[g.id].count).toFixed(2) : "0.00"
                    })).sort((a, b) => b.avg - a.avg));
                });
            }, [session]);

            return (
                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h2 className="text-xl font-bold mb-6 flex items-center gap-2 text-gray-800"><Icons.BarChart3 /> 排行榜與成績</h2>
                    <div className="space-y-2">
                        {results.map((g, i) => (
                            <div key={g.id} className={`flex justify-between items-center p-4 rounded-lg ${i === 0 ? 'bg-yellow-50 border border-yellow-200' : 'border-b border-gray-50'}`}>
                                <div className="flex items-center gap-4">
                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-white ${i===0?'bg-yellow-400':i===1?'bg-gray-400':i===2?'bg-orange-400':'bg-gray-200 text-gray-500'}`}>{i+1}</div>
                                    <span className="font-bold text-lg">{g.name}</span>
                                </div>
                                <span className="text-2xl font-bold text-blue-600">{g.avg}</span>
                            </div>
                        ))}
                    </div>
                    {!isAdmin && <div className="mt-4 text-center text-gray-400 text-xs">結果由老師公佈後顯示</div>}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
