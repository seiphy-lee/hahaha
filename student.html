<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共同評分</title>
<style>
  :root {
    --bg: #fdf8f0; --card: #fff; --ink: #2b2620; --muted: #8a8177; --line: #eee3d3;
    --accent: #e8730c; --accent-soft: #fff1e2; --ok: #1f9d55; --ok-soft: #e3f6ea; --warn: #c0392b; --warn-soft: #fdecea;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 16px; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 9px 16px; border-radius: 10px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .login { max-width: 400px; width: 100%; text-align: center; }
  .muted { color: var(--muted); font-size: 14px; }
  .err { color: var(--warn); }
  .row { display: flex; align-items: center; gap: 10px; }
  .spacer { flex: 1; }
  h2 { margin: 0 0 10px; font-size: 20px; }
  header { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header .wrap { padding-top: 10px; padding-bottom: 10px; }
  .me b { font-size: 17px; }
  .tag { display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: #f3efe9; color: var(--muted); }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.todo { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .group-item { display: flex; align-items: center; gap: 10px; padding: 14px 4px; border-bottom: 1px solid var(--line); }
  .group-item:last-child { border-bottom: none; }
  .group-item .name { font-weight: 700; font-size: 17px; flex: 1; }
  .crit { margin-bottom: 18px; }
  .crit .top { display: flex; align-items: baseline; margin-bottom: 6px; }
  .crit .top b { flex: 1; }
  .crit .val { font-size: 26px; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; }
  .crit .val.unset { color: #ccc; font-size: 18px; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
  .crit.unset input[type=range] { opacity: .45; }
  .ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .total { font-size: 18px; text-align: right; margin: 6px 0 14px; }
  .big-btn { width: 100%; padding: 14px; font-size: 18px; }
  .rank-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .rank-no { width: 34px; height: 34px; border-radius: 50%; background: #f3efe9; display: flex; align-items: center; justify-content: center; font-weight: 800; }
  .rank-row:nth-child(1) .rank-no { background: #f7c948; color: #fff; }
  .rank-row:nth-child(2) .rank-no { background: #b8bec6; color: #fff; }
  .rank-row:nth-child(3) .rank-no { background: #d69e61; color: #fff; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #2b2620; color: #fff; padding: 10px 18px;
    border-radius: 8px; z-index: 100; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: 1; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal { background: #fff; border-radius: 14px; padding: 20px; max-width: 420px; width: 100%; }
  .modal .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  table { width: 100%; border-collapse: collapse; } td { padding: 5px 0; border-bottom: 1px solid var(--line); } td.num { text-align: right; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px 0 32px; }
</style>
</head>
<body>
<div id="app"><div class="center muted">載入中…</div></div>
<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, query, where, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAmqdU3AimELr5sa9FIFd_eb5zbM0nCFkI",
  authDomain: "evaluate-each-other-5d4bf.firebaseapp.com",
  projectId: "evaluate-each-other-5d4bf",
  storageBucket: "evaluate-each-other-5d4bf.firebasestorage.app",
  messagingSenderId: "323924183931",
  appId: "1:323924183931:web:945c1feceaa4593d000bde",
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const HEARTBEAT_MS = 60000;    // 每 60 秒回報一次上線狀態

const $   = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 2800); }
function modal(title, html, buttons) {
  return new Promise(res => {
    const bg = document.createElement("div"); bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal"><h2>${esc(title)}</h2>${html}<div class="btns">${buttons.map((b, i) =>
      `<button data-i="${i}" class="${b.cls || ""}">${esc(b.label)}</button>`).join("")}</div></div>`;
    bg.onclick = e => { const b = e.target.closest("button[data-i]"); if (b) { bg.remove(); res(buttons[+b.dataset.i].value); } };
    document.body.appendChild(bg);
  });
}

const roomId = (new URLSearchParams(location.search).get("room") || "").trim().toUpperCase();
const S = { user: null, room: null, me: null, myVotes: new Map(), results: null, form: null, unsub: [], hb: null, busy: false };
const app$ = () => $("#app");
const roomRef = () => doc(db, "rooms", roomId);
const presenceRef = () => doc(db, "rooms", roomId, "presence", S.user.uid);

// ══════════════════════════════════════════════════════════════════
if (!roomId) {
  app$().innerHTML = `<div class="center"><div class="card login"><div style="font-size:44px">🔗</div>
    <h2>請使用老師提供的連結進入</h2><p class="muted">此頁面需要教室代碼才能使用。</p></div></div>`;
} else {
  onAuthStateChanged(auth, u => { stopAll(); S.user = u; u ? enter() : renderLogin(); });
}

function renderLogin(err = "") {
  app$().innerHTML = `<div class="center"><div class="card login">
    <div style="font-size:44px">📝</div><h2>共同評分</h2>
    <p class="muted">教室代碼 <b>${esc(roomId)}</b></p>
    <p>請使用<b>學校 Google 帳號</b>登入</p>
    ${err ? `<p class="err">${err}</p>` : ""}
    <button class="primary big-btn" id="btnLogin">使用 Google 帳號登入</button></div></div>`;
  $("#btnLogin").onclick = async () => {
    const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" });
    try { await signInWithPopup(auth, p); }
    catch (e) {
      if (e.code === "auth/popup-blocked") renderLogin("登入視窗被瀏覽器擋住了，請允許彈出視窗後再試一次。");
      else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") renderLogin("登入失敗：" + esc(e.message));
    }
  };
}

function renderBlocked(title, msg) {
  app$().innerHTML = `<div class="center"><div class="card login"><div style="font-size:44px">⚠️</div>
    <h2>${esc(title)}</h2><p>${msg}</p><button id="btnOut">登出並換帳號</button></div></div>`;
  $("#btnOut").onclick = () => signOut(auth);
}

async function enter() {
  app$().innerHTML = `<div class="center muted">連線教室中…</div>`;
  const email = (S.user.email || "").toLowerCase();
  try {
    const r = await getDoc(roomRef());
    if (!r.exists()) return renderBlocked("找不到教室", `教室代碼「${esc(roomId)}」不存在，請確認連結是否正確。`);
    const me = await getDoc(doc(db, "rooms", roomId, "roster", email));
    if (!me.exists()) return renderBlocked("不在這個班級名單中",
      `你目前登入的帳號是 <b>${esc(email)}</b>。<br>請確認使用<b>學校帳號</b>登入；若帳號正確，請告知老師。`);
    S.me = { email, ...me.data() };
  } catch (e) {
    console.error(e);
    if (e.code === "permission-denied") return renderBlocked("不在這個班級名單中", `你目前登入的帳號是 <b>${esc(email)}</b>。請改用學校帳號登入。`);
    return renderBlocked("連線錯誤", esc(e.message));
  }

  S.unsub.push(onSnapshot(roomRef(), snap => {
    if (!snap.exists()) return renderBlocked("教室已關閉", "老師已刪除此教室。");
    S.room = snap.data();
    if (S.form && !(S.room.openGroups || []).includes(S.form.group)) { S.form = null; toast("老師已關閉這一組的評分"); }
    render();
  }, e => console.error(e)));
  S.unsub.push(onSnapshot(query(collection(db, "rooms", roomId, "votes"), where("uid", "==", S.user.uid)), snap => {
    S.myVotes = new Map(snap.docs.map(d => [d.data().group, d.data()]));
    render();
  }, e => console.error(e)));
  S.unsub.push(onSnapshot(doc(db, "rooms", roomId, "public", "results"), snap => {
    S.results = snap.exists() ? snap.data() : null; render();
  }, e => console.error(e)));
  startHeartbeat();
}

// ── 上線狀態（心跳）─────────────────────────────────────────────────
function beat(online = true) {
  if (!S.user || !S.me) return Promise.resolve();
  return setDoc(presenceRef(), { email: S.me.email, lastSeen: serverTimestamp(), online }).catch(e => console.error("心跳失敗", e));
}
const onVis = () => { if (!document.hidden) beat(true); };
const onHide = () => beat(false);
function startHeartbeat() {
  beat(true);
  S.hb = setInterval(() => beat(true), HEARTBEAT_MS);
  document.addEventListener("visibilitychange", onVis);
  window.addEventListener("pagehide", onHide);
}
function stopAll() {
  S.unsub.forEach(f => f()); S.unsub = [];
  if (S.hb) clearInterval(S.hb); S.hb = null;
  document.removeEventListener("visibilitychange", onVis);
  window.removeEventListener("pagehide", onHide);
  S.room = null; S.me = null; S.myVotes = new Map(); S.results = null; S.form = null;
}
async function logout() { await beat(false); stopAll(); await signOut(auth); }

// ══════════════════════════════════════════════════════════════════
//  畫面
// ══════════════════════════════════════════════════════════════════
function render() {
  if (!S.room || !S.me) return;
  if (S.form) return;                    // 評分表單開啟中：不重畫，避免滑桿被重設
  const r = S.room, me = S.me, open = new Set(r.openGroups || []);
  const list = (r.groups || []).filter(g => open.has(g));
  const pending = list.filter(g => !S.myVotes.has(g) && !(r.blockOwnGroup && g === me.group)).length;

  app$().innerHTML = `${headerHtml()}
  <div class="wrap">
    <div class="card"><h2>${esc(r.title)}</h2>
      ${list.length ? `<p class="muted" style="margin-top:-4px">${pending ? `還有 <b>${pending}</b> 組待評分` : "目前開放的組別都已完成 🎉"}</p>
        ${list.map(g => groupItem(g)).join("")}`
      : `<p class="muted">⏳ 等待老師開放評分…</p>`}
    </div>
    ${resultsHtml()}
    <footer>臺中二中 阿發老師 設計</footer>
  </div>`;
  $("#btnOut").onclick = logout;
  document.querySelectorAll("[data-score]").forEach(b => b.onclick = () => openForm(b.dataset.score));
}
function headerHtml() {
  return `<header><div class="wrap row"><div class="me"><b>${esc(S.me.name)}</b> <span class="tag">${esc(S.me.group)}</span></div>
    <span class="spacer"></span><button id="btnOut">登出</button></div></header>`;
}
function groupItem(g) {
  const r = S.room, v = S.myVotes.get(g);
  let right;
  if (r.blockOwnGroup && g === S.me.group) right = `<span class="tag">自己的組</span>`;
  else if (v && v.valid === false) right = `<span class="tag warn">已被老師作廢</span>`;
  else if (v) right = `<span class="tag ok">✓ 已送出 ${v.total} 分</span>`;
  else right = `<button class="primary" data-score="${esc(g)}">評分</button>`;
  return `<div class="group-item"><span class="name">${esc(g)}</span>${right}</div>`;
}
function resultsHtml() {
  const R = S.results; if (!R || !R.published) return "";
  return `<div class="card"><h2>🏆 排行榜</h2>
    ${(R.ranking || []).map(x => `<div class="rank-row"><div class="rank-no">${x.rank ?? "—"}</div>
      <div style="flex:1;font-weight:700">${esc(x.group)}</div>
      <div style="text-align:right"><b style="font-size:20px">${x.score ?? "—"}</b><div class="muted">/ ${R.maxTotal}</div></div></div>`).join("")}
  </div>`;
}

// ── 評分表單 ────────────────────────────────────────────────────────
function openForm(g) {
  const crit = S.room.criteria || [];
  S.form = { group: g, crit, scores: Object.fromEntries(crit.map(c => [c.id, null])) };
  app$().innerHTML = `${headerHtml()}
  <div class="wrap"><div class="card">
    <div class="row"><button id="btnBack">← 返回</button><span class="spacer"></span></div>
    <h2 style="margin-top:12px">評分：${esc(g)}</h2>
    <p class="muted" style="margin-top:-4px">每一項都要拖動滑桿給分。<b>送出後無法修改</b>。</p>
    ${crit.map(c => `<div class="crit unset" id="cr_${c.id}">
      <div class="top"><b>${esc(c.name)}</b><span class="val unset" id="v_${c.id}">未評</span><span class="muted">&nbsp;/ ${c.max}</span></div>
      <input type="range" min="0" max="${c.max}" step="1" value="${Math.round(c.max / 2)}" data-c="${c.id}">
      <div class="ticks"><span>0</span><span>${Math.round(c.max / 2)}</span><span>${c.max}</span></div></div>`).join("")}
    <div class="total">總分 <b id="tot">—</b> / ${crit.reduce((a, c) => a + c.max, 0)}</div>
    <button class="primary big-btn" id="btnSubmit" disabled>確認送出</button>
  </div></div>`;
  $("#btnOut").onclick = logout;
  $("#btnBack").onclick = () => { S.form = null; render(); };
  document.querySelectorAll("input[type=range]").forEach(inp => inp.addEventListener("input", () => {
    const id = inp.dataset.c; S.form.scores[id] = parseInt(inp.value, 10);
    $("#cr_" + id).classList.remove("unset"); const v = $("#v_" + id); v.textContent = inp.value; v.classList.remove("unset");
    const vals = Object.values(S.form.scores);
    const done = vals.every(x => x !== null);
    $("#tot").textContent = done ? vals.reduce((a, b) => a + b, 0) : "—";
    $("#btnSubmit").disabled = !done;
  }));
  $("#btnSubmit").onclick = submit;
}

async function submit() {
  const F = S.form; if (!F || S.busy) return;
  if (Object.values(F.scores).some(x => x === null)) return toast("還有項目沒有評分");
  const total = Object.values(F.scores).reduce((a, b) => a + b, 0);
  const ok = await modal("確認送出？", `<p>評分對象：<b>${esc(F.group)}</b></p><table>
    ${F.crit.map(c => `<tr><td>${esc(c.name)}</td><td class="num">${F.scores[c.id]} / ${c.max}</td></tr>`).join("")}
    <tr><td><b>總分</b></td><td class="num"><b>${total}</b></td></tr></table>
    <p class="err" style="font-size:14px">送出後無法修改。</p>`, [{ label: "再想想", value: false }, { label: "確認送出", value: true, cls: "primary" }]);
  if (!ok || !S.form) return;
  S.busy = true; $("#btnSubmit").disabled = true; $("#btnSubmit").textContent = "送出中…";
  try {
    await setDoc(doc(db, "rooms", roomId, "votes", `${S.user.uid}__${F.group}`), {
      uid: S.user.uid, email: S.me.email, name: S.me.name, voterGroup: S.me.group,
      group: F.group, scores: F.scores, total, at: serverTimestamp(), valid: true,
    });
    toast("✓ 已送出");
    S.form = null; render();
  } catch (e) {
    console.error(e);
    toast(e.code === "permission-denied" ? "送出失敗：這一組可能已關閉、已評過，或評分項目剛被老師修改" : "送出失敗，請再試一次");
    if (S.form) { $("#btnSubmit").disabled = false; $("#btnSubmit").textContent = "確認送出"; }
  } finally { S.busy = false; }
}
</script>
</body>
</html>
