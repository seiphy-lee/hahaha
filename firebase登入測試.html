<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Firebase 登入測試</title>
<style>
  body { font-family: sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#1e1e2f; color:#fff; }
  button { padding: 12px 24px; font-size:16px; cursor:pointer; border-radius:8px; border:none; background:#4285F4; color:#fff; margin:10px; }
  #info { margin-top:20px; padding:16px; background:#2a2a40; border-radius:8px; max-width:600px; word-break:break-all; }
</style>
</head>
<body>

  <h2>Firebase 登入測試</h2>
  <button id="loginBtn">使用 Google 登入</button>
  <button id="logoutBtn">登出</button>
  <div id="info">尚未登入</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBZI122UpF1_a4ocyhkgheOOUtoOKhKAu4",
      authDomain: "monopoly-roster.firebaseapp.com",
      projectId: "monopoly-roster",
      storageBucket: "monopoly-roster.firebasestorage.app",
      messagingSenderId: "621655373476",
      appId: "1:621655373476:web:f4c8d5ce66dd0a7c821831",
      measurementId: "G-TT24T8XSX4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    document.getElementById('loginBtn').onclick = () => {
      signInWithPopup(auth, provider).catch(err => {
        document.getElementById('info').innerText = "登入錯誤：" + err.message;
      });
    };

    document.getElementById('logoutBtn').onclick = () => {
      signOut(auth);
    };

    onAuthStateChanged(auth, (user) => {
      const infoDiv = document.getElementById('info');
      if (user) {
        infoDiv.innerHTML = `
          <b>已登入</b><br>
          姓名：${user.displayName}<br>
          Email：${user.email}<br>
          <b>UID：${user.uid}</b>
        `;
      } else {
        infoDiv.innerText = "尚未登入";
      }
    });
  </script>

</body>
</html>
