<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高中物理：繩波的反射與透射</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* 充滿活力的全螢幕漸層背景 */
            background: linear-gradient(120deg, #ffe2ed 0%, #e0e7ff 50%, #ccfbf1 100%);
        }
        .mode-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .mode-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .active-btn {
            /* 活潑的紫粉紅漸層頁籤 */
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            color: white;
            box-shadow: 0 6px 20px -3px rgba(236, 72, 153, 0.5);
            border-color: transparent !important;
        }
        
        /* 讓畫布有立體內凹感 */
        .canvas-container {
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.06), 0 10px 20px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center min-h-screen font-sans">

    <div class="w-full max-w-5xl bg-white/70 backdrop-blur-xl p-6 md:p-8 rounded-[2rem] shadow-2xl shadow-indigo-200/50 border border-white">
        <!-- 標題與阿發老師專屬署名 -->
        <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-700 to-purple-600 mb-6 border-b-2 border-purple-200/50 pb-4 flex items-baseline flex-wrap">
            繩波的反射與透射
            <span class="text-[#0000FF] ml-4 text-[0.8em] font-normal drop-shadow-sm">(臺中二中 阿發老師 設計)</span>
        </h1>
        
        <div class="flex flex-col gap-5 mb-6">
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <button id="btnFixed" class="mode-btn active-btn px-4 py-3 font-bold rounded-2xl text-center border border-transparent text-lg">固定端反射</button>
                <button id="btnFree" class="mode-btn bg-white/80 text-slate-600 border border-slate-200 hover:bg-pink-50 hover:text-pink-600 hover:border-pink-200 px-4 py-3 font-bold rounded-2xl text-center text-lg">自由端反射</button>
                <button id="btnL2H" class="mode-btn bg-white/80 text-slate-600 border border-slate-200 hover:bg-pink-50 hover:text-pink-600 hover:border-pink-200 px-4 py-3 font-bold rounded-2xl text-center text-lg">輕繩傳重繩</button>
                <button id="btnH2L" class="mode-btn bg-white/80 text-slate-600 border border-slate-200 hover:bg-pink-50 hover:text-pink-600 hover:border-pink-200 px-4 py-3 font-bold rounded-2xl text-center text-lg">重繩傳輕繩</button>
            </div>
            
            <div class="bg-gradient-to-r from-amber-100 to-orange-50 p-4 rounded-2xl text-amber-900 font-bold border border-amber-200 shadow-sm text-lg">
                目前模式：<span id="statusText">反射波形左右相反、上下顛倒</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 p-6 bg-gradient-to-r from-cyan-50 to-blue-50 rounded-3xl border border-cyan-100 shadow-inner">
                <div class="flex flex-col">
                    <label for="speedSlider" class="text-slate-700 font-bold mb-3 text-base flex justify-between">
                        <span>入射波速: <span id="speedValue" class="text-indigo-600 font-black ml-1">中</span></span>
                    </label>
                    <input type="range" id="speedSlider" min="1" max="15" value="5" class="w-full h-3 bg-cyan-200 rounded-lg appearance-none cursor-pointer accent-fuchsia-500 hover:accent-fuchsia-400 transition-all">
                </div>

                <div class="flex flex-col">
                    <label for="widthSlider" class="text-slate-700 font-bold mb-3 text-base flex justify-between">
                        <span>波長 (脈衝寬度): <span id="widthValue" class="text-indigo-600 font-black ml-1">中</span></span>
                    </label>
                    <!-- 滑桿最大值放大到240 (對應原本 80 的三倍，波長可拉得極長) -->
                    <input type="range" id="widthSlider" min="20" max="240" value="90" class="w-full h-3 bg-cyan-200 rounded-lg appearance-none cursor-pointer accent-fuchsia-500 hover:accent-fuchsia-400 transition-all">
                </div>
            </div>

            <div class="flex flex-wrap gap-4 items-center mt-2">
                <button id="btnStart" class="px-6 py-3 bg-gradient-to-r from-emerald-400 to-teal-500 text-white font-bold rounded-2xl shadow-lg shadow-teal-200/60 hover:scale-105 transition-all text-lg">發射波 / 重置</button>
                <button id="btnPause" class="px-6 py-3 bg-gradient-to-r from-amber-400 to-orange-500 text-white font-bold rounded-2xl shadow-lg shadow-orange-200/60 transition-all hover:scale-105 disabled:opacity-50 disabled:hover:scale-100 disabled:shadow-none cursor-not-allowed text-lg" disabled>暫停</button>
                <span id="stepHint" class="text-slate-600 text-sm font-medium ml-2 bg-white/70 px-4 py-2 rounded-xl border border-white">✨ 提示：播放時按「空白鍵」暫停，暫停時按「空白鍵」可單步播放</span>
            </div>
        </div>

        <!-- 畫布底色改為溫暖的奶油/淡粉色漸層，搭配純白立體粗框 -->
        <div class="canvas-container relative w-full overflow-hidden bg-gradient-to-br from-[#fffdf5] to-[#ffeaf2] border-8 border-white rounded-[2rem]" style="height: 450px;">
            <canvas id="waveCanvas" class="absolute top-0 left-0 w-full h-full"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        
        const modes = {
            'fixed': { name: '固定端反射', R: -1, T: 0, v2Ratio: 1, text: "反射波形左右相反、上下顛倒" },
            'free': { name: '自由端反射', R: 1, T: 0, v2Ratio: 1, text: "反射波形左右相反、上下不顛倒" },
            'L2H': { name: '輕繩傳重繩', R: -0.35, T: 0.65, v2Ratio: 0.5, text: "反射波顛倒且振幅變小；透射波正立、波速變慢且波長變短" },
            'H2L': { name: '重繩傳輕繩', R: 0.35, T: 1.35, v2Ratio: 2.0, text: "反射波正立且振幅變小；透射波正立、波速變快且波長變長" }
        };

        let currentMode = 'fixed';
        let isPlaying = false; 
        let isPaused = false;
        let animationId;
        
        let canvasWidth = 0;
        let canvasHeight = 0;
        let ropeStartY = 0;
        let boundaryX = 0;

        // 計算初始寬度：基底寬度 0.05，預設滑桿為 90
        const baseW = 0.05;
        const initialRatio = 90 / 50;
        let waveParams = {
            v: 5,        
            A: -90,      
            width: 2.5 / (90 * 90) // 對應滑桿預設值 90
        };
        
        let incidentWave = null;
        let reflectedWave = null;
        let transmittedWave = null;

        // 頁籤切換事件
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn').forEach(b => {
                    b.classList.remove('active-btn');
                    b.classList.add('bg-white/80', 'text-slate-600', 'border-slate-200', 'hover:bg-pink-50', 'hover:text-pink-600', 'hover:border-pink-200');
                });
                e.target.classList.remove('bg-white/80', 'text-slate-600', 'border-slate-200', 'hover:bg-pink-50', 'hover:text-pink-600', 'hover:border-pink-200');
                e.target.classList.add('active-btn');
                
                const id = e.target.id;
                if (id === 'btnFixed') currentMode = 'fixed';
                if (id === 'btnFree') currentMode = 'free';
                if (id === 'btnL2H') currentMode = 'L2H';
                if (id === 'btnH2L') currentMode = 'H2L';
                
                document.getElementById('statusText').innerText = modes[currentMode].text;
                
                resizeCanvas();
                resetWave();
            });
        });

        // 波速滑桿
        document.getElementById('speedSlider').addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            waveParams.v = val;
            
            const textObj = document.getElementById('speedValue');
            if (val <= 4) textObj.innerText = "慢";
            else if (val >= 10) textObj.innerText = "快";
            else textObj.innerText = "中";

            if (incidentWave) {
                // 如果已經在行進中調整波速，必須重置波才能保持物理同步不穿幫
                resetWave(); 
            }
        });

        // 波長滑桿 (支援 1.5倍 以上加長)
        document.getElementById('widthSlider').addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            // 確保視覺上與滑桿數值成真正的平方反比關係 (讓波可以拉得極長)
            const newW = 2.5 / (val * val);
            waveParams.width = newW;
            
            if (incidentWave) {
                incidentWave.w = newW;
                reflectedWave.w = newW;
                if (transmittedWave) {
                    const vRatio = modes[currentMode].v2Ratio;
                    transmittedWave.w = newW / (vRatio * vRatio);
                }
            }
            if (isPaused || (!isPlaying)) drawFrame();
            
            const textObj = document.getElementById('widthValue');
            // 配合 20~240 範圍
            if (val <= 80) textObj.innerText = "短";
            else if (val >= 160) textObj.innerText = "長";
            else textObj.innerText = "中";
        });

        const btnPause = document.getElementById('btnPause');
        document.getElementById('btnStart').addEventListener('click', () => {
            resetWave();
            isPlaying = true;
            isPaused = false;
            updatePauseButtonUI();
            animate();
        });

        btnPause.addEventListener('click', togglePause);

        // 空白鍵單步播放與暫停
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && isPlaying) {
                e.preventDefault(); 
                if (!isPaused) {
                    togglePause(); 
                } else {
                    updatePhysics();
                    drawFrame();
                }
            }
        });

        function togglePause() {
            if (!isPlaying) return;
            isPaused = !isPaused;
            updatePauseButtonUI();
            
            if (isPaused) cancelAnimationFrame(animationId);
            else animate();
        }

        function updatePauseButtonUI() {
            btnPause.disabled = !isPlaying;
            if (!isPlaying) {
                btnPause.className = "px-6 py-3 bg-slate-300 text-white font-bold rounded-2xl transition-all opacity-50 cursor-not-allowed text-lg";
                btnPause.innerText = "暫停";
                return;
            }
            
            if (isPaused) {
                btnPause.innerText = "繼續 (空白鍵)";
                btnPause.className = "px-6 py-3 bg-gradient-to-r from-blue-400 to-indigo-500 text-white font-bold rounded-2xl shadow-lg shadow-indigo-200 transition-all hover:scale-105 text-lg";
            } else {
                btnPause.innerText = "暫停 (空白鍵)";
                btnPause.className = "px-6 py-3 bg-gradient-to-r from-amber-400 to-orange-500 text-white font-bold rounded-2xl shadow-lg shadow-orange-200 transition-all hover:scale-105 text-lg";
            }
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            canvasWidth = canvas.width;
            canvasHeight = canvas.height;
            ropeStartY = canvasHeight / 2;
            
            if (currentMode === 'fixed' || currentMode === 'free') {
                boundaryX = canvasWidth - 100; // 靠右邊
            } else {
                boundaryX = canvasWidth / 2;   // 放在正中間展示透射
            }
            if (!isPlaying && !isPaused) drawFrame();
        }
        window.addEventListener('resize', resizeCanvas);

        // 不對稱波形高斯函數 (前陡後緩)
        function getWaveY(x, waveCenter, dir, A, w) {
            const dx = x - waveCenter;
            const isFront = (dx * dir > 0); 
            // 進行方向衰減較快(陡峭)，後方衰減較慢(平緩)
            const effectiveW = isFront ? w * 2.5 : w * 0.4;
            return A * Math.exp(-effectiveW * dx * dx);
        }

        function updatePhysics() {
            if (!incidentWave) return;
            
            incidentWave.x += incidentWave.v;
            reflectedWave.x += reflectedWave.v;
            
            if (transmittedWave) {
                transmittedWave.x += transmittedWave.v;
            }
            
            // 讓波走遠一點再停止，避免超長波長被提早截斷
            if (incidentWave.x > canvasWidth * 3) {
                isPlaying = false;
                isPaused = false;
                updatePauseButtonUI();
            }
        }

        function animate() {
            if (!isPaused && isPlaying) updatePhysics();
            drawFrame();
            if (isPlaying && !isPaused) animationId = requestAnimationFrame(animate);
        }

        function resetWave() {
            cancelAnimationFrame(animationId);
            isPlaying = false;
            isPaused = false;
            updatePauseButtonUI();
            
            const startX = -150;
            
            // 1. 真正的入射波
            incidentWave = { 
                x: startX, 
                v: waveParams.v, 
                A: waveParams.A, 
                w: waveParams.width,
                dir: 1
            };
            
            // 距離邊界的總路程
            const distToBoundary = boundaryX - startX;
            
            // 2. 虛擬的反射波 (鏡像法)，藏在牆後
            reflectedWave = {
                x: boundaryX + distToBoundary,
                v: -waveParams.v,
                A: waveParams.A * modes[currentMode].R,
                w: waveParams.width,
                dir: -1
            };

            // 3. 透射波處理 【核心除錯點：完美同步】
            if (currentMode === 'L2H' || currentMode === 'H2L') {
                const vRatio = modes[currentMode].v2Ratio;
                // 為了讓透射波跟入射波在同一瞬間到達 boundaryX，
                // 必須根據它的波速比例，回推它的起跑點 (可能藏在畫面外很遠的地方)
                const transmittedStartX = boundaryX - (distToBoundary * vRatio);

                transmittedWave = {
                    x: transmittedStartX, // 根據時間差反推的正確起始點！
                    v: waveParams.v * vRatio,
                    A: waveParams.A * modes[currentMode].T,
                    w: waveParams.width / (vRatio * vRatio), 
                    dir: 1
                };
            } else {
                transmittedWave = null;
            }

            drawFrame();
        }

        function drawBoundary() {
            if (currentMode === 'fixed') {
                ctx.fillStyle = '#b95c5c'; 
                const brickWidth = 40;
                const brickHeight = 22;
                // 完美的垂直向上疊加紅磚牆 (無交叉)
                for (let y = 0; y < canvas.height; y += brickHeight) {
                    ctx.fillRect(boundaryX, y, brickWidth, brickHeight - 2);
                }
            } else if (currentMode === 'free') {
                ctx.fillStyle = '#78513b'; 
                ctx.fillRect(boundaryX - 5, 0, 10, canvas.height);
                
                let ringY = ropeStartY;
                if (incidentWave && reflectedWave) {
                    const y1 = getWaveY(boundaryX, incidentWave.x, incidentWave.dir, incidentWave.A, incidentWave.w);
                    const y2 = getWaveY(boundaryX, reflectedWave.x, reflectedWave.dir, reflectedWave.A, reflectedWave.w);
                    ringY += (y1 + y2);
                }

                ctx.strokeStyle = '#cbd5e1'; 
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.ellipse(boundaryX, ringY, 15, 8, 0, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function drawRope() {
            // 繪製左半段 (入射與反射的完美數學疊加)
            ctx.beginPath();
            for (let x = 0; x <= boundaryX; x++) {
                let y = ropeStartY;
                if (incidentWave && reflectedWave) {
                    // 入射與反射在數學上疊加
                    const y_in = getWaveY(x, incidentWave.x, incidentWave.dir, incidentWave.A, incidentWave.w);
                    const y_ref = getWaveY(x, reflectedWave.x, reflectedWave.dir, reflectedWave.A, reflectedWave.w);
                    y += (y_in + y_ref);
                }
                
                // 固定端強制歸零點
                if (currentMode === 'fixed' && x === boundaryX) {
                    y = ropeStartY; 
                }
                
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            
            if (currentMode === 'H2L') {
                ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 14; 
            } else if (currentMode === 'L2H') {
                ctx.strokeStyle = '#d4a373'; ctx.lineWidth = 5;  
            } else {
                ctx.strokeStyle = '#c49c71'; ctx.lineWidth = 7;  
            }
            ctx.lineJoin = 'round';
            ctx.stroke();

            // 繪製右半段 (透射) 【核心除錯點：移除 if 判斷，信任數學自動疊加】
            if (currentMode === 'L2H' || currentMode === 'H2L') {
                ctx.beginPath();
                for (let x = boundaryX; x <= canvasWidth; x++) {
                    let y = ropeStartY;
                    if (transmittedWave) {
                        // 讓高斯函數自然從邊界平滑浮現，不再斷裂！
                        y += getWaveY(x, transmittedWave.x, transmittedWave.dir, transmittedWave.A, transmittedWave.w);
                    }
                    if (x === boundaryX) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                
                if (currentMode === 'L2H') {
                    ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 14; 
                } else {
                    ctx.strokeStyle = '#d4a373'; ctx.lineWidth = 5;  
                }
                ctx.stroke();
            }

            // 繪製連接處繩結
            ctx.beginPath();
            if (currentMode === 'fixed') {
                ctx.arc(boundaryX, ropeStartY, 9, 0, Math.PI * 2);
                ctx.fillStyle = '#3b82f6'; // 鮮明藍色固定結
            } else if (currentMode === 'free') {
                let endY = ropeStartY;
                if (incidentWave && reflectedWave) {
                    endY += getWaveY(boundaryX, incidentWave.x, incidentWave.dir, incidentWave.A, incidentWave.w);
                    endY += getWaveY(boundaryX, reflectedWave.x, reflectedWave.dir, reflectedWave.A, reflectedWave.w);
                }
                ctx.arc(boundaryX, endY, 7, 0, Math.PI * 2);
                ctx.fillStyle = '#6b4c3a'; 
            } else {
                let endY = ropeStartY;
                if (incidentWave && reflectedWave) {
                    endY += getWaveY(boundaryX, incidentWave.x, incidentWave.dir, incidentWave.A, incidentWave.w);
                    endY += getWaveY(boundaryX, reflectedWave.x, reflectedWave.dir, reflectedWave.A, reflectedWave.w);
                }
                ctx.arc(boundaryX, endY, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#334155'; 
            }
            ctx.fill();
        }

        function drawArrowAndLabel() {
            if (!incidentWave || !isPlaying) return;
            
            // 入射波標籤
            if (incidentWave.x > 20 && incidentWave.x <= boundaryX + 20) {
                drawSingleLabel(incidentWave.x, ropeStartY + getWaveY(incidentWave.x, incidentWave.x, incidentWave.dir, incidentWave.A, incidentWave.w), "入射波", 1, incidentWave.A < 0);
            }
            
            // 反射波標籤
            if (reflectedWave.x >= 20 && reflectedWave.x < boundaryX - 20) {
                // 利用反射係數 R 判斷正負，確保標籤不會指錯邊
                const isPeakUp = (incidentWave.A * modes[currentMode].R) < 0; 
                drawSingleLabel(reflectedWave.x, ropeStartY + getWaveY(reflectedWave.x, reflectedWave.x, reflectedWave.dir, reflectedWave.A, reflectedWave.w), "反射波", -1, isPeakUp);
            }
            
            // 透射波標籤
            if (transmittedWave && transmittedWave.x >= boundaryX + 20 && transmittedWave.x < canvasWidth - 20) {
                // 透射波永遠和原來的 A 同向，所以直接用 original A 判斷
                drawSingleLabel(transmittedWave.x, ropeStartY + getWaveY(transmittedWave.x, transmittedWave.x, transmittedWave.dir, transmittedWave.A, transmittedWave.w), "透射波", 1, incidentWave.A < 0);
            }
        }

        function drawSingleLabel(x, peakY, text, dir, isPeakUp) {
            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 17px sans-serif';
            ctx.textAlign = 'center';
            
            let textY, arrowY;
            // 標籤動態浮動，確保不遮擋波形
            if (isPeakUp) {
                arrowY = peakY - 35;
                textY = peakY - 50;
            } else {
                arrowY = peakY + 35;
                textY = peakY + 55;
            }
            
            ctx.fillText(text, x, textY);
            
            ctx.beginPath();
            ctx.moveTo(x - dir * 22, arrowY);
            ctx.lineTo(x + dir * 15, arrowY);
            ctx.strokeStyle = '#f43f5e'; 
            ctx.lineWidth = 3.5;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(x + dir * 18, arrowY);
            ctx.lineTo(x + dir * 6, arrowY - 6);
            ctx.lineTo(x + dir * 6, arrowY + 6);
            ctx.fillStyle = '#f43f5e';
            ctx.fill();
        }

        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBoundary();
            drawRope();
            drawArrowAndLabel();
        }

        // 初始化
        resizeCanvas();
    </script>
</body>
</html>
