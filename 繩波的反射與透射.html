<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高中物理：繩波反射與透射模擬</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4 md:p-8 flex flex-col items-center min-h-screen font-sans">

    <div class="w-full max-w-5xl bg-white p-6 rounded-xl shadow-lg border border-gray-200">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 border-b pb-2">繩波的反射與透射</h1>
        
        <div class="flex flex-col gap-4 mb-6">
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                <button id="btnFixed" class="mode-btn px-4 py-2 font-semibold rounded shadow transition bg-blue-600 text-white">固定端反射</button>
                <button id="btnFree" class="mode-btn px-4 py-2 font-semibold rounded shadow transition bg-gray-200 text-gray-700 hover:bg-gray-300">自由端反射</button>
                <button id="btnL2H" class="mode-btn px-4 py-2 font-semibold rounded shadow transition bg-gray-200 text-gray-700 hover:bg-gray-300">輕繩傳重繩</button>
                <button id="btnH2L" class="mode-btn px-4 py-2 font-semibold rounded shadow transition bg-gray-200 text-gray-700 hover:bg-gray-300">重繩傳輕繩</button>
            </div>
            
            <div class="bg-blue-50 p-3 rounded text-blue-800 font-bold border border-blue-100">
                目前模式：<span id="statusText">反射波形左右相反、上下顛倒</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
                <div class="flex flex-col">
                    <label for="speedSlider" class="text-gray-700 font-semibold mb-2 text-sm">
                        入射波速: <span id="speedValue" class="text-blue-600 font-bold ml-1">中</span>
                    </label>
                    <input type="range" id="speedSlider" min="1" max="15" value="5" class="w-full h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer">
                </div>

                <div class="flex flex-col">
                    <label for="widthSlider" class="text-gray-700 font-semibold mb-2 text-sm">
                        波長 (脈衝寬度): <span id="widthValue" class="text-blue-600 font-bold ml-1">中</span>
                    </label>
                    <input type="range" id="widthSlider" min="20" max="80" value="50" class="w-full h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>

            <div class="flex gap-2 items-center">
                <button id="btnStart" class="px-6 py-2 bg-green-500 text-white font-bold rounded shadow hover:bg-green-600 transition">發射波 / 重置</button>
                <button id="btnPause" class="px-6 py-2 bg-yellow-500 text-white font-bold rounded shadow transition disabled:opacity-50 cursor-not-allowed" disabled>暫停</button>
                <span id="stepHint" class="text-gray-500 text-sm ml-2">提示：播放時按「空白鍵」暫停，暫停時按「空白鍵」可單步播放</span>
            </div>
        </div>

        <div class="relative w-full overflow-hidden bg-white border-2 border-gray-100 rounded-lg shadow-inner" style="height: 400px;">
            <canvas id="waveCanvas" class="absolute top-0 left-0 w-full h-full"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        
        // 模式參數設定 (物理學反射與透射係數)
        const modes = {
            'fixed': { name: '固定端反射', R: -1, T: 0, v2Ratio: 1, text: "反射波形左右相反、上下顛倒" },
            'free': { name: '自由端反射', R: 1, T: 0, v2Ratio: 1, text: "反射波形左右相反、上下不顛倒" },
            'L2H': { name: '輕繩傳重繩', R: -0.35, T: 0.65, v2Ratio: 0.5, text: "反射波顛倒且振幅變小；透射波正立、波速變慢且波長變短" },
            'H2L': { name: '重繩傳輕繩', R: 0.35, T: 1.35, v2Ratio: 2.0, text: "反射波正立且振幅變小；透射波正立、波速變快且波長變長" }
        };

        let currentMode = 'fixed';
        let isPlaying = false; 
        let isPaused = false;
        let animationId;
        
        let canvasWidth = 0;
        let canvasHeight = 0;
        let ropeStartY = 0;
        let boundaryX = 0;

        let waveParams = {
            v: 5,        
            A: -80,      
            width: 0.001 
        };
        
        let activeWave = null; 

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                // 更新按鈕樣式
                document.querySelectorAll('.mode-btn').forEach(b => {
                    b.classList.remove('bg-blue-600', 'text-white');
                    b.classList.add('bg-gray-200', 'text-gray-700');
                });
                e.target.classList.remove('bg-gray-200', 'text-gray-700');
                e.target.classList.add('bg-blue-600', 'text-white');
                
                // 更新模式
                const id = e.target.id;
                if (id === 'btnFixed') currentMode = 'fixed';
                if (id === 'btnFree') currentMode = 'free';
                if (id === 'btnL2H') currentMode = 'L2H';
                if (id === 'btnH2L') currentMode = 'H2L';
                
                document.getElementById('statusText').innerText = modes[currentMode].text;
                
                // 重新計算邊界並重置波
                resizeCanvas();
                resetWave();
            });
        });

        document.getElementById('speedSlider').addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            waveParams.v = val;
            if (activeWave) activeWave.v = val;
            const textObj = document.getElementById('speedValue');
            if (val <= 4) textObj.innerText = "慢";
            else if (val >= 10) textObj.innerText = "快";
            else textObj.innerText = "中";
        });

        document.getElementById('widthSlider').addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            const newW = 0.05 / val;
            waveParams.width = newW;
            if (activeWave) {
                activeWave.w = newW;
                if (isPaused) drawFrame();
            }
            const textObj = document.getElementById('widthValue');
            if (val <= 40) textObj.innerText = "短";
            else if (val >= 60) textObj.innerText = "長";
            else textObj.innerText = "中";
        });

        const btnPause = document.getElementById('btnPause');
        document.getElementById('btnStart').addEventListener('click', () => {
            resetWave();
            isPlaying = true;
            isPaused = false;
            updatePauseButtonUI();
            animate();
        });

        btnPause.addEventListener('click', togglePause);

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && isPlaying) {
                e.preventDefault(); 
                if (!isPaused) {
                    togglePause(); 
                } else {
                    updatePhysics();
                    drawFrame();
                }
            }
        });

        function togglePause() {
            if (!isPlaying) return;
            isPaused = !isPaused;
            updatePauseButtonUI();
            
            if (isPaused) cancelAnimationFrame(animationId);
            else animate();
        }

        function updatePauseButtonUI() {
            btnPause.disabled = !isPlaying;
            if (!isPlaying) {
                btnPause.classList.add('opacity-50', 'cursor-not-allowed');
                btnPause.innerText = "暫停";
                return;
            }
            btnPause.classList.remove('opacity-50', 'cursor-not-allowed');
            if (isPaused) {
                btnPause.innerText = "繼續 (空白鍵)";
                btnPause.classList.replace('bg-yellow-500', 'bg-blue-500');
            } else {
                btnPause.innerText = "暫停 (空白鍵)";
                btnPause.classList.replace('bg-blue-500', 'bg-yellow-500');
            }
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            canvasWidth = canvas.width;
            canvasHeight = canvas.height;
            ropeStartY = canvasHeight / 2;
            
            // 動態邊界：如果需要展示透射波，就把牆壁移到中間
            if (currentMode === 'fixed' || currentMode === 'free') {
                boundaryX = canvasWidth - 100;
            } else {
                boundaryX = canvasWidth / 2; 
            }
            if (!isPlaying && !isPaused) drawFrame();
        }
        window.addEventListener('resize', resizeCanvas);

        function getWaveY(x, waveCenter, dir, A, w) {
            const dx = x - waveCenter;
            const isFront = (dx * dir > 0); 
            const effectiveW = isFront ? w * 2.5 : w * 0.4;
            return A * Math.exp(-effectiveW * dx * dx);
        }

        function updatePhysics() {
            if (!activeWave) return;
            activeWave.x += activeWave.v;
            
            // 當波遠離畫面邊界時結束
            if (activeWave.x > canvasWidth * 2) {
                isPlaying = false;
                isPaused = false;
                updatePauseButtonUI();
            }
        }

        function animate() {
            if (!isPaused && isPlaying) updatePhysics();
            drawFrame();
            if (isPlaying && !isPaused) animationId = requestAnimationFrame(animate);
        }

        function resetWave() {
            cancelAnimationFrame(animationId);
            isPlaying = false;
            isPaused = false;
            updatePauseButtonUI();
            
            activeWave = { 
                x: -150, 
                v: waveParams.v, 
                A: waveParams.A, 
                w: waveParams.width 
            };
            drawFrame();
        }

        function drawBoundary() {
            if (currentMode === 'fixed') {
                // 初版的完美紅磚牆
                ctx.fillStyle = '#a55c5c'; 
                const brickWidth = 40;
                const brickHeight = 20;
                for (let y = 0; y < canvas.height; y += brickHeight) {
                    const offsetX = (y / brickHeight) % 2 === 0 ? 0 : -10;
                    ctx.fillRect(boundaryX + offsetX, y, brickWidth, brickHeight - 2);
                }
            } else if (currentMode === 'free') {
                // 自由端的鐵桿與環
                ctx.fillStyle = '#5c4033'; 
                ctx.fillRect(boundaryX - 5, 0, 10, canvas.height);
                
                let ringY = ropeStartY;
                if (activeWave) {
                    ringY += getWaveY(boundaryX, activeWave.x, 1, activeWave.A, activeWave.w);
                    ringY += getWaveY(boundaryX, 2 * boundaryX - activeWave.x, -1, activeWave.A * modes[currentMode].R, activeWave.w);
                }

                ctx.strokeStyle = '#9ca3af'; 
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.ellipse(boundaryX, ringY, 15, 8, 0, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function drawRope() {
            // 繪製左半邊 (入射區段)
            ctx.beginPath();
            for (let x = 0; x <= boundaryX; x++) {
                let y = ropeStartY;
                if (activeWave) {
                    // 入射波 + 虛擬的反射波 (鏡像法)
                    y += getWaveY(x, activeWave.x, 1, activeWave.A, activeWave.w);
                    const refX = 2 * boundaryX - activeWave.x;
                    y += getWaveY(x, refX, -1, activeWave.A * modes[currentMode].R, activeWave.w);
                }
                
                // 固定端強制鎖死在平衡位置，杜絕物理錯誤
                if (currentMode === 'fixed' && x === boundaryX) {
                    y = ropeStartY; 
                }
                
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            
            // 決定左繩子的粗細顏色
            if (currentMode === 'H2L') {
                ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 12; // 重繩
            } else if (currentMode === 'L2H') {
                ctx.strokeStyle = '#d4a373'; ctx.lineWidth = 4;  // 輕繩
            } else {
                ctx.strokeStyle = '#c49c71'; ctx.lineWidth = 6;  // 一般繩
            }
            ctx.lineJoin = 'round';
            ctx.stroke();

            // 繪製右半邊 (透射區段，只有在有透射模式時畫)
            if (currentMode === 'L2H' || currentMode === 'H2L') {
                ctx.beginPath();
                for (let x = boundaryX; x <= canvasWidth; x++) {
                    let y = ropeStartY;
                    if (activeWave) {
                        const vRatio = modes[currentMode].v2Ratio;
                        // 透射波位置：依據波速比例推算
                        const transX = boundaryX + (activeWave.x - boundaryX) * vRatio;
                        // 波長與波速成正比，在公式中 w 與寬度的平方成反比
                        const transW = activeWave.w / (vRatio * vRatio);
                        
                        y += getWaveY(x, transX, 1, activeWave.A * modes[currentMode].T, transW);
                    }
                    if (x === boundaryX) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                
                if (currentMode === 'L2H') {
                    ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 12; // 重繩
                } else {
                    ctx.strokeStyle = '#d4a373'; ctx.lineWidth = 4;  // 輕繩
                }
                ctx.stroke();
            }

            // 繪製連接處繩結
            ctx.beginPath();
            if (currentMode === 'fixed') {
                ctx.arc(boundaryX, ropeStartY, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#3b82f6'; // 藍色鎖死
            } else if (currentMode === 'free') {
                let endY = ropeStartY;
                if (activeWave) {
                    endY += getWaveY(boundaryX, activeWave.x, 1, activeWave.A, activeWave.w);
                    endY += getWaveY(boundaryX, 2 * boundaryX - activeWave.x, -1, activeWave.A * modes[currentMode].R, activeWave.w);
                }
                ctx.arc(boundaryX, endY, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#6b4c3a'; 
            } else {
                // 輕重繩交界處
                let endY = ropeStartY;
                if (activeWave) {
                    endY += getWaveY(boundaryX, activeWave.x, 1, activeWave.A, activeWave.w);
                    endY += getWaveY(boundaryX, 2 * boundaryX - activeWave.x, -1, activeWave.A * modes[currentMode].R, activeWave.w);
                }
                ctx.arc(boundaryX, endY, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#1f2937'; 
            }
            ctx.fill();
        }

        function drawArrowAndLabel() {
            if (!activeWave || !isPlaying) return;
            
            const x_p = activeWave.x;
            const x_ref = 2 * boundaryX - activeWave.x;
            
            // 繪製入射波標籤
            if (x_p > 20 && x_p <= boundaryX + 20) {
                drawSingleLabel(x_p, ropeStartY + activeWave.A, "入射波", 1, activeWave.A < 0);
            }
            
            // 繪製反射波標籤
            if (x_ref >= 20 && x_ref < boundaryX - 20) {
                const refA = activeWave.A * modes[currentMode].R;
                drawSingleLabel(x_ref, ropeStartY + refA, "反射波", -1, refA < 0);
            }
            
            // 繪製透射波標籤
            if (currentMode === 'L2H' || currentMode === 'H2L') {
                const vRatio = modes[currentMode].v2Ratio;
                const x_t = boundaryX + (activeWave.x - boundaryX) * vRatio;
                if (x_t >= boundaryX + 20 && x_t < canvasWidth - 20) {
                    const transA = activeWave.A * modes[currentMode].T;
                    drawSingleLabel(x_t, ropeStartY + transA, "透射波", 1, transA < 0);
                }
            }
        }

        function drawSingleLabel(x, peakY, text, dir, isPeakUp) {
            ctx.fillStyle = '#1f2937';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            
            let textY, arrowY;
            if (isPeakUp) {
                arrowY = peakY - 30;
                textY = peakY - 45;
            } else {
                arrowY = peakY + 30;
                textY = peakY + 50;
            }
            
            ctx.fillText(text, x, textY);
            
            ctx.beginPath();
            ctx.moveTo(x - dir * 20, arrowY);
            ctx.lineTo(x + dir * 15, arrowY);
            ctx.strokeStyle = '#ef4444'; 
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(x + dir * 18, arrowY);
            ctx.lineTo(x + dir * 6, arrowY - 6);
            ctx.lineTo(x + dir * 6, arrowY + 6);
            ctx.fillStyle = '#ef4444';
            ctx.fill();
        }

        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBoundary();
            drawRope();
            drawArrowAndLabel();
        }

        // 初始化
        resizeCanvas();
    </script>
</body>
</html>
