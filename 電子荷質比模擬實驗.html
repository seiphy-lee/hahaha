   <p class="note">從量尺讀出圓軌跡最高點的高度，就是直徑 2r。理想化模型：磁場均勻，忽略電子與氣體碰撞造成的能量損失。</p>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const QM = 1.75882e11;            // e/m (C/kg)
const V3 = (x,y,z)=>new THREE.Vector3(x,y,z);
const $ = id=>document.getElementById(id);

/* ---------- 格式化 ---------- */
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const sup=n=>String(n).split('').map(c=>SUP[c]).join('');
function sci(x,d=2){
  if(!isFinite(x)) return '—';
  if(x===0) return '0';
  let e=Math.floor(Math.log10(Math.abs(x))); let m=x/10**e;
  if(Math.abs(+m.toFixed(d))>=10){m/=10;e++;}
  return `${m.toFixed(d)} × 10${sup(e)}`;
}

/* ---------- 渲染器 / 場景 ---------- */
const canvas=$('c'), stage=$('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0b1020);
const camera=new THREE.PerspectiveCamera(45,1,0.1,500);
const controls=new OrbitControls(camera,canvas); controls.enableDamping=true;
scene.add(new THREE.AmbientLight(0xffffff,0.6));
const dl=new THREE.DirectionalLight(0xffffff,1.2); dl.position.set(10,20,15); scene.add(dl);
const dl2=new THREE.DirectionalLight(0x8899ff,0.5); dl2.position.set(-15,-5,-10); scene.add(dl2);

const g1=new THREE.Group(), g2=new THREE.Group(); scene.add(g1,g2);

/* ---------- 共用材質與工具 ---------- */
const glassMat=new THREE.MeshPhysicalMaterial({color:0xa8ccff,transparent:true,opacity:0.13,roughness:0.05,metalness:0,side:THREE.DoubleSide,depthWrite:false});
const metalMat=new THREE.MeshStandardMaterial({color:0xb4bdd0,metalness:0.8,roughness:0.35,side:THREE.DoubleSide});
const copperMat=new THREE.MeshStandardMaterial({color:0xc07a3e,metalness:0.7,roughness:0.35});
const darkMat=new THREE.MeshStandardMaterial({color:0x222631,metalness:0.3,roughness:0.6});

function glowTexture(){
  const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.2,'rgba(255,255,255,0.75)');
  gr.addColorStop(0.5,'rgba(255,255,255,0.18)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);
}
const GLOW=glowTexture();
function glowSprite(color,size){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
  s.scale.set(size,size,1);return s;
}
function makeLabel(text,{color='#e6ebf5',size=0.9}={}){
  const fs=48,pad=18;const c=document.createElement('canvas');const ctx=c.getContext('2d');
  const font=`600 ${fs}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;
  ctx.font=font;const w=Math.ceil(ctx.measureText(text).width)+pad*2,h=Math.ceil(fs+pad*1.3);
  c.width=w;c.height=h;ctx.font=font;
  ctx.fillStyle='rgba(20,27,46,0.78)';
  if(ctx.roundRect){ctx.beginPath();ctx.roundRect(0,0,w,h,14);ctx.fill();}else ctx.fillRect(0,0,w,h);
  ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,w/2,h/2+2);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;tex.minFilter=THREE.LinearFilter;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true}));
  sp.scale.set(size*w/h,size,1);sp.renderOrder=10;return sp;
}
function cylX(r,len,mat,x,y=0,open=false){ // 沿 x 軸的圓柱
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,32,1,open),mat);
  m.rotation.z=Math.PI/2;m.position.set(x,y,0);return m;
}
function resample(pts,step=0.15){
  const out=[pts[0].clone()];
  for(let i=1;i<pts.length;i++){
    const a=out[out.length-1],b=pts[i];const d=a.distanceTo(b);if(d<1e-6)continue;
    const n=Math.max(1,Math.ceil(d/step));const a0=a.clone();
    for(let k=1;k<=n;k++)out.push(a0.clone().lerp(b,k/n));
  }
  return out;
}
function taperTube(geo,curve,seg,radial,len){ // 光暈兩端漸細收尾
  const pos=geo.attributes.position,L=curve.getLength(),c=new THREE.Vector3(),v=new THREE.Vector3();
  for(let i=0;i<=seg;i++){
    const t=i/seg,f=Math.min(1,Math.min(t*L,(1-t)*L)/len);if(f>=1)continue;
    curve.getPointAt(t,c);
    for(let j=0;j<=radial;j++){const k=i*(radial+1)+j;v.fromBufferAttribute(pos,k).sub(c).multiplyScalar(f).add(c);pos.setXYZ(k,v.x,v.y,v.z);}
  }
  pos.needsUpdate=true;
}
function makeBeam(group,coreColor,haloColor){
  const core=new THREE.Mesh(new THREE.BufferGeometry(),new THREE.MeshBasicMaterial({color:coreColor,transparent:true,opacity:0.95}));
  const halo=new THREE.Mesh(new THREE.BufferGeometry(),new THREE.MeshBasicMaterial({color:haloColor,transparent:true,opacity:0.3,blending:THREE.AdditiveBlending,depthWrite:false}));
  group.add(core,halo);
  return {set(pts){
    const d=resample(pts);
    if(d.length<2){core.visible=halo.visible=false;return d;}
    core.visible=halo.visible=true;
    const curve=new THREE.CatmullRomCurve3(d,false,'centripetal');const seg=Math.min(2000,d.length);
    core.geometry.dispose();halo.geometry.dispose();
    core.geometry=new THREE.TubeGeometry(curve,seg,0.045,8,false);
    halo.geometry=new THREE.TubeGeometry(curve,seg,0.17,10,false);
    taperTube(halo.geometry,curve,seg,10,1.0);
    return d;
  }};
}
class Runner{ // 沿軌跡移動的電子
  constructor(group,n,color){
    this.n=n;this.meshes=[];this.offset=0;this.L=0;this.speed=8;this.visible=false;
    const geo=new THREE.SphereGeometry(0.12,12,12),mat=new THREE.MeshBasicMaterial({color});
    for(let i=0;i<n;i++){const m=new THREE.Mesh(geo,mat);m.add(glowSprite(color,0.75));m.visible=false;group.add(m);this.meshes.push(m);}
  }
  setPath(pts){
    this.path=pts;this.cum=[0];
    for(let i=1;i<pts.length;i++)this.cum.push(this.cum[i-1]+pts[i].distanceTo(pts[i-1]));
    this.L=this.cum[this.cum.length-1];
  }
  setVisible(v){this.visible=v;this.meshes.forEach(m=>m.visible=v);}
  update(dt){
    if(!this.visible||this.L<=0)return;
    this.offset=(this.offset+this.speed*dt)%this.L;
    for(let i=0;i<this.n;i++){
      const s=(this.offset+i*this.L/this.n)%this.L;
      let lo=0,hi=this.cum.length-1;
      while(hi-lo>1){const mid=(lo+hi)>>1;if(this.cum[mid]<=s)lo=mid;else hi=mid;}
      const seg=this.cum[hi]-this.cum[lo];const t=seg>0?(s-this.cum[lo])/seg:0;
      this.meshes[i].position.lerpVectors(this.path[lo],this.path[hi],t);
    }
  }
}
function setArrowOpacity(a,op){
  [a.line.material,a.cone.material].forEach(m=>{m.transparent=true;m.opacity=op;m.depthWrite=false;});
}

/* =========================================================
   分頁一：湯姆森實驗（單位：場景 1 = 1 cm）
   ========================================================= */
const GUN_X=-11.25, PX1=-2.5, PX2=2.5, PL=5, GAP_H=1.5, SCREEN_X=14.95;
const CONE_X1=7, CONE_X2=14, NECK_R=2.7, FACE_R=5.5, SCREEN_R=5.45;
const EMAX=3e4, BMAX=1e-3;

// 玻璃管
{
  const prof=[[0,-17.8],[0.9,-17.7],[1.5,-17.3],[NECK_R,-16.6],[NECK_R,CONE_X1],[FACE_R,CONE_X2],[FACE_R+0.1,14.6],[FACE_R,15.0],[0,15.05]].map(p=>new THREE.Vector2(p[0],p[1]));
  const tube=new THREE.Mesh(new THREE.LatheGeometry(prof,72),glassMat);
  tube.rotation.z=-Math.PI/2;tube.renderOrder=5;g1.add(tube);
}
// 螢光幕
function screenTexture(){
  const N=512,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d');
  const s=N/(2*SCREEN_R),cx=N/2;
  g.fillStyle='#0f2a1d';g.beginPath();g.arc(cx,cx,N/2,0,Math.PI*2);g.fill();
  g.save();g.beginPath();g.arc(cx,cx,N/2,0,Math.PI*2);g.clip();
  for(let i=-5;i<=5;i++){
    g.strokeStyle=i===0?'rgba(140,255,190,0.55)':'rgba(140,255,190,0.2)';g.lineWidth=i===0?3:1.5;
    g.beginPath();g.moveTo(cx+i*s,0);g.lineTo(cx+i*s,N);g.stroke();
    g.beginPath();g.moveTo(0,cx+i*s);g.lineTo(N,cx+i*s);g.stroke();
  }
  g.fillStyle='rgba(160,255,200,0.7)';g.font='22px sans-serif';g.textAlign='left';
  for(const i of [-4,-2,2,4])g.fillText(String(i),cx+6,cx-i*s-4);
  g.restore();
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
{
  const scr=new THREE.Mesh(new THREE.CircleGeometry(SCREEN_R,64),new THREE.MeshBasicMaterial({map:screenTexture(),side:THREE.DoubleSide}));
  scr.rotation.y=Math.PI/2;scr.position.x=14.97;g1.add(scr);
}
// 電子槍
{
  g1.add(cylX(0.3,0.8,darkMat,-16.2));
  const heat=glowSprite(0xff8a3d,1.0);heat.position.set(-15.75,0,0);g1.add(heat);
  g1.add(cylX(0.55,1.6,metalMat,-15.0,0,true));
  g1.add(cylX(0.5,2.6,metalMat,-12.6,0,true));
  const disk=new THREE.Mesh(new THREE.RingGeometry(0.12,0.8,40),metalMat);
  disk.rotation.y=Math.PI/2;disk.position.x=GUN_X;g1.add(disk);
}
// 偏向板
const plateGeo=new THREE.BoxGeometry(PL,0.08,2.4);
const plateMat=new THREE.MeshStandardMaterial({color:0xf2f5fa,metalness:0.3,roughness:0.25,emissive:0x2a2e36});
const plateTop=new THREE.Mesh(plateGeo,plateMat),plateBot=new THREE.Mesh(plateGeo,plateMat);
plateTop.position.y=GAP_H+0.04;plateBot.position.y=-GAP_H-0.04;g1.add(plateTop,plateBot);
// 亥姆霍茲線圈
const COIL_R1=6.4;
for(const z of [-COIL_R1/2,COIL_R1/2]){
  const t=new THREE.Mesh(new THREE.TorusGeometry(COIL_R1,0.4,20,100),copperMat);t.position.z=z;g1.add(t);
}
// 標籤
{
  const L1=makeLabel('電子槍');L1.position.set(-14,2.6,0);g1.add(L1);
  const L2=makeLabel('亥姆霍茲線圈',{color:'#f6c08a'});L2.position.set(0,COIL_R1+1.2,COIL_R1/2);g1.add(L2);
  const L3=makeLabel('螢光幕',{color:'#9ff5c8'});L3.position.set(15,6.6,0);g1.add(L3);
  const L4=makeLabel('偏向板');L4.position.set(-4.6,2.4,0);g1.add(L4);
}
const plusL=makeLabel('+',{color:'#fc8181',size:0.8}),minusL=makeLabel('−',{color:'#90cdf4',size:0.8});
g1.add(plusL,minusL);
// 場向量
const eArrows=new THREE.Group(),bArrows1=new THREE.Group();g1.add(eArrows,bArrows1);
for(const x of [-2,-1,0,1,2])for(const z of [-0.7,0.7]){
  const a=new THREE.ArrowHelper(V3(0,-1,0),V3(x,1.35,z),2.7,0x4db8ff,0.28,0.16);a.userData.x=x;a.userData.z=z;eArrows.add(a);
}
for(const x of [-1.5,1.5])for(const y of [-0.7,0.7]){
  const a=new THREE.ArrowHelper(V3(0,0,-1),V3(x,y,1.6),3.2,0xffe14d,0.3,0.18);a.userData.x=x;a.userData.y=y;bArrows1.add(a);
}
// 光束、亮點、電子
const beam1=makeBeam(g1,0xc8ffb8,0x39ff14);
const spot=glowSprite(0x7dffb5,1.6);g1.add(spot);
const spotOut=glowSprite(0x7dffb5,1.6);g1.add(spotOut); // 螢幕外側亮點（從管外觀看）
const run1=new Runner(g1,14,0xfff3a0);

const st1={V:1000,E:0,B:0,sE:1,sB:1,elec:false,ans:false};
const DEF1={V:1000,E:0,B:0,sE:1,sB:1};

function rcone(X){
  if(X<CONE_X1)return NECK_R;
  if(X<CONE_X2)return NECK_R+(X-CONE_X1)*(FACE_R-NECK_R)/(CONE_X2-CONE_X1);
  return FACE_R;
}
function traceThomson(V,E,B,sE,sB){
  const v0=Math.sqrt(2*QM*V);
  const Ey=-sE*E;   // sE=+1：上板為正，E 向下
  const Bz=-sB*B;   // sB=+1：B 射入紙面（−z）
  const acc=(vx,vy)=>[-QM*vy*Bz,-QM*(Ey-vx*Bz)]; // a = −(e/m)(E + v×B)
  const pts=[V3(GUN_X,0,0),V3(PX1,0,0)];
  let x=PX1/100,y=0,vx=v0,vy=0,status='ok',n=0;
  const dt=(PL/100/v0)/1500;
  while(x<PX2/100){
    const k1=acc(vx,vy);
    const v2x=vx+k1[0]*dt/2,v2y=vy+k1[1]*dt/2,k2=acc(v2x,v2y);
    const v3x=vx+k2[0]*dt/2,v3y=vy+k2[1]*dt/2,k3=acc(v3x,v3y);
    const v4x=vx+k3[0]*dt,v4y=vy+k3[1]*dt,k4=acc(v4x,v4y);
    x+=dt/6*(vx+2*v2x+2*v3x+v4x);y+=dt/6*(vy+2*v2y+2*v3y+v4y);
    vx+=dt/6*(k1[0]+2*k2[0]+2*k3[0]+k4[0]);vy+=dt/6*(k1[1]+2*k2[1]+2*k3[1]+k4[1]);
    n++;
    if(Math.abs(y*100)>=GAP_H){status='plate';pts.push(V3(x*100,Math.sign(y)*GAP_H,0));break;}
    if(vx<=0||n>100000){status='plate';break;}
    if(n%10===0)pts.push(V3(x*100,y*100,0));
  }
  let ys=null;
  if(status==='ok'){
    const xe=x*100,ye=y*100,k=vy/vx;pts.push(V3(xe,ye,0));
    for(let X=xe;X<=SCREEN_X;X+=0.05){
      const Y=ye+k*(X-xe);
      if(Math.abs(Y)>rcone(X)-0.06){status='wall';pts.push(V3(X,Y,0));break;}
    }
    if(status==='ok'){
      ys=ye+k*(SCREEN_X-xe);
      if(Math.abs(ys)>SCREEN_R-0.05)status='wall';
      pts.push(V3(SCREEN_X,ys,0));
    }
  }
  return {pts,status,ys,v0};
}

/* 螢光幕正視 HUD */
const hud=$('hud'),hctx=hud.getContext('2d');
function sizeHUD(){const r=hud.getBoundingClientRect(),d=Math.min(devicePixelRatio,2);hud.width=r.width*d;hud.height=r.height*d;}
function drawHUD(res){
  const W=hud.width,cx=W/2,s=W/(2*SCREEN_R+0.6);
  hctx.clearRect(0,0,W,W);
  hctx.fillStyle='#0f2a1d';hctx.beginPath();hctx.arc(cx,cx,SCREEN_R*s,0,Math.PI*2);hctx.fill();
  hctx.save();hctx.beginPath();hctx.arc(cx,cx,SCREEN_R*s,0,Math.PI*2);hctx.clip();
  for(let i=-5;i<=5;i++){
    hctx.strokeStyle=i===0?'rgba(140,255,190,0.6)':'rgba(140,255,190,0.2)';hctx.lineWidth=i===0?1.6:1;
    hctx.beginPath();hctx.moveTo(cx+i*s,0);hctx.lineTo(cx+i*s,W);hctx.stroke();
    hctx.beginPath();hctx.moveTo(0,cx+i*s);hctx.lineTo(W,cx+i*s);hctx.stroke();
  }
  hctx.fillStyle='rgba(160,255,200,0.75)';hctx.font=`${Math.round(W*0.06)}px sans-serif`;
  for(const i of [-4,-2,2,4])hctx.fillText(String(i),cx+3,cx-i*s-3);
  if(res.status==='ok'){
    const py=cx-res.ys*s,gr=hctx.createRadialGradient(cx,py,0,cx,py,s*0.9);
    gr.addColorStop(0,'rgba(240,255,245,1)');gr.addColorStop(0.3,'rgba(125,255,181,0.9)');gr.addColorStop(1,'rgba(125,255,181,0)');
    hctx.fillStyle=gr;hctx.beginPath();hctx.arc(cx,py,s*0.9,0,Math.PI*2);hctx.fill();
  }
  hctx.restore();
}

function update1(){
  const {V,E,B,sE,sB}=st1;
  $('v1v').textContent=`${V} V`;
  $('e1v').textContent=`${(E/1e4).toFixed(3)} × 10⁴ V/m`;
  $('b1v').textContent=`${(B*1e3).toFixed(3)} mT`;
  $('dir1').innerHTML=`<b>E 方向：</b>${sE>0?'上板＋、下板－（E 向下，電力向上）':'上板－、下板＋（E 向上，電力向下）'}<br>`+
    `<b>B 方向：</b>${sB>0?'⊗ 射入紙面（磁力向下）':'⊙ 射出紙面（磁力向上）'}`;
  plusL.position.set(-3.1,sE>0?GAP_H+0.1:-GAP_H-0.1,0);
  minusL.position.set(-3.1,sE>0?-GAP_H-0.1:GAP_H+0.1,0);

  // 場向量
  eArrows.visible=E>0;const eop=0.3+0.7*E/EMAX;
  eArrows.children.forEach(a=>{
    if(sE>0){a.position.set(a.userData.x,1.35,a.userData.z);a.setDirection(V3(0,-1,0));}
    else{a.position.set(a.userData.x,-1.35,a.userData.z);a.setDirection(V3(0,1,0));}
    setArrowOpacity(a,eop);
  });
  bArrows1.visible=B>0;const bop=0.3+0.7*B/BMAX;
  bArrows1.children.forEach(a=>{
    if(sB>0){a.position.set(a.userData.x,a.userData.y,1.6);a.setDirection(V3(0,0,-1));}
    else{a.position.set(a.userData.x,a.userData.y,-1.6);a.setDirection(V3(0,0,1));}
    setArrowOpacity(a,bop);
  });

  const res=traceThomson(V,E,B,sE,sB);
  const d=beam1.set(res.pts);run1.setPath(d);run1.speed=res.v0/1e7*6;
  spot.visible=spotOut.visible=res.status==='ok';if(res.status==='ok'){spot.position.set(SCREEN_X-0.05,res.ys,0);spotOut.position.set(15.1,res.ys,0);}
  drawHUD(res);
  $('hudY').textContent=res.status==='ok'?`y = ${res.ys>=0?'+':''}${res.ys.toFixed(2)} cm`:'無亮點';

  const v0=res.v0,vEB=B>0?E/B:Infinity;
  const balanced=E>0&&B>0&&Math.abs(vEB-v0)/v0<0.01;
  // 電力與磁力方向是否相反（才可能平衡）
  const opposite=sE===sB;
  let stTxt,stCls;
  if(res.status==='plate'){stTxt='電子打到偏向板';stCls='st-bad';}
  else if(res.status==='wall'){stTxt='電子束偏出螢幕（撞到管壁）';stCls='st-bad';}
  else if(balanced&&opposite){stTxt='✔ 力平衡：eE = evB';stCls='st-ok';}
  else if(E>0&&B>0&&!opposite){stTxt='電力與磁力同向，無法平衡';stCls='st-warn';}
  else{stTxt='未達力平衡';stCls='st-norm';}
  const r=B>0?v0/(QM*B)*100:null;
  $('data1').innerHTML=
    `<span class="k">電子速率 v</span><span class="v">${sci(v0)} m/s</span>`+
    `<span class="k">E / B</span><span class="v">${B>0?sci(vEB)+' m/s':'—'}</span>`+
    `<span class="k">只有磁場時半徑 r</span><span class="v">${r?r.toFixed(2)+' cm':'—'}</span>`+
    `<span class="k">螢幕偏移 y</span><span class="v">${res.status==='ok'?res.ys.toFixed(2)+' cm':'—'}</span>`+
    `<span class="status ${stCls}">${stTxt}</span>`;

  if(balanced&&opposite&&res.status==='ok'){
    const em=E*E/(2*V*B*B);
    $('ansBody1').innerHTML=`力平衡：eE = evB ⇒ v = E / B<br>加速：eV = ½mv²<br>⇒ e/m = E² / (2VB²)<br>= <span class="res">${sci(em,3)} C/kg</span><br><span class="note">公認值 1.759 × 10¹¹ C/kg</span>`;
  }else{
    $('ansBody1').innerHTML=`目前尚未達到力平衡。請調整 E 或 B（電力與磁力方向需相反），讓光點回到螢幕中心（v = E / B），再由 e/m = E² / (2VB²) 求出荷質比。`;
  }
}

/* =========================================================
   分頁二：荷質比管
   ========================================================= */
const SR=8, GUN_Y=-6, GLASS_IN=7.8, COIL_R2=15, B2MAX=2e-3;
{
  const sph=new THREE.Mesh(new THREE.SphereGeometry(SR,64,40),glassMat);sph.renderOrder=5;g2.add(sph);
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,3.3,32,1,true),glassMat);stem.position.y=-9.5;g2.add(stem);
  const sock=new THREE.Mesh(new THREE.CylinderGeometry(2.1,2.3,2.2,40),darkMat);sock.position.y=-12.2;g2.add(sock);
  // 電子槍
  g2.add(cylX(0.4,2.2,metalMat,-1.3,GUN_Y,true));
  const cap=new THREE.Mesh(new THREE.RingGeometry(0.1,0.42,32),metalMat);cap.rotation.y=Math.PI/2;cap.position.set(-0.2,GUN_Y,0);g2.add(cap);
  const heat=glowSprite(0xff8a3d,0.8);heat.position.set(-2.2,GUN_Y,0);g2.add(heat);
  const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,5,12),metalMat);rod.position.set(-1.3,GUN_Y-2.9,0);g2.add(rod);
  // 量尺（0 位於電子槍出口高度）
  const H=13,c=document.createElement('canvas');c.width=160;c.height=H*120;const g=c.getContext('2d');
  g.fillStyle='rgba(255,255,255,0.10)';g.fillRect(0,0,160,c.height);
  g.strokeStyle='rgba(255,255,255,0.85)';g.fillStyle='rgba(255,255,255,0.9)';g.font='bold 44px sans-serif';
  for(let mm=0;mm<=H*10;mm+=5){
    const y=c.height-mm*12;const major=mm%10===0;
    g.lineWidth=major?4:2;g.beginPath();g.moveTo(0,y);g.lineTo(major?70:38,y);g.stroke();
    if(major&&mm>0)g.fillText(String(mm/10),80,y+15);
  }
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const ruler=new THREE.Mesh(new THREE.PlaneGeometry(1.1,H),new THREE.MeshBasicMaterial({map:t,transparent:true,side:THREE.DoubleSide,depthWrite:false}));
  ruler.position.set(0.55,GUN_Y+H/2,-0.35);g2.add(ruler);
  // 線圈
  for(const z of [-COIL_R2/2,COIL_R2/2]){
    const tr=new THREE.Mesh(new THREE.TorusGeometry(COIL_R2,0.9,20,140),copperMat);tr.position.z=z;g2.add(tr);
  }
  const L1=makeLabel('電子槍');L1.position.set(-4,GUN_Y-0.2,0);g2.add(L1);
  const L2=makeLabel('亥姆霍茲線圈',{color:'#f6c08a'});L2.position.set(0,COIL_R2+2,COIL_R2/2);g2.add(L2);
  const L3=makeLabel('玻璃球（低壓氣體）',{color:'#bcd4ff'});L3.position.set(6.5,8.2,0);g2.add(L3);
  const L4=makeLabel('量尺（讀直徑 2r）',{size:0.75});L4.position.set(3.2,GUN_Y+13.6,0);g2.add(L4);
}
const bArrows2=new THREE.Group();g2.add(bArrows2);
for(const x of [-4,0,4])for(const y of [-2.5,1,4.5]){
  bArrows2.add(new THREE.ArrowHelper(V3(0,0,1),V3(x,y,-2),4,0xffe14d,0.45,0.25));
}
const beam2=makeBeam(g2,0xc8ffb8,0x39ff14);
const run2=new Runner(g2,12,0xfff3a0);
const st2={V:200,B:1.0e-3,elec:false,ans:false};
const DEF2={V:200,B:1.0e-3};

function traceTube(V,B){
  const v0=Math.sqrt(2*QM*V),r=v0/(QM*B)*100,cy=GUN_Y+r;
  const pts=[V3(-0.2,GUN_Y,0)];let status='full';
  const N=480;
  for(let i=0;i<=N;i++){
    const th=2*Math.PI*i/N,x=r*Math.sin(th),y=cy-r*Math.cos(th);
    if(Math.hypot(x,y)>GLASS_IN){status='hit';pts.push(V3(x,y,0));break;}
    pts.push(V3(x,y,0));
  }
  return {pts,status,r,v0};
}
function update2(){
  const {V,B}=st2;
  $('v2v').textContent=`${V} V`;$('b2v').textContent=`${(B*1e3).toFixed(2)} mT`;
  bArrows2.children.forEach(a=>setArrowOpacity(a,0.15+0.45*B/B2MAX));
  const res=traceTube(V,B);
  const d=beam2.set(res.pts);run2.setPath(d);run2.speed=res.v0/1e7*6;
  const rR=Math.round(res.r*100)/100;
  const full=res.status==='full';
  $('data2').innerHTML=
    `<span class="k">電子速率 v</span><span class="v">${sci(res.v0)} m/s</span>`+
    `<span class="k">軌跡半徑 r</span><span class="v">${full?rR.toFixed(2)+' cm':'—'}</span>`+
    `<span class="k">直徑 2r（量尺讀數）</span><span class="v">${full?(2*rR).toFixed(2)+' cm':'—'}</span>`+
    `<span class="status ${full?'st-ok':'st-bad'}">${full?'完整圓形軌跡':'電子束撞到玻璃壁'}</span>`;
  if(full){
    const rm=rR/100,em=2*V/(B*B*rm*rm);
    $('ansBody2').innerHTML=`磁力提供向心力：evB = mv²/r ⇒ v = (e/m)Br<br>加速：eV = ½mv²<br>⇒ e/m = 2V / (B²r²)<br>= <span class="res">${sci(em,3)} C/kg</span><br><span class="note">公認值 1.759 × 10¹¹ C/kg</span>`;
  }else{
    $('ansBody2').innerHTML=`軌跡半徑太大，電子束撞到玻璃壁，無法量出完整的圓。請增大 B 或降低 V。`;
  }
}

/* ---------- UI 綁定 ---------- */
function syncSliders1(){$('v1').value=st1.V;$('e1').value=st1.E/1e4;$('b1').value=st1.B*1e3;}
function syncSliders2(){$('v2').value=st2.V;$('b2').value=st2.B*1e3;}
$('v1').oninput=e=>{st1.V=+e.target.value;update1();};
$('e1').oninput=e=>{st1.E=+e.target.value*1e4;update1();};
$('b1').oninput=e=>{st1.B=+e.target.value*1e-3;update1();};
$('flipE').onclick=()=>{st1.sE*=-1;update1();};
$('flipB').onclick=()=>{st1.sB*=-1;update1();};
$('resetP1').onclick=()=>{Object.assign(st1,DEF1);syncSliders1();update1();};
$('v2').oninput=e=>{st2.V=+e.target.value;update2();};
$('b2').oninput=e=>{st2.B=+e.target.value*1e-3;update2();};
$('resetP2').onclick=()=>{Object.assign(st2,DEF2);syncSliders2();update2();};
function bindToggle(btnId,st,run){
  $(btnId).onclick=()=>{st.elec=!st.elec;run.setVisible(st.elec);
    $(btnId).textContent=`顯示電子：${st.elec?'開':'關'}`;$(btnId).classList.toggle('on',st.elec);};
}
bindToggle('elec1',st1,run1);bindToggle('elec2',st2,run2);
function bindAns(btnId,bodyId,st){
  $(btnId).onclick=()=>{st.ans=!st.ans;$(bodyId).hidden=!st.ans;$(btnId).textContent=st.ans?'隱藏答案':'顯示答案';};
}
bindAns('ans1','ansBody1',st1);bindAns('ans2','ansBody2',st2);

/* ---------- 分頁與視角 ---------- */
const VIEWS={1:{pos:V3(3,8,30),tgt:V3(1,0,0)},2:{pos:V3(10,6,46),tgt:V3(0,0,0)}};
let tab=1;
function resetView(){const v=VIEWS[tab];camera.position.copy(v.pos);controls.target.copy(v.tgt);controls.update();}
function setTab(t){
  tab=t;g1.visible=t===1;g2.visible=t===2;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',+b.dataset.tab===t));
  $('pane1').classList.toggle('active',t===1);$('pane2').classList.toggle('active',t===2);
  $('hudBox').style.display=t===1?'block':'none';
  resetView();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(+b.dataset.tab));
$('resetView').onclick=resetView;

function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  sizeHUD();if(tab===1)update1();
}
window.addEventListener('resize',resize);

syncSliders1();syncSliders2();
setTab(1);resize();update1();update2();

const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05);
  controls.update();
  if(tab===1)run1.update(dt);else run2.update(dt);
  renderer.render(scene,camera);
});
</script>
