<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一維彈性碰撞過程分析</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .canvas-container { aspect-ratio: 16 / 9; width: 100%; background-color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-100 p-4">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-4 text-center">一維彈性碰撞過程分析</h1>
        <div class="canvas-container shadow-lg rounded-lg overflow-hidden border">
            <canvas id="simCanvas"></canvas>
        </div>
        <div class="mt-6">
            <canvas id="vtChart"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        
        // 模擬狀態
        const state = {
            m1: 1.0, v1: 2.0, x1: -200,
            m2: 1.0, v2: -1.0, x2: 200, // 拉大距離
            time: 0,
            phase: 'before', // before, during, after
            running: true
        };

        function draw() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 簡易物理模擬邏輯
            if (state.running) {
                state.time += 0.05;
                state.x1 += state.v1;
                state.x2 += state.v2;

                // 碰撞判定
                if (Math.abs(state.x1 - state.x2) < 50 && state.phase === 'before') {
                    state.phase = 'during';
                    // 彈性碰撞公式更新 v
                    let v1_after = ((state.m1 - state.m2) * state.v1 + 2 * state.m2 * state.v2) / (state.m1 + state.m2);
                    let v2_after = ((state.m2 - state.m1) * state.v2 + 2 * state.m1 * state.v1) / (state.m1 + state.m2);
                    state.v1 = v1_after;
                    state.v2 = v2_after;
                }
                
                if (state.phase === 'during' && Math.abs(state.x1 - state.x2) > 60) {
                    state.phase = 'after';
                }
            }

            // 繪圖 (使用視角轉換保持物體在畫面中心)
            const centerX = canvas.width / 2;
            ctx.save();
            ctx.translate(centerX, canvas.height / 2);
            
            ctx.fillStyle = 'blue';
            ctx.fillRect(state.x1, -25, 50, 50);
            ctx.fillStyle = 'red';
            ctx.fillRect(state.x2, -25, 50, 50);
            ctx.restore();
        }

        function loop() {
            draw();
            requestAnimationFrame(loop);
        }

        // 初始化圖表
        const ctxChart = document.getElementById('vtChart').getContext('2d');
        new Chart(ctxChart, {
            type: 'line',
            data: { labels: [], datasets: [{ label: '物體 1 v-t', data: [] }, { label: '物體 2 v-t', data: [] }] },
            options: { responsive: true, animation: false }
        });

        loop();
    </script>
</body>
</html>
