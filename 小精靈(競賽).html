<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>絲滑版小精靈：向量追擊物理模擬</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050510; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        canvas { border: 2px solid #00d2ff; background-color: #0a0a16; box-shadow: 0 0 30px rgba(0, 210, 255, 0.15); border-radius: 4px; }
        
        /* UI 覆蓋層通用樣式 */
        .overlay-panel {
            position: absolute;
            background-color: rgba(16, 16, 32, 0.95);
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* 左上角控制面板 */
        #ui-overlay {
            top: 20px;
            left: 20px;
            width: 280px;
        }

        /* 中央開始/結算畫面 */
        #start-screen {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            max-height: 90vh; /* 防止太高超出螢幕 */
            overflow-y: auto;
            text-align: center;
            border: 2px solid #00d2ff;
            box-shadow: 0 0 50px rgba(0, 210, 255, 0.3);
            display: flex; /* 初始顯示 */
            flex-direction: column;
            gap: 15px;
            z-index: 200;
        }

        /* 排行榜面板 */
        #leaderboard-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #ffd700;
        }

        h2 { margin-top: 0; color: #00d2ff; text-transform: uppercase; font-size: 1.1rem; letter-spacing: 1px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        h3 { color: #ffd700; margin: 10px 0 5px 0; border-bottom: 1px solid #555; font-size: 1rem;}

        .control-group { margin-bottom: 15px; text-align: left;}
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #aaffaa; font-size: 0.85rem; }
        
        /* 輸入元件樣式 */
        button, textarea {
            width: 100%;
            padding: 10px;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
            font-size: 1rem;
            margin-top: 5px;
            box-sizing: border-box; /* 確保 padding 不會撐大寬度 */
        }
        
        textarea {
            font-size: 0.8rem;
            height: 80px;
            resize: vertical;
            font-family: monospace;
        }

        button {
            background: linear-gradient(45deg, #00d2ff, #0055ff);
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        button:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(0, 210, 255, 0.5); }
        button:active { transform: scale(0.98); }

        /* 匯入按鈕特別樣式 */
        #importBtn {
            background: linear-gradient(45deg, #444, #666);
            font-size: 0.9rem;
            padding: 8px;
            margin-top: 5px;
        }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 4px;
            background: #444;
            outline: none;
            border-radius: 2px;
            margin-top: 5px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00d2ff;
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 0 10px #00d2ff;
            transition: transform 0.1s;
        }
        
        /* 排行榜表格 */
        table { width: 100%; border-collapse: collapse; font-size: 0.9em; margin-bottom: 15px; }
        th { text-align: left; color: #888; padding: 4px; font-size: 0.8em; }
        td { padding: 4px; border-bottom: 1px solid #333; }
        .rank-1 { color: #ffd700; font-weight: bold; }
        .rank-2 { color: #c0c0c0; }
        .rank-3 { color: #cd7f32; }
        
        #score-board, #timer-board {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 10px; border-top: 1px solid #444; padding-top: 10px;
        }
        #score { color: #ffcc00; font-size: 1.4em; font-weight: bold; text-shadow: 0 0 5px rgba(255, 204, 0, 0.5); }
        #remaining { color: #fff; font-size: 1.1em; font-weight: bold; margin-left: 5px; } /* 新增樣式 */
        #timer { color: #00d2ff; font-size: 1.4em; font-weight: bold; font-family: monospace; text-shadow: 0 0 5px rgba(0, 210, 255, 0.5); }
        #game-status { color: #ff4d4d; font-weight: bold; font-size: 1.1em; min-height: 2.5em; text-align: center; margin-top: 15px; text-shadow: 0 0 10px red; line-height: 1.4;}
        
        .instruction { font-size: 0.75rem; color: #888; margin-top: 4px; font-style: italic; }
        .key-badge { background: #333; padding: 2px 6px; border-radius: 4px; color: #fff; font-family: monospace; }
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; margin-bottom: 5px;}
        
        /* 隱藏 class */
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- 控制面板 -->
    <div id="ui-overlay" class="overlay-panel">
        <h2>物理參數控制面板</h2>
        
        <div class="control-group">
            <label>小精靈速度 (Velocity)</label>
            <input type="range" id="speedSlider" min="1.5" max="5" value="2.5" step="0.1">
        </div>

        <div class="control-group">
            <label>幽靈感知半徑 (Field of View)</label>
            <input type="range" id="ghostRangeSlider" min="50" max="400" value="150" step="10">
            <div class="instruction">進入此圓圈後，幽靈會開始追擊</div>
        </div>

        <div class="control-group">
            <label>幽靈速度 (Ghost Speed)</label>
            <input type="range" id="ghostSpeedSlider" min="0.5" max="3" value="1.5" step="0.1">
        </div>

        <div id="score-board">
            <div style="display:flex; flex-direction:column; align-items:flex-start;">
                <span style="font-size:0.8em; color:#aaa">SCORE</span>
                <span id="score">0</span>
            </div>
            <div style="display:flex; flex-direction:column; align-items:flex-end;">
                <span style="font-size:0.8em; color:#aaa">LEFT</span>
                <span id="remaining">0</span>
            </div>
        </div>
        
        <div id="timer-board">
            <span>TIME LEFT</span>
            <span id="timer">03:00</span>
        </div>

        <div id="game-status"></div>
        <div class="instruction" style="text-align: center; margin-top: 15px; border-top: 1px solid #333; padding-top:10px;">
            使用 <span class="key-badge">方向鍵</span> 控制向量方向
        </div>
    </div>

    <!-- 排行榜面板 -->
    <div id="leaderboard-panel" class="overlay-panel">
        <h2>🏆 榮譽榜</h2>
        
        <h3>最高分排行榜 (Top 5)</h3>
        <table id="score-table">
            <thead><tr><th>名次</th><th>玩家</th><th>分數</th></tr></thead>
            <tbody><!-- JS 動態生成 --></tbody>
        </table>

        <h3>最速通關排行榜 (Top 5)</h3>
        <table id="time-table">
            <thead><tr><th>名次</th><th>玩家</th><th>通關時間</th></tr></thead>
            <tbody><!-- JS 動態生成 --></tbody>
        </table>
    </div>

    <!-- 開始/選角畫面 -->
    <div id="start-screen" class="overlay-panel">
        <h1 style="color:#00d2ff; margin:10px 0;">VECTOR PACMAN</h1>
        
        <!-- 選角區 -->
        <div style="text-align: left; padding: 0 20px;">
            <input type="text" id="playerInput" placeholder="請輸入您的暱稱 (最多10字)" maxlength="10" style="padding: 10px; width: 100%; border-radius: 5px; border: 1px solid #444; background: #222; color: white;">
        </div>
        
        <!-- 規則說明 -->
        <div style="padding: 10px 20px;">
            <p style="color:#aaa; font-size:0.85em; margin-bottom: 10px; line-height: 1.5;">
                ★ 規則：限時3分鐘吃光豆子 (含星星)<br>
                ★ 獎勵：大金幣 +20分<br>
                ★ 反擊：無敵星星可吃幽靈<br>
                <span style="color:#ff4d4d; font-weight:bold;">※ 只有過關者才能進入排行榜！</span>
            </p>
            <button id="startBtn">START GAME</button>
        </div>
    </div>

    <script type="module">
            // --- 1. 引入 Firebase SDK (這是雲端工具箱) ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
        // --- 2. 你的 Firebase 設定 (這是鑰匙) ---
        const firebaseConfig = {
            apiKey: "AIzaSyDgSJmFY0-YJImS4gRfcycjjGkNaLQoXJo",
            authDomain: "hahaha-c46df.firebaseapp.com",
            projectId: "hahaha-c46df",
            storageBucket: "hahaha-c46df.firebasestorage.app",
            messagingSenderId: "366156547809",
            appId: "1:366156547809:web:2e24d24b900180530559a0",
            measurementId: "G-DFM8BWTS7C"
        };
    
        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const SCORES_COLLECTION = "pacman_scores"; 
    
        console.log("Firebase 連線準備中...");
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 畫布設定
        canvas.width = 600;
        canvas.height = 600;
        const GRID_SIZE = 30; 

        // 遊戲狀態控制
        let gameStarted = false;
        let currentPlayer = "";
        
        // 排行榜資料 - 使用 localStorage key
        const LEADERBOARD_KEY = 'pacman_leaderboard_v1';
        let leaderboard = {
            scores: [
                {name: "PacMaster", score: 300},
            ],
            times: [
                {name: "PacMaster", timeStr: "02:00", timeMs: 120000}
            ]
        };

        // --- 雲端排行榜邏輯開始 ---
    
    // 變數：存放排行榜資料
    let leaderboard = {
        scores: [], 
        times: []   
    };

    // 監聽器：只要雲端有人玩完，這裡就會自動收到通知並更新畫面
    const q = query(collection(db, SCORES_COLLECTION));
    onSnapshot(q, (querySnapshot) => {
        const allRecords = [];
        querySnapshot.forEach((doc) => {
            allRecords.push(doc.data());
        });

        // 整理資料：分數榜 (高到低)
        leaderboard.scores = [...allRecords].sort((a, b) => b.score - a.score);
        
        // 整理資料：速通榜 (有過關且時間短優先)
        leaderboard.times = allRecords
            .filter(r => r.isWin === true)
            .sort((a, b) => a.timeMs - b.timeMs);

        console.log("收到最新排行榜資料！", leaderboard);
        renderLeaderboard(); // 更新畫面
    });

    // 上傳功能：遊戲結束時呼叫此函式
    // --- 修改後的上傳邏輯：只存前 5 名 ---
        async function updateLeaderboard(isWin, finalScore, timeStr, timeMs) {
            // 1. 如果沒過關，直接不存
            if (!isWin) return;
            
            // 2. 判斷是否夠格進入前五名
            // 我們查看目前已載入的 leaderboard.scores (這是從雲端即時抓下來的)
            let isTop5 = false;

            // 情況 A: 目前排行榜還不到 5 人 -> 直接進榜
            if (leaderboard.scores.length < 5) {
                isTop5 = true;
            } 
            // 情況 B: 排行榜滿了，但我的分數比第 5 名還高
            else {
                // 陣列是從 0 開始，所以第 5 名是 index 4
                const fifthPlaceScore = leaderboard.scores[4].score;
                if (finalScore > fifthPlaceScore) {
                    isTop5 = true;
                }
            }

            // 3. 只有夠格才上傳
            if (isTop5) {
                try {
                    await addDoc(collection(db, SCORES_COLLECTION), {
                        name: currentPlayer,
                        score: finalScore,
                        timeStr: timeStr,
                        timeMs: timeMs,
                        isWin: isWin,
                        timestamp: Date.now()
                    });
                    console.log(`恭喜 ${currentPlayer}！您的 ${finalScore} 分已擠進前五名並上傳！`);
                    alert(`太強了！您以 ${finalScore} 分擠進排行榜前五名！`);
                } catch (e) {
                    console.error("上傳失敗: ", e);
                }
            } else {
                console.log("可惜，分數未達前五名，不予上傳。");
                // 這裡可以選擇是否要告訴玩家
                // alert(`恭喜過關！可惜 ${finalScore} 分未能擠進前五名，請再接再厲！`); 
            }
        }
    // --- 雲端排行榜邏輯結束 ---

        // 開始遊戲邏輯
        startBtn.addEventListener('click', () => {
            alert("開始");
            const name = document.getElementById('playerInput').value.trim(); // 取得輸入的名字並去掉空白
            if (name='') {
                alert("請先輸入您的名字！");
                return;
            }
            currentPlayer = name;
            resetGame();
            
            document.getElementById('start-screen').classList.add('hidden');
            gameStarted = true;
            startTime = Date.now();
            spawnBigCoin();
        });

        function resetGame() {
            maze = JSON.parse(JSON.stringify(initialMaze));
            // 計算剩餘豆子數 (2和3都算)
            remainingPellets = maze.flat().filter(c => c === 2 || c === 3).length;
            
            score = 0;
            scoreDisplay.innerText = 0;
            remainingDisplay.innerText = remainingPellets; // 更新UI
            
            timerDisplay.innerText = "03:00";
            timerDisplay.style.color = "#00d2ff";
            statusDisplay.innerText = "";
            gameOver = false;
            gameWin = false;
            
            // 重置 Pacman
            pacman.x = GRID_SIZE * 1.5;
            pacman.y = GRID_SIZE * 1.5;
            pacman.dx = 0; pacman.dy = 0; pacman.nextDx = 0; pacman.nextDy = 0;
            
            // 重置幽靈
            ghosts.forEach(g => {
                g.x = g.startX;
                g.y = g.startY;
                g.dx = 0; g.dy = 0; // 暫停移動直到邏輯啟動
                g.state = 'wander';
                g.isDead = false;
                g.color = g.originalColor;
                // 賦予初始移動方向 (避免開場卡住)
                if(g.originalColor === COLORS.ghostRed) g.dx = 1;
                else if(g.originalColor === COLORS.ghostYellow) g.dx = -1;
                else g.dy = -1;
            });
        }

        document.addEventListener('keydown', (e) => {
            if(!gameStarted || gameOver || gameWin) return;
            switch(e.key) {
                case 'ArrowUp': pacman.nextDx = 0; pacman.nextDy = -1; break;
                case 'ArrowDown': pacman.nextDx = 0; pacman.nextDy = 1; break;
                case 'ArrowLeft': pacman.nextDx = -1; pacman.nextDy = 0; break;
                case 'ArrowRight': pacman.nextDx = 1; pacman.nextDy = 0; break;
            }
        });

        // --- 核心物理邏輯 ---
        function isWallGrid(c, r) {
            if (r < 0 || r >= maze.length || c < 0 || c >= maze[0].length) return true;
            return maze[r][c] === 1;
        }

        function isWallPixel(x, y, radius) {
            const points = [{x: x-radius, y:y}, {x: x+radius, y:y}, {x:x, y:y-radius}, {x:x, y:y+radius}];
            for (let p of points) {
                const col = Math.floor(p.x / GRID_SIZE);
                const row = Math.floor(p.y / GRID_SIZE);
                if (isWallGrid(col, row)) return true;
            }
            return false;
        }

        function getCenter(val) { return Math.floor(val / GRID_SIZE) * GRID_SIZE + GRID_SIZE / 2; }

        function formatTime(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            return (minutes < 10 ? '0' : '') + minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
        }

        function updateTimer() {
            if(!gameStarted || gameOver || gameWin) return;
            
            const now = Date.now();
            const elapsed = now - startTime; // 經過時間
            const remaining = Math.max(0, GAME_DURATION - elapsed);
            
            // 紀錄此次遊戲的花費時間 (供排行榜用)
            finalTimeMs = elapsed;

            if (remaining <= 0) {
                triggerGameOver("Time's Up");
                return;
            }

            timerDisplay.innerText = formatTime(remaining);
            timerDisplay.style.color = (remaining < 30000) ? "#ff4d4d" : "#00d2ff";
        }

        function triggerGameOver(reason) {
            gameOver = true;
            score = 0; // 失敗分數歸零
            scoreDisplay.innerText = score;
            timerDisplay.innerText = "00:00";
            statusDisplay.innerText = `Game Over (${reason})`;
            statusDisplay.style.color = "#ff4d4d";
            
            // 更新排行榜 (失敗不進榜) 並顯示開始畫面
            updateLeaderboard(false, 0, "", 0);
            setTimeout(() => {
                document.getElementById('start-screen').classList.remove('hidden');
            }, 2000);
        }

        function triggerGameWin() {
            gameWin = true;
            // 計算時間字串
            const timeStr = formatTime(finalTimeMs);
            statusDisplay.innerHTML = `恭喜過關！<br><span style="font-size:0.8em; color:#00d2ff">花費時間: ${timeStr}</span>`;
            statusDisplay.style.color = "#00ff00";

            // 更新排行榜 (過關才進榜) 並顯示開始畫面
            updateLeaderboard(true, score, timeStr, finalTimeMs);
            setTimeout(() => {
                document.getElementById('start-screen').classList.remove('hidden');
            }, 3000);
        }

        function spawnBigCoin() {
            let valid = false;
            let r, c;
            let attempts = 0;
            while (!valid && attempts < 100) {
                r = Math.floor(Math.random() * maze.length);
                c = Math.floor(Math.random() * maze[0].length);
                if (maze[r][c] !== 1) valid = true;
                attempts++;
            }
            if (valid) {
                bigCoin.x = c * GRID_SIZE + GRID_SIZE / 2;
                bigCoin.y = r * GRID_SIZE + GRID_SIZE / 2;
                bigCoin.spawnTime = Date.now();
            }
        }

        function updateBigCoin() {
            if (!gameStarted || gameOver || gameWin) return;
            const now = Date.now();
            if (now - bigCoin.spawnTime > bigCoin.duration) spawnBigCoin();
        }

        function activatePowerMode() {
            powerModeEndTime = Date.now() + 5000;
            statusDisplay.innerHTML = '<span class="status-badge" style="background:#0000ff; color:white;">無敵模式!</span>';
            ghosts.forEach(g => {
                if (!g.isDead) {
                    g.state = 'scared';
                    const reverseDx = -g.dx;
                    const reverseDy = -g.dy;
                    const gridX = Math.round(g.x / GRID_SIZE - 0.5);
                    const gridY = Math.round(g.y / GRID_SIZE - 0.5);
                    if (!isWallGrid(gridX + reverseDx, gridY + reverseDy)) {
                        g.dx = reverseDx; g.dy = reverseDy;
                    }
                }
            });
        }

        function updatePacman() {
            if (!gameStarted || gameOver || gameWin) return;

            const centerX = getCenter(pacman.x);
            const centerY = getCenter(pacman.y);
            const distToCenter = Math.hypot(pacman.x - centerX, pacman.y - centerY);

            if (distToCenter < 5) {
                if (pacman.nextDx !== 0 || pacman.nextDy !== 0) {
                    const nextCol = Math.floor((centerX + pacman.nextDx * GRID_SIZE) / GRID_SIZE);
                    const nextRow = Math.floor((centerY + pacman.nextDy * GRID_SIZE) / GRID_SIZE);
                    if (!isWallGrid(nextCol, nextRow)) {
                        pacman.x = centerX; pacman.y = centerY;
                        pacman.dx = pacman.nextDx; pacman.dy = pacman.nextDy;
                        pacman.nextDx = 0; pacman.nextDy = 0;
                    }
                }
            }

            let nextX = pacman.x + pacman.dx * pacman.speed;
            let nextY = pacman.y + pacman.dy * pacman.speed;
            if (!isWallPixel(nextX, nextY, pacman.radius - 2)) {
                pacman.x = nextX; pacman.y = nextY;
            } else {
                pacman.x = centerX; pacman.y = centerY;
            }

            // ★ 優化吃豆子邏輯：檢查九宮格範圍，避免邊界判定失效
            const pCol = Math.round(pacman.x / GRID_SIZE - 0.5);
            const pRow = Math.round(pacman.y / GRID_SIZE - 0.5);
            
            for (let r = pRow - 1; r <= pRow + 1; r++) {
                for (let c = pCol - 1; c <= pCol + 1; c++) {
                    if (r >= 0 && r < maze.length && c >= 0 && c < maze[0].length) {
                         const cellType = maze[r][c];
                         if (cellType === 2 || cellType === 3) {
                             const itemX = c * GRID_SIZE + GRID_SIZE/2;
                             const itemY = r * GRID_SIZE + GRID_SIZE/2;
                             
                             // 放寬判定距離 10 -> 15
                             if (Math.hypot(pacman.x - itemX, pacman.y - itemY) < 15) {
                                 maze[r][c] = 0;
                                 score++;
                                 if (cellType === 3) activatePowerMode();
                                 scoreDisplay.innerText = score;
                                 
                                 // 更新剩餘數量
                                 remainingPellets = maze.flat().filter(c => c === 2 || c === 3).length;
                                 remainingDisplay.innerText = remainingPellets;
                                 
                                 if (remainingPellets === 0) triggerGameWin();
                             }
                         }
                    }
                }
            }

            if (Math.hypot(pacman.x - bigCoin.x, pacman.y - bigCoin.y) < 15) {
                score += bigCoin.value;
                scoreDisplay.innerText = score;
                spawnBigCoin();
                const tempText = statusDisplay.innerHTML;
                statusDisplay.innerHTML = '<span style="color:#ffd700">★ +20 ★</span>';
                setTimeout(() => {
                   if (!gameOver && !gameWin && statusDisplay.innerHTML.includes("+20")) {
                       statusDisplay.innerHTML = tempText.includes("無敵模式") ? tempText : "";
                   }
                }, 1000);
            }
        }

        function updateGhosts() {
            if (!gameStarted || gameOver || gameWin) return;

            const isPowerMode = Date.now() < powerModeEndTime;
            if (!isPowerMode && statusDisplay.innerText.includes("無敵模式")) statusDisplay.innerText = "";

            ghosts.forEach(g => {
                if (g.isDead) {
                    if (Date.now() > g.reviveTime) {
                        g.isDead = false; g.x = g.startX; g.y = g.startY;
                        g.state = 'wander'; g.color = g.originalColor;
                    } else return;
                }

                if (isPowerMode) { g.state = 'scared'; g.color = COLORS.ghostScared; }
                else {
                    g.color = g.originalColor;
                    if (g.state === 'scared') g.state = 'wander'; 
                }

                let currentSpeed = g.speed * (g.state === 'scared' ? 0.5 : 1);
                
                // 網格移動邏輯 (保持原有邏輯，僅略微整理)
                const gridX = Math.round(g.x / GRID_SIZE - 0.5);
                const gridY = Math.round(g.y / GRID_SIZE - 0.5);
                const centerX = gridX * GRID_SIZE + GRID_SIZE/2;
                const centerY = gridY * GRID_SIZE + GRID_SIZE/2;
                const nextX = g.x + g.dx * currentSpeed;
                const nextY = g.y + g.dy * currentSpeed;

                let crossCenter = false;
                if (g.dx !== 0 && ((g.x <= centerX && nextX >= centerX) || (g.x >= centerX && nextX <= centerX))) crossCenter = true;
                else if (g.dy !== 0 && ((g.y <= centerY && nextY >= centerY) || (g.y >= centerY && nextY <= centerY))) crossCenter = true;
                else if (g.dx === 0 && g.dy === 0) crossCenter = true; // 靜止狀態強制啟動

                if (crossCenter) {
                    g.x = centerX; g.y = centerY;
                    const possibleMoves = [];
                    const directions = [{ dx: 0, dy: -1 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }, { dx: 1, dy: 0 }];
                    directions.forEach(dir => {
                        if (dir.dx === -g.dx && dir.dy === -g.dy) return; 
                        if (!isWallGrid(gridX + dir.dx, gridY + dir.dy)) possibleMoves.push(dir);
                    });
                    if (possibleMoves.length === 0) { // 死路
                        directions.forEach(dir => {
                            if (!isWallGrid(gridX + dir.dx, gridY + dir.dy)) possibleMoves.push(dir);
                        });
                    }

                    if (!isPowerMode) {
                        const dist = Math.hypot(g.x - pacman.x, g.y - pacman.y);
                        g.state = (dist < ghostDetectionRadius) ? 'chase' : 'wander';
                    }

                    let bestMove = possibleMoves[0];
                    if (possibleMoves.length > 0) {
                        if (g.state === 'chase') {
                            let minDistance = Infinity;
                            possibleMoves.forEach(move => {
                                const d = Math.hypot((gridX+move.dx)*GRID_SIZE+GRID_SIZE/2 - pacman.x, (gridY+move.dy)*GRID_SIZE+GRID_SIZE/2 - pacman.y);
                                if (d < minDistance) { minDistance = d; bestMove = move; }
                            });
                        } else if (g.state === 'scared') {
                            let maxDistance = -1;
                            possibleMoves.forEach(move => {
                                const d = Math.hypot((gridX+move.dx)*GRID_SIZE+GRID_SIZE/2 - pacman.x, (gridY+move.dy)*GRID_SIZE+GRID_SIZE/2 - pacman.y);
                                if (d > maxDistance) { maxDistance = d; bestMove = move; }
                            });
                        } else {
                            bestMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                        }
                    }
                    if (bestMove) { g.dx = bestMove.dx; g.dy = bestMove.dy; }
                }

                g.x += g.dx * currentSpeed;
                g.y += g.dy * currentSpeed;

                if (Math.hypot(g.x - pacman.x, g.y - pacman.y) < 20) {
                    if (g.state === 'scared') {
                        g.isDead = true; g.reviveTime = Date.now() + 5000;
                        score += 10; scoreDisplay.innerText = score;
                        g.x = -1000; g.y = -1000;
                    } else {
                        triggerGameOver("Caught");
                    }
                }
            });
        }

        function drawMaze() {
            ctx.lineWidth = 2;
            for (let r = 0; r < maze.length; r++) {
                for (let c = 0; c < maze[r].length; c++) {
                    const x = c * GRID_SIZE; const y = r * GRID_SIZE;
                    if (maze[r][c] === 1) {
                        ctx.fillStyle = COLORS.wall; ctx.fillRect(x, y, GRID_SIZE, GRID_SIZE);
                        ctx.strokeStyle = COLORS.wallBorder; ctx.strokeRect(x, y, GRID_SIZE, GRID_SIZE);
                    } else if (maze[r][c] === 2) {
                        ctx.beginPath(); ctx.arc(x + GRID_SIZE/2, y + GRID_SIZE/2, 3, 0, Math.PI*2);
                        ctx.fillStyle = COLORS.pellet; ctx.fill();
                    } else if (maze[r][c] === 3) {
                        const cx = x + GRID_SIZE/2; const cy = y + GRID_SIZE/2;
                        ctx.save(); ctx.translate(cx, cy); ctx.rotate((Date.now()/200)%(Math.PI*2));
                        ctx.beginPath();
                        for(let i=0; i<10; i++){
                            const r = (i%2===0)?8:4; const a = (i*Math.PI)/5;
                            ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
                        }
                        ctx.closePath(); ctx.fillStyle = COLORS.powerPellet; ctx.fill(); ctx.restore();
                    }
                }
            }
        }

        function drawBigCoin() {
            ctx.save(); ctx.translate(bigCoin.x, bigCoin.y);
            const scale = 1 + Math.sin(Date.now() / 150) * 0.1; ctx.scale(scale, scale);
            ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fillStyle = COLORS.bigCoin; ctx.shadowColor = COLORS.bigCoin; ctx.shadowBlur = 15; ctx.fill();
            ctx.fillStyle = "#000"; ctx.font = "bold 10px monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("$", 0, 1);
            ctx.restore();
        }

        function drawPacman() {
            ctx.save(); ctx.translate(pacman.x, pacman.y);
            let angle = 0;
            if(pacman.dx===1) angle=0; else if(pacman.dx===-1) angle=Math.PI;
            else if(pacman.dy===-1) angle=-Math.PI/2; else if(pacman.dy===1) angle=Math.PI/2;
            pacman.angle = angle; ctx.rotate(angle);
            pacman.mouthOpen += pacman.mouthSpeed;
            if (pacman.mouthOpen > 0.25 * Math.PI || pacman.mouthOpen < 0) pacman.mouthSpeed *= -1;
            ctx.beginPath(); ctx.arc(0, 0, pacman.radius, pacman.mouthOpen, 2*Math.PI-pacman.mouthOpen);
            ctx.lineTo(0, 0); ctx.fillStyle = COLORS.pacman; ctx.shadowColor = COLORS.pacman; ctx.shadowBlur = 15; ctx.fill(); ctx.restore();
        }

        function drawGhosts() {
            ghosts.forEach(g => {
                if (g.isDead) return;
                ctx.save(); ctx.translate(g.x, g.y);
                if (g.state === 'chase' && !statusDisplay.innerText.includes("無敵模式")) {
                    ctx.beginPath(); ctx.arc(0, 0, ghostDetectionRadius, 0, Math.PI*2);
                    ctx.strokeStyle = g.color; ctx.lineWidth = 1; ctx.setLineDash([5, 5]); ctx.globalAlpha = 0.3; ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1.0;
                }
                ctx.fillStyle = g.color; ctx.shadowColor = g.color; ctx.shadowBlur = 20;
                ctx.beginPath(); ctx.arc(0, 0, 12, Math.PI, 0); ctx.lineTo(12, 12);
                for(let i=1; i<=3; i++) ctx.lineTo(12 - 8*i, 12 - (i%2)*4);
                ctx.fill();
                ctx.fillStyle = '#fff'; ctx.shadowBlur = 0;
                const ex = g.dx*3; const ey = g.dy*3;
                ctx.beginPath(); ctx.arc(-4+ex, -2+ey, 3, 0, Math.PI*2); ctx.arc(4+ex, -2+ey, 3, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(-4+ex*1.5, -2+ey*1.5, 1.5, 0, Math.PI*2); ctx.arc(4+ex*1.5, -2+ey*1.5, 1.5, 0, Math.PI*2); ctx.fill();
                if (g.state === 'scared') {
                     ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath();
                     ctx.moveTo(-6, 6); ctx.lineTo(-3, 4); ctx.lineTo(0, 6); ctx.lineTo(3, 4); ctx.lineTo(6, 6); ctx.stroke();
                }
                ctx.restore();
            });
        }

        function gameLoop() {
            ctx.fillStyle = COLORS.trail;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 更新邏輯 (只有開始遊戲且未結束才執行)
            updateTimer();
            updateBigCoin();
            updatePacman();
            updateGhosts();

            // 繪圖 (隨時執行，保持畫面)
            if(maze) drawMaze(); // maze 存在才畫
            if(gameStarted) drawBigCoin();
            if(maze) { drawPacman(); drawGhosts(); }

            animationId = requestAnimationFrame(gameLoop);
        }

        // 啟動流程
        initUI();
        resetGame(); // 初始化地圖與變數，但不開始
        gameLoop();  // 啟動渲染循環

    </script>
</body>
