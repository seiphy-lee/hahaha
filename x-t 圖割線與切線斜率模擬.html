<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>x-t 圖割線與切線斜率模擬</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .container {
            background-color: white;
            padding: 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        /* D3 繪圖相關樣式 */
        .line-main {
            fill: none;
            stroke: #2563eb; /* 藍色 */
            stroke-width: 2.5;
        }
        .line-secant {
            fill: none;
            stroke: #ea580c; /* 橘色 */
            stroke-width: 2;
            stroke-dasharray: 5,5; /* 虛線效果 */
        }
        .point {
            fill: #dc2626; /* 紅色 */
            cursor: pointer;
        }
        .point:hover {
            stroke: #991b1b;
            stroke-width: 2;
        }
        .axis text {
            font-size: 12px;
        }
        .grid line {
            stroke: #e5e7eb;
            stroke-opacity: 0.7;
            shape-rendering: crispEdges;
        }
        .grid path {
            stroke-width: 0;
        }
        /* 控制面板的輸入框樣式 */
        input[type="number"] {
            width: 60px;
            text-align: center;
            border: 1px solid #d1d5db;
            border-radius: 0.25rem;
            padding: 0.25rem;
        }
        /* 隱藏 Chrome/Safari 數字輸入框的上下箭頭 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="text-2xl font-bold text-center text-gray-800">x-t 圖割線與切線斜率模擬 <span class="text-blue-600 text-xl font-medium">(台中二中 阿發老師 設計)</span></h1>
        
        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <!-- 函數定義區 -->
                <div class="flex items-center gap-2 text-lg font-mono flex-wrap justify-center">
                    <span class="font-bold text-gray-700">x(t) = </span>
                    <input type="number" id="coeff-a" value="0" step="0.1"> <span class="text-sm text-gray-500">t³</span> <span class="text-gray-400">+</span>
                    <input type="number" id="coeff-b" value="1" step="0.1"> <span class="text-sm text-gray-500">t²</span> <span class="text-gray-400">+</span>
                    <input type="number" id="coeff-c" value="0" step="0.1"> <span class="text-sm text-gray-500">t</span> <span class="text-gray-400">+</span>
                    <input type="number" id="coeff-d" value="0" step="0.1">
                </div>
                
                <!-- 縮放控制區 -->
                <div class="flex items-center gap-2">
                    <label for="zoom-slider" class="text-sm font-semibold text-gray-600 whitespace-nowrap">畫面縮放:</label>
                    <input type="range" id="zoom-slider" min="0.5" max="5" value="1" step="0.1" class="w-32 cursor-pointer">
                    <span id="zoom-value" class="text-sm text-gray-500 font-mono w-8 text-right">1.0x</span>
                </div>
            </div>
            <p class="text-xs text-center text-gray-400 mt-2">提示：修改上方係數後，圖表會自動更新。</p>
        </div>
        
        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 flex flex-wrap justify-around items-center gap-4">
            <div class="text-center">
                <span class="block text-sm text-gray-500 font-semibold">點 A (t₁, x₁)</span>
                <span id="coord-a" class="block text-lg font-bold text-blue-700 font-mono">(1.00, 1.00)</span>
            </div>
            <div class="text-center">
                <span class="block text-sm text-gray-500 font-semibold">點 B (t₂, x₂)</span>
                <span id="coord-b" class="block text-lg font-bold text-blue-700 font-mono">(3.00, 9.00)</span>
            </div>
            <div class="text-center md:border-l-2 md:border-blue-200 md:pl-6 w-full md:w-auto">
                <span id="slope-label" class="block text-sm text-gray-500 font-semibold">割線斜率 (Δx / Δt)</span>
                <span id="slope-value" class="block text-2xl font-bold text-orange-600 font-mono">4.00</span>
            </div>
        </div>

        <!-- 修改高度比例，讓畫面更緊湊 -->
        <div id="chart-container" class="relative w-full aspect-[21/9] border border-gray-100 rounded-lg overflow-hidden bg-white shadow-inner"></div>
        
        <p class="text-center text-sm text-gray-500">操作說明：拖曳圖表上的<span class="text-red-500 font-bold">紅點</span>來觀察割線斜率的變化。</p>
    </div>

    <script>
        // --- 1. 取得 DOM 元素與設定變數 ---
        const container = d3.select("#chart-container");
        const coordAEl = document.getElementById('coord-a');
        const coordBEl = document.getElementById('coord-b');
        const slopeLabelEl = document.getElementById('slope-label');
        const slopeValueEl = document.getElementById('slope-value');
        const zoomSlider = document.getElementById('zoom-slider');
        const zoomValueEl = document.getElementById('zoom-value');
        
        const inputA = document.getElementById('coeff-a');
        const inputB = document.getElementById('coeff-b');
        const inputC = document.getElementById('coeff-c');
        const inputD = document.getElementById('coeff-d');

        // 圖表邊距設定
        const margin = { top: 20, right: 30, bottom: 40, left: 50 };
        // 使用固定的內部坐標系大小，方便運算
        const SVG_WIDTH = 800;
        const SVG_HEIGHT = 400;
        const innerWidth = SVG_WIDTH - margin.left - margin.right;
        const innerHeight = SVG_HEIGHT - margin.top - margin.bottom;

        // 初始狀態變數
        let t1 = 1;
        let t2 = 3;
        let zoomLevel = parseFloat(zoomSlider.value);

        // 基礎座標範圍 (當 zoom = 1 時)，將 X 軸改為從 0 開始
        const BASE_DOMAIN_X = [0, 5];
        const BASE_DOMAIN_Y = [-5, 20];

        // --- 2. 核心邏輯函式 ---

        // 根據輸入框取得目前的函數 f(t)
        function f(t) {
            const a = parseFloat(inputA.value) || 0;
            const b = parseFloat(inputB.value) || 0;
            const c = parseFloat(inputC.value) || 0;
            const d = parseFloat(inputD.value) || 0;
            return a * Math.pow(t, 3) + b * Math.pow(t, 2) + c * t + d;
        }

        // 計算函數的一階導數 f'(t)，用來求切線斜率
        function fPrime(t) {
            const a = parseFloat(inputA.value) || 0;
            const b = parseFloat(inputB.value) || 0;
            const c = parseFloat(inputC.value) || 0;
            return 3 * a * Math.pow(t, 2) + 2 * b * t + c;
        }

        // --- 3. D3 圖表初始化 ---
        
        // 建立 SVG 畫布
        const svg = container.append("svg")
            .attr("width", "100%")
            .attr("height", "100%")
            .attr("viewBox", `0 0 ${SVG_WIDTH} ${SVG_HEIGHT}`)
            .attr("preserveAspectRatio", "xMidYMid meet");

        // 建立一個有裁切區域的群組，防止圖形超出座標軸範圍
        svg.append("defs").append("clipPath")
            .attr("id", "clip")
            .append("rect")
            .attr("width", innerWidth)
            .attr("height", innerHeight);

        // 主要繪圖群組
        const g = svg.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // 包含曲線和點的群組，套用裁切
        const plotArea = g.append("g")
            .attr("clip-path", "url(#clip)");

        // 初始化比例尺 (Scale)
        const xScale = d3.scaleLinear().range([0, innerWidth]);
        const yScale = d3.scaleLinear().range([innerHeight, 0]);

        // 建立座標軸的群組
        const xAxisG = g.append("g")
            .attr("class", "axis text-gray-700")
            .attr("transform", `translate(0,${innerHeight})`);
        const yAxisG = g.append("g")
            .attr("class", "axis text-gray-700");
            
        // 建立網格線的群組
        const xGridG = g.append("g").attr("class", "grid").attr("transform", `translate(0,${innerHeight})`);
        const yGridG = g.append("g").attr("class", "grid");

        // 座標軸標籤
        g.append("text")
            .attr("x", innerWidth / 2)
            .attr("y", innerHeight + 35)
            .attr("fill", "currentColor")
            .style("text-anchor", "middle")
            .style("font-size", "14px")
            .text("時間 t");

        g.append("text")
            .attr("transform", "rotate(-90)")
            .attr("y", -35)
            .attr("x", -innerHeight / 2)
            .attr("fill", "currentColor")
            .style("text-anchor", "middle")
            .style("font-size", "14px")
            .text("位置 x");

        // --- 4. 繪製元素初始化 ---

        // 主曲線
        const mainLinePath = plotArea.append("path")
            .attr("class", "line-main");

        // 割線
        const secantLine = plotArea.append("line")
            .attr("class", "line-secant");

        // 控制點 A 與 B
        const pointA = plotArea.append("circle").attr("class", "point").attr("r", 6);
        const pointB = plotArea.append("circle").attr("class", "point").attr("r", 6);

        // --- 5. 更新圖表的函式 (核心渲染邏輯) ---
        function updateChart(fullUpdate = true) {
            // 如果需要完整更新 (例如改變縮放或改變函數係數)
            if (fullUpdate) {
                // 計算新的座標範圍 (基於 zoomLevel 縮放)
                const currentDomainX = [
                    BASE_DOMAIN_X[0] / zoomLevel, 
                    BASE_DOMAIN_X[1] / zoomLevel
                ];
                
                // 1. 優先計算曲線路徑的點
                const tMin = currentDomainX[0];
                const tMax = currentDomainX[1];
                const step = (tMax - tMin) / 200; 
                const lineData = d3.range(tMin, tMax + step, step).map(t => ({ t: t, x: f(t) }));

                // 2. 動態計算 Y 軸範圍：找出範圍內的最高和最低點
                const yMin = d3.min(lineData, d => d.x);
                const yMax = d3.max(lineData, d => d.x);
                
                // 上下預留 10% 的邊距，確保兩顆紅點絕對不會超出畫面
                const yRange = yMax - yMin;
                const padding = yRange === 0 ? 1 : yRange * 0.1;
                
                const currentDomainY = [
                    yMin - padding, 
                    yMax + padding
                ];

                // 更新比例尺
                xScale.domain(currentDomainX);
                yScale.domain(currentDomainY);

                // 更新座標軸與網格
                xAxisG.call(d3.axisBottom(xScale));
                yAxisG.call(d3.axisLeft(yScale));
                
                xGridG.call(d3.axisBottom(xScale).tickSize(-innerHeight).tickFormat(""));
                yGridG.call(d3.axisLeft(yScale).tickSize(-innerWidth).tickFormat(""));
                
                // 3. 繪製曲線路徑
                const lineGenerator = d3.line()
                    .x(d => xScale(d.t))
                    .y(d => yScale(d.x))
                    .curve(d3.curveBasis);

                mainLinePath
                    .datum(lineData)
                    .attr("d", lineGenerator);
            }

            // --- 以下為每次更新都會執行的部分 (例如拖曳點) ---

            // 計算當前的 x1, x2 值
            const x1 = f(t1);
            const x2 = f(t2);

            // 更新點的位置
            pointA.attr("cx", xScale(t1)).attr("cy", yScale(x1));
            pointB.attr("cx", xScale(t2)).attr("cy", yScale(x2));

            // 更新割線或切線與斜率計算
            let slope = 0;
            let isTangent = false;

            // 當兩點距離極近（或重疊）時，轉換為切線
            if (Math.abs(t1 - t2) < 0.01) {
                isTangent = true;
                slope = fPrime(t1); // 代入導數求切線斜率
            } else {
                slope = (x2 - x1) / (t2 - t1); // 一般割線斜率
            }
                
            // 延伸割線或切線到畫面邊緣
            const domainX = xScale.domain();
            const ext_t1 = domainX[0] - 10; // 稍微超出範圍確保畫滿
            const ext_x1 = slope * (ext_t1 - t1) + x1;
            
            const ext_t2 = domainX[1] + 10;
            const ext_x2 = slope * (ext_t2 - t1) + x1;

            secantLine
                .attr("x1", xScale(ext_t1)).attr("y1", yScale(ext_x1))
                .attr("x2", xScale(ext_t2)).attr("y2", yScale(ext_x2))
                .style("display", "block");
                
            // 根據是割線還是切線，改變視覺樣式與標籤
            if (isTangent) {
                secantLine.attr("stroke-dasharray", "none").style("stroke", "#16a34a"); // 綠色實線代表切線
                slopeLabelEl.textContent = "切線斜率 (dx / dt)";
                slopeValueEl.className = "block text-2xl font-bold text-green-600 font-mono";
            } else {
                secantLine.attr("stroke-dasharray", "5,5").style("stroke", "#ea580c"); // 橘色虛線代表割線
                slopeLabelEl.textContent = "割線斜率 (Δx / Δt)";
                slopeValueEl.className = "block text-2xl font-bold text-orange-600 font-mono";
            }

            // 更新 HTML 顯示數值
            coordAEl.textContent = `(${t1.toFixed(2)}, ${x1.toFixed(2)})`;
            coordBEl.textContent = `(${t2.toFixed(2)}, ${x2.toFixed(2)})`;
            slopeValueEl.textContent = slope.toFixed(2);
        }

        // --- 6. 事件綁定 (拖曳與輸入改變) ---

        // 點的拖曳行為
        function createDragBehavior(isPointA) {
            return d3.drag().on("drag", (event) => {
                // 將滑鼠在 SVG 的 X 座標反推回 t 值
                let newT = xScale.invert(event.x);
                
                // 將時間點四捨五入到小數點後第二位，幫助使用者更容易將兩點重合
                newT = Math.round(newT * 100) / 100;
                
                // 限制拖曳範圍在目前的畫布內，且確保 t >= 0
                const domainX = xScale.domain();
                newT = Math.max(0, Math.max(domainX[0], Math.min(domainX[1], newT)));
                
                if (isPointA) {
                    t1 = newT;
                } else {
                    t2 = newT;
                }
                updateChart(false); // 拖曳時只需要更新點和線，不用重畫曲線和座標軸
            });
        }

        pointA.call(createDragBehavior(true));
        pointB.call(createDragBehavior(false));

        // 綁定輸入框改變事件 (改變係數時重新繪圖)
        const inputs = [inputA, inputB, inputC, inputD];
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                updateChart(true);
            });
        });

        // 綁定縮放滑桿事件
        zoomSlider.addEventListener('input', (e) => {
            zoomLevel = parseFloat(e.target.value);
            zoomValueEl.textContent = zoomLevel.toFixed(1) + 'x';
            updateChart(true); // 縮放時需要完整更新
        });

        // --- 7. 啟動 ---
        updateChart(true);

    </script>
</body>
</html>
