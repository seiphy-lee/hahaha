<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>x-t 圖割線與切線斜率模擬</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fffbeb; /* 活潑淺黃背景 */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .container {
            background-color: white;
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        /* D3 繪圖相關樣式 */
        .line-main {
            fill: none;
            stroke: #3b82f6; /* 亮藍色主曲線 */
            stroke-width: 3.5;
        }
        .line-secant {
            fill: none;
            stroke: #f97316; /* 亮橘色割線 */
            stroke-width: 2.5;
            stroke-dasharray: 6,6;
        }
        .point {
            fill: #ef4444; /* 亮紅色控制點 */
            cursor: grab;
            stroke: white;
            stroke-width: 2;
        }
        .point:active {
            cursor: grabbing;
        }
        .point:hover {
            stroke: #b91c1c;
            stroke-width: 3;
            r: 9;
            transition: all 0.2s;
        }
        .axis text {
            font-size: 13px;
            font-weight: 600;
            fill: #4b5563;
        }
        .axis path, .axis line {
            stroke: #9ca3af;
        }
        .grid line {
            stroke: #e5e7eb;
            stroke-opacity: 0.7;
            shape-rendering: crispEdges;
        }
        .grid path {
            stroke-width: 0;
        }
        /* 控制面板的輸入框樣式 */
        input[type="number"] {
            width: 55px; 
            text-align: center;
            border: 2px solid #fdba74;
            border-radius: 0.5rem;
            padding: 0.25rem;
            background-color: #fffaf0;
            font-weight: bold;
            color: #c2410c;
            transition: all 0.2s;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #ea580c;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.2);
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        /* 縮放滑桿樣式 */
        input[type=range] {
            accent-color: #f97316;
            height: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="text-3xl font-extrabold text-center text-gray-800 tracking-tight">
            x-t 圖割線與切線斜率模擬 
            <span class="text-blue-600 text-xl font-bold ml-2 align-middle drop-shadow-sm">(台中二中 阿發老師 設計)</span>
        </h1>
        
        <div class="bg-orange-50 p-3 rounded-xl border-2 border-orange-200 shadow-sm flex flex-col xl:flex-row items-center justify-between gap-4">
            
            <!-- 函數定義區 -->
            <div class="flex items-center gap-2 text-lg font-mono flex-wrap justify-center">
                <span class="font-extrabold text-orange-900 mr-1">x(t) = </span>
                <input type="number" id="coeff-a" value="0" step="0.1"> <span class="text-base font-bold text-orange-500">t³</span> <span class="text-orange-400 font-bold">+</span>
                <input type="number" id="coeff-b" value="1" step="0.1"> <span class="text-base font-bold text-orange-500">t²</span> <span class="text-orange-400 font-bold">+</span>
                <input type="number" id="coeff-c" value="0" step="0.1"> <span class="text-base font-bold text-orange-500">t</span> <span class="text-orange-400 font-bold">+</span>
                <input type="number" id="coeff-d" value="0" step="0.1">
            </div>
            
            <!-- 提示與縮放控制區 -->
            <div class="flex items-center gap-4 flex-wrap justify-center mt-2 md:mt-0">
                <span class="text-xs font-semibold text-orange-600/80 hidden md:inline bg-orange-100 px-2 py-1 rounded-md">提示: 修改係數自動更新</span>
                
                <div class="flex items-center gap-2 bg-white/60 px-3 py-1.5 rounded-lg border border-orange-100">
                    <label for="zoom-y-slider" class="text-sm font-bold text-orange-800 whitespace-nowrap">x軸 (位置) 縮放:</label>
                    <input type="range" id="zoom-y-slider" min="1" max="5" value="1" step="0.1" class="w-20 cursor-pointer">
                    <span id="zoom-y-value" class="text-sm text-orange-700 font-bold font-mono w-8 text-right">1.0x</span>
                </div>

                <div class="flex items-center gap-2 bg-white/60 px-3 py-1.5 rounded-lg border border-orange-100">
                    <label for="zoom-x-slider" class="text-sm font-bold text-orange-800 whitespace-nowrap">t軸 (時間) 縮放:</label>
                    <input type="range" id="zoom-x-slider" min="0.5" max="5" value="1" step="0.1" class="w-20 cursor-pointer">
                    <span id="zoom-x-value" class="text-sm text-orange-700 font-bold font-mono w-8 text-right">1.0x</span>
                </div>
            </div>
        </div>
        
        <!-- 數值顯示區 (修復了不小心多出來的 </div>) -->
        <div class="bg-orange-50 border-2 border-orange-200 rounded-xl p-5 flex flex-wrap justify-around items-center gap-4 shadow-sm">
            <div class="text-center flex-1">
                <span class="block text-2xl text-amber-800 font-black uppercase tracking-wider mb-2 drop-shadow-sm">點 A (t₁, x₁)</span>
                <span id="coord-a" class="block text-3xl font-black text-blue-600 font-mono drop-shadow-sm">(1.00, 1.00)</span>
            </div>
            <div class="text-center md:border-l-2 md:border-amber-200 md:pl-6 flex-1">
                <span class="block text-2xl text-amber-800 font-black uppercase tracking-wider mb-2 drop-shadow-sm">點 B (t₂, x₂)</span>
                <span id="coord-b" class="block text-3xl font-black text-blue-600 font-mono drop-shadow-sm">(3.00, 9.00)</span>
            </div>
            <div class="text-center md:border-l-2 md:border-amber-200 md:pl-6 flex-1 relative">
                <span id="slope-label" class="block text-2xl text-amber-800 font-black uppercase tracking-wider mb-2 drop-shadow-sm">割線斜率 (Δx / Δt)</span>
                <span id="slope-value" class="block text-5xl font-black text-orange-600 font-mono drop-shadow-md">4.00</span>
            </div>
        </div>

        <div id="chart-container" class="relative w-full aspect-[21/9] border-2 border-gray-200 rounded-2xl overflow-hidden bg-white shadow-inner"></div>
        
        <p class="text-center text-sm font-semibold text-gray-500">
            操作說明：拖曳圖表上的<span class="text-red-500 font-black px-1 text-base">紅點</span>來觀察割線斜率的變化。
        </p>
    </div>

    <script>
        const container = d3.select("#chart-container");
        const coordAEl = document.getElementById('coord-a');
        const coordBEl = document.getElementById('coord-b');
        const slopeLabelEl = document.getElementById('slope-label');
        const slopeValueEl = document.getElementById('slope-value');
        
        const zoomXSlider = document.getElementById('zoom-x-slider');
        const zoomXValueEl = document.getElementById('zoom-x-value');
        const zoomYSlider = document.getElementById('zoom-y-slider');
        const zoomYValueEl = document.getElementById('zoom-y-value');
        
        const inputA = document.getElementById('coeff-a');
        const inputB = document.getElementById('coeff-b');
        const inputC = document.getElementById('coeff-c');
        const inputD = document.getElementById('coeff-d');

        const margin = { top: 30, right: 30, bottom: 50, left: 60 };
        const SVG_WIDTH = 900;
        const SVG_HEIGHT = 450;
        const innerWidth = SVG_WIDTH - margin.left - margin.right;
        const innerHeight = SVG_HEIGHT - margin.top - margin.bottom;

        let t1 = 1;
        let t2 = 3;
        let zoomLevelX = parseFloat(zoomXSlider.value);
        let zoomLevelY = parseFloat(zoomYSlider.value);

        const BASE_DOMAIN_X = [0, 5]; // t 強制從 0 開始

        // 計算 x(t)
        function f(t) {
            const a = parseFloat(inputA.value) || 0;
            const b = parseFloat(inputB.value) || 0;
            const c = parseFloat(inputC.value) || 0;
            const d = parseFloat(inputD.value) || 0;
            return a * Math.pow(t, 3) + b * Math.pow(t, 2) + c * t + d;
        }

        // 計算 f'(t) (導數)
        function fPrime(t) {
            const a = parseFloat(inputA.value) || 0;
            const b = parseFloat(inputB.value) || 0;
            const c = parseFloat(inputC.value) || 0;
            return 3 * a * Math.pow(t, 2) + 2 * b * t + c;
        }

        const svg = container.append("svg")
            .attr("width", "100%")
            .attr("height", "100%")
            .attr("viewBox", `0 0 ${SVG_WIDTH} ${SVG_HEIGHT}`)
            .attr("preserveAspectRatio", "xMidYMid meet");

        svg.append("defs").append("clipPath")
            .attr("id", "clip")
            .append("rect")
            .attr("width", innerWidth)
            .attr("height", innerHeight);

        const g = svg.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        const plotArea = g.append("g").attr("clip-path", "url(#clip)");

        const xScale = d3.scaleLinear().range([0, innerWidth]);
        const yScale = d3.scaleLinear().range([innerHeight, 0]);

        const xAxisG = g.append("g").attr("class", "axis").attr("transform", `translate(0,${innerHeight})`);
        const yAxisG = g.append("g").attr("class", "axis");
        const xGridG = g.append("g").attr("class", "grid").attr("transform", `translate(0,${innerHeight})`);
        const yGridG = g.append("g").attr("class", "grid");

        // 座標軸標籤
        g.append("text")
            .attr("x", innerWidth / 2)
            .attr("y", innerHeight + 40)
            .attr("fill", "#374151")
            .style("text-anchor", "middle")
            .style("font-size", "15px")
            .style("font-weight", "bold")
            .text("時間 t");

        g.append("text")
            .attr("transform", "rotate(-90)")
            .attr("y", -45)
            .attr("x", -innerHeight / 2)
            .attr("fill", "#374151")
            .style("text-anchor", "middle")
            .style("font-size", "15px")
            .style("font-weight", "bold")
            .text("位置 x");

        const mainLinePath = plotArea.append("path").attr("class", "line-main");
        const secantLine = plotArea.append("line").attr("class", "line-secant");
        const pointA = plotArea.append("circle").attr("class", "point").attr("r", 8);
        const pointB = plotArea.append("circle").attr("class", "point").attr("r", 8);

        function updateChart(fullUpdate = true) {
            if (fullUpdate) {
                // 處理水平 t 軸 (X軸) 縮放
                const currentDomainX = [
                    BASE_DOMAIN_X[0] / zoomLevelX, 
                    BASE_DOMAIN_X[1] / zoomLevelX
                ];
                
                // 產生取樣點，找出可視範圍內的曲線高低點
                const tMin = currentDomainX[0];
                const tMax = currentDomainX[1];
                const step = (tMax - tMin) / 200; 
                const lineData = d3.range(tMin, tMax + step, step).map(t => ({ t: t, x: f(t) }));

                // 自動計算目前的垂直 Y 軸極值
                const yMin = d3.min(lineData, d => d.x);
                const yMax = d3.max(lineData, d => d.x);
                const baseRange = yMax - yMin;
                const padding = baseRange === 0 ? 1 : baseRange * 0.1;
                
                const baseMinY = yMin - padding;
                const baseMaxY = yMax + padding;
                
                // 處理垂直 x 軸 (Y軸) 縮放
                const scaledRangeY = (baseMaxY - baseMinY) / zoomLevelY;
                const currentDomainY = [
                    baseMinY, 
                    baseMinY + scaledRangeY
                ];

                xScale.domain(currentDomainX);
                yScale.domain(currentDomainY);

                // 更新畫面中的座標軸與格線
                xAxisG.call(d3.axisBottom(xScale));
                yAxisG.call(d3.axisLeft(yScale));
                xGridG.call(d3.axisBottom(xScale).tickSize(-innerHeight).tickFormat(""));
                yGridG.call(d3.axisLeft(yScale).tickSize(-innerWidth).tickFormat(""));
                
                // 繪製藍色曲線
                const lineGenerator = d3.line()
                    .x(d => xScale(d.t))
                    .y(d => yScale(d.x))
                    .curve(d3.curveBasis);

                mainLinePath
                    .datum(lineData)
                    .attr("d", lineGenerator);
            }

            const x1 = f(t1);
            const x2 = f(t2);

            pointA.attr("cx", xScale(t1)).attr("cy", yScale(x1));
            pointB.attr("cx", xScale(t2)).attr("cy", yScale(x2));

            let slope = 0;
            let isTangent = false;

            // 判斷是否重疊 (切線) - 小於 0.01 視為重疊
            if (Math.abs(t1 - t2) < 0.01) {
                isTangent = true;
                slope = fPrime(t1);
            } else {
                slope = (x2 - x1) / (t2 - t1);
            }
                
            // 繪製割/切線 (延伸出畫面)
            const domainX = xScale.domain();
            const ext_t1 = domainX[0] - 10;
            const ext_x1 = slope * (ext_t1 - t1) + x1;
            const ext_t2 = domainX[1] + 10;
            const ext_x2 = slope * (ext_t2 - t1) + x1;

            secantLine
                .attr("x1", xScale(ext_t1)).attr("y1", yScale(ext_x1))
                .attr("x2", xScale(ext_t2)).attr("y2", yScale(ext_x2))
                .style("display", "block");
                
            // 更新 UI 文字與樣式 (切線綠色實線 / 割線橘色虛線)
            if (isTangent) {
                secantLine.attr("stroke-dasharray", "none").style("stroke", "#10b981"); 
                slopeLabelEl.textContent = "切線斜率 (dx / dt)";
                slopeValueEl.className = "block text-5xl font-black text-emerald-500 font-mono drop-shadow-md";
            } else {
                secantLine.attr("stroke-dasharray", "6,6").style("stroke", "#f97316");
                slopeLabelEl.textContent = "割線斜率 (Δx / Δt)";
                slopeValueEl.className = "block text-5xl font-black text-orange-600 font-mono drop-shadow-md";
            }

            coordAEl.textContent = `(${t1.toFixed(2)}, ${x1.toFixed(2)})`;
            coordBEl.textContent = `(${t2.toFixed(2)}, ${x2.toFixed(2)})`;
            
            slopeValueEl.textContent = Math.abs(slope) < 0.001 ? "0.00" : slope.toFixed(2);
        }

        function createDragBehavior(isPointA) {
            return d3.drag().on("drag", (event) => {
                let newT = xScale.invert(event.x);
                newT = Math.round(newT * 100) / 100;
                
                const domainX = xScale.domain();
                // 強制限制 t 必須大於等於 0，且不出現在畫面外
                newT = Math.max(0, Math.max(domainX[0], Math.min(domainX[1], newT)));
                
                if (isPointA) { t1 = newT; } else { t2 = newT; }
                updateChart(false); 
            });
        }

        pointA.call(createDragBehavior(true));
        pointB.call(createDragBehavior(false));

        const inputs = [inputA, inputB, inputC, inputD];
        inputs.forEach(input => {
            input.addEventListener('input', () => { updateChart(true); });
        });

        // 綁定時間軸(水平)縮放
        zoomXSlider.addEventListener('input', (e) => {
            zoomLevelX = parseFloat(e.target.value);
            zoomXValueEl.textContent = zoomLevelX.toFixed(1) + 'x';
            updateChart(true);
        });

        // 綁定位置軸(垂直)縮放
        zoomYSlider.addEventListener('input', (e) => {
            zoomLevelY = parseFloat(e.target.value);
            zoomYValueEl.textContent = zoomLevelY.toFixed(1) + 'x';
            updateChart(true);
        });

        updateChart(true);

    </script>
</body>
</html>
