<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽籤回答系統 - 物理老師的藝術作</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --panel-bg: rgba(20, 20, 25, 0.85);
            --neon-blue: #00f2ff;
            --neon-pink: #ff00ea;
            --text-color: #e0e0e0;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            display: block;
            cursor: pointer; /* 提示可以點擊 */
        }

        /* 介面樣式 */
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            max-height: 90vh;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
            z-index: 100;
        }

        h2 { margin-top: 0; color: var(--neon-blue); font-size: 1.2rem; }
        
        textarea {
            width: 100%;
            height: 120px;
            background: rgba(0,0,0,0.3);
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            font-size: 14px;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(45deg, var(--neon-blue), #0066ff);
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px var(--neon-blue);
        }

        button.secondary {
            background: #444;
        }

        button.shuffle {
            background: linear-gradient(45deg, #ffcc00, #ff9900);
            color: #000;
        }

        .winner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .winner-card {
            text-align: center;
            padding: 40px;
            border: 2px solid var(--neon-pink);
            border-radius: 20px;
            box-shadow: 0 0 30px var(--neon-pink);
            background: #111;
        }

        .winner-title { color: var(--neon-pink); font-size: 1.5rem; margin-bottom: 10px; }
        .winner-name { font-size: 3rem; font-weight: bold; color: #fff; margin-bottom: 20px; }

        input[type="file"] { display: none; }
        .file-label {
            display: inline-block;
            padding: 8px;
            background: #333;
            border-radius: 5px;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <h2>🌀 抽籤回答系統(輪盤模式)</h2>
        <p style="font-size: 0.8rem; opacity: 0.7;">輸入名單（每行一個，或逗點隔開）</p>
        <textarea id="nameInput">愛因斯坦, 牛頓, 居禮夫人, 費曼, 霍金, 薛丁格, 普朗克, 特斯拉</textarea>
        
        <div class="controls">
            <div style="display: flex; gap: 5px;">
                <button onclick="updateWheel()" style="flex:1;">更新名單</button>
                <button onclick="shuffleNames()" class="shuffle" style="flex:1;">🔀 打散名單</button>
            </div>
            <div style="display: flex; gap: 5px;">
                <label class="file-label" style="flex:1;">
                    CSV 匯入 <input type="file" id="csvFile" accept=".csv" onchange="handleCSV(this)">
                </label>
            </div>
            <button id="spinBtn" style="font-size: 1.2rem; height: 60px;">⚡ 旋轉輪盤</button>
            <p style="font-size: 0.8rem; margin: 0;">阻力係數：<span id="fricVal">0.985</span></p>
            <input type="range" id="frictionSlider" min="950" max="995" value="985">
        </div>
    </div>

    <!-- 獲獎彈窗 -->
    <div id="winnerOverlay" class="winner-overlay">
        <div class="winner-card">
            <div class="winner-title">🏆 本日最幸運 🏆</div>
            <div id="winnerName" class="winner-name">---</div>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button onclick="closeWinner(false)">留在名單</button>
                <button onclick="closeWinner(true)" class="secondary">移除並繼續</button>
            </div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

<script>
    /** * 音效系統 - 使用 Web Audio API 生成物理音效
     */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTick(freq = 400, type = 'sine', volume = 0.1, duration = 0.05) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    /**
     * 物理引擎參數
     */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const nameInput = document.getElementById('nameInput');
    const winnerOverlay = document.getElementById('winnerOverlay');
    const winnerNameSpan = document.getElementById('winnerName');
    const frictionSlider = document.getElementById('frictionSlider');

    let names = [];
    let angle = 0;
    let angularVel = 0;
    let isSpinning = false;
    let friction = 0.985;
    let lastTickIndex = -1;
    let currentRadius = 0;
    let currentCenterX = 0;
    let currentCenterY = 0;

    // 初始化畫布尺寸
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 更新名單與顏色
    let colors = [];
    function updateWheel() {
        const raw = nameInput.value;
        names = raw.split(/[\n,]+/).map(n => n.trim()).filter(n => n !== "");
        colors = names.map((_, i) => `hsl(${(i * 360 / names.length)}, 70%, 60%)`);
    }
    updateWheel();

    // 打散名單
    function shuffleNames() {
        if (isSpinning) return;
        for (let i = names.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [names[i], names[j]] = [names[j], names[i]];
        }
        nameInput.value = names.join(', ');
        updateWheel();
        playTick(500, 'sine', 0.1, 0.2);
    }

    // CSV 處理
    function handleCSV(input) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            nameInput.value = e.target.result;
            updateWheel();
        };
        reader.readAsText(file);
    }

    // 啟動旋轉函數
    function startSpin() {
        if (isSpinning || names.length === 0) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        // 給予初始衝量 (隨機性)
        angularVel = 0.3 + Math.random() * 0.4;
        isSpinning = true;
        playTick(600, 'square', 0.15, 0.1); // 開始音效
    }

    // 點擊事件
    spinBtn.addEventListener('click', startSpin);
    
    canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        // 計算滑鼠到輪盤中心的距離
        const dx = mouseX - currentCenterX;
        const dy = mouseY - currentCenterY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        // 如果點擊範圍在輪盤內，則旋轉
        if (dist < currentRadius) {
            startSpin();
        }
    });

    function closeWinner(remove) {
        if (remove) {
            const currentWinner = winnerNameSpan.innerText;
            names = names.filter(n => n !== currentWinner);
            nameInput.value = names.join(', ');
            updateWheel();
        }
        winnerOverlay.style.display = 'none';
        isSpinning = false;
    }

    // 核心動畫迴圈
    function animate() {
        // 背景微弱殘影 (物理軌跡感)
        ctx.fillStyle = 'rgba(10, 10, 12, 0.3)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 輪盤中心向右偏移 (由 0.5 改為 0.6)
        const centerX = canvas.width * 0.6;
        const centerY = canvas.height / 2;
        const radius = Math.min(canvas.width, canvas.height) * 0.4;
        
        // 儲存目前座標供點擊判定使用
        currentCenterX = centerX;
        currentCenterY = centerY;
        currentRadius = radius;

        // 讀取摩擦力
        friction = frictionSlider.value / 1000;
        document.getElementById('fricVal').innerText = friction.toFixed(3);

        // 更新物理狀態
        if (isSpinning) {
            angle += angularVel;
            angularVel *= friction; // 模擬空氣與機械摩擦

            // 音效邏輯：當指針跨過扇區邊界時播放
            const segmentAngle = (Math.PI * 2) / names.length;
            const currentTickIndex = Math.floor(((angle % (Math.PI * 2)) + (Math.PI * 2)) % (Math.PI * 2) / segmentAngle);
            if (currentTickIndex !== lastTickIndex && angularVel > 0.005) {
                playTick(300 + angularVel * 200, 'sine', 0.05 + angularVel * 0.1);
                lastTickIndex = currentTickIndex;
            }

            // 停止判定
            if (angularVel < 0.001) {
                angularVel = 0;
                // 指針固定在正上方 (1.5 PI)
                const pointerPos = (1.5 * Math.PI); 
                const finalIdx = Math.floor(( (pointerPos - angle) % (Math.PI * 2) + (Math.PI * 2)) % (Math.PI * 2) / segmentAngle);
                
                setTimeout(() => {
                    if (names[finalIdx]) {
                        winnerNameSpan.innerText = names[finalIdx];
                        winnerOverlay.style.display = 'flex';
                        playTick(800, 'triangle', 0.2, 0.5); // 結束成功音效
                        playTick(1200, 'sine', 0.1, 0.6);
                    } else {
                        isSpinning = false;
                    }
                }, 500);
                isSpinning = false;
            }
        }

        // 繪製輪盤
        if (names.length > 0) {
            const sliceAngle = (Math.PI * 2) / names.length;
            names.forEach((name, i) => {
                const startA = angle + i * sliceAngle;
                const endA = startA + sliceAngle;

                // 扇形主體
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startA, endA);
                ctx.fillStyle = colors[i];
                ctx.fill();
                
                // 霓虹邊緣
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 繪製文字
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startA + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = `bold ${Math.max(12, radius/12)}px Arial`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = colors[i];
                ctx.fillText(name, radius - 20, 10);
                ctx.restore();
            });
        }

        // 繪製靜止指針 (上方，跟隨輪盤中心移動)
        ctx.fillStyle = varColor('--neon-pink');
        ctx.beginPath();
        ctx.moveTo(centerX - 15, centerY - radius - 20);
        ctx.lineTo(centerX + 15, centerY - radius - 20);
        ctx.lineTo(centerX, centerY - radius + 10);
        ctx.fill();
        ctx.shadowBlur = 20;
        ctx.shadowColor = varColor('--neon-pink');
        ctx.stroke();

        // 繪製中心軸
        ctx.beginPath();
        ctx.arc(centerX, centerY, 15, 0, Math.PI * 2);
        ctx.fillStyle = "#fff";
        ctx.fill();
        ctx.shadowBlur = 0;

        requestAnimationFrame(animate);
    }

    function varColor(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    animate();
</script>
</body>
</html>
