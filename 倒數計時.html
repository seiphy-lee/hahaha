<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>倒數計時器｜中原標準時間</title>
<style>
:root{
  --bg:#0a1020; --card1:#162447; --card2:#0e1933; --line:#26386a;
  --text:#e6edf7; --muted:#8ea0c4; --primary:#3b82f6; --primary2:#2563eb;
  --danger:#ef4444; --ok:#34d399; --warnc:#fbbf24;
  --accent:transparent; --cd-color:#e6edf7;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(1200px 700px at 15% -10%, #18295a 0%, var(--bg) 62%) fixed;
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-text-size-adjust:100%;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* ---------- 頂列 ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px}
.title{font-weight:700;font-size:1.15rem;letter-spacing:.04em}
.title small{font-weight:400;color:var(--muted);margin-left:10px;font-size:.78rem;letter-spacing:.02em}
.top-actions{display:flex;gap:8px}
.btn{background:#1b2c57;border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:40px;
  transition:background .15s, transform .05s}
.btn:hover{background:#243a72}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary2);font-weight:700}
.btn.primary:hover{background:var(--primary2)}
.btn.danger{background:#7f1d1d;border-color:#b91c1c}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- 左右分割 ---------- */
main.split{flex:1;min-height:clamp(560px,72vh,1000px);display:grid;grid-template-columns:5fr 6fr;gap:16px;padding:0 16px 12px}
.card{
  position:relative;container-type:inline-size;overflow:hidden;
  background:linear-gradient(180deg,var(--card1),var(--card2));
  border:1px solid var(--line);border-radius:22px;padding:18px 20px;
  display:flex;flex-direction:column;
  transition:box-shadow .3s,border-color .3s;
}
.card-label{color:var(--muted);font-size:clamp(.9rem,3.2cqw,1.35rem);letter-spacing:.08em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card-label .tz{font-size:.75em;border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.card-label .sub{color:#b8c6e6}

/* 左：時鐘 */
.clock-card{justify-content:center;align-items:center;text-align:center;gap:6px}
.clock-card .card-label{position:absolute;left:20px;top:16px}
.clock-digits{font-size:clamp(2.2rem,19cqw,11rem);font-weight:700;line-height:1.05;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;color:#9bdcff;text-shadow:0 0 30px rgba(120,200,255,.25)}
.clock-date{font-size:clamp(1rem,5cqw,2.2rem);color:#c7d4ee;margin-top:4px}
.sync{margin-top:18px;display:inline-flex;align-items:center;gap:8px;font-size:clamp(.75rem,2.6cqw,1rem);color:var(--muted);max-width:92%;text-align:left}
.sync .dot{flex:none;width:.7em;height:.7em;border-radius:50%;background:#64748b}
.sync.ok .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.sync.bad .dot{background:var(--warnc);box-shadow:0 0 8px var(--warnc)}
.sync.busy .dot{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* 右：倒數 */
.cd-card{gap:2px}
.cd-card.warn{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 46px color-mix(in srgb,var(--accent) 38%,transparent)}
.cd-digits{
  text-align:center;font-weight:700;line-height:1.05;margin-top:6px;
  font-size:clamp(2.2rem,16cqw,11rem);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--cd-color);
  text-shadow:0 0 28px color-mix(in srgb,var(--cd-color) 30%,transparent);
}
.cd-digits.short{font-size:clamp(2.6rem,23cqw,12rem)}
.cd-digits.idle{opacity:.55}
.cd-digits.flash{animation:blink .5s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.cd-info{text-align:center;color:#b8c6e6;font-size:clamp(.85rem,3cqw,1.2rem);min-height:1.5em}
.stage-wrap{position:relative;flex:1;min-height:260px}
#stage{position:absolute;display:block;pointer-events:none}
.paused-tag{position:absolute;right:8px;top:6px;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.9rem;display:none}
.card.paused .paused-tag{display:block}
.plain-bar{display:none;height:clamp(14px,3.2cqw,30px);border-radius:999px;background:#0b1430;border:1px solid var(--line);overflow:hidden;margin:14px 6% 8px}
.plain-bar i{display:block;height:100%;width:100%;background:var(--cd-color);transition:width .2s linear,background .3s;border-radius:999px}
.banner{position:absolute;left:0;right:0;top:64%;text-align:center;pointer-events:none;
  font-weight:800;font-size:clamp(1.6rem,8cqw,5rem);color:#fff;letter-spacing:.06em;
  text-shadow:0 4px 0 rgba(0,0,0,.45),0 0 30px rgba(255,180,60,.7);opacity:0;transform:scale(.4)}
.banner.show{animation:pop .55s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.card.finished{animation:finishGlow 1s ease-in-out 3}
@keyframes finishGlow{50%{box-shadow:0 0 0 2px #ef4444,0 0 60px rgba(239,68,68,.55)}}
/* 純數字主題 */
.theme-plain .stage-wrap{display:none}
.theme-plain .plain-bar{display:block}
.theme-plain .cd-card{justify-content:center}
.theme-plain .cd-digits{font-size:clamp(2.6rem,19cqw,13rem)}
.theme-plain .cd-digits.short{font-size:clamp(3rem,28cqw,15rem)}
.theme-plain .banner{top:auto;bottom:10%}

/* ---------- 控制面板 ---------- */
.panel{margin:0 16px 16px;background:rgba(16,27,56,.85);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.ctrl-row{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center}
.tabs{display:inline-flex;background:#0b1430;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.tabs button{background:transparent;border:0;border-radius:9px;padding:8px 14px;min-height:40px;color:var(--muted)}
.tabs button.on{background:var(--primary);color:#fff;font-weight:700}
.time-in{display:inline-flex;align-items:center;gap:6px}
.time-in input[type=number]{width:4.4rem;min-height:46px;background:#0b1430;border:1px solid var(--line);border-radius:10px;text-align:center;font-size:1.35rem;font-variant-numeric:tabular-nums;padding:2px 4px}
.time-in input:focus,.warn-row input:focus{outline:2px solid var(--primary);outline-offset:1px}
.time-in span{color:var(--muted)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#14224a;border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-height:34px;font-size:.9rem}
.chip:hover{background:#1f3370}
.actions{display:flex;gap:8px;margin-left:auto}
.actions .btn{min-height:46px;padding:8px 20px;font-size:1.05rem}
.hint{color:var(--muted);font-size:.9rem}
.hint b{color:#cfe0ff;font-weight:600}
.msg{min-height:1.3em;color:#fbbf24;font-size:.95rem}
label.chk{display:inline-flex;align-items:center;gap:6px;color:#c7d4ee;cursor:pointer}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary)}

details.settings{border-top:1px solid var(--line);padding-top:10px}
details.settings>summary{cursor:pointer;color:#b8c6e6;font-weight:600;padding:4px 0;list-style:none}
details.settings>summary::before{content:"▸ ";color:var(--muted)}
details.settings[open]>summary::before{content:"▾ "}
.set-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:18px 30px;margin-top:10px}
.set-block h4{margin:0 0 8px;font-size:.95rem;color:#9db2dd;font-weight:600;letter-spacing:.05em}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:#14224a;border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:42px}
.seg button.on{background:var(--primary);border-color:var(--primary2);font-weight:700}
.set-line{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:10px}
.set-line input[type=range]{accent-color:var(--primary);width:130px}
.warn-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 0;border-bottom:1px dashed #22335f}
.warn-row input[type=number]{width:3.6rem;min-height:38px;background:#0b1430;border:1px solid var(--line);border-radius:8px;text-align:center;font-size:1.05rem}
.warn-row input[type=color],.normal-color input[type=color]{width:44px;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#0b1430;cursor:pointer}
.warn-row .x{margin-left:auto;background:transparent;border:0;color:#f87171;font-size:1.1rem;min-width:36px;min-height:36px}
.warn-row .lb{color:var(--muted)}
.normal-color{display:flex;align-items:center;gap:10px;margin-top:8px;color:#c7d4ee}
.warn-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.foot{color:#5f7199;font-size:.8rem;text-align:center;padding:0 0 14px}

/* ---------- 投影模式 ---------- */
.mini-bar{display:none;position:fixed;right:14px;bottom:12px;gap:8px;z-index:20;opacity:.28;transition:opacity .2s}
.mini-bar:hover,.mini-bar:focus-within{opacity:1}
body.present .mini-bar{display:flex}
body.present .topbar,body.present .panel,body.present .foot{display:none}
body.present main.split{min-height:100vh;min-height:100dvh;padding:12px;gap:12px}
body.present .cd-digits{font-size:min(16cqw,24vh)}
body.present .cd-digits.short{font-size:min(23cqw,34vh)}
body.present.theme-plain .cd-digits{font-size:min(19cqw,34vh)}
body.present.theme-plain .cd-digits.short{font-size:min(28cqw,48vh)}
body.present .clock-digits{font-size:min(19cqw,24vh)}
.sound-hint{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);background:#78350f;border:1px solid #f59e0b;border-radius:999px;padding:6px 16px;font-size:.9rem;display:none;z-index:30}

/* ---------- 手機 ---------- */
@media (max-width:860px){
  main.split{grid-template-columns:1fr;min-height:0}
  .clock-card{padding:44px 12px 16px}
  .clock-card .card-label{left:14px;top:12px}
  .cd-card{min-height:0}
  .stage-wrap{min-height:250px}
  .actions{margin-left:0;width:100%}
  .actions .btn{flex:1}
  .set-grid{grid-template-columns:1fr}
  .title small{display:none}
  body.present main.split{grid-template-rows:auto 1fr}
  body.present .clock-card{padding:36px 10px 10px}
}
@media (prefers-reduced-motion:reduce){
  .cd-digits.flash{animation:none}
  .card.finished{animation:none}
}
</style>
</head>
<body class="theme-bomb">
<div id="app">
  <header class="topbar">
    <div class="title">⏳ 倒數計時器<small>臺中二中 阿發老師 設計</small></div>
    <div class="top-actions">
      <button class="btn" id="btnSound" title="音效開關 (M)" aria-label="音效開關">🔊</button>
      <button class="btn" id="btnPresent" title="投影模式 (F)">⛶ 投影模式</button>
    </div>
  </header>

  <main class="split">
    <!-- 左：中原標準時間 -->
    <section class="card clock-card" aria-label="中原標準時間">
      <div class="card-label">中原標準時間 <span class="tz">UTC+8</span></div>
      <div class="clock-digits" id="clockDigits">--:--:--</div>
      <div class="clock-date" id="clockDate">&nbsp;</div>
      <div class="sync busy" id="syncBox"><span class="dot"></span><span id="syncText">校時中…</span></div>
    </section>

    <!-- 右：倒數 -->
    <section class="card cd-card" id="cdCard" aria-label="倒數">
      <div class="card-label"><span id="cdLabel">倒數時間</span><span class="sub" id="cdSub"></span></div>
      <div class="cd-digits idle short" id="cdDigits">05:00</div>
      <div class="cd-info" id="cdInfo">&nbsp;</div>
      <div class="stage-wrap" id="stageWrap">
        <canvas id="stage"></canvas>
        <div class="paused-tag">⏸ 已暫停</div>
      </div>
      <div class="plain-bar"><i id="plainFill"></i></div>
      <div class="banner" id="banner"></div>
    </section>
  </main>

  <!-- 控制面板 -->
  <section class="panel" id="panel">
    <div class="ctrl-row">
      <div class="tabs" role="tablist">
        <button id="tabDur" role="tab" class="on">⏱ 倒數時間</button>
        <button id="tabClock" role="tab">🕒 倒數到幾點</button>
      </div>

      <div id="modeDur" class="ctrl-row" style="gap:10px 16px">
        <div class="time-in">
          <input type="number" id="dH" min="0" max="99" inputmode="numeric" aria-label="小時"><span>時</span>
          <input type="number" id="dM" min="0" max="59" inputmode="numeric" aria-label="分鐘"><span>分</span>
          <input type="number" id="dS" min="0" max="59" inputmode="numeric" aria-label="秒"><span>秒</span>
        </div>
        <div class="presets" id="presets"></div>
      </div>

      <div id="modeClock" class="ctrl-row" style="gap:10px 16px;display:none">
        <div class="time-in">
          <span>倒數到中原標準時間</span>
          <input type="number" id="cH" min="0" max="23" inputmode="numeric" aria-label="時"><span>時</span>
          <input type="number" id="cM" min="0" max="59" inputmode="numeric" aria-label="分"><span>分</span>
          <input type="number" id="cS" min="0" max="59" inputmode="numeric" aria-label="秒"><span>秒</span>
        </div>
        <label class="chk"><input type="checkbox" id="cTomorrow">明天</label>
        <span class="hint" id="clockHint"></span>
      </div>

      <div class="actions">
        <button class="btn primary" id="btnStart">▶ 開始</button>
        <button class="btn" id="btnPause">⏸ 暫停</button>
        <button class="btn" id="btnReset">↺ 重設</button>
      </div>
    </div>
    <div class="msg" id="msg" role="status"></div>

    <details class="settings" id="settings">
      <summary>⚙ 設定（主題・顏色提醒・音效・校時）</summary>
      <div class="set-grid">
        <div>
          <div class="set-block">
            <h4>趣味主題</h4>
            <div class="seg" id="themeSeg">
              <button data-theme="bomb">💣 炸彈</button>
              <button data-theme="balloon">🎈 氣球</button>
              <button data-theme="water">💧 水球</button>
              <button data-theme="plain">🔢 純數字</button>
            </div>
          </div>
          <div class="set-block" style="margin-top:16px">
            <h4>音效</h4>
            <div class="set-line" style="margin-top:0">
              <label class="chk">音量 <input type="range" id="optVol" min="0" max="100"></label>
              <button class="chip" id="btnTestSound">試聽</button>
            </div>
          </div>
          <div class="set-block" style="margin-top:16px">
            <h4>校時</h4>
            <div class="set-line" style="margin-top:0">
              <button class="chip" id="btnResync">重新校時</button>
              <span class="hint" id="syncDetail"></span>
            </div>
          </div>
          <div class="set-block" style="margin-top:16px">
            <h4>產生設定連結</h4>
            <div class="set-line" style="margin-top:0">
              <label class="chk"><input type="checkbox" id="lnkAuto">開啟後自動開始</label>
              <label class="chk"><input type="checkbox" id="lnkPresent">投影模式開啟</label>
              <button class="chip" id="btnCopyLink">複製連結</button>
            </div>
            <div class="hint" id="linkOut" style="margin-top:6px;word-break:break-all"></div>
          </div>
        </div>

        <div class="set-block">
          <h4>顏色提醒（剩餘時間 ≤ 設定值時，倒數數字變色；勾「滴答」則從該時間起有滴答聲，直到結束）</h4>
          <div id="warnList"></div>
          <div class="warn-tools">
            <button class="chip" id="btnAddWarn">＋ 新增一段</button>
            <button class="chip" id="btnResetWarn">還原預設</button>
          </div>
          <div class="normal-color"><span>平常顏色</span><input type="color" id="normalColor"></div>
        </div>
      </div>
    </details>
  </section>
  <div class="foot">時間以網路校時後的中原標準時間（UTC+8）為準</div>
</div>

<div class="mini-bar" id="miniBar">
  <button class="btn primary" id="miniStart">▶ 開始</button>
  <button class="btn" id="miniReset">↺ 重設</button>
  <button class="btn" id="miniExit">✕ 離開</button>
</div>
<div class="sound-hint" id="soundHint">🔈 點一下畫面以啟用音效</div>

<script>
'use strict';
/* =====================================================================
   倒數計時器｜臺中二中 阿發老師 設計
   ===================================================================== */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rand = (a, b) => a + Math.random() * (b - a);
const TZ_MS = 8 * 3600e3;          // 中原標準時間 UTC+8（無日光節約時間）
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];

/* ---------------- 顏色工具 ---------------- */
function hex2rgb(h) {
  h = String(h).replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mixRgb(a, b, t) { return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }
const rgba = (rgb, a) => `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;

/* ---------------- 設定（含 localStorage） ---------------- */
const DEFAULT_WARNS = [
  { sec: 60, color: '#ffd43b', flash: false, tick: false },
  { sec: 30, color: '#ff922b', flash: false, tick: false },
  { sec: 10, color: '#ff3b30', flash: true, tick: true }
];
const DEFAULTS = {
  theme: 'bomb', normalColor: '#e6edf7', warns: DEFAULT_WARNS,
  vol: 70, sound: true,
  mode: 'dur', dur: { h: 0, m: 5, s: 0 }, clock: { h: 12, m: 0, s: 0, tomorrow: false }
};
const STORE_KEY = 'afa-countdown-v1';
let cfg = JSON.parse(JSON.stringify(DEFAULTS));
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (saved && typeof saved === 'object') {
    for (const k of ['theme', 'normalColor', 'vol', 'sound', 'mode']) if (k in saved) cfg[k] = saved[k];
    if (Array.isArray(saved.warns)) {
      cfg.warns = saved.warns.filter(w => w && w.sec >= 0 && /^#[0-9a-f]{6}$/i.test(w.color));
      // 舊版設定（滴答聲是全域開關）→ 讓最後一段開始滴答，維持原本「接近結束會滴答」的行為
      if (cfg.warns.length && cfg.warns.every(w => !('tick' in w))) cfg.warns.reduce((a, b) => b.sec < a.sec ? b : a).tick = true;
    }
    if (saved.dur) cfg.dur = Object.assign(cfg.dur, saved.dur);
  }
} catch (e) { /* 忽略 */ }
function saveCfg() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); } catch (e) { /* 忽略 */ }
}

/* ---------------- 時間：網路校時＋補償 ---------------- */
let offsetMs = 0;                    // 真實時間 - 電腦時間
const nowMs = () => Date.now() + offsetMs;
function twParts(ms) {
  const d = new Date(ms + TZ_MS);
  return { y: d.getUTCFullYear(), mo: d.getUTCMonth() + 1, d: d.getUTCDate(), wd: d.getUTCDay(),
           h: d.getUTCHours(), mi: d.getUTCMinutes(), s: d.getUTCSeconds() };
}
/* 解析 ISO 字串（可能帶 7 位小數、可能無時區）→ epoch ms */
function parseIso(str, defOffsetMin) {
  const m = /(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d):(\d\d)(?:\.(\d+))?\s*(Z|[+-]\d\d:?\d\d)?/.exec(str);
  if (!m) throw new Error('bad iso');
  const ms = m[7] ? Math.floor(parseFloat('0.' + m[7]) * 1000) : 0;
  let offMin = defOffsetMin;
  if (m[8]) {
    if (m[8] === 'Z') offMin = 0;
    else { const t = /([+-])(\d\d):?(\d\d)/.exec(m[8]); offMin = (t[1] === '-' ? -1 : 1) * (+t[2] * 60 + +t[3]); }
  }
  return Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6], ms) - offMin * 60000;
}
const TIME_SOURCES = [
  { name: 'timeapi.io', prec: 'ms',
    url: 'https://timeapi.io/api/Time/current/zone?timeZone=Asia/Taipei',
    parse: async r => parseIso((await r.json()).dateTime, 480) },

  const results = (await Promise.all(TIME_SOURCES.filter(s => s.url).map(bestOfSource))).filter(Boolean);
  const ms = results.filter(r => r.prec === 'ms').sort((a, b) => a.rtt - b.rtt);
  const pool = ms.length ? ms.slice(0, 3) : results.sort((a, b) => a.rtt - b.rtt).slice(0, 1);
  if (pool.length) {
    const offs = pool.map(r => r.offset).sort((a, b) => a - b);
    const med = offs[Math.floor(offs.length / 2)];
    offsetMs = med;
    Object.assign(syncInfo, { ok: true, offset: med,
      err: pool[0].prec === 's' ? 500 : Math.max(...pool.map(r => r.rtt / 2)),
      name: pool.map(r => r.name).join('、'), at: Date.now() });

    const off = (Math.abs(syncInfo.offset) / 1000).toFixed(2);
    const err = syncInfo.err >= 500 ? '±0.5 秒' : '±' + Math.max(10, Math.round(syncInfo.err / 10) * 10) + ' ms';
    txt.textContent = `已網路校時（電腦時鐘 ${sign}${off} 秒，誤差約 ${err}）`;

const Sound = {

  setVol(v) { if (this.master) this.master.gain.value = clamp(v / 100, 0, 1); },
  get ready() { return !!this.ctx && this.ctx.state === 'running'; },
  ok() { return cfg.sound && this.ctx && this.ctx.state === 'running'; },
  noise(dur) {

    g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  tick(final, alt) {

  },
  chime() {

  },
  pop() {
    if (!this.ok()) return;

    hp.type = 'highpass'; hp.frequency.value = 700;
    g.gain.setValueAtTime(1.0, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    n.connect(hp); hp.connect(g); g.connect(this.master); n.start(t);

  },
  splash() {
    if (!this.ok()) return;

    const n = this.noise(1.3), bp = c.createBiquadFilter(), g = c.createGain();
    bp.type = 'bandpass'; bp.Q.value = 0.9;
    bp.frequency.setValueAtTime(2200, t + 0.05); bp.frequency.exponentialRampToValueAtTime(500, t + 1.2);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9, t + 0.08);

    for (let i = 0; i < 6; i++) this.tone(rand(500, 900), 0.09, 'sine', 0.18, 0.15 + i * rand(0.07, 0.14), rand(1300, 2000));
  },
  alarm() {
    if (!this.ok()) return;
    for (let i = 0; i < 4; i++) this.tone(1000, 0.22, 'square', 0.3, i * 0.32);
  },
  finish(theme) {

  }

  el.miniStart.textContent = st === 'paused' ? '▶ 繼續' : (st === 'running' ? (run.kind === 'dur' ? '⏸ 暫停' : '進行中') : '▶ 開始');
  el.miniStart.disabled = (st === 'running' && run.kind !== 'dur');
  [el.dH, el.dM, el.dS, el.cH, el.cM, el.cS, el.cTomorrow, el.tabDur, el.tabClock].forEach(e => { e.disabled = active; });
  document.querySelectorAll('#presets .chip').forEach(b => { b.disabled = active; });
  el.cdCard.classList.toggle('paused', st === 'paused');
  if (st !== 'finished') el.cdCard.classList.remove('finished');
  lastClockSec = -1;   // 強制刷新一次提示文字
  update(nowMs());
}

/* ---------------- 每幀更新 ---------------- */
function stageFor(remSec) {
  let best = null;
  for (const w of cfg.warns) if (remSec <= w.sec && (!best || w.sec < best.sec)) best = w;
  return best;
}
function update(n) {
  // 左：中原標準時間
  const sec = Math.floor(n / 1000);
  const newSecond = sec !== lastClockSec;
  if (newSecond) {
    lastClockSec = sec;
    const p = twParts(n);
    el.clockDigits.textContent = `${pad(p.h)}:${pad(p.mi)}:${pad(p.s)}`;
    el.clockDate.textContent = `${p.y} 年 ${p.mo} 月 ${p.d} 日　星期${WEEK[p.wd]}`;
    updateClockHint(n);
  }
  // 右：倒數
  const st = run.state;
  let remMs = 0, idleSec = 0, p = 1;
  if (st === 'idle') {
    if (cfg.mode === 'dur') { const d = readDur(); idleSec = Math.min(359999, d.h * 3600 + d.m * 60 + d.s); }
    else { const t = clockTarget(n); idleSec = t.ok ? Math.ceil((t.target - n) / 1000) : 0; }
  } else {
    remMs = remAt();
    p = st === 'finished' ? 0 : clamp(remMs / run.total, 0, 1);
  }
  const remSec = st === 'idle' ? idleSec : Math.ceil(remMs / 1000);
  const warn = st === 'idle' ? null : stageFor(remSec);
  const color = warn ? warn.color : cfg.normalColor;
  const long = st === 'idle' ? idleSec >= 3600 : run.long;
  const text = fmt(remSec, long);
  if (el.cdDigits.textContent !== text) el.cdDigits.textContent = text;
  el.cdDigits.classList.toggle('short', !long);
  el.cdDigits.classList.toggle('idle', st === 'idle');
  el.cdDigits.classList.toggle('flash', !!(warn && warn.flash && (st === 'running' || st === 'finished')));
  el.cdCard.style.setProperty('--cd-color', color);
  el.cdCard.style.setProperty('--accent', warn ? color : 'transparent');
  el.cdCard.classList.toggle('warn', !!warn);
  el.plainFill.style.width = (st === 'idle' ? 100 : p * 100).toFixed(2) + '%';

  if (newSecond || st !== view.state) {
    el.cdLabel.textContent = cfg.mode === 'clock' ? '倒數到中原標準時間' : '倒數時間';
    let sub = '', info = '';
    if (cfg.mode === 'clock' && st === 'idle') { const t = clockTarget(n); sub = t.label ? ' → ' + t.label : ''; }
    if (st === 'running' || st === 'paused' || st === 'finished') {
      if (run.kind === 'clock') sub = ' → ' + hms(run.end);
      info = st === 'paused' ? '⏸ 已暫停' : (st === 'finished' ? '時間到　結束於 ' + hms(endTrue()) : '預定結束：' + hms(endTrue()) + '（中原標準時間）');
    } else info = '設定好時間後按「開始」';
    el.cdSub.textContent = sub; el.cdInfo.textContent = info;
    document.title = st === 'running' ? `${text} ｜倒數計時器` : '倒數計時器｜中原標準時間';
  }
  // 音效與階段切換
  if (st === 'running') {
    if (remSec !== run.lastSec) {
      if (run.lastSec !== null && remSec > 0 && cfg.warns.some(w => w.tick && remSec <= w.sec)) Sound.tick(remSec <= 10, remSec % 2);
      run.lastSec = remSec;
    }
    const idx = warn ? cfg.warns.indexOf(warn) : -1;
    if (idx !== run.lastIdx) { if (run.lastIdx !== null && idx >= 0) Sound.chime(); run.lastIdx = idx; }
    if (remMs <= 0) finish();
  }
  el.soundHint.style.display = (st === 'running' && cfg.sound && !Sound.ready) ? 'block' : 'none';
  Object.assign(view, { theme: cfg.theme, state: run.state, p, remSec, color: warn ? warn.color : null });
}
function updateClockHint(n) {
  if (cfg.mode !== 'clock') return;
  const t = clockTarget(n);
  el.clockHint.innerHTML = t.ok ? `目標 <b>${t.label}</b>，距離現在約 <b>${fmtJp(Math.ceil((t.target - n) / 1000))}</b>` : `<span style="color:#fbbf24">${t.err}</span>`;
}

/* ---------------- 面板：模式、輸入、預設 ---------------- */
function setMode(m) {
  if (run.state === 'running' || run.state === 'paused') return;
  cfg.mode = m; saveCfg();
  el.tabDur.classList.toggle('on', m === 'dur'); el.tabClock.classList.toggle('on', m === 'clock');
  el.modeDur.style.display = m === 'dur' ? 'flex' : 'none';
  el.modeClock.style.display = m === 'clock' ? 'flex' : 'none';
  showMsg(''); lastClockSec = -1; update(nowMs());
}
function writeDur(sec) {
  sec = clamp(Math.floor(sec), 0, 359999);
  el.dH.value = Math.floor(sec / 3600); el.dM.value = Math.floor(sec % 3600 / 60); el.dS.value = sec % 60;
  cfg.dur = { h: +el.dH.value, m: +el.dM.value, s: +el.dS.value }; saveCfg();
}
[[30, '30 秒'], [60, '1 分'], [180, '3 分'], [300, '5 分'], [600, '10 分'], [900, '15 分'], [1800, '30 分'], [2700, '45 分'], [3600, '1 小時']].forEach(([s, t]) => {
  const b = document.createElement('button'); b.className = 'chip'; b.textContent = t;
  b.addEventListener('click', () => { writeDur(s); lastClockSec = -1; update(nowMs()); });
  $('#presets').appendChild(b);
});
[el.dH, el.dM, el.dS].forEach(e => {
  e.addEventListener('change', () => { const d = readDur(); writeDur(d.h * 3600 + d.m * 60 + d.s); });
});
[el.cH, el.cM, el.cS].forEach(e => e.addEventListener('change', () => { e.value = num(e, e === el.cH ? 23 : 59); }));
[el.cH, el.cM, el.cS, el.cTomorrow].forEach(e => e.addEventListener('input', () => { lastClockSec = -1; }));
el.cTomorrow.addEventListener('change', () => { lastClockSec = -1; });
document.querySelectorAll('.time-in input, .warn-row input[type=number]').forEach(e => e.addEventListener('focus', () => e.select()));
el.tabDur.addEventListener('click', () => setMode('dur'));
el.tabClock.addEventListener('click', () => setMode('clock'));
el.btnStart.addEventListener('click', start);
el.btnPause.addEventListener('click', pause);
el.btnReset.addEventListener('click', reset);
el.miniStart.addEventListener('click', toggleMain);
el.miniReset.addEventListener('click', reset);
el.miniExit.addEventListener('click', exitPresent);
$('#cdCard').addEventListener('dblclick', () => { document.body.classList.contains('present') ? exitPresent() : enterPresent(); });

/* ---------------- 主題 ---------------- */
function applyTheme(t, save) {
  cfg.theme = t;
  THEMES.forEach(x => document.body.classList.toggle('theme-' + x, x === t));
  document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('on', b.dataset.theme === t));
  Stage.reset();
  if (run.state === 'finished') { Stage.burst(); el.banner.textContent = BANNER[t]; }
  if (save) saveCfg();
  requestAnimationFrame(() => Stage.resize());
}
document.querySelectorAll('#themeSeg button').forEach(b => b.addEventListener('click', () => applyTheme(b.dataset.theme, true)));

/* ---------------- 顏色提醒 ---------------- */
function renderWarns() {
  const box = $('#warnList'); box.innerHTML = '';
  cfg.warns.forEach((w, i) => {
    const row = document.createElement('div'); row.className = 'warn-row';
    row.innerHTML = `<span class="lb">最後</span>
      <input type="number" min="0" max="999" inputmode="numeric" class="wm" aria-label="分鐘"><span class="lb">分</span>
      <input type="number" min="0" max="59" inputmode="numeric" class="ws" aria-label="秒"><span class="lb">秒</span>
      <input type="color" class="wc" aria-label="顏色">
      <label class="chk"><input type="checkbox" class="wf">閃爍</label>
      <label class="chk" title="從這一段開始有滴答聲，持續到結束"><input type="checkbox" class="wt">滴答</label>
      <button class="x" title="刪除這一段" aria-label="刪除">✕</button>`;
    const wm = row.querySelector('.wm'), ws = row.querySelector('.ws'), wc = row.querySelector('.wc'), wf = row.querySelector('.wf'), wt = row.querySelector('.wt');
    wm.value = Math.floor(w.sec / 60); ws.value = w.sec % 60; wc.value = w.color; wf.checked = !!w.flash; wt.checked = !!w.tick;
    const syncSec = () => { w.sec = clamp(Math.floor(+wm.value || 0), 0, 999) * 60 + clamp(Math.floor(+ws.value || 0), 0, 59); };
    wm.addEventListener('input', syncSec); ws.addEventListener('input', syncSec);
    [wm, ws].forEach(e => e.addEventListener('change', () => { syncSec(); cfg.warns.sort((a, b) => b.sec - a.sec); saveCfg(); renderWarns(); }));
    wc.addEventListener('input', () => { w.color = wc.value; saveCfg(); });
    wf.addEventListener('change', () => { w.flash = wf.checked; saveCfg(); });
    wt.addEventListener('change', () => { w.tick = wt.checked; saveCfg(); });
    row.querySelector('.x').addEventListener('click', () => { cfg.warns.splice(i, 1); saveCfg(); renderWarns(); });
    row.querySelectorAll('input[type=number]').forEach(e => e.addEventListener('focus', () => e.select()));
    box.appendChild(row);
  });
  if (!cfg.warns.length) box.innerHTML = '<div class="hint">目前沒有顏色提醒，可按「新增一段」。</div>';
}
$('#btnAddWarn').addEventListener('click', () => {
  const smallest = cfg.warns.length ? Math.min(...cfg.warns.map(w => w.sec)) : 60;
  cfg.warns.push({ sec: Math.max(5, Math.floor(smallest / 2) || 15), color: '#ff6b6b', flash: false, tick: false });
  cfg.warns.sort((a, b) => b.sec - a.sec); saveCfg(); renderWarns();
});
$('#btnResetWarn').addEventListener('click', () => { cfg.warns = JSON.parse(JSON.stringify(DEFAULT_WARNS)); saveCfg(); renderWarns(); });
$('#normalColor').addEventListener('input', e => { cfg.normalColor = e.target.value; saveCfg(); });

/* ---------------- 音效 UI ---------------- */
function renderSoundBtn() { $('#btnSound').textContent = cfg.sound ? '🔊' : '🔇'; }
$('#btnSound').addEventListener('click', () => { Sound.ensure(); cfg.sound = !cfg.sound; renderSoundBtn(); saveCfg(); });
$('#optVol').addEventListener('input', e => { cfg.vol = +e.target.value; Sound.setVol(cfg.vol); saveCfg(); });
$('#btnTestSound').addEventListener('click', () => {
  Sound.ensure();
  if (!cfg.sound) { showMsg('目前為靜音狀態，請先按右上角的喇叭開啟音效'); return; }
  setTimeout(() => { Sound.chime(); [0, 1, 2].forEach(i => setTimeout(() => Sound.tick(false, i % 2), 500 + i * 250)); setTimeout(() => Sound.tick(true), 1300); setTimeout(() => Sound.finish(cfg.theme), 1700); }, 60);
});
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => { Sound.ensure(); }, { passive: true }));

/* ---------------- 校時 UI ---------------- */
$('#btnResync').addEventListener('click', () => syncTime(true));
setInterval(() => syncTime(false), 10 * 60 * 1000);
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > 60000) syncTime(false);
});
addEventListener('online', () => syncTime(false));

/* ---------------- 投影模式 ---------------- */
let presentFS = false;
async function enterPresent() {
  document.body.classList.add('present');
  try { if (document.documentElement.requestFullscreen) { await document.documentElement.requestFullscreen(); presentFS = true; } } catch (e) { presentFS = false; }
}
function exitPresent() {
  document.body.classList.remove('present');
  if (document.fullscreenElement) { presentFS = false; document.exitFullscreen().catch(() => {}); }
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && presentFS) { presentFS = false; document.body.classList.remove('present'); }
});
$('#btnPresent').addEventListener('click', enterPresent);

/* ---------------- 快捷鍵 ---------------- */
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (b) b.blur(); });
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea,select')) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'Space' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); toggleMain(); }
  else if (e.key === 'r' || e.key === 'R') reset();
  else if (e.key === 'f' || e.key === 'F') document.body.classList.contains('present') ? exitPresent() : enterPresent();
  else if (e.key === 'm' || e.key === 'M') { Sound.ensure(); cfg.sound = !cfg.sound; renderSoundBtn(); saveCfg(); }
});

/* ---------------- 設定連結 ---------------- */
function buildLink() {
  const q = new URLSearchParams();
  if (cfg.mode === 'dur') {
    const d = readDur(); if (d.h) q.set('h', d.h); if (d.m) q.set('m', d.m); if (d.s) q.set('s', d.s);
    if (!d.h && !d.m && !d.s) q.set('m', 5);
  } else {
    const c = readClock(); q.set('at', `${pad(c.h)}:${pad(c.m)}:${pad(c.s)}`); if (c.tomorrow) q.set('tomorrow', '1');
  }
  q.set('theme', cfg.theme);
  q.set('warn', cfg.warns.map(w => `${w.sec}:${w.color.slice(1)}${(w.flash || w.tick) ? ':' + (w.flash ? 'f' : '') + (w.tick ? 't' : '') : ''}`).join(','));
  if (!cfg.sound) q.set('mute', '1');
  if ($('#lnkAuto').checked) q.set('auto', '1');
  if ($('#lnkPresent').checked) q.set('present', '1');
  return location.href.split('#')[0].split('?')[0] + '?' + q.toString();
}
$('#btnCopyLink').addEventListener('click', () => {
  const link = buildLink(); $('#linkOut').textContent = link;
  const done = () => showMsg('已複製設定連結');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, () => showMsg('請手動複製下方連結'));
  else showMsg('請手動複製下方連結');
});

/* ---------------- 網址參數 ---------------- */
function applyParams() {
  const q = new URLSearchParams(location.search), r = { auto: false, present: false, hasAt: false };
  if (!location.search) return r;
  const iv = k => Math.max(0, parseInt(q.get(k), 10) || 0);
  if (THEMES.includes(q.get('theme'))) cfg.theme = q.get('theme');
  if (q.has('h') || q.has('m') || q.has('s')) {
    cfg.mode = 'dur';
    const sec = Math.min(359999, iv('h') * 3600 + iv('m') * 60 + iv('s'));
    cfg.dur = { h: Math.floor(sec / 3600), m: Math.floor(sec % 3600 / 60), s: sec % 60 };
  }
  if (q.has('at')) {
    const m = /^(\d{1,2})[:：](\d{1,2})(?:[:：](\d{1,2}))?$/.exec(q.get('at').trim());
    if (m) { r.hasAt = true; cfg.mode = 'clock'; cfg.clock = { h: clamp(+m[1], 0, 23), m: clamp(+m[2], 0, 59), s: clamp(+(m[3] || 0), 0, 59), tomorrow: q.get('tomorrow') === '1' }; }
  }
  if (q.has('warn')) {
    const ws = q.get('warn').split(',').map(x => x.split(':')).filter(a => /^\d+$/.test(a[0]) && /^[0-9a-f]{6}$/i.test(a[1] || ''))
      .map(a => ({ sec: +a[0], color: '#' + a[1], flash: (a[2] || '').includes('f'), tick: (a[2] || '').includes('t') })).sort((a, b) => b.sec - a.sec);
    if (ws.length || q.get('warn') === 'none') cfg.warns = ws;
  }
  if (q.get('mute') === '1') cfg.sound = false;
  r.auto = q.get('auto') === '1'; r.present = q.get('present') === '1';
  return r;
}

/* ---------------- 初始化 ---------------- */
function init() {
  const pr = applyParams();
  if (innerHeight >= 1000) $('#settings').open = true;
  // 「到幾點」預設：約 10 分鐘後的整分
  if (!pr.hasAt) {
    const p = twParts(Date.now() + 10 * 60000);
    cfg.clock = { h: p.h, m: p.mi, s: 0, tomorrow: false };
  }
  el.dH.value = cfg.dur.h; el.dM.value = cfg.dur.m; el.dS.value = cfg.dur.s;
  el.cH.value = cfg.clock.h; el.cM.value = cfg.clock.m; el.cS.value = cfg.clock.s; el.cTomorrow.checked = !!cfg.clock.tomorrow;
  $('#optVol').value = cfg.vol; $('#normalColor').value = cfg.normalColor;
  renderSoundBtn(); renderWarns();
  applyTheme(THEMES.includes(cfg.theme) ? cfg.theme : 'bomb', false);
  setMode(cfg.mode === 'clock' ? 'clock' : 'dur');
  afterStateChange();
  if (pr.present) document.body.classList.add('present');
  syncTime(false).then(() => { lastClockSec = -1; });
  if (pr.auto) setTimeout(start, 0);

  let last = 0;
  function frame(ts) {
    const dt = Math.min(0.05, ((ts - last) / 1000) || 0.016); last = ts;
    update(nowMs());
    Stage.draw(dt, ts / 1000, view);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setInterval(() => update(nowMs()), 200);   // 背景分頁時 rAF 會暫停，靠它維持計時與結束判斷
}
init();
</script>
