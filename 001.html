<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body { 
        font-family: "Microsoft JhengHei", sans-serif; 
        background-color: #f4f7f6; 
        margin: 0; padding: 10px; 
      }

      .container { 
        width: 100%; max-width: 800px; margin: 0 auto;
        background: white; padding: 15px; border-radius: 12px; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        display: flex; flex-direction: column; height: 95vh; 
        box-sizing: border-box;
      }

      /* 標題放大 2 倍 */
      h2 { text-align: center; margin: 15px 0; color: #333; font-size: 48px; }

      .controls { display: flex; gap: 10px; margin-bottom: 15px; }
      
      /* 選單放大 2 倍 */
      select { 
        width: 50%; padding: 10px; font-size: 40px; 
        height: 70px; 
        border-radius: 8px; border: 2px solid #ccc; background: white;
      }

      #studentGrid {
        flex-grow: 1; 
        display: grid;
        grid-template-rows: repeat(10, 1fr); 
        /* 固定寬度，支援左右滑動 */
        grid-template-columns: repeat(5, 150px);
        grid-auto-flow: column; 
        gap: 8px; 
        overflow-y: auto; 
        overflow-x: auto; 
        padding: 5px;
      }

      /* 學生按鈕文字放大 2 倍，且不換行 */
      .student-btn {
        background-color: #f0f0f0;
        border: 1px solid #ccc;
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        text-align: center;
        font-size: 32px; font-weight: bold; color: #333;
        cursor: pointer;
        user-select: none; 
        transition: 0.2s;
        padding: 5px;
        line-height: 1.1; 
        white-space: nowrap; 
      }

      .student-btn.selected {
        background-color: #4CAF50;
        color: white;
        border-color: #2E7D32;
        transform: scale(0.98);
      }

      .footer { margin-top: 15px; }
      
      /* 送出按鈕文字放大 2 倍 */
      button#submitBtn { 
        width: 100%; padding: 20px; 
        background-color: #2196F3; color: white; border: none; 
        font-size: 48px; font-weight: bold; border-radius: 12px; 
      }
      button#submitBtn:active { background-color: #1976D2; }
      
      /* 狀態文字放大 */
      #status { text-align: center; margin-top: 10px; font-weight: bold; height: 30px; font-size: 24px; color: #666;}
    </style>
  </head>
  <body>
    <div class="container">
      <h2>🎓 點名系統</h2>
      
      <div class="controls">
        <select id="className" onchange="loadStudents()">
          <option>班級載入中...</option>
        </select>
        
        <!-- 【修改重點 1】把寫死的選項刪除，改成「載入中」的提示 -->
        <select id="behavior">
           <option>行為載入中...</option>
        </select>
      </div>

      <div id="studentGrid">載入名單中...</div>

      <div class="footer">
        <button id="submitBtn" onclick="submitBatch()">送出記錄 (0)</button>
        <div id="status"></div>
      </div>
    </div>

    <script>
      window.onload = function() {
        // --- 載入班級清單 ---
        google.script.run.withSuccessHandler(function(classes) {
          var select = document.getElementById("className");
          select.innerHTML = "";
          
          if(classes.length === 0 || classes[0].toString().includes("請先")) {
             select.innerHTML = "<option>請檢查'名單'分頁</option>";
             return;
          }

          classes.forEach(function(c) {
            var option = document.createElement("option");
            option.text = c;
            option.value = c;
            select.add(option);
          });
          
          loadStudents();
        }).getAllClasses();

        // --- 【修改重點 2】新增：網頁載入時，呼叫後端取得行為清單 ---
        google.script.run.withSuccessHandler(function(behaviorsList) {
          // 這個 behaviorSelect 就是我們畫面上的下拉選單
          var behaviorSelect = document.getElementById("behavior");
          
          // 先把原本寫著「行為載入中...」的選項清空
          behaviorSelect.innerHTML = ""; 
          
          // 把後端傳過來的陣列，一個一個變成 <option> 塞進選單裡
          behaviorsList.forEach(function(b) {
            var option = document.createElement("option");
            option.text = b.name;   // 顯示在畫面的文字 (例如: 👍 認真實作)
            option.value = b.value; // 真正紀錄到試算表的文字 (例如: 認真實作)
            behaviorSelect.add(option);
          });
        }).getBehaviors();
        // -------------------------------------------------------------
      };

      // (其餘 loadStudents, toggleSelection, updateSubmitBtn, submitBatch 皆保持原樣不變)
      function loadStudents() {
        var className = document.getElementById("className").value;
        var grid = document.getElementById("studentGrid");
        grid.innerHTML = "載入中...";
        
        google.script.run.withSuccessHandler(function(students) {
          grid.innerHTML = ""; 
          
          if (students.length === 0) {
             grid.innerHTML = "無學生名單";
             return;
          }

          students.forEach(function(student) {
            var btn = document.createElement("div");
            btn.className = "student-btn";
            btn.innerText = student;
            btn.onclick = function() { toggleSelection(this); };
            grid.appendChild(btn);
          });
          
          updateSubmitBtn(); 
        }).getStudentList(className);
      }

      function toggleSelection(btn) {
        btn.classList.toggle("selected");
        updateSubmitBtn();
      }

      function updateSubmitBtn() {
        var count = document.querySelectorAll(".student-btn.selected").length;
        document.getElementById("submitBtn").innerText = "送出記錄 (" + count + ")";
      }

      function submitBatch() {
        var className = document.getElementById('className').value;
        var action = document.getElementById('behavior').value;
        var statusDiv = document.getElementById('status');
        
        var selectedBtns = document.querySelectorAll(".student-btn.selected");
        var students = [];
        selectedBtns.forEach(function(btn) {
          students.push(btn.innerText);
        });

        if (students.length === 0) {
          statusDiv.innerText = "尚未選取任何學生！";
          statusDiv.style.color = "red";
          return;
        }

        statusDiv.innerText = "處理中...";
        statusDiv.style.color = "blue";
        document.getElementById("submitBtn").disabled = true;

        google.script.run
          .withSuccessHandler(function(msg) {
            statusDiv.innerText = msg;
            statusDiv.style.color = "green";
            document.getElementById("submitBtn").disabled = false;
            
            selectedBtns.forEach(function(btn) {
              btn.classList.remove("selected");
            });
            updateSubmitBtn();
          })
          .recordBatchData(className, students, action);
      }
    </script>
  </body>
</html>
