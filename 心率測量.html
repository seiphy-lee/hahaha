<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光學心率偵測 V2.0 (智慧降噪版)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        canvas {
            box-shadow: 0 0 50px rgba(0, 255, 128, 0.1);
            border-radius: 8px;
        }

        /* 懸浮控制面板 UI */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 30, 0.9);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 200, 0.3);
            backdrop-filter: blur(5px);
            width: 320px;
            pointer-events: auto;
            z-index: 10;
        }

        h1 { margin: 0 0 10px 0; font-size: 1.2rem; color: #0ff; text-shadow: 0 0 10px #0ff; }
        .control-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #ccc; }
        input[type="range"] { width: 100%; accent-color: #0ff; }
        
        .status {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 10px;
            line-height: 1.4;
            border-top: 1px solid #333;
            padding-top: 10px;
        }
        
        .indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #333;
            margin-right: 5px;
            transition: background-color 0.2s;
        }
        .indicator.active { background-color: #0f0; box-shadow: 0 0 8px #0f0; }
        .indicator.error { background-color: #f00; box-shadow: 0 0 8px #f00; }

        #bpmDisplay {
            margin-top: 10px;
            font-size: 2rem;
            color: #333; /* 預設暗色 */
            font-weight: bold;
            transition: color 0.3s;
        }
        #bpmDisplay.valid { color: #f0f; text-shadow: 0 0 15px #f0f; }

        video { display: none; }
        button {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            border: none;
            padding: 8px 16px;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1>💓 光學心率 V2.0 (智慧降噪)</h1>
        
        <div class="control-group">
            <div style="display:flex; align-items:center;">
                <div id="signalLight" class="indicator"></div>
                <span id="signalStatus">等待訊號...</span>
            </div>
        </div>

        <div class="control-group">
            <label>訊號平滑度: <span id="smoothVal">0.92</span></label>
            <input type="range" id="smoothing" min="0" max="0.98" step="0.01" value="0.92">
        </div>

        <div class="control-group">
            <label>顯示增益 (Gain): <span id="gainVal">5.0</span></label>
            <input type="range" id="gain" min="1" max="20" step="0.1" value="5.0">
        </div>

        <button id="toggleMode">切換至：模擬模式</button>

        <div id="bpmDisplay">-- BPM</div>
        
        <div class="status" id="debugInfo">
            邏輯修正：<br>
            1. 低於閾值的訊號視為雜訊 (歸零)<br>
            2. 手指未蓋好時不計算 BPM
        </div>
    </div>

    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

<script>
    /**
     * V2.0 重點更新：
     * 1. 加入 MIN_SIGNAL_STRENGTH 閾值，過濾背景雜訊。
     * 2. 加入 Timeout 機制，若太久沒心跳則 BPM 歸零。
     * 3. 視覺化訊號品質指示燈。
     */
    
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('webcam');
    
    // UI
    const smoothingInput = document.getElementById('smoothing');
    const gainInput = document.getElementById('gain');
    const smoothValDisplay = document.getElementById('smoothVal');
    const gainValDisplay = document.getElementById('gainVal');
    const bpmDisplay = document.getElementById('bpmDisplay');
    const signalLight = document.getElementById('signalLight');
    const signalStatus = document.getElementById('signalStatus');
    const toggleBtn = document.getElementById('toggleMode');
    const debugInfo = document.getElementById('debugInfo');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // 參數
    let isSimulation = false;
    let signalBuffer = new Array(400).fill(0);
    let smoothedSignal = 0;
    
    // BPM 計算相關
    let lastBeatTime = 0;
    let bpm = 0;
    let lastValidSignalTime = 0; // 上一次收到有效訊號的時間
    
    // 動態範圍偵測
    let minBrightness = 255;
    let maxBrightness = 0;
    // 重點修正：訊號強度閾值。
    // 如果 (Max - Min) 小於此數值，代表只是雜訊，非心跳。
    // 真實心跳引起的亮度變化通常在 2~10 之間 (視鏡頭而定)，雜訊通常 < 1
    const MIN_SIGNAL_STRENGTH = 1.5; 

    // 動畫變數
    let heartScale = 1;
    let simTime = 0;

    async function setupCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user", width: 320, height: 240 } 
            });
            video.srcObject = stream;
            video.play();
            signalStatus.textContent = "相機開啟，請蓋住鏡頭";
        } catch (err) {
            console.warn("No camera", err);
            signalStatus.textContent = "無相機，請切換模擬模式";
            signalLight.className = "indicator error";
        }
    }

    toggleBtn.addEventListener('click', () => {
        isSimulation = !isSimulation;
        toggleBtn.textContent = isSimulation ? "切換至：真實偵測" : "切換至：模擬模式";
        
        // 重置狀態
        signalBuffer.fill(0);
        bpm = 0;
        bpmDisplay.textContent = "-- BPM";
        bpmDisplay.classList.remove('valid');
        
        if(!isSimulation && !video.srcObject) setupCamera();
    });

    smoothingInput.addEventListener('input', (e) => smoothValDisplay.textContent = e.target.value);
    gainInput.addEventListener('input', (e) => gainValDisplay.textContent = e.target.value);

    function animate() {
        // 清除畫面 (殘影)
        ctx.fillStyle = 'rgba(5, 5, 5, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let rawBrightness = 0;
        let isValidSignal = false;
        let normalizedSignal = 0;

        if (isSimulation) {
            // --- 模擬模式 ---
            simTime += 0.05;
            // 模擬：加入雜訊，但訊號夠強
            rawBrightness = 100 + (Math.sin(simTime) + 0.6 * Math.sin(simTime*2 + 0.4)) * 10;
            // 模擬偶爾手指移開 (讓訊號變超弱)
            if (Math.random() > 0.995) rawBrightness = 100 + Math.random(); 
            
            // 模擬模式下我們假設一定有訊號 (除了故意造假的部分)
            const signalStrength = 20; 
            isValidSignal = true;
            normalizedSignal = (rawBrightness - 100) / 10; // 簡單正規化

        } else {
            // --- 真實模式 ---
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // 讀取中心像素
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = 40; 
                tempCanvas.height = 40;
                const tCtx = tempCanvas.getContext('2d');
                // 抓取中心
                tCtx.drawImage(video, (video.videoWidth-40)/2, (video.videoHeight-40)/2, 40, 40, 0, 0, 40, 40);
                const frame = tCtx.getImageData(0,0,40,40).data;
                
                let sum = 0;
                // 計算紅色通道平均
                for(let i=0; i<frame.length; i+=4) sum += frame[i];
                rawBrightness = sum / (frame.length/4);

                // --- 核心修正邏輯 ---
                
                // 1. 動態更新範圍 (加上衰減，讓範圍能隨環境適應)
                minBrightness = minBrightness * 0.99 + rawBrightness * 0.01;
                maxBrightness = maxBrightness * 0.99 + rawBrightness * 0.01;
                
                // 擴張範圍
                if(rawBrightness < minBrightness) minBrightness = rawBrightness;
                if(rawBrightness > maxBrightness) maxBrightness = rawBrightness;

                const range = maxBrightness - minBrightness;

                // 2. 判斷訊號強度 (Squelch)
                if (range > MIN_SIGNAL_STRENGTH) {
                    // 訊號夠強，可能是心跳
                    isValidSignal = true;
                    signalLight.className = "indicator active";
                    signalStatus.textContent = "偵測到訊號";
                    
                    // 正規化到 -1 ~ 1
                    normalizedSignal = (rawBrightness - minBrightness) / range * 2 - 1;
                    normalizedSignal = -normalizedSignal; // 翻轉，因為紅血球多吸收光->變暗->數值變小，但我們想看波峰
                    lastValidSignalTime = Date.now();
                } else {
                    // 訊號太弱 (可能是雜訊或手指沒蓋好)
                    isValidSignal = false;
                    signalLight.className = "indicator";
                    signalStatus.textContent = "訊號微弱 (請蓋好鏡頭)";
                    normalizedSignal = 0; // 強制歸零
                }
            }
        }

        // 平滑處理
        const alpha = parseFloat(smoothingInput.value);
        smoothedSignal = smoothedSignal * alpha + normalizedSignal * (1 - alpha);

        // 存入 Buffer
        const gain = parseFloat(gainInput.value);
        signalBuffer.push(smoothedSignal * gain);
        signalBuffer.shift();

        // --- 心跳計算 ---
        const now = Date.now();
        
        // 只有在訊號有效時才計算 BPM
        if (isValidSignal) {
            // 簡單波峰偵測
            // 條件：數值大於 0.3 且目前是波峰 (比前一個大，且比上上個大，簡單判斷斜率反轉)
            // 這裡用 buffer 最後幾點來判斷
            const val = signalBuffer[signalBuffer.length-1];
            const prev = signalBuffer[signalBuffer.length-2];
            
            // 閾值偵測 (冷卻時間 350ms，相當於最高 170 BPM)
            if (val > 0.4 && val > prev && (now - lastBeatTime > 350)) {
                const interval = now - lastBeatTime;
                
                // 過濾掉不合理的間隔 (例如 > 2000ms 或 < 300ms)
                if (interval < 2000 && interval > 300) {
                     let instantBpm = 60000 / interval;
                     // 平滑 BPM
                     if (bpm === 0) bpm = instantBpm;
                     else bpm = bpm * 0.6 + instantBpm * 0.4;
                     
                     bpmDisplay.textContent = Math.floor(bpm);
                     bpmDisplay.classList.add('valid');
                     heartScale = 1.4; // 視覺跳動
                }
                lastBeatTime = now;
            }
        }

        // 超時重置：如果超過 2.5 秒沒有效訊號，BPM 歸零
        if (now - lastValidSignalTime > 2500 || now - lastBeatTime > 2500) {
            bpm = 0;
            bpmDisplay.textContent = "-- BPM";
            bpmDisplay.classList.remove('valid');
        }

        // 視覺回復
        heartScale += (1 - heartScale) * 0.1;

        drawGraph();
        drawHeart();

        requestAnimationFrame(animate);
    }

    function drawGraph() {
        ctx.beginPath();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#0ff';
        const startX = (canvas.width - signalBuffer.length * 2) / 2;
        const centerY = canvas.height / 2;

        for (let i = 0; i < signalBuffer.length; i++) {
            const x = startX + i * 2;
            const y = centerY - signalBuffer[i] * 40;
            if (i===0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    function drawHeart() {
        const cx = canvas.width / 2;
        const cy = canvas.height / 2 + 150;
        const r = 20 * heartScale;

        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255, 50, 50, ${bpm > 0 ? 0.8 : 0.2})`; // 有心跳才亮
        ctx.fill();
        ctx.shadowBlur = bpm > 0 ? 20 : 0;
        ctx.shadowColor = '#f00';
    }

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });

    setupCamera();
    animate();

</script>
</body>
</html>
