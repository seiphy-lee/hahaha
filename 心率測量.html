<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>光學心率監測儀 (PPG Physics)</title>
    <style>
        :root {
            --bg-color: #050505;
            --primary-color: #00ffcc; /* Neon Cyan */
            --accent-color: #ff0055;  /* Neon Pink */
            --text-color: #ffffff;
            --glass-bg: rgba(20, 20, 20, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Canvas Container */
        #canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 隱藏的 Video 元素，用於捕捉影像流 */
        #video-feed {
            display: none; 
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 讓點擊穿透到按鈕 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Top Bar */
        .header {
            text-align: center;
            background: var(--glass-bg);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            align-self: center;
            margin-top: 10px;
            pointer-events: auto;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--primary-color);
            text-shadow: 0 0 10px var(--primary-color);
        }

        .status-text {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }

        /* Center Info (BPM Display) */
        .center-display {
            text-align: center;
            pointer-events: none;
        }

        .bpm-value {
            font-size: 5rem;
            font-weight: bold;
            color: var(--text-color);
            text-shadow: 0 0 20px var(--accent-color);
            font-variant-numeric: tabular-nums;
        }

        .bpm-label {
            font-size: 1.2rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Camera Preview Circle */
        #preview-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -150%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            overflow: hidden;
            display: none; /* Hidden initially */
            box-shadow: 0 0 15px var(--primary-color);
            z-index: 10;
        }

        /* Control Panel */
        .controls {
            pointer-events: auto;
            background: var(--glass-bg);
            padding: 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            align-self: center;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        button {
            background: linear-gradient(135deg, var(--accent-color), #ff5500);
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 80%;
            font-weight: bold;
            letter-spacing: 1px;
        }

        button.secondary {
            background: linear-gradient(135deg, #444, #666);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-size: 1rem;
            padding: 10px 20px;
        }
        
        button.share-btn {
            background: linear-gradient(135deg, #00ccff, #0066ff);
            box-shadow: 0 4px 15px rgba(0, 100, 255, 0.4);
        }

        button.stop-btn {
            background: linear-gradient(135deg, #ff3333, #aa0000);
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background: #444;
            box-shadow: none;
            cursor: not-allowed;
            color: #888;
        }

        /* Instructions Overlay */
        #instructions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
        }

        .guide-step {
            margin: 10px 0;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        
        .highlight { color: var(--primary-color); font-weight: bold; }

        /* Report Overlay */
        #report-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.98);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 90;
            padding: 20px;
            overflow-y: auto; /* 允許小螢幕滾動 */
        }

        .chart-container {
            width: 90%;
            height: 200px;
            border-left: 2px solid var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            margin: 20px 0;
        }
        
        .export-buttons {
            display: flex;
            gap: 10px;
            width: 90%;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .export-buttons button {
            width: auto;
            font-size: 0.9rem;
            padding: 10px 20px;
        }

    </style>
</head>
<body>

    <!-- 隱藏的 Video 元素 -->
    <video id="video-feed" playsinline></video>

    <!-- 主畫布 -->
    <div id="canvas-container">
        <canvas id="main-canvas"></canvas>
        <div id="preview-container">
            <canvas id="preview-canvas" width="80" height="80"></canvas>
        </div>
    </div>

    <!-- UI 層 -->
    <div class="ui-layer">
        <div class="header">
            <h1>光學心率監測儀</h1>
            <div class="status-text" id="status-display">等待啟動...</div>
            <div style="font-size:0.8rem; color:#666; margin-top:5px;">穩定版 v2.1</div>
        </div>

        <div class="center-display" id="bpm-display-area" style="opacity: 0; transition: opacity 0.5s;">
            <div class="bpm-value" id="bpm-value">--</div>
            <div class="bpm-label">BPM</div>
        </div>

        <div class="controls">
            <button id="action-btn">開啟相機權限</button>
        </div>
    </div>

    <!-- 初始引導畫面 -->
    <div id="instructions">
        <h2 style="color: var(--primary-color);">使用說明</h2>
        <div class="guide-step">1. 允許瀏覽器使用<span class="highlight">相機</span>。</div>
        <div class="guide-step">2. 將手指輕輕蓋住<span class="highlight">主鏡頭與閃光燈</span>。</div>
        <div class="guide-step">3. 保持靜止，放鬆手指。</div>
        <div class="guide-step" style="font-size: 0.9rem; color: #888; margin-top: 20px;">
            (注意：此為物理原理模擬程式，非專業醫療器材)
        </div>
        <button id="start-intro-btn" style="margin-top: 30px;">我了解了</button>
    </div>

    <!-- 結果報告畫面 -->
    <div id="report-overlay">
        <h2 style="color: var(--primary-color);">測量完成</h2>
        <div style="font-size: 1.2rem;">平均心率</div>
        <div class="bpm-value" id="final-avg-bpm">--</div>
        <div class="bpm-label">BPM</div>
        
        <div style="width: 320px; height: 160px; margin: 20px 0; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 10px;">
             <canvas id="result-chart" width="300" height="140"></canvas>
        </div>
        
        <div class="export-buttons">
            <button class="share-btn" id="share-btn">分享結果 (推薦)</button>
            <button class="secondary" id="download-img-btn">下載圖表</button>
            <button class="secondary" id="copy-csv-btn">複製數據</button>
        </div>
        
        <button id="restart-btn" style="margin-top: 20px;">重新測量</button>
    </div>

    <script>
        const video = document.getElementById('video-feed');
        const mainCanvas = document.getElementById('main-canvas');
        const ctx = mainCanvas.getContext('2d');
        const previewCanvas = document.getElementById('preview-canvas');
        const previewCtx = previewCanvas.getContext('2d');
        
        const actionBtn = document.getElementById('action-btn');
        const statusDisplay = document.getElementById('status-display');
        const bpmDisplayArea = document.getElementById('bpm-display-area');
        const bpmValueEl = document.getElementById('bpm-value');
        const previewContainer = document.getElementById('preview-container');
        
        const instructions = document.getElementById('instructions');
        const reportOverlay = document.getElementById('report-overlay');
        const resultChart = document.getElementById('result-chart');
        
        const STATE = {
            IDLE: 'idle',
            CAMERA_READY: 'camera_ready',
            COUNTDOWN: 'countdown',
            MEASURING: 'measuring',
            RESULT: 'result'
        };
        let currentState = STATE.IDLE;

        // 訊號處理變數
        let signalBuffer = [];       
        const BUFFER_SIZE = 300;     
        let brightnessHistory = [];  
        
        // 改良版心率計算變數
        let beats = [];              
        let displayBPM = 0;          // 用於平滑顯示
        let startTime = 0;
        let sessionData = [];        // 存儲完整的 {time, bpm} 記錄
        let rawSignalHistory = [];   // 用於最後畫圖 {time, value}
        
        // 動態閾值相關
        let dynamicThreshold = 0;
        let signalMin = 0;
        let signalMax = 0;

        let streamTrack = null;

        function resize() {
            mainCanvas.width = window.innerWidth;
            mainCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        document.getElementById('start-intro-btn').addEventListener('click', () => {
            instructions.style.display = 'none';
        });

        actionBtn.addEventListener('click', handleAction);
        document.getElementById('restart-btn').addEventListener('click', resetApp);
        document.getElementById('download-img-btn').addEventListener('click', downloadChartImage);
        document.getElementById('copy-csv-btn').addEventListener('click', copyCSVData);
        document.getElementById('share-btn').addEventListener('click', shareResult);

        function resetApp() {
            reportOverlay.style.display = 'none';
            currentState = STATE.CAMERA_READY;
            statusDisplay.textContent = "準備就緒，請蓋住鏡頭";
            actionBtn.textContent = "開始測量";
            actionBtn.className = ""; // Reset class
            actionBtn.disabled = false;
            bpmDisplayArea.style.opacity = 0;
            
            signalBuffer = [];
            beats = [];
            sessionData = [];
            rawSignalHistory = [];
            displayBPM = 0;
            
            previewContainer.style.display = 'block';
            startAnimationLoop();
        }

        async function handleAction() {
            if (currentState === STATE.IDLE) {
                try {
                    statusDisplay.textContent = "正在啟動相機...";
                    const constraints = {
                        audio: false,
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 640 },
                            height: { ideal: 480 },
                            frameRate: { ideal: 60 }
                        }
                    };
                    
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = stream;
                    await video.play();

                    streamTrack = stream.getVideoTracks()[0];
                    const capabilities = streamTrack.getCapabilities();
                    if (capabilities.torch) {
                        try {
                            await streamTrack.applyConstraints({ advanced: [{ torch: true }] });
                        } catch (e) {
                            console.warn("閃光燈開啟失敗", e);
                            statusDisplay.textContent = "無法開啟閃光燈，請手動補光";
                        }
                    }

                    currentState = STATE.CAMERA_READY;
                    statusDisplay.textContent = "請將手指蓋住鏡頭與閃光燈";
                    actionBtn.textContent = "開始測量";
                    previewContainer.style.display = 'block';
                    
                    startAnimationLoop();

                } catch (err) {
                    console.error(err);
                    alert("無法存取相機。請檢查權限。");
                    statusDisplay.textContent = "相機啟動失敗";
                }
            } else if (currentState === STATE.CAMERA_READY) {
                startCountdown();
            } else if (currentState === STATE.MEASURING) {
                finishMeasurement(); // 手動結束
            }
        }

        function startCountdown() {
            currentState = STATE.COUNTDOWN;
            actionBtn.disabled = true;
            let count = 3;
            
            const timer = setInterval(() => {
                count--;
                if (count <= 0) {
                    clearInterval(timer);
                    startMeasurement();
                }
            }, 1000);
            
            window.countdownValue = 3;
            const uiTimer = setInterval(() => {
                window.countdownValue--;
                if(window.countdownValue <= 0) clearInterval(uiTimer);
            }, 1000);
        }

        function startMeasurement() {
            currentState = STATE.MEASURING;
            startTime = performance.now();
            
            // UI 更新：變為停止按鈕
            statusDisplay.textContent = "測量中... 按下結束以停止";
            actionBtn.textContent = "結束測量";
            actionBtn.className = "stop-btn";
            actionBtn.disabled = false;
            
            bpmDisplayArea.style.opacity = 1;
            beats = [];
            brightnessHistory = [];
            rawSignalHistory = [];
            sessionData = [];
            displayBPM = 0;
            bpmValueEl.textContent = "--";
        }

        function finishMeasurement() {
            currentState = STATE.RESULT;
            
            previewContainer.style.display = 'none';
            reportOverlay.style.display = 'flex';
            
            // 計算總平均 BPM (剔除極端值)
            const validReadings = sessionData
                .map(d => d.bpm)
                .filter(r => r > 40 && r < 180);
            
            const avg = validReadings.length > 5 
                ? Math.round(validReadings.reduce((a, b) => a + b, 0) / validReadings.length) 
                : "--";
            
            document.getElementById('final-avg-bpm').textContent = avg;

            drawResultChart();
        }

        function startAnimationLoop() {
            requestAnimationFrame(loop);
        }

        function loop(timestamp) {
            if (currentState === STATE.RESULT) return;

            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
            ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const sx = Math.floor(video.videoWidth / 2 - 25);
                const sy = Math.floor(video.videoHeight / 2 - 25);
                
                previewCtx.drawImage(video, sx, sy, 50, 50, 0, 0, 80, 80);
                const frameData = previewCtx.getImageData(0, 0, 80, 80);
                const data = frameData.data;
                
                let totalRed = 0;
                let pixelCount = data.length / 4;

                for (let i = 0; i < data.length; i += 4) {
                    totalRed += data[i];
                }
                let avgRed = totalRed / pixelCount;

                // --- 改良的訊號處理 ---
                
                // 去除直流分量 (High-pass filter concept)
                brightnessHistory.push(avgRed);
                if (brightnessHistory.length > 30) brightnessHistory.shift(); // 約 0.5 秒的平均
                const localAvg = brightnessHistory.reduce((a, b) => a + b, 0) / brightnessHistory.length;
                
                // 放大訊號：心臟收縮 -> 變暗 -> avgRed 變小 -> localAvg - avgRed 變大 (波峰)
                let signal = (localAvg - avgRed) * 8; 

                // 紀錄原始數據供繪圖
                if (currentState === STATE.MEASURING) {
                    rawSignalHistory.push({ t: (timestamp - startTime) / 1000, val: signal });
                }

                if (signalBuffer.length > BUFFER_SIZE) signalBuffer.shift();
                signalBuffer.push(signal);

                drawWaveform(signalBuffer);

                if (currentState === STATE.MEASURING) {
                    detectHeartbeatAdaptive(signal, timestamp);
                    drawRecordingStatus(timestamp);
                } else if (currentState === STATE.COUNTDOWN) {
                    drawCountdown();
                }

                // 品質監控
                if(avgRed < 40) { // 閾值調低一點
                     statusDisplay.textContent = "光線不足，請緊貼閃光燈";
                     statusDisplay.style.color = "red";
                } else if (currentState === STATE.MEASURING) {
                     statusDisplay.textContent = "測量中... 按下按鈕結束";
                     statusDisplay.style.color = "var(--primary-color)";
                } else if (currentState === STATE.CAMERA_READY) {
                     statusDisplay.textContent = "訊號穩定，請按開始";
                     statusDisplay.style.color = "#aaa";
                }
            }

            requestAnimationFrame(loop);
        }

        // --- 改良版：自適應峰值偵測算法 (修正雙倍計數問題) ---
        
        let lastBeatTime = 0;
        let signalWindow = []; 
        const WINDOW_SIZE = 60; 

        function detectHeartbeatAdaptive(signal, time) {
            // 1. 維護訊號視窗以計算動態閾值
            signalWindow.push(signal);
            if (signalWindow.length > WINDOW_SIZE) signalWindow.shift();

            // 2. 計算動態範圍
            let min = Math.min(...signalWindow);
            let max = Math.max(...signalWindow);
            let amplitude = max - min;
            
            // [修正] 提高閾值至 75% 高度，避免偵測到重搏波 (Dicrotic Notch)
            dynamicThreshold = min + amplitude * 0.75;
            
            const isSignificant = amplitude > 3.0; 

            // 3. 峰值判斷
            // [修正] 將不反應期從 300ms 提高到 400ms (限制最高 BPM 為 150，過濾雙重波)
            if (signal > dynamicThreshold && (time - lastBeatTime > 400) && isSignificant) {
                
                let delta = time - lastBeatTime;
                
                if (lastBeatTime !== 0) {
                    let instantBPM = 60000 / delta;

                    // 4. 數據過濾
                    if (instantBPM > 40 && instantBPM < 160) {
                        
                        // 5. 加權平滑
                        if (displayBPM === 0) {
                            displayBPM = instantBPM;
                        } else {
                            displayBPM = displayBPM * 0.7 + instantBPM * 0.3;
                        }

                        bpmValueEl.textContent = Math.round(displayBPM);
                        
                        // 記錄數據
                        sessionData.push({
                            time: (time - startTime) / 1000, 
                            bpm: Math.round(instantBPM)
                        });

                        triggerBeatEffect();
                    }
                }
                
                lastBeatTime = time;
                beats.push(time);
            }
        }

        function triggerBeatEffect() {
            ctx.fillStyle = 'rgba(255, 0, 85, 0.2)';
            ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
            // 文字放大效果
            bpmValueEl.style.transform = "scale(1.2)";
            setTimeout(() => bpmValueEl.style.transform = "scale(1)", 100);
        }

        function drawWaveform(buffer) {
            if (buffer.length < 2) return;

            const centerY = mainCanvas.height / 2;
            const stepX = mainCanvas.width / BUFFER_SIZE;

            ctx.beginPath();
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'var(--primary-color)';
            ctx.lineJoin = 'round';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'var(--primary-color)';

            for (let i = 0; i < buffer.length; i++) {
                const x = i * stepX;
                const y = centerY - (buffer[i] * 5); 
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;

            const lastX = (buffer.length - 1) * stepX;
            const lastY = centerY - (buffer[buffer.length - 1] * 5);
            ctx.beginPath();
            ctx.arc(lastX, lastY, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
        }

        function drawCountdown() {
            ctx.font = "bold 150px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctx.fillText(window.countdownValue, mainCanvas.width / 2, mainCanvas.height / 2);
        }

        function drawRecordingStatus(time) {
            const elapsed = (time - startTime) / 1000;
            ctx.fillStyle = "#ff0055";
            ctx.font = "bold 20px Arial";
            ctx.textAlign = "center";
            ctx.fillText(`REC ${elapsed.toFixed(1)}s`, mainCanvas.width / 2, mainCanvas.height - 100);
            
            if (Math.floor(time / 500) % 2 === 0) {
                ctx.beginPath();
                ctx.arc(mainCanvas.width / 2 - 60, mainCanvas.height - 106, 6, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawResultChart() {
            const rCtx = resultChart.getContext('2d');
            rCtx.clearRect(0, 0, resultChart.width, resultChart.height);
            
            rCtx.strokeStyle = "rgba(255,255,255,0.1)";
            rCtx.lineWidth = 1;
            rCtx.beginPath();
            for(let i=1; i<5; i++) {
                let y = (resultChart.height / 5) * i;
                rCtx.moveTo(0, y);
                rCtx.lineTo(resultChart.width, y);
            }
            rCtx.stroke();

            if (rawSignalHistory.length < 10) {
                rCtx.fillStyle = "#fff";
                rCtx.fillText("數據不足", 10, 20);
                return;
            }

            let vals = rawSignalHistory.map(d => d.val);
            let min = Math.min(...vals);
            let max = Math.max(...vals);
            let range = max - min || 1;
            let duration = rawSignalHistory[rawSignalHistory.length-1].t - rawSignalHistory[0].t;

            rCtx.beginPath();
            rCtx.strokeStyle = "#00ffcc";
            rCtx.lineWidth = 1.5;

            for (let i = 0; i < rawSignalHistory.length; i++) {
                let point = rawSignalHistory[i];
                let x = ((point.t - rawSignalHistory[0].t) / duration) * resultChart.width;
                let y = resultChart.height - ((point.val - min) / range) * (resultChart.height - 20) - 10;
                
                if (i === 0) rCtx.moveTo(x, y);
                else rCtx.lineTo(x, y);
            }
            rCtx.stroke();
            
            rCtx.fillStyle = "#aaa";
            rCtx.font = "10px Arial";
            rCtx.textAlign = "left";
            rCtx.fillText("PPG Signal Waveform", 5, 12);
            rCtx.textAlign = "right";
            rCtx.fillText(`${duration.toFixed(1)}s`, resultChart.width - 5, resultChart.height - 5);
        }

        // --- 手機端優化功能 ---

        // 產生圖片 Blob
        async function getChartBlob() {
             const tempCanvas = document.createElement('canvas');
             tempCanvas.width = resultChart.width;
             tempCanvas.height = resultChart.height;
             const tCtx = tempCanvas.getContext('2d');
             tCtx.fillStyle = "#000000";
             tCtx.fillRect(0,0, tempCanvas.width, tempCanvas.height);
             tCtx.drawImage(resultChart, 0, 0);
             return new Promise(resolve => tempCanvas.toBlob(resolve, 'image/png'));
        }

        // [新增] 使用 Web Share API 分享
        async function shareResult() {
            try {
                const blob = await getChartBlob();
                const file = new File([blob], "heart_rate.png", { type: "image/png" });
                
                // 計算平均心率文字
                const avgText = document.getElementById('final-avg-bpm').textContent;
                const text = `我的心率測量結果: 平均 ${avgText} BPM`;

                if (navigator.share && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: '心率測量結果',
                        text: text,
                        files: [file]
                    });
                } else {
                    alert("您的裝置不支援直接分享圖片，將為您開啟圖片，請長按儲存。");
                    downloadChartImage(); // Fallback
                }
            } catch (err) {
                console.error("Share failed", err);
                // 這裡不報錯，因為用戶可能只是取消了分享選單
            }
        }

        async function downloadChartImage() {
            const blob = await getChartBlob();
            const url = URL.createObjectURL(blob);
            
            // 針對手機瀏覽器的處理
            const link = document.createElement('a');
            link.href = url;
            link.download = `heart_rate_chart_${new Date().getTime()}.png`;
            
            // 嘗試自動點擊下載
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // 如果是在 iOS Safari 等可能不支援自動下載的環境，或是 download 屬性失效
            // 可以在這裡做一些提示，或者直接在新視窗打開
            // setTimeout(() => window.open(url, '_blank'), 100);
        }

        function copyCSVData() {
            if (sessionData.length === 0) {
                alert("沒有足夠的數據");
                return;
            }

            let csvContent = "Time(s),BPM\n";
            sessionData.forEach(row => {
                csvContent += `${row.time.toFixed(2)},${row.bpm}\n`;
            });

            navigator.clipboard.writeText(csvContent).then(() => {
                const btn = document.getElementById('copy-csv-btn');
                const originalText = btn.textContent;
                btn.textContent = "已複製！";
                setTimeout(() => btn.textContent = originalText, 2000);
            }).catch(err => {
                console.error('複製失敗: ', err);
                alert("複製失敗 (權限限制)，請嘗試分享功能");
            });
        }

    </script>
