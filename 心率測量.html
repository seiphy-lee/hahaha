<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理心率實驗室 V4.0 (Chromebook 專用版)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            transition: background-color 0.5s;
        }

        /* 補光模式：測量時背景變亮白，提供光源 */
        body.measuring-mode {
            background-color: #fff; 
            color: #333;
        }
        
        /* 為了讓白色背景時文字看得到，需調整 UI 顏色 */
        body.measuring-mode #ui-layer {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ccc;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            color: #333;
        }
        body.measuring-mode h1 { color: #007bff; text-shadow: none; }
        body.measuring-mode label { color: #555; }

        canvas {
            position: absolute;
            top: 0; left: 0; z-index: 1;
            opacity: 0.8; /* 讓背景光透出來 */
        }

        #ui-layer {
            position: absolute;
            top: 20px; left: 20px;
            background: rgba(20, 20, 30, 0.95);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(0, 255, 200, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            width: 320px;
            z-index: 10;
            transition: all 0.3s;
        }

        h1 { margin: 0 0 15px 0; font-size: 1.3rem; color: #0ff; }
        .control-group { margin-bottom: 15px; }
        
        select, button {
            width: 100%; padding: 10px; margin-bottom: 10px;
            border-radius: 6px; border: 1px solid #666; font-size: 1rem;
        }
        button { cursor: pointer; font-weight: bold; border: none; }
        
        .btn-start { background: #007bff; color: white; }
        .btn-stop { background: #dc3545; color: white; display: none; }
        
        /* 狀態燈 */
        .status-row { display: flex; align-items: center; margin-bottom: 10px; }
        .indicator { width: 12px; height: 12px; border-radius: 50%; background: #555; margin-right: 8px; transition: 0.2s; }
        .indicator.ok { background: #28a745; box-shadow: 0 0 8px #28a745; }
        .indicator.bad { background: #dc3545; }

        /* BPM 數值 */
        .bpm-display { font-size: 4rem; font-weight: bold; text-align: center; margin: 10px 0; color: #888; }
        .bpm-display.active { color: #e83e8c; animation: pop 0.2s; }

        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* 倒數遮罩 */
        #countdown-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 20; display: none; flex-direction: column;
            align-items: center; justify-content: center;
            color: white;
        }
        #countdown-num { font-size: 8rem; font-weight: bold; color: #0ff; }
        
        video { display: none; }
    </style>
</head>
<body>

    <div id="countdown-overlay">
        <div id="countdown-num">3</div>
        <div style="font-size: 1.2rem; margin-top: 20px;">請將手指<b>輕觸</b>鏡頭</div>
        <div style="color: #aaa; margin-top: 5px;">背景即將變亮以補光</div>
    </div>

    <div id="ui-layer">
        <h1>💓 V4.0 Chromebook 修正版</h1>
        
        <div class="control-group">
            <select id="cameraSelect"><option>讀取相機中...</option></select>
        </div>

        <div class="status-row">
            <div id="statusLight" class="indicator"></div>
            <span id="statusText">請選擇鏡頭並開始</span>
        </div>

        <div id="bpmValue" class="bpm-display">--</div>
        
        <button id="btnStart" class="btn-start">開始測量 (3秒倒數)</button>
        <button id="btnStop" class="btn-stop">停止測量</button>

        <div style="font-size: 0.85rem; color: #666; margin-top: 15px; border-top: 1px solid #ccc; padding-top: 10px;">
            <b>修正說明：</b><br>
            1. 測量時螢幕變白，提供反光。<br>
            2. 加入 400ms 冷卻時間，防止兩倍誤判。<br>
            3. 若手指未蓋好 (非紅色)，則不計算。
        </div>
    </div>

    <video id="webcam" playsinline></video>
    <canvas id="canvas"></canvas>

<script>
    // === 參數設定 ===
    const CONFIG = {
        minSignalRange: 2.0,     // 訊號震幅至少要大於此數值 (防雜訊)
        minBeatInterval: 400,    // 兩個心跳間隔至少 400ms (限制最高 150 BPM，防止雙倍誤判)
        smoothing: 0.90,         // 平滑係數
        redThreshold: 1.2        // 紅色通道必須是藍綠通道平均值的 1.2 倍以上 (防鬼影)
    };

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('webcam');
    const bpmDisplay = document.getElementById('bpmValue');
    const statusText = document.getElementById('statusText');
    const statusLight = document.getElementById('statusLight');
    
    let stream = null;
    let isMeasuring = false;
    let signalBuffer = new Array(300).fill(0);
    let smoothedVal = 0;
    
    // BPM 計算變數
    let lastBeatTime = 0;
    let bpm = 0;
    let lastValidSignal = 0;

    // 1. 初始化相機選單
    async function init() {
        try {
            await navigator.mediaDevices.getUserMedia({ video: true }); // 先拿權限
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevs = devices.filter(d => d.kind === 'videoinput');
            
            const select = document.getElementById('cameraSelect');
            select.innerHTML = '';
            videoDevs.forEach((d, i) => {
                const opt = document.createElement('option');
                opt.value = d.deviceId;
                opt.text = d.label || `Camera ${i+1}`;
                // 嘗試自動標記
                if(opt.text.toLowerCase().includes('user')) opt.text = "👤 前置 (螢幕上方)";
                if(opt.text.toLowerCase().includes('environment')) opt.text = "🌍 後置 (鍵盤上方)";
                select.appendChild(opt);
            });
            stopStream();
        } catch(e) {
            statusText.innerText = "無法存取相機";
        }
    }

    // 2. 啟動與倒數
    document.getElementById('btnStart').onclick = () => {
        const devId = document.getElementById('cameraSelect').value;
        const overlay = document.getElementById('countdown-overlay');
        const countNum = document.getElementById('countdown-num');
        
        document.getElementById('btnStart').style.display = 'none';
        overlay.style.display = 'flex';
        
        // 預先啟動相機
        startCamera(devId);
        
        let count = 3;
        countNum.innerText = count;
        const timer = setInterval(() => {
            count--;
            if(count > 0) {
                countNum.innerText = count;
            } else {
                clearInterval(timer);
                overlay.style.display = 'none';
                startMeasurement();
            }
        }, 1000);
    };

    document.getElementById('btnStop').onclick = stopMeasurement;

    async function startCamera(deviceId) {
        if(stream) stopStream();
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { deviceId: { exact: deviceId }, width: 320, height: 240, frameRate: { ideal: 30 } }
            });
            video.srcObject = stream;
            video.play();
        } catch(e) { alert("相機錯誤: " + e.message); }
    }

    function stopStream() {
        if(stream) stream.getTracks().forEach(t => t.stop());
        stream = null;
    }

    function startMeasurement() {
        isMeasuring = true;
        document.body.classList.add('measuring-mode'); // 背景變白
        document.getElementById('btnStop').style.display = 'block';
        signalBuffer.fill(0);
        bpm = 0;
        bpmDisplay.innerText = "--";
        animate();
    }

    function stopMeasurement() {
        isMeasuring = false;
        document.body.classList.remove('measuring-mode'); // 恢復黑背景
        document.getElementById('btnStop').style.display = 'none';
        document.getElementById('btnStart').style.display = 'block';
        statusText.innerText = "已停止";
        statusLight.className = "indicator";
        stopStream();
        ctx.clearRect(0,0,canvas.width, canvas.height);
    }

    // 3. 核心迴圈
    function animate() {
        if(!isMeasuring) return;
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // 繪製背景網格
        drawGrid();

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            processVideoFrame();
        }
        
        drawWaveform();
        requestAnimationFrame(animate);
    }

    function processVideoFrame() {
        const tempC = document.createElement('canvas');
        tempC.width = 40; tempC.height = 40;
        const tCtx = tempC.getContext('2d');
        // 取樣中心
        tCtx.drawImage(video, (video.videoWidth-40)/2, (video.videoHeight-40)/2, 40, 40, 0, 0, 40, 40);
        const data = tCtx.getImageData(0,0,40,40).data;
        
        let rTotal = 0, gTotal = 0, bTotal = 0;
        for(let i=0; i<data.length; i+=4) {
            rTotal += data[i];
            gTotal += data[i+1];
            bTotal += data[i+2];
        }
        const pixels = data.length/4;
        const avgR = rTotal / pixels;
        const avgG = gTotal / pixels;
        const avgB = bTotal / pixels;
        
        // --- 關鍵過濾邏輯 ---
        
        // 1. 紅色主導檢查 (Red Dominance Check)
        // 手指充滿血液時，紅色應該遠大於藍綠色。
        // 如果 avgR 很低，或者跟 G/B 差不多，代表拍到的不是手指 (是環境黑影或牆壁)
        const isRedDominant = avgR > (avgG + avgB) * 0.5 * CONFIG.redThreshold;
        const isBrightEnough = avgR > 40; // 太暗也不行

        if (!isRedDominant || !isBrightEnough) {
            // 視為無效訊號
            updateStatus(false, "請貼緊鏡頭 (需紅色畫面)");
            pushSignal(0); // 推入 0 讓波形變平
            return;
        }

        // 2. 訊號取值與平滑
        // 使用紅色通道作為訊號源
        // 這裡我們動態正規化
        updateStatus(true, "訊號穩定");
        
        // 簡單的高通濾波 (去除直流偏移) - 這裡用簡化的變異數方法
        // 實際上我們只需要看"變化量"
        // 為了波形好看，我們還是做個 buffer 平均
        
        // 這裡用一個 trick: 減去這 40px 的平均值並不可行，因為我們只有一個點
        // 我們減去 "長時間平均" (DC Component)
        // 但為了簡化，直接送入 buffer 後在繪圖時正規化即可，
        // 這裡先做平滑
        smoothedVal = smoothedVal * CONFIG.smoothing + avgR * (1 - CONFIG.smoothing);
        
        // 由於心跳是微小變化，我們需要把 "變化量" 放大
        // 心跳時紅光會變"暗" (吸收多)，舒張時變"亮" (吸收少)
        // 為了波峰向上，我們取負號效果： Signal = -avgR
        pushSignal(-avgR); 
        
        detectHeartbeat();
    }

    // 將數值存入 Buffer 並保持長度
    function pushSignal(val) {
        signalBuffer.push(val);
        signalBuffer.shift();
    }

    function detectHeartbeat() {
        const now = Date.now();
        
        // 找出 Buffer 中的最大與最小值來決定波形比例
        let min = Infinity, max = -Infinity;
        for(let v of signalBuffer) {
            if(v < min) min = v;
            if(v > max) max = v;
        }
        
        const range = max - min;
        
        // 3. 訊號強度檢查 (Squelch)
        // 如果波形震幅太小，表示只是雜訊
        if (range < CONFIG.minSignalRange) {
            return; // 不計算心跳
        }

        // 4. 波峰偵測
        // 看最新的幾個點
        const p0 = signalBuffer[signalBuffer.length-1]; // 最新
        const p1 = signalBuffer[signalBuffer.length-2];
        const p2 = signalBuffer[signalBuffer.length-3];
        
        // 簡單的波峰條件：中間高，兩邊低
        // 且高度要在動態範圍的上半部 (避免雜訊)
        const threshold = min + range * 0.7; // 門檻設在 70% 高度
        
        if (p1 > p0 && p1 > p2 && p1 > threshold) {
            // 找到了波峰
            // 5. 不反應期檢查 (Refractory Period) !!! 這是解決兩倍數值的關鍵
            if (now - lastBeatTime > CONFIG.minBeatInterval) {
                
                const interval = now - lastBeatTime;
                
                // 再次過濾極端值 (300ms ~ 2000ms)
                if (interval > 300 && interval < 2000) {
                    let newBpm = 60000 / interval;
                    
                    // 平滑 BPM 顯示
                    if (bpm === 0) bpm = newBpm;
                    else bpm = bpm * 0.7 + newBpm * 0.3;
                    
                    bpmDisplay.innerText = Math.floor(bpm);
                    bpmDisplay.classList.remove('active');
                    void bpmDisplay.offsetWidth; // trigger reflow
                    bpmDisplay.classList.add('active');
                }
                lastBeatTime = now;
            }
        }
        
        // 超時歸零
        if (now - lastBeatTime > 2500) {
            bpm = 0;
            bpmDisplay.innerText = "--";
        }
    }

    function updateStatus(isOk, text) {
        statusLight.className = isOk ? "indicator ok" : "indicator bad";
        statusText.innerText = text;
        statusText.style.color = isOk ? "#28a745" : "#dc3545";
    }

    function drawWaveform() {
        // 自動縮放波形以適應視窗
        // 算出 min/max
        let min = Infinity, max = -Infinity;
        // 我們只畫最後 100 點讓反應看起來快一點，或是全畫
        // 這裡過濾掉 0 的值 (無效值) 來計算範圍
        const validData = signalBuffer.filter(v => v !== 0);
        if (validData.length < 10) return;

        for(let v of validData) {
            if(v < min) min = v;
            if(v > max) max = v;
        }
        
        // 避免除以零
        let range = max - min;
        if(range < 0.1) range = 0.1;

        ctx.beginPath();
        ctx.strokeStyle = '#ff0055';
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';

        const step = canvas.width / signalBuffer.length;
        const h = canvas.height;
        
        for(let i=0; i<signalBuffer.length; i++) {
            const val = signalBuffer[i];
            let y;
            if (val === 0) {
                y = h / 2; // 無訊號置中
            } else {
                // 正規化到 0~1，保留 20% 邊界
                const norm = (val - min) / range;
                y = h - (h * 0.2 + norm * h * 0.6); 
            }
            
            const x = i * step;
            if(i===0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }
    
    function drawGrid() {
        ctx.strokeStyle = 'rgba(100,100,100,0.1)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        // 畫幾條橫線
        for(let i=1; i<5; i++) {
            let y = canvas.height * (i/5);
            ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
        }
        ctx.stroke();
    }

    init();
</script>
</body>
</html>
