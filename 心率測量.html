<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理心率實驗室 V5.0 (視覺化閾值版)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            transition: background-color 0.5s;
        }

        /* 測量時背景全白補光 */
        body.measuring-mode {
            background-color: #fff; 
            color: #333;
        }

        /* UI 調整 */
        body.measuring-mode #ui-layer {
            background: rgba(240, 240, 240, 0.95);
            border: 1px solid #999;
            color: #333;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        body.measuring-mode h1 { color: #0056b3; }
        body.measuring-mode .bpm-value { color: #d63384; }

        canvas {
            position: absolute;
            top: 0; left: 0; z-index: 1;
            opacity: 0.9;
        }

        #ui-layer {
            position: absolute;
            top: 20px; left: 20px;
            background: rgba(20, 20, 30, 0.95);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 200, 0.3);
            width: 300px;
            z-index: 10;
        }

        h1 { margin: 0 0 10px 0; font-size: 1.2rem; color: #0ff; }
        
        select { width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 5px; }
        
        .bpm-display {
            text-align: center;
            margin: 15px 0;
            padding: 10px;
            background: rgba(0,0,0,0.05);
            border-radius: 8px;
        }
        .bpm-value { font-size: 3.5rem; font-weight: bold; color: #e83e8c; line-height: 1; }
        .bpm-label { font-size: 0.9rem; color: #888; }

        button {
            width: 100%; padding: 12px; border: none; border-radius: 6px;
            font-size: 1rem; font-weight: bold; cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        .btn-start { background: #007bff; color: white; }
        .btn-stop { background: #dc3545; color: white; display: none; }

        /* 訊號指示 */
        .signal-bar { height: 4px; background: #ddd; margin-top: 5px; border-radius: 2px; overflow: hidden; }
        .signal-fill { height: 100%; width: 0%; background: #28a745; transition: width 0.2s; }

        /* 倒數層 */
        #countdown-layer {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100;
            display: none; align-items: center; justify-content: center; flex-direction: column;
        }
        #cnt-num { font-size: 8rem; color: #0ff; font-weight: bold; }
        #cnt-tip { color: #fff; font-size: 1.5rem; margin-top: 20px; }

        video { display: none; }
    </style>
</head>
<body>

    <div id="countdown-layer">
        <div id="cnt-num">3</div>
        <div id="cnt-tip">請將手指輕蓋鏡頭</div>
        <div style="color:#aaa; margin-top:10px;">螢幕即將變亮</div>
    </div>

    <div id="ui-layer">
        <h1>💓 V5.0 強力偵測版</h1>
        
        <select id="camSelect"><option>偵測鏡頭中...</option></select>
        
        <div class="bpm-display">
            <div id="bpmVal" class="bpm-value">--</div>
            <div class="bpm-label">BPM (次/分)</div>
        </div>

        <div>
            <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:#666;">
                <span>訊號強度</span>
                <span id="sigText">等待中</span>
            </div>
            <div class="signal-bar"><div id="sigFill" class="signal-fill"></div></div>
        </div>
        
        <div style="margin-top: 15px;">
            <button id="btnStart" class="btn-start">開始測量</button>
            <button id="btnStop" class="btn-stop">停止</button>
        </div>

        <div style="margin-top:15px; font-size:0.8rem; color:#666; border-top:1px solid #ccc; padding-top:10px; line-height:1.4;">
            <b>🎯 觀察重點：</b><br>
            紅色波浪必須<b>衝過黃色虛線</b>才會計算心跳。<br>
            若波浪太小，請調整手指位置或稍微放鬆。
        </div>
    </div>

    <video id="video" playsinline></video>
    <canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('video');
    const bpmDisplay = document.getElementById('bpmVal');
    const sigFill = document.getElementById('sigFill');
    const sigText = document.getElementById('sigText');
    const camSelect = document.getElementById('camSelect');

    let stream = null;
    let isRunning = false;
    let animationId;

    // 訊號處理變數
    const BUFFER_SIZE = 300;
    let rawBuffer = []; // 原始紅光數據
    let smoothBuffer = []; // 平滑後數據
    
    // BPM 計算
    let lastBeatTime = 0;
    let bpm = 0;
    let peaks = []; // 紀錄波峰位置用於繪圖

    // 初始化
    async function init() {
        try {
            await navigator.mediaDevices.getUserMedia({ video: true });
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videos = devices.filter(d => d.kind === 'videoinput');
            
            camSelect.innerHTML = '';
            videos.forEach((d, i) => {
                const opt = document.createElement('option');
                opt.value = d.deviceId;
                // 嘗試分辨前後鏡頭
                let name = d.label || `Camera ${i+1}`;
                if(name.toLowerCase().includes('user') || name.toLowerCase().includes('front')) name = "👤 前置 (螢幕上方)";
                else if(name.toLowerCase().includes('environment') || name.toLowerCase().includes('back')) name = "📷 後置 (鍵盤上方)";
                opt.text = name;
                camSelect.appendChild(opt);
            });
            
            // 停止初始串流
            stopStream();
        } catch(e) {
            camSelect.innerHTML = "<option>無法存取相機</option>";
        }
        
        // 畫初始網格
        resize();
        drawGrid();
    }

    // 事件監聽
    document.getElementById('btnStart').onclick = startSequence;
    document.getElementById('btnStop').onclick = stopMeasurement;
    window.onresize = resize;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        if(!isRunning) drawGrid();
    }

    function startSequence() {
        const overlay = document.getElementById('countdown-layer');
        const num = document.getElementById('cnt-num');
        const devId = camSelect.value;

        document.getElementById('btnStart').style.display = 'none';
        overlay.style.display = 'flex';
        
        // 先開相機
        startCamera(devId);

        let count = 3;
        num.innerText = count;
        
        const timer = setInterval(() => {
            count--;
            if(count > 0) num.innerText = count;
            else {
                clearInterval(timer);
                overlay.style.display = 'none';
                startMeasurement();
            }
        }, 1000);
    }

    async function startCamera(id) {
        if(stream) stopStream();
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { deviceId: { exact: id }, width: 320, height: 240, frameRate: { ideal: 30 } }
            });
            video.srcObject = stream;
            video.play();
        } catch(e) { alert("相機啟動失敗"); }
    }

    function stopStream() {
        if(stream) stream.getTracks().forEach(t => t.stop());
        stream = null;
    }

    function startMeasurement() {
        isRunning = true;
        document.body.classList.add('measuring-mode');
        document.getElementById('btnStop').style.display = 'block';
        
        // 重置數據
        rawBuffer = new Array(BUFFER_SIZE).fill(0);
        smoothBuffer = new Array(BUFFER_SIZE).fill(0);
        bpm = 0;
        bpmDisplay.innerText = "--";
        
        loop();
    }

    function stopMeasurement() {
        isRunning = false;
        document.body.classList.remove('measuring-mode');
        document.getElementById('btnStart').style.display = 'block';
        document.getElementById('btnStop').style.display = 'none';
        cancelAnimationFrame(animationId);
        stopStream();
        
        ctx.clearRect(0,0,canvas.width, canvas.height);
        drawGrid();
        sigFill.style.width = "0%";
        sigText.innerText = "已停止";
    }

    // 核心循環
    function loop() {
        if(!isRunning) return;

        // 1. 影像處理
        if (video.readyState === 4) {
            const tmpCv = document.createElement('canvas');
            tmpCv.width = 40; tmpCv.height = 40;
            const tCtx = tmpCv.getContext('2d');
            tCtx.drawImage(video, (video.videoWidth-40)/2, (video.videoHeight-40)/2, 40, 40, 0, 0, 40, 40);
            const data = tCtx.getImageData(0,0,40,40).data;
            
            let rSum = 0;
            for(let i=0; i<data.length; i+=4) rSum += data[i];
            let rAvg = rSum / (data.length/4);

            // 訊號反轉 (血多->光暗->值小，我們想看波峰所以反轉)
            // 同時做一個 High-pass filter 去除直流分量 (DC Offset)
            // 簡單做法：減去目前的"長期平均"
            
            // 加入緩衝區
            rawBuffer.push(rAvg);
            rawBuffer.shift();

            processSignal();
        }

        draw();
        animationId = requestAnimationFrame(loop);
    }

    function processSignal() {
        // 算出原始數據的平均值 (DC)
        let sum = 0;
        for(let v of rawBuffer) sum += v;
        let dc = sum / BUFFER_SIZE;

        // 取出最新的 AC 分量 (變化量)
        let currentRaw = rawBuffer[rawBuffer.length-1];
        
        // 檢查是否太暗或不是紅色 (手指沒蓋好)
        if (currentRaw < 30) {
            sigText.innerText = "太暗/沒蓋好";
            sigText.style.color = "red";
            sigFill.style.width = "5%";
            sigFill.style.background = "red";
            return; // 不處理訊號
        }

        // 核心：AC 訊號 = (DC - Raw) * Gain
        // 乘上 10 是為了放大 Chromebook 微弱的訊號
        let ac = (dc - currentRaw) * 15; 

        // 強力平滑 (Exponential Moving Average) 消除階梯狀
        let lastSmooth = smoothBuffer[smoothBuffer.length-1];
        let smooth = lastSmooth * 0.9 + ac * 0.1;

        smoothBuffer.push(smooth);
        smoothBuffer.shift();

        // 訊號強度顯示
        let strength = Math.abs(smooth);
        let barWidth = Math.min(strength * 20, 100); // 視覺化強度
        sigFill.style.width = barWidth + "%";
        
        if(strength > 0.5) {
            sigText.innerText = "訊號良好";
            sigText.style.color = "green";
            sigFill.style.background = "#28a745";
        } else {
            sigText.innerText = "訊號微弱";
            sigText.style.color = "#ffc107";
            sigFill.style.background = "#ffc107";
        }

        detectBeat(smooth);
    }

    function detectBeat(val) {
        const now = Date.now();
        // 閾值設定：必須超過 1.0 (這就是黃色虛線的高度)
        const THRESHOLD = 1.0; 

        // 簡單的波峰偵測：當數值大於閾值，且斜率由正轉負
        // 取出最後三個點
        const p0 = smoothBuffer[smoothBuffer.length-1];
        const p1 = smoothBuffer[smoothBuffer.length-2];
        const p2 = smoothBuffer[smoothBuffer.length-3];

        if (p1 > THRESHOLD && p1 > p0 && p1 > p2) {
            // 找到波峰
            if (now - lastBeatTime > 400) { // 冷卻時間 400ms (Max 150 BPM)
                let interval = now - lastBeatTime;
                if (interval < 2000) {
                    let newBpm = 60000 / interval;
                    // 平滑 BPM
                    if (bpm === 0) bpm = newBpm;
                    else bpm = bpm * 0.7 + newBpm * 0.3;

                    bpmDisplay.innerText = Math.floor(bpm);
                    
                    // 視覺回饋
                    ctx.fillStyle = "rgba(255,0,100,0.2)";
                    ctx.fillRect(0,0,canvas.width, canvas.height);
                }
                lastBeatTime = now;
            }
        }
        
        // 超時歸零
        if (now - lastBeatTime > 2500) {
            bpm = 0;
            bpmDisplay.innerText = "--";
        }
    }

    function draw() {
        // 清空 (留殘影效果可選，這裡為了清晰選擇全清)
        ctx.clearRect(0,0,canvas.width, canvas.height);
        drawGrid();

        // 畫黃色閾值線 (及格線)
        const centerY = canvas.height / 2;
        const scale = 50; // 放大倍率
        const thresholdY_Top = centerY - 1.0 * scale; 
        
        ctx.beginPath();
        ctx.strokeStyle = "rgba(255, 200, 0, 0.8)"; // 黃色
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 10]); // 虛線
        ctx.moveTo(0, thresholdY_Top);
        ctx.lineTo(canvas.width, thresholdY_Top);
        ctx.stroke();
        ctx.setLineDash([]); // 復原

        // 畫波形
        ctx.beginPath();
        ctx.strokeStyle = "#ff0055"; // 紅色波形
        ctx.lineWidth = 4;
        ctx.lineJoin = "round";

        const step = canvas.width / BUFFER_SIZE;
        
        for(let i=0; i<smoothBuffer.length; i++) {
            let x = i * step;
            let y = centerY - smoothBuffer[i] * scale;
            if (i===0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    function drawGrid() {
        ctx.strokeStyle = "rgba(100,100,100,0.1)";
        ctx.lineWidth = 1;
        
        // 中心線
        ctx.beginPath();
        ctx.moveTo(0, canvas.height/2);
        ctx.lineTo(canvas.width, canvas.height/2);
        ctx.stroke();
    }

    init();
</script>
</body>
</html>
