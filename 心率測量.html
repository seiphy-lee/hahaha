<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>光學心率監測儀 (PPG Physics)</title>
    <style>
        :root {
            --bg-color: #050505;
            --primary-color: #00ffcc; /* Neon Cyan */
            --accent-color: #ff0055;  /* Neon Pink */
            --text-color: #ffffff;
            --glass-bg: rgba(20, 20, 20, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Canvas Container */
        #canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 隱藏的 Video 元素，用於捕捉影像流 */
        #video-feed {
            display: none; 
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 讓點擊穿透到按鈕 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Top Bar */
        .header {
            text-align: center;
            background: var(--glass-bg);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            align-self: center;
            margin-top: 10px;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--primary-color);
            text-shadow: 0 0 10px var(--primary-color);
        }

        .status-text {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }

        /* Center Info (BPM Display) */
        .center-display {
            text-align: center;
            pointer-events: none;
        }

        .bpm-value {
            font-size: 5rem;
            font-weight: bold;
            color: var(--text-color);
            text-shadow: 0 0 20px var(--accent-color);
            font-variant-numeric: tabular-nums;
        }

        .bpm-label {
            font-size: 1.2rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Camera Preview Circle */
        #preview-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -150%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            overflow: hidden;
            display: none; /* Hidden initially */
            box-shadow: 0 0 15px var(--primary-color);
            z-index: 10;
        }

        /* Control Panel */
        .controls {
            pointer-events: auto;
            background: var(--glass-bg);
            padding: 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            align-self: center;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        button {
            background: linear-gradient(135deg, var(--accent-color), #ff5500);
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 80%;
            font-weight: bold;
            letter-spacing: 1px;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background: #444;
            box-shadow: none;
            cursor: not-allowed;
            color: #888;
        }

        /* Instructions Overlay */
        #instructions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
        }

        .guide-step {
            margin: 10px 0;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        
        .highlight { color: var(--primary-color); font-weight: bold; }

        /* Report Overlay */
        #report-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 90;
            padding: 20px;
        }

        .chart-container {
            width: 90%;
            height: 200px;
            border-left: 2px solid var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            margin: 20px 0;
        }

    </style>
</head>
<body>

    <!-- 隱藏的 Video 元素 -->
    <video id="video-feed" playsinline></video>

    <!-- 主畫布 -->
    <div id="canvas-container">
        <canvas id="main-canvas"></canvas>
        <div id="preview-container">
            <canvas id="preview-canvas" width="80" height="80"></canvas>
        </div>
    </div>

    <!-- UI 層 -->
    <div class="ui-layer">
        <div class="header">
            <h1>光學心率監測儀</h1>
            <div class="status-text" id="status-display">等待啟動...</div>
        </div>

        <div class="center-display" id="bpm-display-area" style="opacity: 0; transition: opacity 0.5s;">
            <div class="bpm-value" id="bpm-value">--</div>
            <div class="bpm-label">BPM</div>
        </div>

        <div class="controls">
            <button id="action-btn">開啟相機權限</button>
        </div>
    </div>

    <!-- 初始引導畫面 -->
    <div id="instructions">
        <h2 style="color: var(--primary-color);">使用說明</h2>
        <div class="guide-step">1. 允許瀏覽器使用<span class="highlight">相機</span>。</div>
        <div class="guide-step">2. 將手指輕輕蓋住<span class="highlight">主鏡頭與閃光燈</span>。</div>
        <div class="guide-step">3. 保持靜止，不要過度用力按壓。</div>
        <div class="guide-step" style="font-size: 0.9rem; color: #888; margin-top: 20px;">
            (注意：此為物理原理模擬程式，非專業醫療器材)
        </div>
        <button id="start-intro-btn" style="margin-top: 30px;">我了解了</button>
    </div>

    <!-- 結果報告畫面 -->
    <div id="report-overlay">
        <h2 style="color: var(--primary-color);">測量完成</h2>
        <div style="font-size: 1.2rem;">平均心率</div>
        <div class="bpm-value" id="final-avg-bpm">72</div>
        <div class="bpm-label">BPM</div>
        
        <canvas id="result-chart" width="300" height="150" style="margin: 20px 0; background: rgba(255,255,255,0.05); border-radius: 10px;"></canvas>
        
        <button id="restart-btn">重新測量</button>
    </div>

    <script>
        /**
         * 物理與程式邏輯核心
         * 1. 取得影像串流
         * 2. 分析畫面中央區域的平均紅色亮度 (Red Channel Brightness)
         * 3. 透過亮度隨時間的變化 (PPG Signal) 偵測峰值
         */

        const video = document.getElementById('video-feed');
        const mainCanvas = document.getElementById('main-canvas');
        const ctx = mainCanvas.getContext('2d');
        const previewCanvas = document.getElementById('preview-canvas');
        const previewCtx = previewCanvas.getContext('2d');
        
        const actionBtn = document.getElementById('action-btn');
        const statusDisplay = document.getElementById('status-display');
        const bpmDisplayArea = document.getElementById('bpm-display-area');
        const bpmValueEl = document.getElementById('bpm-value');
        const previewContainer = document.getElementById('preview-container');
        
        const instructions = document.getElementById('instructions');
        const reportOverlay = document.getElementById('report-overlay');
        const resultChart = document.getElementById('result-chart');
        
        // 應用程式狀態
        const STATE = {
            IDLE: 'idle',
            CAMERA_READY: 'camera_ready',
            COUNTDOWN: 'countdown',
            MEASURING: 'measuring',
            RESULT: 'result'
        };
        let currentState = STATE.IDLE;

        // 訊號處理變數
        let signalBuffer = [];       // 存儲原始亮度訊號
        let timeBuffer = [];         // 存儲時間戳記
        const BUFFER_SIZE = 300;     // 畫面上顯示的波形長度
        let lastFrameTime = 0;
        let brightnessHistory = [];  // 用於計算動態閾值
        
        // 心率計算變數
        let beats = [];              // 存儲偵測到的心跳時間點
        let currentBPM = 0;
        let measurementStartTime = 0;
        const MEASURE_DURATION = 15000; // 測量 15 秒
        let sessionReadings = [];    // 存儲這次測量過程中的所有心率值

        let streamTrack = null;      // 用於控制閃光燈

        // 初始化
        function resize() {
            mainCanvas.width = window.innerWidth;
            mainCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        document.getElementById('start-intro-btn').addEventListener('click', () => {
            instructions.style.display = 'none';
        });

        actionBtn.addEventListener('click', handleAction);
        document.getElementById('restart-btn').addEventListener('click', resetApp);

        function resetApp() {
            reportOverlay.style.display = 'none';
            currentState = STATE.CAMERA_READY;
            statusDisplay.textContent = "準備就緒，請蓋住鏡頭";
            actionBtn.textContent = "開始測量";
            actionBtn.disabled = false;
            bpmDisplayArea.style.opacity = 0;
            
            // 清空數據
            signalBuffer = [];
            beats = [];
            sessionReadings = [];
            
            // 重新開啟預覽
            previewContainer.style.display = 'block';
            startAnimationLoop();
        }

        async function handleAction() {
            if (currentState === STATE.IDLE) {
                // 步驟 1: 請求相機權限
                try {
                    statusDisplay.textContent = "正在啟動相機...";
                    const constraints = {
                        audio: false,
                        video: {
                            facingMode: 'environment', // 後鏡頭
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        }
                    };
                    
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = stream;
                    await video.play();

                    // 嘗試開啟閃光燈 (Torch)
                    streamTrack = stream.getVideoTracks()[0];
                    const capabilities = streamTrack.getCapabilities();
                    if (capabilities.torch) {
                        try {
                            await streamTrack.applyConstraints({ advanced: [{ torch: true }] });
                        } catch (e) {
                            console.warn("閃光燈開啟失敗", e);
                            statusDisplay.textContent = "無法開啟閃光燈，請手動補光";
                        }
                    }

                    currentState = STATE.CAMERA_READY;
                    statusDisplay.textContent = "請將手指蓋住鏡頭與閃光燈";
                    actionBtn.textContent = "開始測量";
                    previewContainer.style.display = 'block';
                    
                    // 開始繪圖迴圈
                    startAnimationLoop();

                } catch (err) {
                    console.error(err);
                    alert("無法存取相機。請確保您使用手機並允許權限，或使用支援的瀏覽器 (Chrome/Safari)。");
                    statusDisplay.textContent = "相機啟動失敗";
                }
            } else if (currentState === STATE.CAMERA_READY) {
                // 步驟 2: 開始倒數
                startCountdown();
            }
        }

        function startCountdown() {
            currentState = STATE.COUNTDOWN;
            actionBtn.disabled = true;
            let count = 3;
            
            // 倒數動畫邏輯在 draw loop 中處理，這裡只負責計時
            const timer = setInterval(() => {
                count--;
                if (count <= 0) {
                    clearInterval(timer);
                    startMeasurement();
                }
            }, 1000);
            
            // 為了在 draw loop 顯示倒數數字，我們用一個全域變數
            window.countdownValue = 3;
            const uiTimer = setInterval(() => {
                window.countdownValue--;
                if(window.countdownValue <= 0) clearInterval(uiTimer);
            }, 1000);
        }

        function startMeasurement() {
            currentState = STATE.MEASURING;
            measurementStartTime = performance.now();
            statusDisplay.textContent = "測量中... 請保持靜止";
            bpmDisplayArea.style.opacity = 1;
            beats = [];
            brightnessHistory = [];
            
            // 設定結束時間
            setTimeout(finishMeasurement, MEASURE_DURATION);
        }

        function finishMeasurement() {
            currentState = STATE.RESULT;
            
            // 關閉閃光燈以省電 (如果需要的話，或者保持預覽)
            // if (streamTrack) streamTrack.applyConstraints({ advanced: [{ torch: false }] });

            previewContainer.style.display = 'none';
            reportOverlay.style.display = 'flex';
            
            // 計算平均 BPM
            const validReadings = sessionReadings.filter(r => r > 40 && r < 180);
            const avg = validReadings.length > 0 
                ? Math.round(validReadings.reduce((a, b) => a + b, 0) / validReadings.length) 
                : "--";
            
            document.getElementById('final-avg-bpm').textContent = avg;

            // 繪製結果圖表
            drawResultChart();
        }

        // --- 核心物理運算與繪圖迴圈 ---

        function startAnimationLoop() {
            requestAnimationFrame(loop);
        }

        function loop(timestamp) {
            if (currentState === STATE.RESULT) return; // 停止背景運算

            // 1. 視覺效果: 清除畫布並留下軌跡 (Trails)
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)'; // 背景淡出效果
            ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);

            // 2. 影像處理
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // 從影片中心擷取一小塊區域進行分析 (50x50 像素)
                const sx = Math.floor(video.videoWidth / 2 - 25);
                const sy = Math.floor(video.videoHeight / 2 - 25);
                
                // 畫到預覽 canvas (小圓圈)
                previewCtx.drawImage(video, sx, sy, 50, 50, 0, 0, 80, 80);

                // 獲取像素數據
                const frameData = previewCtx.getImageData(0, 0, 80, 80);
                const data = frameData.data;
                
                let totalRed = 0;
                let pixelCount = data.length / 4;

                // 計算平均紅色亮度
                for (let i = 0; i < data.length; i += 4) {
                    totalRed += data[i];
                }
                let avgRed = totalRed / pixelCount;

                // 物理訊號處理:
                // 反轉數值：血液多 -> 光暗 -> 數值低。
                // 為了讓圖表直觀(波峰代表心跳)，我們取反或取變化量。
                // 這裡我們直接記錄亮度，但在畫圖時做處理。
                // 實際上，心臟收縮時，手指變暗(吸光多)。

                // 處理訊號：簡單的平滑濾波 (Moving Average)
                if (signalBuffer.length > BUFFER_SIZE) signalBuffer.shift();
                
                // 正規化訊號以便顯示
                // 我們需要去除直流分量 (DC Component)，只看交流分量 (AC Component)
                brightnessHistory.push(avgRed);
                if (brightnessHistory.length > 30) brightnessHistory.shift();
                const localAvg = brightnessHistory.reduce((a, b) => a + b, 0) / brightnessHistory.length;
                
                // 訊號強度 (偏差值)
                let signal = (localAvg - avgRed) * 5; // 放大變化
                signalBuffer.push(signal);

                // 3. 繪製波形圖 (Oscilloscope style)
                drawWaveform(signalBuffer);

                // 4. 心跳偵測算法 (Peak Detection)
                if (currentState === STATE.MEASURING) {
                    detectHeartbeat(signal, timestamp);
                    drawProgress(timestamp);
                } else if (currentState === STATE.COUNTDOWN) {
                    drawCountdown();
                }

                // 顯示紅色濾鏡覆蓋效果
                if(avgRed < 50) {
                     statusDisplay.textContent = "光線不足或手指未覆蓋";
                     statusDisplay.style.color = "red";
                } else {
                     if(currentState === STATE.CAMERA_READY) {
                        statusDisplay.textContent = "訊號捕捉中... 按下開始";
                        statusDisplay.style.color = "#aaa";
                     }
                }
            }

            requestAnimationFrame(loop);
        }

        function drawWaveform(buffer) {
            if (buffer.length < 2) return;

            const centerY = mainCanvas.height / 2;
            const stepX = mainCanvas.width / BUFFER_SIZE;

            ctx.beginPath();
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'var(--primary-color)';
            ctx.lineJoin = 'round';
            
            // 加入發光效果
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'var(--primary-color)';

            for (let i = 0; i < buffer.length; i++) {
                const x = i * stepX;
                // 將訊號值映射到 Y 軸
                const y = centerY - (buffer[i] * 5); 
                
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            // Reset shadow
            ctx.shadowBlur = 0;

            // 繪製掃描線頭
            const lastX = (buffer.length - 1) * stepX;
            const lastY = centerY - (buffer[buffer.length - 1] * 5);
            
            ctx.beginPath();
            ctx.arc(lastX, lastY, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
        }

        // 簡單的峰值偵測
        let lastSignal = 0;
        let peakThreshold = 2.0; // 閾值，動態調整
        let lastBeatTime = 0;

        function detectHeartbeat(signal, time) {
            // 當訊號向上穿過閾值，且距離上次心跳超過 300ms (相當於最高 200 BPM)
            if (signal > peakThreshold && lastSignal <= peakThreshold && (time - lastBeatTime > 300)) {
                // 偵測到心跳
                lastBeatTime = time;
                
                // 視覺回饋：背景閃爍
                ctx.fillStyle = 'rgba(255, 0, 85, 0.1)';
                ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
                
                // 計算 BPM
                if (beats.length > 0) {
                    const delta = time - beats[beats.length - 1];
                    const instantBPM = 60000 / delta;
                    
                    // 平滑 BPM 顯示 (取最後 3 次平均)
                    sessionReadings.push(instantBPM);
                    const recentReadings = sessionReadings.slice(-5);
                    currentBPM = Math.round(recentReadings.reduce((a, b) => a + b, 0) / recentReadings.length);
                    
                    bpmValueEl.textContent = currentBPM;
                }
                
                beats.push(time);
            }
            lastSignal = signal;
        }

        function drawCountdown() {
            ctx.font = "bold 150px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctx.fillText(window.countdownValue, mainCanvas.width / 2, mainCanvas.height / 2);
        }

        function drawProgress(time) {
            const elapsed = time - measurementStartTime;
            const progress = Math.min(elapsed / MEASURE_DURATION, 1);
            
            const w = 300;
            const h = 10;
            const x = (mainCanvas.width - w) / 2;
            const y = mainCanvas.height - 100;
            
            // 進度條背景
            ctx.fillStyle = "#333";
            ctx.fillRect(x, y, w, h);
            
            // 進度條本體
            ctx.fillStyle = "var(--primary-color)";
            ctx.fillRect(x, y, w * progress, h);
            
            ctx.fillStyle = "#fff";
            ctx.font = "16px Arial";
            ctx.textAlign = "center";
            ctx.fillText(`測量剩餘 ${Math.ceil((MEASURE_DURATION - elapsed)/1000)} 秒`, mainCanvas.width/2, y - 15);
        }

        function drawResultChart() {
            const rCtx = resultChart.getContext('2d');
            rCtx.clearRect(0, 0, resultChart.width, resultChart.height);
            
            if (sessionReadings.length < 2) return;

            // 找出最大最小值以縮放
            let min = Math.min(...sessionReadings);
            let max = Math.max(...sessionReadings);
            let range = max - min || 1;

            rCtx.beginPath();
            rCtx.strokeStyle = "#ff0055";
            rCtx.lineWidth = 2;

            const stepX = resultChart.width / (sessionReadings.length - 1);
            
            for (let i = 0; i < sessionReadings.length; i++) {
                let val = sessionReadings[i];
                let normY = 1 - (val - min) / range; // 0..1
                let x = i * stepX;
                let y = normY * (resultChart.height - 20) + 10; // Margin 10
                
                if (i === 0) rCtx.moveTo(x, y);
                else rCtx.lineTo(x, y);
            }
            rCtx.stroke();
            
            // 標示平均線
            rCtx.beginPath();
            rCtx.strokeStyle = "rgba(255,255,255,0.3)";
            rCtx.setLineDash([5, 5]);
            rCtx.moveTo(0, resultChart.height/2);
            rCtx.lineTo(resultChart.width, resultChart.height/2);
            rCtx.stroke();
        }

    </script>
</body>
</html>
