<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡諧運動模擬</title>
<style>
:root{--bg:#0f1420;--panel:#171e2e;--panel2:#1f2840;--line:#2d3954;--text:#e6ebf5;--muted:#9aa6c0;--accent:#4fc3f7;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;overflow:hidden}
header{min-height:52px;display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;padding:8px 16px;background:#121828;border-bottom:1px solid var(--line)}
h1{font-size:18px;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);color:var(--muted);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit}
.tab.on{background:var(--accent);color:#06202c;border-color:var(--accent);font-weight:700}
.credit{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
#app{display:flex;height:calc(100% - 52px)}
#view{position:relative;flex:1;min-width:0;overflow:hidden}
#view canvas.three{display:block;width:100%;height:100%;touch-action:none}
#panel{width:310px;flex:none;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);padding:12px}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.box h3{font-size:15px;margin-bottom:10px;color:#cfe8ff}
.box h4{font-size:13px;color:var(--muted);margin:4px 0 2px;font-weight:500}
.row{display:flex;gap:8px}
.btn{flex:1;background:#2a3552;border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit}
.btn:hover{background:#33406a}
.lbl{font-size:13px;color:var(--muted);margin:10px 0 6px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:transparent;border:none;color:var(--muted);padding:7px 4px;cursor:pointer;font-size:13px;font-family:inherit}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#06202c;font-weight:700}
.sl{margin:10px 0}
.sl .top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
.sl .top b{color:var(--text);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;font-size:14px;cursor:pointer;user-select:none}
.sw input{display:none}
.sw .knob{width:40px;height:22px;border-radius:11px;background:#3a4560;position:relative;flex:none;transition:.2s}
.sw .knob::after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#cbd3e6;transition:.2s}
.sw input:checked + .knob{background:var(--accent)}
.sw input:checked + .knob::after{left:21px;background:#fff}
.readout{font-size:13px;line-height:1.75;color:var(--muted);background:#141a2a;border-radius:8px;padding:8px 10px;margin-top:8px;font-variant-numeric:tabular-nums}
.readout b{color:var(--text)}
.sub{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.legend{font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin:0 4px 2px 8px;vertical-align:middle}
.hidden{display:none !important}
#graph{position:absolute;left:10px;right:10px;bottom:10px;height:150px;width:calc(100% - 20px);background:rgba(12,17,28,.88);border:1px solid var(--line);border-radius:10px;display:none}
#energy{position:absolute;left:10px;top:10px;width:240px;background:rgba(12,17,28,.88);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:none;font-size:12px}
#energy .ttl{color:var(--muted);margin-bottom:4px}
.ebar{display:grid;grid-template-columns:70px 1fr 62px;align-items:center;gap:6px;margin:4px 0}
.ebar .track{height:12px;background:#222b40;border-radius:6px;overflow:hidden}
.ebar .fill{height:100%;width:0}
.ebar .val{text-align:right;font-variant-numeric:tabular-nums}
#hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(255,183,77,.15);border:1px solid rgba(255,183,77,.5);color:#ffd59a;padding:6px 14px;border-radius:20px;font-size:13px;pointer-events:none;display:none;white-space:nowrap}
@media (max-width:820px){
  html,body{overflow:auto;height:auto}
  #app{flex-direction:column;height:auto}
  #view{height:58vh;flex:none}
  #panel{width:100%;border-left:none;border-top:1px solid var(--line)}
  #graph{height:120px}
  #energy{width:200px;top:auto;bottom:10px}
  #energy.withgraph{bottom:140px}
  .credit{margin-left:0}
}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<header>
  <h1>簡諧運動</h1>
  <div class="tabs">
    <button class="tab on" data-tab="0">等速圓周運動的投影</button>
    <button class="tab" data-tab="1">彈簧–物體系統</button>
    <button class="tab" data-tab="2">單擺</button>
  </div>
  <div class="credit">臺中二中 阿發老師 設計</div>
</header>
<div id="app">
  <div id="view">
    <canvas id="graph"></canvas>
    <div id="energy">
      <div class="ttl" id="eTitle">力學能</div>
      <div class="ebar"><span>動能 K</span><div class="track"><div class="fill" id="eK" style="background:#ff7a7a"></div></div><span class="val" id="eKv">0</span></div>
      <div class="ebar"><span id="eUname">位能 U</span><div class="track"><div class="fill" id="eU" style="background:#64b5f6"></div></div><span class="val" id="eUv">0</span></div>
      <div class="ebar"><span>力學能 E</span><div class="track"><div class="fill" id="eE" style="background:#81c784"></div></div><span class="val" id="eEv">0</span></div>
    </div>
    <div id="hint">按住物體拖曳，放開後開始振盪</div>
  </div>
  <div id="panel">
    <section class="box">
      <div class="row">
        <button class="btn" id="btnPlay">⏸ 暫停</button>
        <button class="btn" id="btnReset">↺ 重置</button>
        <button class="btn" id="btnCam">重設視角</button>
      </div>
      <div class="lbl">播放速度</div>
      <div class="seg" id="speedSeg">
        <button data-v="0.25">×0.25</button><button data-v="0.5">×0.5</button><button data-v="1" class="on">×1</button>
      </div>
    </section>

    <!-- 分頁一 -->
    <section class="box" data-panel="0">
      <h3>等速圓周運動的投影</h3>
      <label class="sw"><span>💡 向下照燈（影子投在地板）</span><input type="checkbox" id="lampDown"><span class="knob"></span></label>
      <label class="sw"><span>💡 向左照燈（影子投在左牆）</span><input type="checkbox" id="lampLeft"><span class="knob"></span></label>
      <div class="sub">
        <h4>顯示選項</h4>
        <label class="sw"><span>調整半徑與週期</span><input type="checkbox" id="c1Sliders"><span class="knob"></span></label>
        <div id="c1SliderBox" class="hidden">
          <div class="sl"><div class="top"><span>半徑 R</span><b id="rSlV"></b></div><input type="range" id="rSl" min="1" max="2" step="0.05" value="1.5"></div>
          <div class="sl"><div class="top"><span>週期 T</span><b id="tSlV"></b></div><input type="range" id="tSl" min="1" max="8" step="0.5" value="4"></div>
        </div>
        <label class="sw"><span>半徑線與相位角 θ</span><input type="checkbox" id="c1Phase"><span class="knob"></span></label>
        <label class="sw"><span>速度與加速度向量</span><input type="checkbox" id="c1Vec"><span class="knob"></span></label>
        <div class="legend hidden" id="c1VecLegend"><i style="background:#66ff88"></i>速度 v<i style="background:#ff5566"></i>加速度 a</div>
        <label class="sw"><span>影子的位置–時間曲線</span><input type="checkbox" id="c1Trace"><span class="knob"></span></label>
      </div>
      <div class="readout" id="ro1"></div>
    </section>

    <!-- 分頁二 -->
    <section class="box hidden" data-panel="1">
      <h3>彈簧–物體系統</h3>
      <div class="seg" id="modeSeg"><button data-v="h" class="on">水平</button><button data-v="v">鉛直</button></div>
      <div class="sl"><div class="top"><span>彈性常數 k</span><b id="kSlV"></b></div><input type="range" id="kSl" min="10" max="100" step="1" value="20"></div>
      <div class="sl"><div class="top"><span>物體質量 m</span><b id="m2SlV"></b></div><input type="range" id="m2Sl" min="0.1" max="2" step="0.05" value="0.5"></div>
      <div class="readout" id="ro2"></div>
    </section>

    <!-- 分頁三 -->
    <section class="box hidden" data-panel="2">
      <h3>單擺</h3>
      <div class="sl"><div class="top"><span>擺繩長度 L</span><b id="lSlV"></b></div><input type="range" id="lSl" min="0.2" max="2" step="0.05" value="1.0"></div>
      <div class="sl"><div class="top"><span>擺錘質量 m</span><b id="m3SlV"></b></div><input type="range" id="m3Sl" min="0.1" max="2" step="0.05" value="0.5"></div>
      <div class="readout" id="ro3"></div>
    </section>

    <!-- 共用 -->
    <section class="box">
      <h3>共用顯示選項</h3>
      <label class="sw"><span>即時圖表</span><input type="checkbox" id="optGraph"><span class="knob"></span></label>
      <div class="seg hidden" id="qSeg"><button data-v="x" class="on">x–t</button><button data-v="v">v–t</button><button data-v="a">a–t</button></div>
      <div class="notab0">
        <label class="sw"><span>能量長條圖</span><input type="checkbox" id="optEnergy"><span class="knob"></span></label>
        <label class="sw"><span>阻尼</span><input type="checkbox" id="optDamp"><span class="knob"></span></label>
        <div class="sl hidden" id="dampBox"><div class="top"><span>阻尼強度 γ（a = … − γv）</span><b id="gSlV"></b></div><input type="range" id="gSl" min="0.05" max="1" step="0.05" value="0.2"></div>
      </div>
    </section>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const g = 9.8;
const $ = id => document.getElementById(id);
const view = $('view');

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.domElement.className = 'three';
view.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1220);
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 100);

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x202430, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 0.75); key.position.set(4, 8, 6); scene.add(key);
const dirDown = new THREE.DirectionalLight(0xfff3c4, 0); dirDown.position.set(0, 10, 0); scene.add(dirDown);
const dirLeft = new THREE.DirectionalLight(0xfff3c4, 0); dirLeft.position.set(10, 2.1, 0); scene.add(dirLeft);

/* ---------- helpers ---------- */
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0.05, ...o });

function makeLabel(text, color = '#ffffff', h = 0.15) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, depthWrite: false, transparent: true }));
  sp.scale.set(h * 4, h, 1); sp.renderOrder = 20;
  sp.userData = { cv, tex, color, text: null };
  setLabel(sp, text); return sp;
}
function setLabel(sp, text) {
  const u = sp.userData; if (u.text === text) return; u.text = text;
  const c = u.cv.getContext('2d'); c.clearRect(0, 0, 512, 128);
  let fs = 60; const fam = '"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif';
  c.font = `bold ${fs}px ${fam}`;
  const w = c.measureText(text).width; if (w > 480) { fs = Math.floor(fs * 480 / w); c.font = `bold ${fs}px ${fam}`; }
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineWidth = 10; c.strokeStyle = 'rgba(0,0,0,0.75)'; c.strokeText(text, 256, 66);
  c.fillStyle = u.color; c.fillText(text, 256, 66);
  u.tex.needsUpdate = true;
}
function makeLine(pts, color, dashed = false, opacity = 1) {
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = dashed
    ? new THREE.LineDashedMaterial({ color, dashSize: 0.06, gapSize: 0.04, transparent: opacity < 1, opacity })
    : new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity });
  const l = new THREE.Line(geo, mat); if (dashed) l.computeLineDistances(); l.frustumCulled = false; return l;
}
function setLine(l, pts) {
  l.geometry.dispose(); l.geometry = new THREE.BufferGeometry().setFromPoints(pts);
  if (l.material.isLineDashedMaterial) l.computeLineDistances();
}
function makeDynLine(n, color) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  geo.setDrawRange(0, 0);
  const l = new THREE.Line(geo, new THREE.LineBasicMaterial({ color })); l.frustumCulled = false; l.userData.n = n; return l;
}
function fillDyn(l, count, fn) {
  const a = l.geometry.attributes.position.array; count = Math.min(count, l.userData.n);
  for (let i = 0; i < count; i++) fn(i, a, i * 3);
  l.geometry.attributes.position.needsUpdate = true; l.geometry.setDrawRange(0, count);
}
const _up = new THREE.Vector3(0, 1, 0), _dir = new THREE.Vector3();
function makeArrow(color) {
  const grp = new THREE.Group(); const mat = new THREE.MeshBasicMaterial({ color });
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 1, 10), mat);
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.14, 14), mat);
  grp.add(shaft, head); grp.userData = { shaft, head }; grp.visible = false; return grp;
}
function setArrow(a, origin, vec, show) {
  const len = vec.length();
  if (!show || len < 0.03) { a.visible = false; return; }
  a.visible = true; a.position.copy(origin);
  a.quaternion.setFromUnitVectors(_up, _dir.copy(vec).divideScalar(len));
  const hl = Math.min(0.14, len * 0.5);
  a.userData.shaft.scale.set(1, len - hl, 1); a.userData.shaft.position.y = (len - hl) / 2;
  a.userData.head.scale.setScalar(hl / 0.14); a.userData.head.position.y = len - hl / 2;
}
class HelixCurve extends THREE.Curve {
  constructor(len, r, coils) { super(); this.len = len; this.r = r; this.coils = coils; }
  getPoint(t, target = new THREE.Vector3()) {
    const L = this.len, lead = Math.min(0.05, L * 0.1), hl = L - 2 * lead, u = t * L;
    if (u <= lead || u >= L - lead) return target.set(u, 0, 0);
    const ang = (u - lead) / hl * this.coils * Math.PI * 2;
    const ramp = Math.min(1, (u - lead) / 0.03, (L - lead - u) / 0.03);
    return target.set(u, this.r * ramp * Math.sin(ang), this.r * ramp * Math.cos(ang));
  }
}
function makeSpring(cfg) {
  const m = new THREE.Mesh(new THREE.BufferGeometry(), std(0xc9d1dc, { metalness: 0.6, roughness: 0.35 }));
  m.userData = { len: -1, cfg }; return m;
}
function updateSpring(mesh, len) {
  if (Math.abs(mesh.userData.len - len) < 1e-4) return;
  const c = mesh.userData.cfg; mesh.userData.len = len;
  mesh.geometry.dispose();
  mesh.geometry = new THREE.TubeGeometry(new HelixCurve(len, c.r, c.coils), c.coils * 24 + 10, c.wire, 6, false);
}
function makeRuler(min, max, vertical) {
  const margin = 0.06, lenM = max - min + 2 * margin, L = 2048, S = 170;
  const cv = document.createElement('canvas'); cv.width = vertical ? S : L; cv.height = vertical ? L : S;
  const c = cv.getContext('2d');
  c.fillStyle = 'rgba(240,232,200,0.95)'; c.fillRect(0, 0, cv.width, cv.height);
  const ppm = L / lenM; c.strokeStyle = '#222'; c.fillStyle = '#222'; c.font = 'bold 34px sans-serif';
  const N = Math.round((max - min) / 0.01);
  for (let i = 0; i <= N; i++) {
    const v = min + i * 0.01, p = (v - min + margin) * ppm;
    const isL = i % 20 === 0, is10 = i % 10 === 0, is5 = i % 5 === 0;
    const len = isL ? 70 : is10 ? 55 : is5 ? 38 : 22;
    c.lineWidth = is10 ? 3 : 1.5; c.beginPath();
    if (!vertical) { c.moveTo(p, 0); c.lineTo(p, len); } else { const y = L - p; c.moveTo(0, y); c.lineTo(len, y); }
    c.stroke();
    if (isL) {
      const txt = Math.abs(v) < 1e-9 ? '0' : v.toFixed(1);
      if (!vertical) { c.textAlign = 'center'; c.textBaseline = 'top'; c.fillText(txt, p, 82); }
      else { c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(txt, 78, L - p); }
    }
  }
  c.font = 'bold 30px sans-serif';
  if (!vertical) { c.textAlign = 'right'; c.textBaseline = 'bottom'; c.fillText('(m)', L - 8, S - 6); }
  else { c.textAlign = 'center'; c.textBaseline = 'top'; c.fillText('(m)', S / 2, 8); }
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const w = vertical ? lenM * S / L : lenM, h = vertical ? lenM : lenM * S / L;
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
}
const hitMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
const fmt = (v, d) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(d);

/* ---------- global state ---------- */
let tab = 0, running = true, speed = 1;
const opt = { graph: false, q: 'x', energy: false, damp: false, gamma: 0.2 };
const G1 = new THREE.Group(), G2 = new THREE.Group(), G3 = new THREE.Group();
scene.add(G1, G2, G3);

/* =====================================================
   分頁一：等速圓周運動的投影
   ===================================================== */
const T1 = { R: 1.5, T: 4, theta: 0, t: 0, hist: [], lampDown: false, lampLeft: false, phase: false, vec: false, trace: false };
const C1 = new THREE.Vector3(0, 2.6, 0), WALLX = -3.0, VZ = 0.3;
{
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(6.8, 5.2), std(0x3a4358));
  floor.rotation.x = -Math.PI / 2; floor.position.set(0.4, 0, 1.0); G1.add(floor);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 5.6), std(0x465069));
  wall.rotation.y = Math.PI / 2; wall.position.set(WALLX, 2.8, 1.0); G1.add(wall);
}
let ring1 = new THREE.Mesh(new THREE.TorusGeometry(T1.R, 0.014, 8, 128), std(0xe6ebf5, { emissive: 0x333944 }));
ring1.position.copy(C1); G1.add(ring1);
const center1 = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 12), std(0xffffff)); center1.position.copy(C1); G1.add(center1);
const ball1 = new THREE.Mesh(new THREE.SphereGeometry(0.11, 32, 24), std(0xff8a3d, { emissive: 0x552200, roughness: 0.4 })); G1.add(ball1);

// lamps
const lampOnCol = 0xfff6c8, lampOffCol = 0x555b66;
const lampDownGrp = new THREE.Group(); lampDownGrp.position.set(0, 5.1, 0);
lampDownGrp.add(new THREE.Mesh(new THREE.BoxGeometry(4.8, 0.14, 0.86), std(0x2a2f3a)));
const lampDownPanel = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.03, 0.7), new THREE.MeshBasicMaterial({ color: lampOffCol }));
lampDownPanel.position.y = -0.08; lampDownGrp.add(lampDownPanel); G1.add(lampDownGrp);
const lampDownLbl = makeLabel('向下照燈', '#ffe9a8', 0.16); lampDownLbl.position.set(0, 5.42, 0); G1.add(lampDownLbl);

const lampLeftGrp = new THREE.Group(); lampLeftGrp.position.set(3.4, 2.6, 0);
lampLeftGrp.add(new THREE.Mesh(new THREE.BoxGeometry(0.14, 4.8, 0.86), std(0x2a2f3a)));
const lampLeftPanel = new THREE.Mesh(new THREE.BoxGeometry(0.03, 4.6, 0.7), new THREE.MeshBasicMaterial({ color: lampOffCol }));
lampLeftPanel.position.x = -0.08; lampLeftGrp.add(lampLeftPanel); G1.add(lampLeftGrp);
{ const post = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.2, 0.08), std(0x2a2f3a)); post.position.set(3.4, 0.1, 0); G1.add(post); }
const lampLeftLbl = makeLabel('向左照燈', '#ffe9a8', 0.16); lampLeftLbl.position.set(3.4, 5.25, 0); G1.add(lampLeftLbl);

    if (s * om0 > 0 && s * om <= 0) {
      const tc = t + h * om0 / (om0 - om);
      if (T3.lastTurn !== null) T3.period = tc - T3.lastTurn;
      T3.lastTurn = tc;
    }
    t += h;
  }
  T3.th = th; T3.om = om; T3.t = t;
  pushGraph(2, t, T3.L * th, T3.L * om, T3.L * f(th, om));
}
function upd3() {
  arm3.rotation.z = T3.th;
  const show = Math.abs(T3.th) > 0.004;
  arc3.visible = thLbl3.visible = show;
  if (show) {
    fillDyn(arc3, 65, (i, a, k) => { const ang = T3.th * i / 64; a[k] = PIV.x + 0.35 * Math.sin(ang); a[k + 1] = PIV.y - 0.35 * Math.cos(ang); a[k + 2] = 0.002; });
    const hm = T3.th / 2; thLbl3.position.set(PIV.x + 0.55 * Math.sin(hm) + (T3.th > 0 ? 0.12 : -0.12), PIV.y - 0.55 * Math.cos(hm), 0.02);
    setLabel(thLbl3, `θ = ${(Math.abs(T3.th) * 180 / Math.PI).toFixed(1)}°`);
  }
  const bx = PIV.x + T3.L * Math.sin(T3.th), by = PIV.y - T3.L * Math.cos(T3.th);
  mLbl3.position.set(bx, by - 0.19, 0.05); setLabel(mLbl3, `${T3.m.toFixed(2)} kg`);
  const T0 = 2 * Math.PI * Math.sqrt(T3.L / g);
  let meas = '—', diff = '—';
  if (T3.released && !T3.dragging) {
    if (T3.period) { meas = T3.period.toFixed(3) + ' s'; diff = fmt((T3.period / T0 - 1) * 100, 2) + ' %'; }
    else meas = '量測中…';
  }
  $('ro3').innerHTML =
    `小角度理論週期 T₀ = 2π√(L/g) = <b>${T0.toFixed(3)}</b> s<br>` +
    `實際週期（模擬量測）= <b>${meas}</b><br>` +
    `與 T₀ 的差異 = <b>${diff}</b><br>` +
    `釋放角 θ₀ = <b>${T3.released || T3.dragging ? (Math.abs(T3.dragging ? T3.th : T3.th0) * 180 / Math.PI).toFixed(1) + '°' : '—'}</b>（上限 60°）<br>` +
    `<span style="font-size:12px">模擬使用完整方程式 θ″ = −(g/L) sin θ，未作小角度近似</span>`;
}

/* ---------- graph ---------- */
const GB = [[], [], []];
function pushGraph(i, t, x, v, a) {
  const b = GB[i]; b.push({ t, x, v, a });
  while (b.length && b[0].t < t - 10.5) b.shift();
}
const graphCv = $('graph'), gctx = graphCv.getContext('2d');
function curT() { return tab === 0 ? T1.t : tab === 1 ? T2.t : T3.t; }
function curScale() {
  if (tab === 0) { const w = 2 * Math.PI / T1.T; return { x: T1.R, v: T1.R * w, a: T1.R * w * w }; }
  return tab === 1 ? T2.scale : T3.scale;
}
function graphMeta() {
  const q = opt.q;
  const units = { x: 'm', v: 'm/s', a: 'm/s²' };
  const names = tab === 0 ? { x: '地板影子位置 x', v: '地板影子速度 vₓ', a: '地板影子加速度 aₓ' }
    : tab === 1 ? (T2.mode === 'h' ? { x: '位置 x', v: '速度 v', a: '加速度 a' } : { x: '位置 y（向上為正）', v: '速度 v', a: '加速度 a' })
    : { x: '弧長位移 s = Lθ', v: '切線速度 v', a: '切線加速度 aₜ' };
  const cols = { x: '#4fc3f7', v: '#66ff88', a: '#ff6b81' };
  return { name: names[q], unit: units[q], col: cols[q] };
}
function drawGraph() {
  if (!opt.graph) { graphCv.style.display = 'none'; return; }
  graphCv.style.display = 'block';
  const d = Math.min(window.devicePixelRatio || 1, 2);
  const W = graphCv.clientWidth * d, H = graphCv.clientHeight * d;
  if (graphCv.width !== Math.round(W) || graphCv.height !== Math.round(H)) { graphCv.width = Math.round(W); graphCv.height = Math.round(H); }
  const c = gctx; c.clearRect(0, 0, W, H);
  const pl = 62 * d, pr = 14 * d, pt = 24 * d, pb = 22 * d, pw = W - pl - pr, ph = H - pt - pb;
  const tNow = curT(), t0 = Math.max(0, tNow - 10);
  const meta = graphMeta(), sc = (curScale()[opt.q] || 1) * 1.15;
  const X = t => pl + (t - t0) / 10 * pw, Y = v => pt + ph / 2 - v / sc * ph / 2;
  c.font = `${11 * d}px sans-serif`; c.lineWidth = 1 * d;
  // grid
  c.strokeStyle = 'rgba(160,175,205,0.15)'; c.fillStyle = '#9aa6c0'; c.textAlign = 'center'; c.textBaseline = 'top';
  for (let s = Math.ceil(t0); s <= t0 + 10; s++) {
    c.beginPath(); c.moveTo(X(s), pt); c.lineTo(X(s), pt + ph); c.stroke();
    if (s % 2 === 0) c.fillText(s + ' s', X(s), pt + ph + 4 * d);
  }
  c.strokeStyle = 'rgba(160,175,205,0.5)';
  c.beginPath(); c.moveTo(pl, Y(0)); c.lineTo(pl + pw, Y(0)); c.stroke();
  c.beginPath(); c.moveTo(pl, pt); c.lineTo(pl, pt + ph); c.stroke();
  c.textAlign = 'right'; c.textBaseline = 'middle';
  const lab = sc / 1.15;
  c.fillText('+' + lab.toPrecision(3), pl - 4 * d, Y(lab)); c.fillText('0', pl - 4 * d, Y(0)); c.fillText('−' + lab.toPrecision(3), pl - 4 * d, Y(-lab));
  c.strokeStyle = 'rgba(160,175,205,0.12)';
  c.beginPath(); c.moveTo(pl, Y(lab)); c.lineTo(pl + pw, Y(lab)); c.moveTo(pl, Y(-lab)); c.lineTo(pl + pw, Y(-lab)); c.stroke();
  // curve
  const b = GB[tab];
  c.strokeStyle = meta.col; c.lineWidth = 2 * d; c.beginPath();
  let started = false;
  for (const p of b) { if (p.t < t0) continue; const xx = X(p.t), yy = Y(p[opt.q]); if (!started) { c.moveTo(xx, yy); started = true; } else c.lineTo(xx, yy); }
  c.stroke();
  // title
  c.textAlign = 'left'; c.textBaseline = 'top'; c.fillStyle = meta.col; c.font = `bold ${12 * d}px sans-serif`;
  const last = b.length ? b[b.length - 1][opt.q] : 0;
  c.fillText(`${meta.name}（${meta.unit}）   目前：${fmt(last, 3)}`, pl + 6 * d, 5 * d);
}

/* ---------- energy ---------- */
function updEnergy() {
  const el = $('energy');
  const show = opt.energy && tab !== 0;
  el.style.display = show ? 'block' : 'none';
  el.classList.toggle('withgraph', opt.graph);
  if (!show) return;
  let K, U, E0, dragging;
  if (tab === 1) { K = 0.5 * T2.m * T2.v * T2.v; U = 0.5 * T2.k * T2.x * T2.x; E0 = T2.E0; dragging = T2.dragging; }
  else { const v = T3.L * T3.om; K = 0.5 * T3.m * v * v; U = T3.m * g * T3.L * (1 - Math.cos(T3.th)); E0 = T3.E0; dragging = T3.dragging; }
  const E = K + U, ref = dragging ? E : E0;
  const pct = v => ref > 1e-12 ? Math.min(100, v / ref * 100) : 0;
  $('eK').style.width = pct(K) + '%'; $('eU').style.width = pct(U) + '%'; $('eE').style.width = pct(E) + '%';
  $('eKv').textContent = K.toFixed(3) + ' J'; $('eUv').textContent = U.toFixed(3) + ' J'; $('eEv').textContent = E.toFixed(3) + ' J';
  if (tab === 1 && T2.mode === 'v') { $('eUname').textContent = '位能 U'; $('eTitle').textContent = '力學能（U = ½ky²：彈力位能＋重力位能，以平衡位置為零）'; }
  else if (tab === 1) { $('eUname').textContent = '彈力位能'; $('eTitle').textContent = '力學能（U = ½kx²）'; }
  else { $('eUname').textContent = '重力位能'; $('eTitle').textContent = '力學能（U = mgL(1−cos θ)，最低點為零）'; }
}

/* ---------- dragging（必須在 OrbitControls 之前註冊） ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hitP = new THREE.Vector3();
let dragging = false;
function setRay(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
renderer.domElement.addEventListener('pointerdown', e => {
  if (tab === 0) return;
  setRay(e);
  const target = tab === 1 ? (T2.mode === 'h' ? hit2h : hit2v) : hit3;
  if (!ray.intersectObject(target, false).length) return;
  if (!ray.ray.intersectPlane(dragPlane, hitP)) return;
  dragging = true; controls.enabled = false;
  renderer.domElement.setPointerCapture(e.pointerId);
  if (tab === 1) {
    T2.dragging = true; T2.released = false; T2.v = 0; T2.t = 0; GB[1].length = 0;
    T2.grab = T2.mode === 'h' ? hitP.x - T2.x : hitP.y - T2.x;
  } else {
    T3.dragging = true; T3.released = false; T3.om = 0; T3.t = 0; T3.period = null; GB[2].length = 0;
  }
  e.preventDefault();
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!dragging) return;
  setRay(e); if (!ray.ray.intersectPlane(dragPlane, hitP)) return;
  if (tab === 1) {
    const [lo, hi] = xLimits2();
    const raw = (T2.mode === 'h' ? hitP.x : hitP.y) - T2.grab;
    T2.x = Math.max(lo, Math.min(hi, raw));
  } else {
    const th = Math.atan2(hitP.x - PIV.x, PIV.y - hitP.y);
    T3.th = Math.max(-THMAX, Math.min(THMAX, th));
  }
});
function endDrag() {
  if (!dragging) return;
  dragging = false; controls.enabled = true;
  if (tab === 1) {
    T2.dragging = false;
    if (Math.abs(T2.x) < 0.003) { resetRest2(); return; }
    const w = Math.sqrt(T2.k / T2.m), A = Math.abs(T2.x);
    T2.released = true; T2.t = 0; T2.v = 0;
    T2.E0 = 0.5 * T2.k * T2.x * T2.x;
    T2.scale = { x: A, v: A * w, a: A * w * w };
    pushGraph(1, 0, T2.x, 0, -w * w * T2.x);
  } else {
    T3.dragging = false;
    if (Math.abs(T3.th) < 0.004) { resetRest3(); return; }
    const th0 = Math.abs(T3.th);
    T3.released = true; T3.t = 0; T3.om = 0; T3.th0 = T3.th;
    T3.turnSign = Math.sign(T3.th); T3.lastTurn = 0; T3.period = null;
    T3.E0 = T3.m * g * T3.L * (1 - Math.cos(T3.th));
    T3.scale = { x: T3.L * th0, v: Math.sqrt(2 * g * T3.L * (1 - Math.cos(th0))), a: g * Math.sin(th0) };
    pushGraph(2, 0, T3.L * T3.th, 0, -g * Math.sin(T3.th));
  }
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;

/* ---------- camera views ---------- */
const camDefaults = {
  '0': { pos: [4.8, 4.3, 9.4], tgt: [-0.1, 2.5, 0.8] },
  '1h': { pos: [0.0, 1.9, 5.0], tgt: [-0.4, 0.25, 0] },
  '1v': { pos: [1.2, 2.4, 5.8], tgt: [0.1, 2.0, 0] },
  '2': { pos: [0.6, 1.8, 4.6], tgt: [0, 1.55, 0] },
};
const camSaved = {};
const camKey = () => tab === 1 ? '1' + T2.mode : String(tab);
let camReady = false;
function saveCam() { if (!camReady) return; camSaved[camKey()] = { pos: camera.position.toArray(), tgt: controls.target.toArray() }; }
function applyCam(k, useDefault = false) {
  camReady = true;
  const v = (!useDefault && camSaved[k]) || camDefaults[k];
  camera.position.fromArray(v.pos); controls.target.fromArray(v.tgt); controls.update();
}

/* ---------- UI ---------- */
function setTab(i) {
  saveCam(); if (dragging) endDrag();
  tab = i;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', +b.dataset.tab === i));
  document.querySelectorAll('[data-panel]').forEach(p => p.classList.toggle('hidden', +p.dataset.panel !== i));
  document.querySelector('.notab0').classList.toggle('hidden', i === 0);
  G1.visible = i === 0; G2.visible = i === 1; G3.visible = i === 2;
  applyCam(camKey());
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(+b.dataset.tab)));

$('btnPlay').addEventListener('click', () => { running = !running; $('btnPlay').textContent = running ? '⏸ 暫停' : '▶ 播放'; });
$('btnReset').addEventListener('click', () => {
  if (tab === 0) { T1.theta = 0; T1.t = 0; T1.hist.length = 0; GB[0].length = 0; }
  else if (tab === 1) resetRest2(); else resetRest3();
});
$('btnCam').addEventListener('click', () => applyCam(camKey(), true));
document.querySelectorAll('#speedSeg button').forEach(b => b.addEventListener('click', () => {
  speed = +b.dataset.v; document.querySelectorAll('#speedSeg button').forEach(x => x.classList.toggle('on', x === b));
}));

function bindSlider(id, f, cb) {
  const el = $(id), out = $(id + 'V');
  const show = () => out.textContent = f(+el.value);
  el.addEventListener('input', () => { show(); cb(+el.value); }); show();
}
// tab1
$('lampDown').addEventListener('change', e => T1.lampDown = e.target.checked);
$('lampLeft').addEventListener('change', e => T1.lampLeft = e.target.checked);
$('c1Sliders').addEventListener('change', e => $('c1SliderBox').classList.toggle('hidden', !e.target.checked));
$('c1Phase').addEventListener('change', e => T1.phase = e.target.checked);
$('c1Vec').addEventListener('change', e => { T1.vec = e.target.checked; $('c1VecLegend').classList.toggle('hidden', !T1.vec); });
$('c1Trace').addEventListener('change', e => T1.trace = e.target.checked);
bindSlider('rSl', v => v.toFixed(2) + ' m', v => { T1.R = v; rebuildRing(); T1.hist.length = 0; GB[0].length = 0; });
bindSlider('tSl', v => v.toFixed(1) + ' s', v => { T1.T = v; T1.hist.length = 0; GB[0].length = 0; });
// tab2
document.querySelectorAll('#modeSeg button').forEach(b => b.addEventListener('click', () => {
  if (T2.mode === b.dataset.v) return;
  saveCam(); T2.mode = b.dataset.v;
  document.querySelectorAll('#modeSeg button').forEach(x => x.classList.toggle('on', x === b));
  resetRest2(); applyCam(camKey());
}));
bindSlider('kSl', v => v.toFixed(0) + ' N/m', v => { T2.k = v; resetRest2(); });
bindSlider('m2Sl', v => v.toFixed(2) + ' kg', v => { T2.m = v; resetRest2(); });
// tab3
bindSlider('lSl', v => v.toFixed(2) + ' m', v => { T3.L = v; resetRest3(); });
bindSlider('m3Sl', v => v.toFixed(2) + ' kg', v => { T3.m = v; resetRest3(); });
// shared
$('optGraph').addEventListener('change', e => { opt.graph = e.target.checked; $('qSeg').classList.toggle('hidden', !opt.graph); });
document.querySelectorAll('#qSeg button').forEach(b => b.addEventListener('click', () => {
  opt.q = b.dataset.v; document.querySelectorAll('#qSeg button').forEach(x => x.classList.toggle('on', x === b));
}));
$('optEnergy').addEventListener('change', e => opt.energy = e.target.checked);
$('optDamp').addEventListener('change', e => { opt.damp = e.target.checked; $('dampBox').classList.toggle('hidden', !opt.damp); });
bindSlider('gSl', v => v.toFixed(2) + ' s⁻¹', v => { opt.gamma = v; if (tab === 1) resetRest2(); else if (tab === 2) resetRest3(); });

/* ---------- resize ---------- */
function resize() {
  const w = view.clientWidth, h = view.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.fov = camera.aspect < 1 ? 62 : 45; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);

/* ---------- init & loop ---------- */
resetRest2(); resetRest3();
setTab(0); resize();
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const rdt = Math.min(clock.getDelta(), 0.05), dt = running ? rdt * speed : 0;
  if (tab === 0) { stepCircle(dt); upd1(); }
  else if (tab === 1) { stepSpring(dt); upd2(); }
  else { stepPend(dt); upd3(); }
  $('hint').style.display = (tab !== 0 && !dragging && !(tab === 1 ? T2.released : T3.released)) ? 'block' : 'none';
  drawGraph(); updEnergy();
  controls.update(); renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
