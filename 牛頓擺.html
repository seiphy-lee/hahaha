<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>牛頓擺</title>
<style>
  :root{
    --bg:#11161f; --panel:#1a2230; --line:#2c3850; --text:#e6ecf5; --sub:#9aa8c0;
    --accent:#4fa3ff; --accent2:#ffb347; --btn:#243046; --btnh:#2f3e5a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
  #view{position:absolute;left:0;top:0;bottom:0;right:310px}
  #view canvas{display:block;width:100%;height:100%;touch-action:none}
  #title{position:absolute;left:16px;top:12px;font-size:22px;font-weight:700;letter-spacing:1px;
    text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none}
  #title small{font-size:13px;color:var(--sub);font-weight:400;margin-left:8px}
  #hint{position:absolute;left:16px;bottom:12px;font-size:13px;color:var(--sub);pointer-events:none;
    text-shadow:0 1px 4px rgba(0,0,0,.8)}
  #panel{position:absolute;right:0;top:0;bottom:0;width:310px;background:var(--panel);
    border-left:1px solid var(--line);padding:16px 16px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
  .grp{display:flex;flex-direction:column;gap:7px}
  .lbl{font-size:14px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
  .lbl b{color:var(--text);font-weight:600}
  .seg{display:flex;gap:5px}
  .seg button{flex:1}
  button{background:var(--btn);color:var(--text);border:1px solid var(--line);border-radius:7px;
    padding:8px 0;font-size:15px;cursor:pointer;font-family:inherit;transition:background .15s}
  button:hover:not(:disabled){background:var(--btnh)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  button:disabled{opacity:.35;cursor:not-allowed}
  #btnRelease{background:#2d7a46;border-color:#3a9a5a;font-weight:700}
  #btnRelease:hover:not(:disabled){background:#359152}
  #btnReset{background:#5a3340;border-color:#7a4655}
  #btnReset:hover{background:#6c3e4d}
  input[type=range]{width:100%;accent-color:var(--accent);height:22px}
  .chk{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
  .chk input{width:18px;height:18px;accent-color:var(--accent)}
  #status{font-size:14px;padding:8px 10px;border-radius:7px;background:#121a26;border:1px solid var(--line);color:var(--accent2)}
  .note{font-size:12.5px;color:var(--sub);line-height:1.6}
  #credit{margin-top:auto;font-size:12.5px;color:var(--sub);text-align:center;padding-top:8px;border-top:1px solid var(--line)}
  @media (max-width:760px){
    #view{right:0;bottom:auto;height:52vh}
    #panel{top:52vh;width:100%;border-left:none;border-top:1px solid var(--line);gap:11px;padding:12px}
    #title{font-size:18px}
    #hint{font-size:11.5px;bottom:6px}
    button{font-size:14px;padding:7px 0}
  }
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="view">
  <div id="title">牛頓擺<small>Newton's Cradle</small></div>
  <div id="hint">可直接拖曳球（放手即釋放）；拖曳空白處旋轉視角、滾輪縮放</div>
</div>

<aside id="panel">
  <div class="grp">
    <div class="lbl">球數</div>
    <div class="seg" id="segN"></div>
  </div>
  <div class="grp">
    <div class="lbl">左邊拉起球數</div>
    <div class="seg" id="segL"></div>
  </div>
  <div class="grp">
    <div class="lbl">右邊拉起球數</div>
    <div class="seg" id="segR"></div>
  </div>
  <div class="seg">
    <button id="btnRelease">釋放</button>
    <button id="btnReset">重置</button>
  </div>
  <div class="grp">
    <div class="lbl">恢復係數 e <b id="eVal">1.00</b></div>
    <input type="range" id="eSlider" min="0" max="1" step="0.01" value="1">
    <div class="note">e = 1 完全彈性碰撞；e = 0 完全非彈性碰撞</div>
  </div>
  <div class="grp">
    <div class="lbl">空氣阻力 <b id="dVal">0.00</b></div>
    <input type="range" id="dSlider" min="0" max="1" step="0.05" value="0">
  </div>
  <div class="grp">
    <div class="lbl">播放速度</div>
    <div class="seg" id="segS"></div>
  </div>
  <label class="chk"><input type="checkbox" id="sndChk" checked>碰撞音效</label>
  <div id="status">—</div>
  <div id="credit">臺中二中 阿發老師 設計</div>
</aside>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= 參數 ================= */
const G = 9.8;          // 重力加速度 (m/s²)
const LP = 0.30;        // 物理擺長 (m)，週期約 1.1 s
const LV = 3.0;         // 畫面擺長
const R = 0.3;          // 畫面球半徑（相鄰懸點間距 = 2R，靜止時恰好相接）
const LIFT = 30 * Math.PI / 180;   // 按鍵拉起角度
const MAXA = 80 * Math.PI / 180;   // 拖曳最大角度
const H = 0.0005;       // 積分子步長 (s)

let N = 5, leftN = 1, rightN = 0, custom = false;
let theta = [], omega = [], held = [];
let state = 'ready';    // 'ready'：拉起靜止中；'running'：擺動中
let speed = 1, e = 1, damp = 0, soundOn = true;
let dragIdx = -1, dragTarget = 0, grabOffset = 0;

/* ================= 場景 ================= */
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2130);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
camera.position.set(2.2, 0.3, 11.5);

scene.add(new THREE.HemisphereLight(0xdde8ff, 0x303040, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(4, 8, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 30 });
sun.shadow.bias = -0.0005;
scene.add(sun);

// 地面
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: 0x252c38, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -4.23; floor.receiveShadow = true;
scene.add(floor);

// 框架
const woodMat = new THREE.MeshStandardMaterial({ color: 0x5b3a22, roughness: 0.6 });
const metalMat = new THREE.MeshStandardMaterial({ color: 0xb8bec8, metalness: 0.9, roughness: 0.3 });
const base = new THREE.Mesh(new THREE.BoxGeometry(9.8, 0.25, 2.4), woodMat);
base.position.y = -4.1; base.castShadow = base.receiveShadow = true; scene.add(base);
for (const sx of [-4.6, 4.6]) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 4.1, 20), metalMat);
  post.position.set(sx, -1.95, 0); post.castShadow = true; scene.add(post);
  const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 0.08, 24), metalMat);
  foot.position.set(sx, -3.94, 0); scene.add(foot);
}
const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 9.2, 20), metalMat);
bar.rotation.z = Math.PI / 2; bar.position.y = 0.06; bar.castShadow = true; scene.add(bar);

// 擺
const ballGeo = new THREE.SphereGeometry(R, 48, 32);
const ballMat = new THREE.MeshStandardMaterial({ color: 0xe8ecf2, metalness: 1, roughness: 0.1 });
const strGeo = new THREE.CylinderGeometry(0.012, 0.012, LV - R, 6);
const strMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.5 });
const pendulums = [], balls = [];

function buildPendulums() {
  pendulums.forEach(p => scene.remove(p));
  pendulums.length = 0; balls.length = 0;
  for (let i = 0; i < N; i++) {
    const g = new THREE.Group();
    g.position.set((i - (N - 1) / 2) * 2 * R, 0, 0);
    const s = new THREE.Mesh(strGeo, strMat);
    s.position.y = -(LV - R) / 2; s.castShadow = true;
    const b = new THREE.Mesh(ballGeo, ballMat);
    b.position.y = -LV; b.castShadow = true; b.userData.index = i;
    g.add(s, b); scene.add(g);
    pendulums.push(g); balls.push(b);
  }
  theta = new Array(N).fill(0); omega = new Array(N).fill(0); held = new Array(N).fill(false);
}

/* ================= 物理 ================= */
// 非線性單擺 + 線性空氣阻力
const acc = (th, w) => -(G / LP) * Math.sin(th) - damp * w;

function rk4(i, h) {
  const t0 = theta[i], w0 = omega[i];
  const k1t = w0,               k1w = acc(t0, w0);
  const k2t = w0 + 0.5*h*k1w,   k2w = acc(t0 + 0.5*h*k1t, w0 + 0.5*h*k1w);
  const k3t = w0 + 0.5*h*k2w,   k3w = acc(t0 + 0.5*h*k2t, w0 + 0.5*h*k2w);
  const k4t = w0 + h*k3w,       k4w = acc(t0 + h*k3t, w0 + h*k3w);
  theta[i] = t0 + h/6*(k1t + 2*k2t + 2*k3t + k4t);
  omega[i] = w0 + h/6*(k1w + 2*k2w + 2*k3w + k4w);
}

// 懸點間距 2R、擺長相同：兩球接觸 ⇔ 擺角相等，此時法線為水平，
// 等質量碰撞可直接以角速度做一維恢復係數計算。
// 依序兩兩處理（正反方向交替掃描），直到沒有任何一對接觸且互相靠近。
function resolveCollisions() {
  let maxV = 0;
  for (let pass = 0; pass < 400; pass++) {
    let any = false;
    const fwd = (pass % 2 === 0);
    for (let k = 0; k < N - 1; k++) {
      const i = fwd ? k : N - 2 - k, j = i + 1;
      if (theta[j] - theta[i] > 1e-6) continue;        // 未接觸
      const rel = omega[i] - omega[j];                  // 靠近的相對角速度
      if (rel <= 1e-9) continue;
      if (held[i] && held[j]) continue;
      any = true;
      maxV = Math.max(maxV, rel * LP);
      if (held[i])      omega[j] = omega[i] + e * rel;  // 手持球視為無限大質量
      else if (held[j]) omega[i] = omega[j] - e * rel;
      else { const d = (1 + e) * rel / 2; omega[i] -= d; omega[j] += d; }
    }
    if (!any) break;
  }
  return maxV;
}

function physicsStep(h) {
  for (let i = 0; i < N; i++) if (!held[i]) rk4(i, h);
  return resolveCollisions();
}

/* ================= 拖曳 ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const hitPt = new THREE.Vector3();

function setPointer(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
}

// 游標射線與 z=0 平面交點相對於懸點的角度（無交點回傳 null）
function pointerAngle() {
  if (!raycaster.ray.intersectPlane(dragPlane, hitPt)) return null;
  const p = pendulums[dragIdx].position;
  return Math.atan2(hitPt.x - p.x, p.y - hitPt.y);
}

function updateDragTarget() {
  const a = pointerAngle();
  if (a === null) return;
  dragTarget = Math.max(-MAXA, Math.min(MAXA, a - grabOffset));
}

// 手持球跟著滑鼠移動；相鄰球每幀重新判斷：
// 位置碰到/重疊，且被壓向手持球（重力或推動方向）時才一起帶著走，否則脫離自由擺動
function applyDrag(dtSim) {
  const i = dragIdx, target = dragTarget;
  const delta = target - theta[i];
  const wh = dtSim > 0 ? Math.max(-25, Math.min(25, delta / dtSim)) : 0;
  held.fill(false); held[i] = true;
  theta[i] = target; omega[i] = wh;
  const pressL = target < 0 || delta < 0;   // 左側球被壓向手持球
  const pressR = target > 0 || delta > 0;   // 右側球被壓向手持球
  if (pressL) {
    for (let j = i - 1; j >= 0; j--) {
      if (theta[j] >= target - 1e-6) { held[j] = true; theta[j] = target; omega[j] = wh; } else break;
    }
  }
  if (pressR) {
    for (let j = i + 1; j < N; j++) {
      if (theta[j] <= target + 1e-6) { held[j] = true; theta[j] = target; omega[j] = wh; } else break;
    }
  }
}

// 必須在 OrbitControls 建立前註冊，才能先行關閉視角旋轉
renderer.domElement.addEventListener('pointerdown', ev => {
  unlockAudio();
  setPointer(ev);
  const hit = raycaster.intersectObjects(balls, false)[0];
  if (!hit) return;
  dragIdx = hit.object.userData.index;
  held.fill(false); held[dragIdx] = true;
  dragTarget = theta[dragIdx];
  const a0 = pointerAngle();
  grabOffset = (a0 === null) ? 0 : a0 - theta[dragIdx];   // 按下瞬間 delta = 0
  controls.enabled = false;
  custom = true; refreshButtons();
  renderer.domElement.setPointerCapture(ev.pointerId);
});
renderer.domElement.addEventListener('pointermove', ev => {
  if (dragIdx < 0) return;
  setPointer(ev); updateDragTarget();
});
function endDrag() {
  if (dragIdx < 0) return;
  for (let k = 0; k < N; k++) if (held[k]) omega[k] = 0;   // 由靜止釋放
  held.fill(false); dragIdx = -1;
  controls.enabled = true;
  state = 'running'; refreshButtons();
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -2, 0);
controls.enableDamping = true;
controls.minDistance = 5; controls.maxDistance = 25;
controls.update();

/* ================= 音效 ================= */
let actx = null, lastSnd = 0, noiseBuf = null;
function unlockAudio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const len = Math.floor(actx.sampleRate * 0.03);
    noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === 'suspended') actx.resume();
}
function playClick(v) {
  if (!soundOn || !actx) return;
  const now = actx.currentTime;
  if (now - lastSnd < 0.03) return;
  lastSnd = now;
  const vol = Math.min(1, v / 1.2) * 0.9;     // 音量正比於碰撞相對速率
  const out = actx.createGain();
  out.gain.value = vol; out.connect(actx.destination);
  for (const [f, d, a] of [[2650, 0.07, 0.5], [4150, 0.04, 0.3], [6400, 0.025, 0.18]]) {
    const o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(a, now + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, now + d);
    o.connect(g).connect(out); o.start(now); o.stop(now + d + 0.02);
  }
  const src = actx.createBufferSource(); src.buffer = noiseBuf;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = 1.2;
  const ng = actx.createGain();
  ng.gain.setValueAtTime(0.6, now); ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.018);
  src.connect(bp).connect(ng).connect(out); src.start(now);
}

/* ================= 介面 ================= */
const segN = document.getElementById('segN'), segL = document.getElementById('segL'),
      segR = document.getElementById('segR'), segS = document.getElementById('segS');
const btnRelease = document.getElementById('btnRelease'), statusEl = document.getElementById('status');

function makeSeg(el, items, onClick) {
  items.forEach(([label, val]) => {
    const b = document.createElement('button');
    b.textContent = label; b.dataset.v = val;
    b.addEventListener('click', () => { unlockAudio(); onClick(val); });
    el.appendChild(b);
  });
}
makeSeg(segN, [3,4,5,6,7].map(n => [n, n]), n => { N = n; leftN = 0; rightN = 0; buildPendulums(); applyLift(); });
makeSeg(segL, [0,1,2,3,4].map(n => [n, n]), n => { if (n + (custom ? 0 : rightN) > N) return; if (custom) rightN = 0; leftN = n; applyLift(); });
makeSeg(segR, [0,1,2,3,4].map(n => [n, n]), n => { if (n + (custom ? 0 : leftN) > N) return; if (custom) leftN = 0; rightN = n; applyLift(); });
makeSeg(segS, [['暫停', 0], ['0.25×', 0.25], ['0.5×', 0.5], ['1×', 1]], s => { speed = s; refreshButtons(); });

function applyLift() {
  custom = false;
  dragIdx = -1; controls.enabled = true;
  for (let i = 0; i < N; i++) { theta[i] = 0; omega[i] = 0; held[i] = false; }
  for (let i = 0; i < leftN; i++) theta[i] = -LIFT;
  for (let i = N - rightN; i < N; i++) theta[i] = LIFT;
  state = 'ready';
  refreshButtons();
}

function refreshButtons() {
  segN.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.v === N));
  const l = custom ? 0 : leftN, r = custom ? 0 : rightN;
  segL.querySelectorAll('button').forEach(b => {
    const v = +b.dataset.v;
    b.classList.toggle('on', !custom && v === leftN);
    b.disabled = v + r > N;
  });
  segR.querySelectorAll('button').forEach(b => {
    const v = +b.dataset.v;
    b.classList.toggle('on', !custom && v === rightN);
    b.disabled = v + l > N;
  });
  segS.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.v === speed));
  btnRelease.disabled = state !== 'ready';
  if (state === 'ready') statusEl.textContent = '已拉起，按「釋放」開始擺動';
  else if (speed === 0) statusEl.textContent = '暫停中';
  else statusEl.textContent = '擺動中' + (speed < 1 ? `（${speed}× 慢動作）` : '');
}

btnRelease.addEventListener('click', () => { unlockAudio(); if (state === 'ready') { state = 'running'; refreshButtons(); } });
document.getElementById('btnReset').addEventListener('click', () => { leftN = 0; rightN = 0; applyLift(); });

const eSlider = document.getElementById('eSlider'), eVal = document.getElementById('eVal');
eSlider.addEventListener('input', () => { e = +eSlider.value; eVal.textContent = e.toFixed(2); });
const dSlider = document.getElementById('dSlider'), dVal = document.getElementById('dVal');
dSlider.addEventListener('input', () => { damp = +dSlider.value * 0.8; dVal.textContent = (+dSlider.value).toFixed(2); });
document.getElementById('sndChk').addEventListener('change', ev => { soundOn = ev.target.checked; });

/* ================= 尺寸 ================= */
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = camera.aspect < 1.2 ? Math.min(70, 38 * 1.2 / camera.aspect) : 38;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);
resize();

/* ================= 主迴圈 ================= */
buildPendulums();
applyLift();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const realDt = Math.min(clock.getDelta(), 1 / 30);
  const running = state === 'running' && speed > 0;
  const dtSim = running ? realDt * speed : 0;
  if (dragIdx >= 0) applyDrag(dtSim);
  let maxV = 0;
  if (running) {
    const n = Math.ceil(dtSim / H), h = dtSim / n;
    for (let s = 0; s < n; s++) maxV = Math.max(maxV, physicsStep(h));
  }
  if (maxV > 0.015) playClick(maxV);
  for (let i = 0; i < N; i++) pendulums[i].rotation.z = theta[i];
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
