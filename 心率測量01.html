<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>心動時刻 - 光學心率監測儀</title>
    <style>
        :root {
            --bg-color: #050505;
            --primary-color: #00ffcc; /* Neon Cyan */
            --accent-color: #ff0055;  /* Neon Pink */
            --text-color: #ffffff;
            --glass-bg: rgba(20, 20, 20, 0.85);
            --panel-bg: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* 通用隱藏 */
        .hidden { display: none !important; }

        /* =========================================
           頁面 1: 測量介面 (Measurement View)
           ========================================= */
        #measurement-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* 上下分佈 */
            z-index: 10;
        }

        /* 背景畫布 (波形圖) */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 上方標題區 */
        .top-bar {
            position: relative;
            z-index: 20;
            text-align: center;
            padding-top: 40px;
        }

        .status-pill {
            display: inline-block;
            background: var(--glass-bg);
            padding: 10px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .status-pill h1 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--primary-color);
            text-shadow: 0 0 10px var(--primary-color);
            letter-spacing: 1px;
        }

        .status-pill p {
            margin: 5px 0 0 0;
            font-size: 0.85rem;
            color: #ccc;
        }

        /* 中間區域：包含鏡頭預覽與數據 */
        .measurement-content {
            position: relative;
            z-index: 20;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly; /* 均勻分佈 */
            padding: 20px 0;
        }

        /* 鏡頭預覽圓圈 (截圖1 上方箭頭) */
        .camera-preview-box {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #fff; /* 白色邊框 */
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5); /* 發光效果 */
            overflow: hidden;
            background: #000;
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 0, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
        }

        .camera-preview-box canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 即時心率顯示位置 (截圖1 下方箭頭) */
        .live-bpm-box {
            text-align: center;
        }

        .live-bpm-value {
            font-size: 5rem;
            font-weight: bold;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 20px var(--accent-color);
            font-variant-numeric: tabular-nums;
        }

        .live-bpm-label {
            font-size: 1.5rem;
            color: var(--accent-color);
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* 下方按鈕區 */
        .bottom-controls {
            position: relative;
            z-index: 20;
            padding: 0 0 40px 0;
            text-align: center;
            width: 100%;
        }

        /* =========================================
           頁面 2: 結果報告 (Result View)
           ========================================= */
        #result-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        /* 適合 Chromebook 的橫式佈局容器 */
        .result-container {
            width: 100%;
            max-width: 900px; /* 限制最大寬度 */
            margin: auto;
            display: flex;
            flex-direction: column; /* 手機預設直式 */
            gap: 20px;
        }

        /* Chromebook / 平板 橫式優化 (寬度大於 768px) */
        @media (min-width: 768px) {
            .result-container {
                flex-direction: row; /* 轉為橫向排列 */
                align-items: center;
                justify-content: center;
                padding: 40px;
                background: var(--panel-bg);
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            }

            /* 左側數據區 */
            .result-left {
                flex: 1;
                text-align: center;
                border-right: 1px solid rgba(255,255,255,0.1);
                padding-right: 20px;
            }

            /* 右側圖表區 */
            .result-right {
                flex: 2;
                padding-left: 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
        }

        .result-header h2 {
            color: var(--text-color);
            margin: 0;
            font-size: 1.2rem;
            opacity: 0.8;
        }
        
        .result-main-score {
            margin: 20px 0;
        }

        .score-value {
            font-size: 6rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 30px var(--accent-color);
        }

        .score-unit {
            font-size: 1.2rem;
            color: var(--accent-color);
            letter-spacing: 3px;
        }

        .chart-box {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* 按鈕樣式 */
        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
            width: 100%;
        }

        button {
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-color), #ff5500);
            width: 80%;
            max-width: 300px;
            font-size: 1.2rem;
        }

        .btn-info {
            background: linear-gradient(135deg, #00ccff, #0066ff);
            flex: 1;
            min-width: 120px;
        }

        .btn-secondary {
            background: #333;
            flex: 1;
            min-width: 120px;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff3333, #990000);
            width: 100%;
            margin-top: 10px;
        }

        button:active { transform: scale(0.95); }
        button:disabled { background: #444; color: #888; cursor: not-allowed; box-shadow: none;}

        /* 指引層 (保持原樣) */
        #instructions {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            box-sizing: border-box;
        }
        
        .guide-text { margin: 10px 0; font-size: 1.1rem; color: #ccc; }
        .highlight { color: var(--primary-color); font-weight: bold; }

    </style>
</head>
<body>

    <!-- 隱藏的 Video 元素 (用於擷取影像) -->
    <video id="video-feed" playsinline style="display:none;"></video>

    <!-- =========================================
         分頁 1: 測量介面
         ========================================= -->
    <div id="measurement-view">
        <!-- 背景畫布 (波形圖) -->
        <canvas id="main-canvas" id="canvas-bg"></canvas>

        <!-- 上方標題與狀態 -->
        <div class="top-bar">
            <div class="status-pill">
                <h1>心動時刻</h1>
                <p id="status-display">等待啟動...</p>
            </div>
        </div>

        <!-- 中間核心區 -->
        <div class="measurement-content">
            <!-- 鏡頭預覽 (圓圈) -->
            <div class="camera-preview-box">
                <canvas id="preview-canvas" width="80" height="80"></canvas>
            </div>

            <!-- 數據顯示 -->
            <div class="live-bpm-box">
                <div class="live-bpm-value" id="bpm-value">--</div>
                <div class="live-bpm-label">BPM</div>
            </div>
        </div>

        <!-- 下方控制按鈕 -->
        <div class="bottom-controls">
            <button id="action-btn" class="btn-primary">開啟相機權限</button>
        </div>
    </div>

    <!-- =========================================
         分頁 2: 結果報告 (Chromebook 優化版)
         ========================================= -->
    <div id="result-view" class="hidden">
        <div class="result-container">
            <!-- 左側 (手機為上方): 數據總結 -->
            <div class="result-left">
                <div class="result-header">
                    <h2>平均心率</h2>
                </div>
                <div class="result-main-score">
                    <div class="score-value" id="final-avg-bpm">72</div>
                    <div class="score-unit">BPM</div>
                </div>
                <div style="font-size: 0.9rem; color: #888;">測量時間: <span id="measure-date"></span></div>
            </div>

            <!-- 右側 (手機為下方): 圖表與操作 -->
            <div class="result-right">
                <div class="chart-box">
                    <canvas id="bpm-chart" width="400" height="200" style="width:100%; height:auto;"></canvas>
                </div>
                
                <div class="btn-group">
                    <button class="btn-info" id="share-btn">分享結果</button>
                    <button class="btn-secondary" id="download-img-btn">下載圖表</button>
                    <button class="btn-secondary" id="copy-csv-btn">複製數據</button>
                </div>
                
                <button class="btn-danger" id="restart-btn">重新測量</button>
            </div>
        </div>
    </div>

    <!-- 初始引導畫面 -->
    <div id="instructions">
        <h2 style="color: var(--primary-color); font-size: 2rem; margin-bottom: 20px;">使用說明</h2>
        <div style="max-width: 400px; text-align: left; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px;">
            <div class="guide-text">1. 允許瀏覽器使用 <span class="highlight">相機</span>。</div>
            <div class="guide-text">2. 將手指輕輕蓋住 <span class="highlight">鏡頭與閃光燈</span>。</div>
            <div class="guide-text">3. 看到畫面出現紅圈預覽，數值穩定後按開始。</div>
            <div class="guide-text">4. 保持放鬆，不要用力按壓。</div>
        </div>
        <button id="start-intro-btn" class="btn-primary" style="margin-top: 30px;">我了解了</button>
    </div>

    <script>
        // DOM 元素選取
        const video = document.getElementById('video-feed');
        const mainCanvas = document.getElementById('main-canvas'); // 背景波形
        const ctx = mainCanvas.getContext('2d');
        const previewCanvas = document.getElementById('preview-canvas'); // 小圓圈預覽
        const previewCtx = previewCanvas.getContext('2d');
        
        // 視圖容器
        const measurementView = document.getElementById('measurement-view');
        const resultView = document.getElementById('result-view');
        const instructions = document.getElementById('instructions');

        // UI 元素
        const actionBtn = document.getElementById('action-btn');
        const statusDisplay = document.getElementById('status-display');
        const bpmValueEl = document.getElementById('bpm-value');
        const finalAvgEl = document.getElementById('final-avg-bpm');
        const measureDateEl = document.getElementById('measure-date');
        const bpmChart = document.getElementById('bpm-chart');

        // 狀態機
        const STATE = {
            IDLE: 'idle',
            CAMERA_READY: 'camera_ready',
            COUNTDOWN: 'countdown',
            MEASURING: 'measuring',
            RESULT: 'result'
        };
        let currentState = STATE.IDLE;

        // 邏輯變數
        let signalBuffer = [];       
        const BUFFER_SIZE = 300;     
        let brightnessHistory = [];  
        let sessionData = []; // 存儲 {time, bpm}
        let startTime = 0;
        let displayBPM = 0;
        let lastBeatTime = 0;
        let beats = [];

        // 初始化與視窗調整
        function resize() {
            mainCanvas.width = window.innerWidth;
            mainCanvas.height = window.innerHeight;
            // 讓圖表也能自適應
            const chartContainer = bpmChart.parentElement;
            bpmChart.width = chartContainer.clientWidth;
            bpmChart.height = 200; 
        }
        window.addEventListener('resize', resize);
        resize();

        // 隱藏教學頁
        document.getElementById('start-intro-btn').addEventListener('click', () => {
            instructions.style.display = 'none';
        });

        // 按鈕監聽器
        actionBtn.addEventListener('click', handleAction);
        document.getElementById('restart-btn').addEventListener('click', resetApp);
        document.getElementById('share-btn').addEventListener('click', shareResult);
        document.getElementById('download-img-btn').addEventListener('click', downloadChartImage);
        document.getElementById('copy-csv-btn').addEventListener('click', copyCSVData);

        // 主邏輯控制
        async function handleAction() {
            if (currentState === STATE.IDLE) {
                // 1. 啟動相機
                try {
                    statusDisplay.textContent = "正在啟動相機...";
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: false,
                        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } }
                    });
                    video.srcObject = stream;
                    await video.play();

                    // 嘗試開閃光燈
                    const track = stream.getVideoTracks()[0];
                    try { await track.applyConstraints({ advanced: [{ torch: true }] }); } catch(e) {}

                    currentState = STATE.CAMERA_READY;
                    statusDisplay.textContent = "調整手指位置，穩定後按開始";
                    actionBtn.textContent = "開始測量";
                    
                    startAnimationLoop();

                } catch (err) {
                    alert("相機開啟失敗，請檢查權限");
                    statusDisplay.textContent = "錯誤：無相機權限";
                }

            } else if (currentState === STATE.CAMERA_READY) {
                // 2. 開始倒數
                startCountdown();
            } else if (currentState === STATE.MEASURING) {
                // 3. 結束測量
                finishMeasurement();
            }
        }

        function startCountdown() {
            currentState = STATE.COUNTDOWN;
            actionBtn.disabled = true;
            let count = 3;
            // 使用 CSS 動畫或簡單文字倒數
            actionBtn.textContent = `準備... ${count}`;
            
            const timer = setInterval(() => {
                count--;
                if(count > 0) {
                     actionBtn.textContent = `準備... ${count}`;
                } else {
                    clearInterval(timer);
                    startMeasurement();
                }
            }, 1000);
        }

        function startMeasurement() {
            currentState = STATE.MEASURING;
            startTime = performance.now();
            sessionData = []; // 清空數據
            displayBPM = 0;
            
            statusDisplay.textContent = "測量中... 請保持靜止";
            actionBtn.textContent = "結束測量";
            actionBtn.classList.replace('btn-primary', 'btn-danger'); // 換紅色按鈕
            actionBtn.disabled = false;
        }

        function finishMeasurement() {
            currentState = STATE.RESULT;
            
            // 計算平均
            const validReadings = sessionData.map(d => d.bpm).filter(r => r > 40 && r < 200);
            const avg = validReadings.length > 3 
                ? Math.round(validReadings.reduce((a, b) => a + b, 0) / validReadings.length) 
                : "--";
            
            finalAvgEl.textContent = avg;
            measureDateEl.textContent = new Date().toLocaleString();

            // 切換視圖 (SPA 核心概念)
            measurementView.classList.add('hidden');
            resultView.classList.remove('hidden');

            // 繪製結果圖表
            setTimeout(() => drawBPMChart(sessionData), 100); // 稍微延遲確保佈局完成
        }

        function resetApp() {
            currentState = STATE.CAMERA_READY;
            
            // UI 重置
            resultView.classList.add('hidden');
            measurementView.classList.remove('hidden');
            
            actionBtn.textContent = "開始測量";
            actionBtn.classList.replace('btn-danger', 'btn-primary');
            statusDisplay.textContent = "準備就緒，請按開始";
            bpmValueEl.textContent = "--";
            
            // 繼續動畫迴圈 (其實它一直在跑，但現在狀態變回來了)
        }

        // 影像處理迴圈
        function startAnimationLoop() {
            function loop(timestamp) {
                if (currentState !== STATE.RESULT) {
                    processFrame(timestamp);
                }
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        function processFrame(timestamp) {
            // 1. 繪製預覽 (圓圈)
            const sx = Math.floor(video.videoWidth / 2 - 25);
            const sy = Math.floor(video.videoHeight / 2 - 25);
            previewCtx.drawImage(video, sx, sy, 50, 50, 0, 0, 80, 80);

            // 2. 獲取亮度數據
            const frameData = previewCtx.getImageData(0, 0, 80, 80);
            const data = frameData.data;
            let totalRed = 0;
            for (let i = 0; i < data.length; i += 4) totalRed += data[i];
            let avgRed = totalRed / (data.length / 4);

            // 3. 訊號處理 (濾波)
            brightnessHistory.push(avgRed);
            if (brightnessHistory.length > 30) brightnessHistory.shift();
            const localAvg = brightnessHistory.reduce((a, b) => a + b, 0) / brightnessHistory.length;
            let signal = (localAvg - avgRed) * 8; // 放大訊號

            if (signalBuffer.length > BUFFER_SIZE) signalBuffer.shift();
            signalBuffer.push(signal);

            // 4. 繪製背景波形
            drawWaveform(signalBuffer);

            // 5. 心率計算 (簡單峰值檢測)
            if (currentState === STATE.CAMERA_READY || currentState === STATE.MEASURING) {
                detectHeartbeat(signal, timestamp);
            }
        }

        function detectHeartbeat(signal, time) {
            // 簡單的動態閾值演算法
            if (signal > 3 && (time - lastBeatTime > 400)) { // 至少間隔 400ms (即 max 150 BPM)
                let delta = time - lastBeatTime;
                lastBeatTime = time;
                
                let instantBPM = 60000 / delta;
                if (instantBPM > 40 && instantBPM < 200) {
                    // 平滑化
                    displayBPM = displayBPM === 0 ? instantBPM : displayBPM * 0.7 + instantBPM * 0.3;
                    bpmValueEl.textContent = Math.round(displayBPM);
                    
                    // 只有在 Measuring 狀態才記錄數據
                    if (currentState === STATE.MEASURING) {
                         sessionData.push({ 
                             time: (time - startTime)/1000, 
                             bpm: Math.round(instantBPM) 
                         });
                    }
                    
                    // 心跳動畫效果
                    bpmValueEl.style.transform = "scale(1.2)";
                    setTimeout(() => bpmValueEl.style.transform = "scale(1)", 100);
                }
            }
        }

        function drawWaveform(buffer) {
            ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
            // 畫個半透明黑色遮罩讓波形不要太搶眼
            ctx.fillStyle = 'rgba(5,5,5,0.8)'; 
            // 這裡不fillRect全屏，保留背景色，只在需要時覆蓋
            
            if (buffer.length < 2) return;

            const centerY = mainCanvas.height / 2;
            const stepX = mainCanvas.width / BUFFER_SIZE;

            ctx.beginPath();
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.3)'; // 淡淡的青色
            
            for (let i = 0; i < buffer.length; i++) {
                const x = i * stepX;
                const y = centerY - (buffer[i] * 5);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        // 繪製統計圖表 (使用 Canvas API 畫折線圖)
        function drawBPMChart(data) {
            const ctx = bpmChart.getContext('2d');
            const w = bpmChart.width;
            const h = bpmChart.height;
            ctx.clearRect(0, 0, w, h);

            if (data.length < 2) {
                ctx.fillStyle = "#fff";
                ctx.fillText("數據不足", w/2, h/2);
                return;
            }

            // 找出最大最小值以縮放
            let maxBPM = Math.max(...data.map(d=>d.bpm)) + 10;
            let minBPM = Math.min(...data.map(d=>d.bpm)) - 10;
            let totalTime = data[data.length-1].time;

            // 畫座標軸
            ctx.strokeStyle = "#444";
            ctx.beginPath();
            ctx.moveTo(30, 10); ctx.lineTo(30, h-20); ctx.lineTo(w-10, h-20);
            ctx.stroke();

            // 畫折線
            ctx.beginPath();
            ctx.strokeStyle = "#ff0055";
            ctx.lineWidth = 3;
            
            data.forEach((d, i) => {
                let x = 30 + (d.time / totalTime) * (w - 40);
                let y = (h - 20) - ((d.bpm - minBPM) / (maxBPM - minBPM)) * (h - 30);
                if (i===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.stroke();
            
            // 標題
            ctx.fillStyle = "#fff";
            ctx.fillText("BPM 趨勢圖", w/2 - 30, 15);
        }

        // 功能：下載圖片
        function downloadChartImage() {
            // 簡單實作：直接下載圖表的 Canvas
            const link = document.createElement('a');
            link.download = 'chart.png';
            link.href = bpmChart.toDataURL();
            link.click();
        }
        
        // 功能：複製數據
        function copyCSVData() {
            let csv = "Time,BPM\n" + sessionData.map(d => `${d.time.toFixed(1)},${d.bpm}`).join("\n");
            navigator.clipboard.writeText(csv).then(() => alert("數據已複製"));
        }
        
        // 功能：分享 (Web Share API)
        function shareResult() {
            if (navigator.share) {
                bpmChart.toBlob(blob => {
                    const file = new File([blob], "result.png", {type: "image/png"});
                    navigator.share({
                        title: '心動時刻結果',
                        text: `我的平均心率是 ${finalAvgEl.textContent} BPM`,
                        files: [file]
                    }).catch(console.error);
                });
            } else {
                alert("此裝置不支援原生分享，請使用下載圖片功能。");
            }
        }
    </script>
</body>
</html>
