<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一維多次彈性碰撞模擬</title>
    <style>
        :root {
            --bg-color: #f4ebe1; /* 參考截圖的淺米色背景 */
            --panel-bg: rgba(255, 255, 255, 0.95); /* 亮色不透明面板 */
            --text-color: #333333; /* 深色文字 */
            --accent-color: #d15a5a; /* 點綴色 (深紅) */
            --btn-play-bg: #00B050; /* 開始發射按鍵 綠色 */
            --btn-reset-bg: #FFC000; /* 重置按鍵 黃橘色 */
            --box-color: #c69c72; /* 木塊顏色 */
            --ground-color: #b0b4b8; /* 地面淺灰色 */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 強制隱藏捲軸，確保畫面不被推動 */
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 雙面板容器 */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 20px;
            z-index: 10;
            align-items: flex-start;
            max-width: 95vw;
            flex-wrap: wrap; 
        }

        /* 獨立面板共用樣式 */
        .panel {
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        #controls-panel {
            width: 320px;
        }

        #stats-panel {
            width: 260px;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0 0 20px 0;
            color: #0000FF; /* 標題顏色修改為藍色 */
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #555;
        }

        .highlight {
            font-weight: bold;
            color: var(--accent-color);
        }

        /* 質量數值的放大樣式 */
        .mass-val {
            font-size: 1.5em;
        }

        /* 速度單位 v0 的樣式 */
        .v-symbol {
            font-size: 2em;
            font-style: italic; 
            font-family: 'Times New Roman', Times, serif;
        }

        .v-sub {
            font-size: 0.5em;
        }

        /* 自訂滑桿樣式 */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 5px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* 停用滑桿時的樣式 (防呆視覺回饋) */
        input[type=range]:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        input[type=range]:disabled::-webkit-slider-thumb {
            cursor: not-allowed;
            background: #999;
        }
        input[type=range]:disabled::-webkit-slider-thumb:hover {
            transform: none;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.2s ease;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #btn-play {
            background-color: var(--btn-play-bg);
        }

        #btn-play:hover {
            background-color: #009342;
            transform: translateY(-2px);
        }

        #btn-reset {
            background-color: var(--btn-reset-bg);
            color: #333; 
        }

        #btn-reset:hover {
            background-color: #e6ad00;
            transform: translateY(-2px);
        }

        /* 統計面板排版 */
        .stat-main {
            font-size: 1.6rem;
            color: #555;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        .stat-main span {
            font-size: 2.8rem;
            color: var(--accent-color);
            margin-left: 10px;
            vertical-align: middle;
        }

        .stat-details {
            font-size: 1.3rem;
            color: #777;
            line-height: 1.8;
            font-family: sans-serif;
        }

        /* ==================================================
           僅針對手機直向的優化佈局 (高度極致壓縮 0.6 倍)
           恢復為浮動覆蓋 (absolute)，確保不推擠 Canvas
           ================================================== */
        @media (max-width: 600px) {
            #ui-container {
                position: absolute;
                top: 5px;
                left: 5px;
                right: 5px;
                gap: 5px;
                pointer-events: none; /* 讓未被面板覆蓋的空白區域可以將事件穿透至下方畫布 */
            }
            .panel {
                pointer-events: auto; /* 面板本身保持可點擊 */
                padding: 8px 12px; /* 大幅縮小手機版內距 */
                border-radius: 6px;
            }
            #controls-panel, #stats-panel {
                width: 100%;
                box-sizing: border-box;
            }
            h1 {
                font-size: 1.05rem;
                margin: 0 0 6px 0;
            }
            .control-group {
                margin-bottom: 6px;
            }
            .control-group label {
                font-size: 0.8rem;
                margin-bottom: 2px;
            }
            .mass-val {
                font-size: 1.1em;
            }
            input[type=range] {
                height: 4px;
            }
            input[type=range]::-webkit-slider-thumb {
                width: 14px;
                height: 14px; 
            }
            .button-group {
                margin-top: 8px;
                gap: 8px;
            }
            button {
                padding: 6px; 
                font-size: 0.9rem;
            }
            .stat-main {
                font-size: 1.1rem;
                margin-bottom: 6px;
                padding-bottom: 6px;
            }
            .stat-main span {
                font-size: 1.6rem; 
            }
            .stat-details {
                font-size: 0.8rem;
                line-height: 1.2;
                display: flex;
                justify-content: space-between; 
            }
            .stat-details > div {
                white-space: nowrap; 
            }
            .v-symbol {
                font-size: 1.2em;
            }
        }

        /* ==================================================
           手機橫向 (Landscape) 專屬佈局
           將兩個面板「左右並排」，釋放下方空間給動畫
           ================================================== */
        @media (max-height: 450px) and (orientation: landscape) {
            #ui-container {
                flex-wrap: nowrap; /* 強制不換行，並排顯示 */
                gap: 10px;
                top: 5px;
                left: 5px;
                right: 5px;
            }
            .panel {
                padding: 6px 10px;
            }
            #controls-panel {
                width: 55%; /* 左邊面板佔 55% */
            }
            #stats-panel {
                width: 45%; /* 右邊面板佔 45% */
            }
            /* 進一步縮減間距避免遮擋 */
            h1 { font-size: 0.95rem; margin: 0 0 4px 0; }
            .control-group { margin-bottom: 4px; }
            .button-group { margin-top: 4px; }
            button { padding: 4px; font-size: 0.85rem; }
            .stat-main { font-size: 1rem; margin-bottom: 4px; padding-bottom: 4px; }
            .stat-main span { font-size: 1.4rem; }
            .stat-details { flex-direction: column; gap: 2px; } /* 空間足夠時可直向排列數據 */
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <!-- 左側：控制面板 -->
        <div id="controls-panel" class="panel">
            <h1>一維多次彈性碰撞分析</h1>
            
            <div class="control-group">
                <label><span>乙質量 (m):</span> <span id="val-m2" class="highlight mass-val">1.0 m</span></label>
                <input type="range" id="slider-m2" min="0.5" max="2.0" step="0.1" value="1.0">
            </div>
            
            <div class="control-group">
                <label><span>丙質量 (m):</span> <span id="val-m3" class="highlight mass-val">2.0 m</span></label>
                <input type="range" id="slider-m3" min="0.5" max="3.0" step="0.1" value="2.0">
            </div>

            <div class="control-group">
                <label><span>畫面縮放:</span> <span id="val-zoom" class="highlight">1.00x</span></label>
                <input type="range" id="slider-zoom" min="0.10" max="1.00" step="0.01" value="1.00">
            </div>

            <div class="button-group">
                <button id="btn-play">開始發射</button>
                <button id="btn-reset">重置</button>
            </div>
        </div>

        <!-- 右側：統計面板 -->
        <div id="stats-panel" class="panel">
            <div class="stat-main">
                總碰撞次數:<span id="stat-collisions">0</span>
            </div>
            <div class="stat-details">
                <div>甲速度: <span id="v-jia">1.00</span> <span class="v-symbol">v</span><span class="v-sub">0</span></div>
                <div>乙速度: <span id="v-yi">0.00</span> <span class="v-symbol">v</span><span class="v-sub">0</span></div>
                <div>丙速度: <span id="v-bing">0.00</span> <span class="v-symbol">v</span><span class="v-sub">0</span></div>
            </div>
        </div>
    </div>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const sliderM2 = document.getElementById('slider-m2');
        const sliderM3 = document.getElementById('slider-m3');
        const sliderZoom = document.getElementById('slider-zoom');
        const valM2 = document.getElementById('val-m2');
        const valM3 = document.getElementById('val-m3');
        const valZoom = document.getElementById('val-zoom');
        
        const btnPlay = document.getElementById('btn-play');
        const btnReset = document.getElementById('btn-reset');
        
        const statCollisions = document.getElementById('stat-collisions');
        const vJia = document.getElementById('v-jia');
        const vYi = document.getElementById('v-yi');
        const vBing = document.getElementById('v-bing');

        // Simulation State
        let isPlaying = false; 
        let hasStarted = false; 
        let animationId;
        let collisionCount = 0;
        
        // Physics & Render Constants
        let globalZoom = 1.0;
        let basePpx = 100; // 基礎縮放下的每單位像素
        const PHYS_W = 1.25; // 物體的「物理寬度」單位
        
        const GROUND_Y_OFFSET = 30; // 確保物體靠近底部邊緣
        const INITIAL_V = 3; 

        class Block {
            constructor(name, m, initialX, initialV) {
                this.name = name;
                this.m = m;
                this.x = initialX; // 物理位置
                this.v = initialV; // 物理速度
                this.color = '#c69c72'; 
                this.flashTimer = 0;
            }

            draw(ctx, groundY, currentPpx) {
                if (this.flashTimer > 0) this.flashTimer--;
                let currentColor = this.flashTimer > 0 ? '#e6c8a8' : this.color;

                const pixelSize = PHYS_W * currentPpx; 
                // pixelX 現在只計算自身相對於物理原點的距離，偏移量由 Canvas translate 處理
                const pixelX = this.x * currentPpx; 
                const pixelY = groundY - pixelSize;
                
                // Draw Box
                ctx.save();
                ctx.fillStyle = currentColor;
                ctx.globalAlpha = 1.0;
                ctx.fillRect(pixelX, pixelY, pixelSize, pixelSize);
                
                // Border
                ctx.strokeStyle = '#a67d53';
                ctx.lineWidth = 1;
                ctx.strokeRect(pixelX, pixelY, pixelSize, pixelSize);
                
                // Label 根據縮放調整字體大小
                ctx.fillStyle = '#333';
                const fontSize = 48 * globalZoom; 
                ctx.font = `${fontSize}px "PMingLiU", "MingLiU", serif`; 
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.name, pixelX + pixelSize / 2, pixelY + pixelSize / 2);
                ctx.restore();

                // Draw Velocity Arrow 根據縮放調整箭頭大小
                if (Math.abs(this.v) > 0.01) {
                    this.drawArrow(ctx, pixelX + pixelSize/2, pixelY - 20 * globalZoom, this.v * 30 * globalZoom, '#f07931');
                }
            }

            drawArrow(ctx, startX, startY, length, color) {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(startX + length, startY);
                ctx.strokeStyle = color;
                ctx.lineWidth = 3 * globalZoom;
                ctx.stroke();

                // Arrow head
                const angle = length > 0 ? 0 : Math.PI;
                const headSize = 10 * globalZoom;
                ctx.beginPath();
                ctx.moveTo(startX + length, startY);
                ctx.lineTo(startX + length - Math.cos(angle - Math.PI/6)*headSize, startY - Math.sin(angle - Math.PI/6)*headSize);
                ctx.lineTo(startX + length - Math.cos(angle + Math.PI/6)*headSize, startY - Math.sin(angle + Math.PI/6)*headSize);
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
                ctx.restore();
            }
        }

        let blocks = [];
        let lastTime = 0;

        function initSimulation() {
            const m2 = parseFloat(sliderM2.value);
            const m3 = parseFloat(sliderM3.value);
            
            collisionCount = 0;
            statCollisions.innerText = collisionCount;

            blocks = [
                new Block('甲', 1.0, 1.0, INITIAL_V),
                new Block('乙', m2, 4.0, 0),
                new Block('丙', m3, 7.0, 0)
            ];
            
            updateHUD();
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight; 
            basePpx = Math.max(50, canvas.width / 15);
        }

        function collide(b1, b2) {
            const v1 = b1.v;
            const v2 = b2.v;
            const m1 = b1.m;
            const m2 = b2.m;

            b1.v = ((m1 - m2) * v1 + 2 * m2 * v2) / (m1 + m2);
            b2.v = ((m2 - m1) * v2 + 2 * m1 * v1) / (m1 + m2);
            
            collisionCount++;
            statCollisions.innerText = collisionCount;
            
            b1.flashTimer = 10;
            b2.flashTimer = 10;
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function updatePhysics(dt) {
            if (dt > 0.1) dt = 0.1;

            // 1. 移動位置
            blocks.forEach(b => b.x += b.v * dt);

            // 2. 碰撞偵測
            // 甲 vs 乙
            let right0 = blocks[0].x + PHYS_W;
            let left1 = blocks[1].x;
            if (right0 >= left1 && blocks[0].v > blocks[1].v) {
                blocks[0].x = left1 - PHYS_W; 
                collide(blocks[0], blocks[1]);
            }

            // 乙 vs 丙
            let right1 = blocks[1].x + PHYS_W;
            let left2 = blocks[2].x;
            if (right1 >= left2 && blocks[1].v > blocks[2].v) {
                blocks[1].x = left2 - PHYS_W;
                collide(blocks[1], blocks[2]);
            }
            
            // 防呆補丁：乙往回彈撞到甲
            right0 = blocks[0].x + PHYS_W;
            left1 = blocks[1].x;
             if (right0 >= left1 && blocks[0].v > blocks[1].v) {
                 blocks[0].x = left1 - PHYS_W;
                collide(blocks[0], blocks[1]);
            }
        }

        // 修改格線繪製邏輯，使其支援視窗偏移 (Translation) 運算
        function drawGrid(groundY, currentPpx, offsetX) {
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.05)'; 
            ctx.lineWidth = 1;
            ctx.beginPath();
            
            // 由於畫布偏移了 offsetX，我們需要回推螢幕的左右邊界所對應的物理座標
            // 以確保整個畫面都有畫到格線
            const startPhysX = Math.floor(-offsetX / currentPpx);
            const endPhysX = Math.ceil((canvas.width - offsetX) / currentPpx);
            
            for (let i = startPhysX; i <= endPhysX; i++) {
                const px = i * currentPpx;
                ctx.moveTo(px, 0);
                ctx.lineTo(px, groundY);
            }
            ctx.stroke();
        }

        function updateHUD() {
            vJia.innerText = (blocks[0].v / INITIAL_V).toFixed(2);
            vYi.innerText = (blocks[1].v / INITIAL_V).toFixed(2);
            vBing.innerText = (blocks[2].v / INITIAL_V).toFixed(2);
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            const groundY = canvas.height - GROUND_Y_OFFSET;
            const currentPpx = basePpx * globalZoom; 
            
            // ★ 計算偏移量：根據裝置決定錨點
            // 判斷是否為手機版 (根據 CSS 的斷點：寬度小於 600，或是高度小於 450 的橫向模式)
            const isMobile = window.innerWidth <= 600 || window.innerHeight <= 450;
            let offsetX = 0;

            if (isMobile) {
                // 手機版：錨點設定為「甲(1.0)與乙(4.0)的中點」，並固定在畫面正中央 (canvas.width / 2)
                const anchorXMobile = ((1.0 + 4.0) / 2) + (PHYS_W / 2); 
                offsetX = (canvas.width / 2) - (anchorXMobile * currentPpx);
            } else {
                // 桌機版：錨點設定為「丙物體的中心位置」(初始X: 7.0)，保持在其初始像素位置不動
                const anchorXDesktop = 7.0 + (PHYS_W / 2);
                offsetX = anchorXDesktop * (basePpx - currentPpx);
            }

            if (isPlaying) {
                updatePhysics(dt);
                updateHUD();
            }

            // 繪製背景 (不動)
            ctx.fillStyle = '#f4ebe1'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 繪製地板 (不動，橫跨整個螢幕)
            ctx.fillStyle = '#b0b4b8';
            ctx.fillRect(0, groundY, canvas.width, GROUND_Y_OFFSET);
            ctx.strokeStyle = '#9da1a5';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();

            // 啟動 Canvas 平移
            ctx.save();
            ctx.translate(offsetX, 0); // 將畫布座標系向右平移

            // 繪製動態物理物件 (皆相對於原物理座標)
            drawGrid(groundY, currentPpx, offsetX);
            blocks.forEach(b => b.draw(ctx, groundY, currentPpx));

            ctx.restore(); // 結束平移

            animationId = requestAnimationFrame(gameLoop);
        }

        // --- Event Listeners ---
        window.addEventListener('resize', resizeCanvas);

        sliderM2.addEventListener('input', (e) => {
            valM2.innerText = parseFloat(e.target.value).toFixed(1) + ' m';
        });

        sliderM3.addEventListener('input', (e) => {
            valM3.innerText = parseFloat(e.target.value).toFixed(1) + ' m';
        });

        sliderZoom.addEventListener('input', (e) => {
            globalZoom = parseFloat(e.target.value);
            valZoom.innerText = globalZoom.toFixed(2) + 'x';
        });

        btnPlay.addEventListener('click', () => {
            if (!hasStarted) {
                hasStarted = true;
                sliderM2.disabled = true;
                sliderM3.disabled = true;
                initSimulation(); 
            }
            
            isPlaying = !isPlaying;
            btnPlay.innerText = isPlaying ? "暫停" : "開始發射";
            btnPlay.style.backgroundColor = isPlaying ? "#e6ad00" : "var(--btn-play-bg)"; 
            lastTime = performance.now(); 
        });

        btnReset.addEventListener('click', () => {
            hasStarted = false;
            sliderM2.disabled = false;
            sliderM3.disabled = false;
            
            initSimulation();
            isPlaying = false; 
            btnPlay.innerText = "開始發射";
            btnPlay.style.backgroundColor = "var(--btn-play-bg)";
            lastTime = performance.now();
        });

        // 啟動初始化
        resizeCanvas();
        initSimulation();
        requestAnimationFrame(gameLoop);

    </script>
</body>
</html>
