<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIO-SCANNER Pro | 智植辨識</title>
    
    <!-- 1. 引入 Tailwind CSS (負責漂亮的樣式) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. 引入 React 核心 (負責程式邏輯) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 3. 引入 Babel (負責翻譯程式碼給瀏覽器看) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #000; overflow-x: hidden; font-family: "Microsoft JhengHei", sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .animate-scan { animation: scan 2.5s ease-in-out infinite; }
        
        /* 避免 iOS 上點擊反白 */
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- 這是主要程式區域，必須包在 type="text/babel" 裡面 -->
    <script type="text/babel" data-type="module">
        // --- 匯入 Firebase ---
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, onSnapshot, query, limit } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // ==========================================
        //  ⚠️ 設定區 (請在此填入您的金鑰)
        // ==========================================
        
        // 1. 請填入您的 Google Gemini API Key
        const apiKey = "AIzaSyD6-EzUozf4f4kn3FpnJIVWU5r2GLrNPNA"; 

        // 2. 請填入您的 Firebase Config (從 Firebase Console 複製)
        const firebaseConfig = {
            apiKey: "您的_FIREBASE_API_KEY",
            authDomain: "您的_PROJECT_ID.firebaseapp.com",
            projectId: "您的_PROJECT_ID",
            storageBucket: "您的_PROJECT_ID.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };

        // ==========================================

        // 初始化 Firebase
        let app, auth, db;
        try {
            // 只有當使用者真的填入 Key 之後才初始化，避免報錯
            if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "您的_FIREBASE_API_KEY") {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            }
        } catch (e) {
            console.error("Firebase 初始化失敗，請檢查 Config", e);
        }

        const modelName = "gemini-1.5-flash";
        
        const App = () => {
            const [user, setUser] = React.useState(null);
            const [image, setImage] = React.useState(null);
            const [base64, setBase64] = React.useState(null);
            const [loading, setLoading] = React.useState(false);
            const [results, setResults] = React.useState(null);
            const [history, setHistory] = React.useState([]);
            const [error, setError] = React.useState(null);
            const [isCameraActive, setIsCameraActive] = React.useState(false);
            
            const canvasRef = React.useRef(null);
            const videoRef = React.useRef(null);

            // 1. 身份驗證與歷史紀錄
            React.useEffect(() => {
                if (!auth) return;
                
                const unsubscribeAuth = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) {
                        const historyRef = collection(db, 'users', currentUser.uid, 'scan_history');
                        const unsubscribeData = onSnapshot(historyRef, (snapshot) => {
                            const docs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            docs.sort((a, b) => b.timestamp - a.timestamp);
                            setHistory(docs);
                        });
                        return () => unsubscribeData();
                    } else {
                        signInAnonymously(auth).catch(e => console.error("登入失敗", e));
                    }
                });
                return () => unsubscribeAuth();
            }, []);

            // 2. 物理背景特效 (Canvas)
            React.useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationId;
                
                const particles = Array.from({ length: 30 }, () => ({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    size: Math.random() * 2
                }));

                const animate = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; 
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.fillStyle = 'rgba(34, 197, 94, 0.3)';
                    particles.forEach(p => {
                        p.x += p.vx; p.y += p.vy;
                        if (p.x < 0) p.x = canvas.width;
                        if (p.x > canvas.width) p.x = 0;
                        if (p.y < 0) p.y = canvas.height;
                        if (p.y > canvas.height) p.y = 0;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    animationId = requestAnimationFrame(animate);
                };
                animate();
                return () => cancelAnimationFrame(animationId);
            }, []);

            // 功能函式
            const handleFile = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onloadend = () => {
                    setBase64(reader.result.split(',')[1]);
                    setImage(reader.result);
                    setResults(null);
                };
                reader.readAsDataURL(file);
            };

            const startCamera = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                        setIsCameraActive(true);
                    }
                } catch (e) { setError("無法存取相機，請確認權限或使用 HTTPS 連線"); }
            };

            const takePhoto = () => {
                const video = videoRef.current;
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const dataUrl = canvas.toDataURL('image/png');
                setBase64(dataUrl.split(',')[1]);
                setImage(dataUrl);
                setIsCameraActive(false);
                video.srcObject.getTracks().forEach(t => t.stop());
            };

            const reset = () => {
                setImage(null); setBase64(null); setResults(null); setError(null);
                setIsCameraActive(false);
            };

            const identify = async () => {
                if (!base64) return;
                if (!apiKey || apiKey.includes("請在此填入")) {
                    setError("請先在程式碼中設定 API Key 才能使用喔！");
                    return;
                }
                setLoading(true);
                setError(null);
                
                const prompt = `分析這張生物影像。請找出前三名最可能的物種，並按可能性排列。回傳 JSON:
                { "candidates": [ { "name": "中文名", "aliases": ["別名"], "scientificName": "學名", "probability": "90%", "desc": "描述", "physicsFact": "物理特性", "care": "照顧建議" } ] }`;

                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: "image/png", data: base64 } }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    
                    if (!res.ok) throw new Error("API 請求失敗");
                    const data = await res.json();
                    const jsonStr = data.candidates[0].content.parts[0].text;
                    const parsed = JSON.parse(jsonStr);
                    setResults(parsed.candidates);

                    if (user && db) {
                        await addDoc(collection(db, 'users', user.uid, 'scan_history'), {
                            name: parsed.candidates[0].name,
                            scientificName: parsed.candidates[0].scientificName,
                            timestamp: Date.now()
                        });
                    }
                } catch (e) {
                    setError("辨識失敗：" + e.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen text-white relative flex flex-col font-sans">
                    <canvas ref={canvasRef} className="absolute inset-0 z-0 opacity-40 pointer-events-none" />
                    
                    {/* Header */}
                    <header className="relative z-10 p-6 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent">
                        <div>
                            <h1 className="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">BIO-SCANNER</h1>
                            <p className="text-xs text-slate-500 tracking-widest">v2.5 WEB EDITION</p>
                        </div>
                        <div className="flex gap-2">
                             <a href="tools.html" className="px-4 py-2 bg-slate-800 rounded-full text-xs font-bold hover:bg-slate-700 transition">← 回列表</a>
                            <button onClick={reset} className="px-4 py-2 border border-red-500/50 text-red-400 rounded-full text-xs font-bold hover:bg-red-500 hover:text-white transition">↺ 重置</button>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="relative z-10 flex-1 max-w-6xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-2 gap-8 overflow-y-auto pb-20 custom-scrollbar">
                        
                        {/* Left: Input */}
                        <div className="space-y-4">
                            <div className="aspect-square relative rounded-3xl border-2 border-slate-800 bg-slate-900/50 overflow-hidden shadow-2xl flex flex-col items-center justify-center">
                                {isCameraActive ? (
                                    <div className="w-full h-full relative">
                                        <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover" />
                                        <button onClick={takePhoto} className="absolute bottom-6 left-1/2 -translate-x-1/2 w-16 h-16 bg-white rounded-full border-4 border-slate-300 shadow-lg"></button>
                                    </div>
                                ) : image ? (
                                    <img src={image} className="w-full h-full object-cover" />
                                ) : (
                                    <div className="text-center space-y-4 p-6">
                                        <div className="text-6xl opacity-20">🧬</div>
                                        <p className="text-slate-500 text-sm">請上傳或拍攝生物影像</p>
                                        <div className="flex gap-2 justify-center">
                                            <label className="bg-emerald-600 px-6 py-2 rounded-xl font-bold cursor-pointer hover:bg-emerald-500 transition">
                                                上傳
                                                <input type="file" className="hidden" onChange={handleFile} accept="image/*" />
                                            </label>
                                            <button onClick={startCamera} className="bg-slate-700 px-6 py-2 rounded-xl font-bold hover:bg-slate-600 transition">相機</button>
                                        </div>
                                    </div>
                                )}
                                {loading && (
                                    <div className="absolute inset-0 bg-black/80 flex flex-col items-center justify-center z-20">
                                        <div className="w-full h-1 bg-emerald-500 absolute top-0 animate-scan"></div>
                                        <span className="text-emerald-400 font-mono animate-pulse">ANALYZING...</span>
                                    </div>
                                )}
                            </div>
                            
                            {image && !loading && (
                                <button onClick={identify} className="w-full py-4 bg-gradient-to-r from-emerald-600 to-cyan-600 rounded-xl font-black text-lg shadow-lg hover:brightness-110 transition transform active:scale-95">
                                    START IDENTIFICATION
                                </button>
                            )}
                            {error && <div className="p-4 bg-red-500/10 border border-red-500/50 text-red-400 rounded-xl text-center text-sm">{error}</div>}
                        </div>

                        {/* Right: Results & History */}
                        <div className="space-y-6">
                            {results ? (
                                <div className="space-y-4 animate-[fadeIn_0.5s_ease-out]">
                                    <h3 className="text-xs font-bold text-slate-500 tracking-widest uppercase">辨識結果</h3>
                                    {results.map((res, idx) => (
                                        <div key={idx} className={`p-6 rounded-3xl border ${idx===0 ? 'bg-emerald-900/10 border-emerald-500/50' : 'bg-slate-900/30 border-slate-800'}`}>
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <h2 className="text-2xl font-bold">{res.name}</h2>
                                                    <p className="text-slate-400 italic text-sm">{res.scientificName}</p>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-2xl font-black text-emerald-400 font-mono">{res.probability}</span>
                                                    <div className="text-[10px] text-slate-500 uppercase">信心指數</div>
                                                </div>
                                            </div>
                                            <div className="mt-2 flex gap-2 flex-wrap">
                                                {res.aliases?.map(a => <span key={a} className="text-[10px] px-2 py-1 bg-white/5 rounded text-slate-400">#{a}</span>)}
                                            </div>
                                            {idx === 0 && (
                                                <div className="mt-4 space-y-3 text-sm text-slate-300">
                                                    <p>{res.desc}</p>
                                                    <div className="p-3 bg-cyan-500/10 border-l-2 border-cyan-500 text-cyan-200 text-xs">
                                                        <strong className="block mb-1 text-cyan-400">⚡ 物理特性：</strong>
                                                        {res.physicsFact}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="h-full min-h-[200px] border-2 border-dashed border-slate-800 rounded-3xl flex items-center justify-center text-slate-600">
                                    等待分析結果...
                                </div>
                            )}

                            {/* 歷史紀錄區塊 */}
                            <div className="pt-6 border-t border-slate-800">
                                <h3 className="text-xs font-bold text-slate-500 tracking-widest uppercase mb-3">歷史紀錄 ({history.length})</h3>
                                <div className="flex gap-2 overflow-x-auto pb-2 custom-scrollbar">
                                    {history.map(h => (
                                        <div key={h.id} className="flex-shrink-0 w-32 p-3 bg-slate-900 rounded-xl border border-slate-800 text-xs">
                                            <div className="font-bold truncate">{h.name}</div>
                                            <div className="text-slate-500 scale-90 origin-left">{new Date(h.timestamp).toLocaleDateString()}</div>
                                        </div>
                                    ))}
                                    {history.length === 0 && <span className="text-slate-700 text-sm italic">尚無紀錄</span>}
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
