<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>207班 探究與實作課簽到</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
            z-index: 10;
            position: relative;
        }
        h2 { color: #0056b3; margin-bottom: 5px; }
        .subtitle { color: #666; font-size: 0.9em; margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: bold;}
        
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #fff;
            cursor: pointer;
        }
        select:focus { outline: none; border-color: #0056b3; }
        
        button {
            width: 100%;
            padding: 14px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }

        #error-msg, #success-msg {
            display: none;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            line-height: 1.5;
        }
        #error-msg { color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; }
        #success-msg { color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; }
        
        .debug-banner {
            background: #ffc107; color: #856404; padding: 8px; font-size: 0.85rem;
            margin-bottom: 15px; border-radius: 5px; border: 1px solid #ffeeba; display: none; 
            font-weight: bold;
        }

        #anim-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }
        .teacher-link { font-size: 0.8em; color: #999; text-decoration: underline; cursor: pointer; display: inline-block; margin-top: 15px;}

        /* 狀態顯示區塊樣式 */
        .status-info {
            margin-top: 15px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 6px;
            font-size: 0.95rem;
            color: #555;
        }
        .status-tag {
            font-weight: bold;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <canvas id="anim-canvas"></canvas>

    <div class="container" id="main-box">
        <h2>⚛️ 探究與實作課簽到</h2>
        <div class="subtitle">班級：207 班</div>
        
        <div id="debug-banner" class="debug-banner">👨‍🏫 教師權限已啟用 (無設備限制)</div>

        <div id="form-area">
            <form id="attendance-form" onsubmit="submitData(event);">
                
                <div class="input-group">
                    <label>請選擇姓名 (Select Student)</label>
                    <select id="studentSelect" required disabled>
                        <option value="" disabled selected>🔄 正在向資料庫載入名單...</option>
                    </select>
                </div>

                <button type="submit" id="submit-btn" disabled>請稍候...</button>
            </form>
        </div>

        <div id="error-msg">
            ⚠️ <strong>設備錯誤</strong><br>
            請使用學校配發的 Chromebook 進行簽到。<br>
            <span class="teacher-link" onclick="teacherLogin()">[我是老師，解除限制]</span>
        </div>

        <div id="success-msg"></div>
    </div>

    <!-- 隱藏的 iframe 用於背景送出 -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) {finishSubmission();}"></iframe>

    <script>
        // ================= 設定區 =================
        const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdSkqsQKC6WozWejhg5bH8b-b2p8bFBbezHCL0CRbX2Yk-_5w/formResponse"; 
        const ENTRY_SEAT = "entry.1279297389";  
        const ENTRY_NAME = "entry.897755681";  
        const TEACHER_PASSWORD = "huleefafa"; 

        // ★★★ 請貼上您剛剛部署產生的「網頁應用程式網址 (Web app URL)」 ★★★
        const API_URL = "請將您的_API_網址貼在這裡"; 

        // 全域變數 (用來存從資料庫抓回來的時間)
        let limitHour = 0;
        let limitMinute = 0;
        // ==========================================

        var submitted = false;
        var isTeacherMode = localStorage.getItem('physics_teacher_mode') === 'true';

        window.onload = function() {
            const isChromebook = navigator.userAgent.indexOf("CrOS") !== -1;
            if (isChromebook || isTeacherMode) {
                if (isTeacherMode) document.getElementById('debug-banner').style.display = 'block';
                
                // 第一件事：去資料庫抓名單和時間！
                fetchDataFromDatabase();
                checkDailyStatus();
            } else {
                document.getElementById('form-area').style.display = 'none';
                document.getElementById('error-msg').style.display = 'block';
            }
        };

        // ★ 新增：透過 API 從試算表抓取資料 ★
        function fetchDataFromDatabase() {
            if(API_URL.includes("請將您的")) {
                alert("老師，您忘記把 API_URL 貼上囉！");
                return;
            }

            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    if(data.status === "success") {
                        // 1. 設定遲到時間
                        const timeParts = data.limitTime.split(":");
                        if(timeParts.length === 2) {
                            limitHour = parseInt(timeParts[0]);
                            limitMinute = parseInt(timeParts[1]);
                        }
                        
                        // 2. 把抓到的名單塞進下拉選單
                        const select = document.getElementById('studentSelect');
                        select.innerHTML = '<option value="" disabled selected>請點擊這裡選擇...</option>';
                        
                        data.roster.forEach(studentStr => {
                            let option = document.createElement("option");
                            option.value = studentStr; 
                            option.text = studentStr;
                            select.appendChild(option);
                        });

                        // 3. 解除按鈕封印
                        select.disabled = false;
                        const btn = document.getElementById('submit-btn');
                        btn.disabled = false;
                        btn.innerText = "確認簽到";
                    }
                })
                .catch(error => {
                    console.error("抓取名單失敗:", error);
                    alert("網路連線異常，無法載入名單。");
                });
        }

        function teacherLogin() {
            if (prompt("請輸入教師密碼:") === TEACHER_PASSWORD) {
                localStorage.setItem('physics_teacher_mode', 'true');
                location.reload();
            } else {
                alert("密碼錯誤");
            }
        }

        function checkDailyStatus() {
            const todayStr = new Date().toDateString(); 
            const lastSignDate = localStorage.getItem('physics_attendance_207');
            if (lastSignDate === todayStr && !isTeacherMode) showAlreadySignedUI();
        }

        function submitData(event) {
            event.preventDefault(); 
            submitted = true;
            
            const form = document.getElementById('attendance-form');
            form.action = GOOGLE_FORM_URL;
            form.method = "POST";
            form.target = "hidden_iframe"; 
            
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "資料傳送中...";
            
            const fullStudentStr = document.getElementById('studentSelect').value;
            const parts = fullStudentStr.split(' ');
            const seatNo = parts[0];
            const name = parts.slice(1).join(' ');

            createHiddenInput(form, ENTRY_SEAT, seatNo);
            createHiddenInput(form, ENTRY_NAME, name);
            
            form.submit(); 
        }

        function createHiddenInput(form, name, value) {
            const oldInput = form.querySelector(`input[name="${name}"]`);
            if (oldInput) oldInput.remove();
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = name;
            input.value = value;
            form.appendChild(input);
        }

        function finishSubmission() {
            localStorage.setItem('physics_attendance_207', new Date().toDateString());
            document.getElementById('form-area').style.display = 'none';
            const successMsg = document.getElementById('success-msg');
            successMsg.style.display = 'block';
            
            const now = new Date();
            const timeString = now.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' });
            
            // 使用從資料庫抓回來的 limitHour 和 limitMinute
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const limitMinutes = limitHour * 60 + limitMinute;
            const absentThreshold = limitMinutes + 25;

            let statusText = "準時";
            let statusColor = "#28a745"; 

            if (currentMinutes > absentThreshold) {
                statusText = "曠課";
                statusColor = "#dc3545"; 
            } else if (currentMinutes > limitMinutes) {
                statusText = "遲到";
                statusColor = "#fd7e14"; 
            }

            successMsg.innerHTML = `
                <h3>✅ 簽到成功</h3>
                <p>207班 資料已寫入</p>
                <div class="status-info">
                    登入時間：${timeString} <span class="status-tag" style="color: ${statusColor}">(${statusText})</span>
                </div>
            `;
            
            startPhysicsAnimation();
        }

        function showAlreadySignedUI() {
            document.getElementById('form-area').style.display = 'none';
            const successMsg = document.getElementById('success-msg');
            successMsg.style.display = 'block';
            successMsg.innerHTML = `<h3>👌 本日已完成簽到</h3><div class="status-info">系統處於穩態 (Stable State)</div>`;
            startPhysicsAnimation();
        }

        function startPhysicsAnimation() {
            const canvas = document.getElementById('anim-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            let x = canvas.width / 2, y = 50, r = 15, vy = 0, g = 0.8, bounce = -0.7; 

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = "#007bff"; ctx.fill();
                ctx.closePath();
                vy += g; y += vy;
                if (y + r > canvas.height) { y = canvas.height - r; vy *= bounce; if (Math.abs(vy) < 1.5) { vy = 0; g = 0; } }
                if (g !== 0) requestAnimationFrame(draw);
            }
            draw();
        }
        window.onresize = () => { document.getElementById('anim-canvas').width = window.innerWidth; document.getElementById('anim-canvas').height = window.innerHeight; };
    </script>
</body>
</html>
