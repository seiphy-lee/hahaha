<!DOCTYPE html><html lang="zh-TW"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">載入中... 簽到系統</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
            z-index: 10;
            position: relative;
        }
        h2 { color: #0056b3; margin-bottom: 5px; }
        .subtitle { color: #666; font-size: 0.9em; margin-bottom: 5px; font-weight: bold;}
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: bold;}
        
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #fff;
            cursor: pointer;
        }
        select:focus { outline: none; border-color: #0056b3; }
        
        button {
            width: 100%;
            padding: 14px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }

        #error-msg, #success-msg {
            display: none;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            line-height: 1.5;
        }
        #error-msg { color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; }
        #success-msg { color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; }
        
        .debug-banner {
            background: #ffc107; color: #856404; padding: 8px; font-size: 0.85rem;
            margin-bottom: 15px; border-radius: 5px; border: 1px solid #ffeeba; display: none; 
            font-weight: bold;
        }

        #anim-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }
        .teacher-link { font-size: 0.8em; color: #999; text-decoration: underline; cursor: pointer; display: inline-block; margin-top: 15px;}

        .status-info {
            margin-top: 15px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 6px;
            font-size: 0.95rem;
            color: #555;
        }
        .status-tag {
            font-weight: bold;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <canvas id="anim-canvas"></canvas>

    <div class="container" id="main-box">
        <!-- 動態文字區塊 -->
        <h2 id="display-course">⚛️ 載入中...</h2>
        <div class="subtitle" id="display-class">連線至資料庫中...</div>
        
        <!-- ★ 新增：源理與阿發老師設計 (與h2標題字體大小一致) ★ -->
        <h2 style="margin-top: 0; margin-bottom: 20px;">源理與阿發老師設計</h2>
        
        <div id="debug-banner" class="debug-banner">👨‍🏫 教師權限已啟用 (無設備限制)</div>

        <div id="form-area">
            <form id="attendance-form" onsubmit="submitData(event);">
                
                <div class="input-group">
                    <label>請選擇姓名 (Select Student)</label>
                    <select id="studentSelect" required disabled>
                        <option value disabled selected>🔄 正在向資料庫載入名單...</option>
                    </select>
                </div>

                <button type="submit" id="submit-btn" disabled>請稍候...</button>
            </form>
        </div>

        <div id="error-msg">
            ⚠️ <strong>設備錯誤</strong><br>
            請使用學校配發的 Chromebook 進行簽到。<br>
            <span class="teacher-link" onclick="teacherLogin()">[我是老師，解除限制]</span>
        </div>

        <div id="success-msg"></div>
    </div>

    <!-- 隱藏的 iframe 用於背景送出 -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) {finishSubmission();}"></iframe>

    

</body></html>
