<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課堂共同評分系統 v4.0 (極簡分流版)</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- 引入 Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 引入 xlsx-js-style (支援樣式匯出) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    
    <!-- 引入 Firebase Compat Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* 自定義捲軸 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #aaa; }
        #global-error-box { display: none; position: fixed; top: 0; left: 0; width: 100%; padding: 20px; background: #fee2e2; color: #b91c1c; z-index: 9999; border-bottom: 2px solid #ef4444; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="global-error-box">
        <h3 class="font-bold text-lg">⚠️ 發生錯誤</h3>
        <pre id="global-error-msg" class="mt-2 text-sm whitespace-pre-wrap"></pre>
        <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">重新整理</button>
    </div>
    <div id="root"></div>

    <script>
        window.onerror = function(msg, url, line, col, error) {
            document.getElementById('global-error-box').style.display = 'block';
            document.getElementById('global-error-msg').innerText = `錯誤: ${msg}\n位置: ${line}:${col}`;
            return false;
        };
    </script>

    <script type="text/babel">
        // --- 1. Firebase Config & Init ---
        const firebaseConfig = {
           apiKey: "AIzaSyAmqdU3AimELr5sa9FIFd_eb5zbM0nCFkI",
           authDomain: "evaluate-each-other-5d4bf.firebaseapp.com",
           projectId: "evaluate-each-other-5d4bf",
           storageBucket: "evaluate-each-other-5d4bf.firebasestorage.app",
           messagingSenderId: "323924183931",
           appId: "1:323924183931:web:945c1feceaa4593d000bde",
           measurementId: "G-GBZKXN3H26"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        // --- DEFAULT_CRITERIA ---
        const DEFAULT_CRITERIA = [
            { id: 'c1', name: '內容深度', max: 10 },
            { id: 'c2', name: '表達技巧', max: 10 },
            { id: 'c3', name: '投影片設計', max: 10 },
            { id: 'c4', name: '團隊合作', max: 10 },
            { id: 'c5', name: '時間控制', max: 10 },
        ];

        // --- 2. Icons ---
        const Icons = {
            Award: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>,
            User: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            Lock: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
            BarChart3: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
            AlertCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Key: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            ArrowLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>,
            Trash2: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
            Download: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
            Home: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Google: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        };

        // --- 3. Main App ---
        function App() {
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const [sessionId, setSessionId] = React.useState(() => {
                return new URLSearchParams(window.location.search).get('room');
            });
            const [role, setRole] = React.useState(() => {
                // 如果網址有帶 room，表示一定是學生從專屬連結進來
                return new URLSearchParams(window.location.search).get('room') ? 'student' : null;
            }); 
            const [sessionData, setSessionData] = React.useState(null);

            // 1. 監聽 Firebase 登入狀態
            React.useEffect(() => {
                const unsub = auth.onAuthStateChanged(u => {
                    setUser(u);
                    setLoading(false);
                });
                return () => unsub();
            }, []);

            // 2. 監聽教室資料
            React.useEffect(() => {
                if (!sessionId) return;
                const unsub = db.collection('sessions').doc(sessionId).onSnapshot(docSnap => {
                    if (docSnap.exists) {
                        setSessionData(docSnap.data());
                    } else {
                        // 只有學生透過連結進入時才需要顯示「找不到教室」
                        if (role === 'student') setSessionData({ notFound: true });
                    }
                }, err => {
                    console.warn("讀取資料暫時被拒絕:", err);
                });
                return () => unsub();
            }, [sessionId, role, user]);

            // 輔助函式：主動解除學生名字的綁定
            const handleUnbindStudent = async () => {
                if (user && sessionId && sessionData?.studentMappings?.[user.uid]) {
                    const update = {};
                    update[`studentMappings.${user.uid}`] = firebase.firestore.FieldValue.delete();
                    try { await db.collection('sessions').doc(sessionId).update(update); } catch(e) { console.error(e); }
                }
            };

            const handleLeaveClass = async () => {
                if (role === 'student') await handleUnbindStudent();
                setRole(null); 
                setSessionId(null); 
                setSessionData(null);
                window.history.pushState({}, '', window.location.pathname);
            };

            const handleSignOut = async () => {
                if (role === 'student') await handleUnbindStudent();
                await auth.signOut();
                setRole(null); 
                setSessionId(null); 
                setSessionData(null);
                window.history.pushState({}, '', window.location.pathname);
            };

            if (loading) return <div className="h-screen flex items-center justify-center font-bold text-gray-500">系統載入中...</div>;

            // =========================================================================
            // 路由 1：老師登入介面 (只要沒有 SessionId 且沒有 Role，就是首頁)
            // =========================================================================
            if (!sessionId && !role) {
                return <TeacherLoginView onLoginSuccess={(sid) => { setSessionId(sid); setRole('teacher'); }} />;
            }

            // =========================================================================
            // 路由 2：學生專屬入口 (只要 Role 是 student)
            // =========================================================================
            if (role === 'student') {
                // 第一關：強制 Google 登入
                if (!user) {
                    return <StudentGoogleLogin sessionId={sessionId} />;
                }
                // 等待資料庫回應
                if (!sessionData) return <div className="h-screen flex items-center justify-center font-bold text-gray-500">載入教室資料中...</div>;
                // 防呆：教室代碼錯誤
                if (sessionData.notFound) {
                    return (
                        <div className="h-screen flex flex-col items-center justify-center bg-gray-50 animate-fade-in p-4 text-center">
                            <div className="text-red-500 mb-4"><Icons.AlertCircle /></div>
                            <h2 className="text-xl font-bold text-red-500 mb-6">找不到此教室，請確認老師提供的網址是否完整。</h2>
                            <button onClick={handleLeaveClass} className="px-6 py-2 bg-blue-600 text-white rounded font-bold shadow-md hover:bg-blue-700">返回首頁</button>
                        </div>
                    );
                }
                
                const registeredName = sessionData.studentMappings?.[user.uid] || "";
                return (
                    <div className="min-h-screen bg-gray-50 pb-10 animate-fade-in">
                        <header className="bg-white shadow px-4 py-3 sticky top-0 z-20 flex justify-between items-center">
                            <div className="flex items-center gap-2 text-blue-600 font-bold text-xl md:text-2xl">
                                <Icons.Award /> 共同評分 <span className="hidden md:inline text-sm text-gray-400 font-normal">| {sessionData.teacherName} - {sessionData.className}</span>
                            </div>
                            <div className="flex items-center gap-3">
                                {registeredName && <span className="text-sm text-gray-600 font-bold bg-green-100 text-green-800 border border-green-200 px-3 py-1 rounded-full shadow-sm">🧑‍🎓 {registeredName}</span>}
                                <button onClick={handleSignOut} title="登出切換帳號" className="text-gray-500 hover:text-red-500 flex items-center gap-1"><Icons.LogOut /><span className="hidden md:inline text-sm">登出</span></button>
                            </div>
                        </header>
                        <main className="max-w-5xl mx-auto p-4 mt-2">
                            <StudentView session={sessionData} sessionId={sessionId} user={user} registeredName={registeredName} />
                        </main>
                    </div>
                );
            }

            // =========================================================================
            // 路由 3：老師控制台介面
            // =========================================================================
            if (role === 'teacher') {
                if (!sessionData || sessionData.notFound) return <div className="h-screen flex items-center justify-center font-bold text-gray-500">載入教室資料中...</div>;
                return (
                    <div className="min-h-screen bg-gray-50 pb-10 animate-fade-in">
                        <header className="bg-white shadow px-4 py-3 sticky top-0 z-20 flex justify-between items-center">
                            <div className="flex items-center gap-2 text-blue-600 font-bold text-xl md:text-2xl">
                                <Icons.Award /> 控制台 <span className="hidden md:inline text-sm text-gray-400 font-normal">| {sessionData.teacherName} - {sessionData.className}</span>
                            </div>
                            <div className="flex items-center gap-3">
                                <span className="text-sm text-gray-600 font-bold hidden sm:inline">👨‍🏫 {sessionData.teacherName} 老師</span>
                                <button onClick={handleLeaveClass} title="離開並返回首頁" className="text-gray-500 hover:text-red-500 flex items-center gap-1"><Icons.LogOut /><span className="hidden md:inline text-sm">登出</span></button>
                            </div>
                        </header>
                        <main className="max-w-5xl mx-auto p-4 mt-2">
                            <TeacherDashboard session={sessionData} sessionId={sessionId} />
                        </main>
                    </div>
                );
            }

            return null; // 防呆
        }

        // --- 4. 老師登入視圖 (首頁專屬) ---
        function TeacherLoginView({ onLoginSuccess }) {
            const [school, setSchool] = React.useState('');
            const [dept, setDept] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [errorMsg, setErrorMsg] = React.useState('');
            const [isChecking, setIsChecking] = React.useState(false);

            const isFormComplete = school.trim() !== '' && dept.trim() !== '';

            const handleLogin = async () => {
                if (!isFormComplete) return;
                if (!/^\d{4}$/.test(password)) {
                    setErrorMsg("密碼格式錯誤！請設定或輸入 4 位數字。");
                    return;
                }
                
                setIsChecking(true);
                const sid = `${school.trim()}_${dept.trim()}`;
                
                try {
                    // 老師走匿名驗證即可，不需綁定 Google，方便快速開房間
                    if (!auth.currentUser) {
                        await auth.signInAnonymously();
                    }

                    const docRef = db.collection('sessions').doc(sid);
                    const docSnap = await docRef.get();
                    
                    if (docSnap.exists) {
                        const data = docSnap.data();
                        if (data.teacherPassword === password) {
                            onLoginSuccess(sid);
                        } else {
                            setErrorMsg("❌ 密碼錯誤！這間教室已經被建立，請輸入正確的 4 位數字密碼。");
                            setPassword('');
                        }
                    } else {
                        if (confirm(`確定要將【${school} - ${dept}】的管理者密碼設定為「${password}」嗎？\n請務必牢記此密碼，設定後將無法更改！`)) {
                            const initialData = {
                                status: 'setup',
                                currentGroupId: null,
                                showResults: false,
                                criteria: DEFAULT_CRITERIA,
                                groups: [],
                                students: [],
                                studentMappings: {}, 
                                teacherPassword: password,
                                teacherName: school.trim(),
                                className: dept.trim()
                            };
                            await docRef.set(initialData);
                            onLoginSuccess(sid);
                        }
                    }
                } catch(e) {
                    setErrorMsg("連線錯誤: " + e.message);
                } finally {
                    setIsChecking(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-blue-50 p-4">
                    <div className="bg-white p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-md text-center animate-fade-in border-t-4 border-blue-500">
                        <div className="flex justify-center text-blue-500 mb-4"><Icons.Award /></div>
                        <h1 className="text-xl sm:text-2xl font-bold mb-2 text-blue-800 leading-snug">課堂共同評分系統</h1>
                        <p className="text-gray-500 mb-6 text-sm">老師控制台 (阿發老師設計)</p>

                        <div className="mb-5 border-b border-gray-200 pb-5 text-left">
                            <label className="block text-blue-800 font-bold mb-2 text-sm sm:text-base">👨‍🏫 請設定或輸入教室資訊：</label>
                            <div className="flex flex-col gap-3 mt-2">
                                <input 
                                    type="text" 
                                    value={school}
                                    onChange={e => {setSchool(e.target.value); setErrorMsg('');}}
                                    className="border p-3 rounded-lg w-full bg-blue-50 text-base focus:ring-2 focus:ring-blue-400 outline-none transition font-bold text-blue-800 placeholder-blue-300" 
                                    placeholder="您的名稱 (例如：王小明老師)" 
                                />
                                <input 
                                    type="text" 
                                    value={dept}
                                    onChange={e => {setDept(e.target.value); setErrorMsg('');}}
                                    className="border p-3 rounded-lg w-full bg-blue-50 text-base focus:ring-2 focus:ring-blue-400 outline-none transition font-bold text-blue-800 placeholder-blue-300" 
                                    placeholder="班級名稱 (例如：高一1班)" 
                                />
                            </div>
                        </div>

                        <div className="mb-6 text-left">
                            <label className={`block font-bold mb-2 text-sm sm:text-base transition-colors duration-300 ${isFormComplete ? 'text-gray-700' : 'text-red-500'}`}>
                                {isFormComplete ? '請設定或輸入專屬密碼 (4位數字)：' : '⚠️ 請先填寫上方資訊'}
                            </label>
                            <input 
                                type="password" 
                                maxLength="4" 
                                placeholder="****" 
                                value={password}
                                onChange={e => {setPassword(e.target.value); setErrorMsg('');}}
                                disabled={!isFormComplete || isChecking}
                                className={`w-full border p-3 rounded-lg text-base text-center tracking-widest focus:ring-2 focus:ring-blue-400 outline-none transition ${isFormComplete ? 'bg-white' : 'bg-gray-50'}`} 
                            />
                            {errorMsg && <p className="text-red-500 text-sm mt-2 font-bold">{errorMsg}</p>}
                        </div>

                        <button 
                            onClick={handleLogin}
                            disabled={!isFormComplete || isChecking}
                            className={`w-full font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md ${isFormComplete ? 'bg-blue-600 hover:bg-blue-700 text-white transform hover:-translate-y-0.5' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}
                        >
                            {isChecking ? '資料連線中...' : (isFormComplete ? '進入控制台 / 建立教室' : '請先完成上方設定')}
                        </button>
                        
                        <p className="mt-6 text-xs text-gray-400">學生請直接點擊老師提供的「專屬網址」進入，不需在此登入。</p>
                    </div>
                </div>
            );
        }

        // --- 5. 學生 Google 登入視圖 ---
        function StudentGoogleLogin({ sessionId }) {
            const [isLoggingIn, setIsLoggingIn] = React.useState(false);

            const handleGoogleLogin = async () => {
                setIsLoggingIn(true);
                try {
                    // 若有殘留的匿名登入，先登出以免衝突
                    if (auth.currentUser && auth.currentUser.isAnonymous) {
                        await auth.signOut();
                    }
                    const provider = new firebase.auth.GoogleAuthProvider();
                    provider.setCustomParameters({ prompt: 'select_account' });
                    await auth.signInWithPopup(provider);
                } catch(e) {
                    alert("登入失敗: " + e.message);
                    setIsLoggingIn(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-blue-50 p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center animate-fade-in border-t-4 border-green-500">
                        <div className="flex justify-center text-green-500 mb-4"><Icons.User /></div>
                        <h2 className="text-2xl font-bold mt-2 mb-2 text-gray-800">準備進入評分教室</h2>
                        
                        <div className="bg-green-50 text-green-800 p-3 rounded-lg mb-6 shadow-inner border border-green-100 flex items-center justify-center gap-2">
                            <span className="font-bold">教室代碼：</span>
                            <span className="font-mono bg-white px-2 py-1 rounded shadow-sm">{sessionId}</span>
                        </div>
                        
                        <p className="text-gray-500 mb-8 text-sm leading-relaxed">請先使用您的 Google 帳號登入系統<br/>登入後將可以<span className="font-bold text-blue-600">從名單中選擇您的真實姓名</span>。</p>
                        
                        <button onClick={handleGoogleLogin} disabled={isLoggingIn} className="w-full py-4 bg-white border border-gray-300 text-gray-700 rounded-xl font-bold text-lg shadow hover:bg-gray-50 transition flex items-center justify-center gap-3 transform hover:-translate-y-0.5 disabled:opacity-50 disabled:transform-none">
                            <Icons.Google /> {isLoggingIn ? '驗證登入中...' : '使用 Google 帳號登入'}
                        </button>
                    </div>
                </div>
            );
        }

        // --- 6. Teacher Dashboard ---
        function TeacherDashboard({ session, sessionId }) {
            const [activeTab, setActiveTab] = React.useState('control'); 
            const [votes, setVotes] = React.useState([]);
            const [groups, setGroups] = React.useState([]); 
            const [batchGroups, setBatchGroups] = React.useState('');
            const [batchStudents, setBatchStudents] = React.useState('');
            const [newCriName, setNewCriName] = React.useState('');
            const [newCriMax, setNewCriMax] = React.useState(10);
            const [monitorGroupId, setMonitorGroupId] = React.useState(null);
            const [newGroupName, setNewGroupName] = React.useState('');

            React.useEffect(() => {
                if (session) {
                    setGroups(session.groups || []);
                }
            }, [session]);

            React.useEffect(() => {
                const unsub = db.collection('sessions').doc(sessionId).collection('votes').onSnapshot(snap => {
                    const data = [];
                    snap.forEach(d => data.push({id: d.id, ...d.data()}));
                    setVotes(data);
                });
                return () => unsub();
            }, [sessionId]);

            const updateSession = (data) => db.collection('sessions').doc(sessionId).set(data, { merge: true });

            if (!session) return <div className="p-10 text-center text-gray-500">正在讀取資料...</div>;

            const handleBatchGroups = async () => {
                const list = batchGroups.split('\n').map(s=>s.trim()).filter(s=>s);
                const newGroups = list.map(name => ({ id: `g${Date.now()}_${Math.random().toString(36).substr(2,5)}`, name }));
                await updateSession({ groups: [...(session.groups||[]), ...newGroups] });
                setBatchGroups('');
                alert(`已新增 ${newGroups.length} 個組別`);
            };

            const handleBatchStudents = async () => {
                const list = batchStudents.split('\n').map(s=>s.trim()).filter(s=>s);
                const currentSet = new Set(session.students || []);
                list.forEach(name => currentSet.add(name));
                await updateSession({ students: Array.from(currentSet) });
                setBatchStudents('');
                alert(`名單更新完成，目前共 ${currentSet.size} 人`);
            };

            const addSingleGroup = async () => {
                if (!newGroupName.trim()) return;
                const newGroup = { id: `g${Date.now()}`, name: newGroupName };
                await updateSession({ groups: [...(session.groups||[]), newGroup] });
                setNewGroupName('');
            };

            const addCriteria = async () => {
                if(!newCriName) return;
                const newC = { id: `c_${Date.now()}`, name: newCriName, max: parseInt(newCriMax) };
                await updateSession({ criteria: [...(session.criteria||[]), newC] });
                setNewCriName('');
            };

            const removeCriteria = async (id) => {
                if(!confirm("確定刪除此評分項目？")) return;
                await updateSession({ criteria: session.criteria.filter(c => c.id !== id) });
            };

            const deleteVote = async (voteId) => {
                if(!confirm("確定要將此評分標記為不採計嗎？(不會物理刪除，Excel 仍可匯出)")) return;
                await db.collection('sessions').doc(sessionId).collection('votes').doc(voteId).update({ isDeleted: true });
            };

            const handleRemoveStudent = async (nameToRemove) => {
                const isBound = Object.values(session.studentMappings || {}).includes(nameToRemove);
                
                if (isBound) {
                    // 如果學生是在線(綁定)狀態，只解除綁定，不從全班名單刪除
                    if(!confirm(`學生 "${nameToRemove}" 目前顯示為線上綁定狀態。\n確定要「解除綁定」將他踢出嗎？\n(解除後姓名仍會保留在名單中，他可以重新登入)`)) return;
                    const newMappings = { ...session.studentMappings };
                    for (const uid in newMappings) {
                        if (newMappings[uid] === nameToRemove) delete newMappings[uid];
                    }
                    await updateSession({ studentMappings: newMappings });
                } else {
                    // 如果學生已經離線，直接從名單中徹底移除
                    if(!confirm(`確定要將學生 "${nameToRemove}" 從名單中「徹底刪除」嗎？`)) return;
                    const newStudents = (session.students || []).filter(s => s !== nameToRemove);
                    await updateSession({ students: newStudents });
                }
            };

            const handleClearStudents = async () => {
                if(!confirm("警告：確定要清空所有學生名單嗎？這將導致所有學生需重新綁定。")) return;
                await updateSession({ students: [], studentMappings: {} });
            };

            const handleClearGroups = async () => {
                if(!confirm("警告：確定要清空所有組別嗎？相關的評分紀錄可能會失去關聯。")) return;
                await updateSession({ groups: [], currentGroupId: null });
            };

            const handleResetVotes = async () => {
                if (!confirm("警告：這將清除所有學生的評分紀錄，且無法復原！確定要重置嗎？")) return;
                try {
                    const votesRef = db.collection('sessions').doc(sessionId).collection('votes');
                    const snapshot = await votesRef.get();
                    const batch = db.batch();
                    snapshot.docs.forEach((doc) => { batch.delete(doc.ref); });
                    await batch.commit();
                    alert("所有評分紀錄已清除。");
                } catch (e) {
                    console.error(e);
                    alert("重置失敗，請稍後再試。");
                }
            };

            const loggedInCount = Object.keys(session.studentMappings || {}).length;
            const currentGroupVotes = votes.filter(v => v.groupId === session.currentGroupId && !v.isDeleted); 
            
            const allTotals = (session.students || []).map(studentName => {
                if (!session.currentGroupId) return null;
                const vote = votes.find(v => v.groupId === session.currentGroupId && v.userName === studentName && !v.isDeleted);
                if (!vote) return null;
                let sum = 0;
                (session.criteria || []).forEach(c => sum += (vote.scores[c.id] || 0));
                return sum;
            }).filter(score => score !== null).sort((a, b) => b - a); 

            const getScoreColor = (score) => {
                if (allTotals.length === 0) return "text-gray-800";
                const rank = allTotals.indexOf(score); 
                if (rank < 3) return "text-red-600 font-bold";
                const reverseRank = allTotals.lastIndexOf(score);
                if (reverseRank >= allTotals.length - 3 && allTotals.length >= 3) return "text-green-600 font-bold";
                return "text-gray-800";
            };

            const shareLink = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(sessionId)}`;

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex bg-white rounded-lg p-1 shadow-sm overflow-x-auto">
                        {[{id: 'control', label: '控制台'}, {id: 'setup', label: '名單設定'}, {id: 'criteria', label: '評分標準'}, {id: 'monitor', label: '監控與修正'}, {id: 'results', label: '結果統計'}]
                        .map(t => (
                            <button key={t.id} onClick={()=>{setActiveTab(t.id); setMonitorGroupId(null);}} className={`flex-1 py-2 px-3 whitespace-nowrap text-sm font-bold rounded-md ${activeTab===t.id ? 'bg-blue-50 text-blue-700' : 'text-gray-500 hover:bg-gray-50'}`}>
                                {t.label}
                            </button>
                        ))}
                    </div>

                    {activeTab === 'control' && (
                        <div className="bg-white rounded-xl shadow p-6 space-y-6">
                            <div className="flex justify-between items-center bg-gray-50 p-4 rounded-lg border border-gray-100">
                                <div>
                                    <p className="text-gray-500 text-xs font-bold uppercase">目前登入並綁定學生</p>
                                    <p className="text-2xl font-bold text-blue-600">{loggedInCount} <span className="text-sm text-gray-400">/ {(session.students||[]).length}</span></p>
                                </div>
                                {session.currentGroupId && (
                                    <div>
                                        <p className="text-gray-500 text-xs font-bold uppercase text-right">本組評分進度</p>
                                        <p className="text-2xl font-bold text-green-600 text-right">{currentGroupVotes.length} <span className="text-sm text-gray-400">人已評</span></p>
                                    </div>
                                )}
                            </div>
                            
                            <div className="bg-blue-50 p-4 rounded-lg border border-blue-100">
                                <p className="text-sm font-bold text-blue-800 mb-2">📢 邀請學生加入本教室網址：</p>
                                <div className="flex gap-2">
                                    <input type="text" readOnly value={shareLink} className="flex-1 p-2 rounded border bg-white text-sm text-gray-600 font-mono shadow-inner" />
                                    <button onClick={() => {
                                        navigator.clipboard.writeText(shareLink);
                                        alert("網址已複製！貼給學生，他們點擊後登入即可選擇名單。");
                                    }} className="bg-blue-600 text-white px-4 rounded font-bold hover:bg-blue-700 shadow-sm">複製網址</button>
                                </div>
                            </div>

                            <h3 className="font-bold text-lg border-b pb-2">報告流程控制</h3>
                            <div className="space-y-3">
                                {(groups||[]).length === 0 && <p className="text-gray-400 py-4 text-center bg-gray-50 border border-dashed rounded-lg">尚未設定組別，請至名單設定新增。</p>}
                                {(groups||[]).map((g, i) => (
                                    <div key={g.id} className={`flex justify-between items-center p-4 border rounded-lg ${session.currentGroupId === g.id ? 'border-green-500 bg-green-50 ring-1 ring-green-500' : 'hover:border-blue-200'}`}>
                                        <span className="font-bold text-lg text-gray-800"><span className="text-gray-400 text-sm mr-2">{i+1}.</span>{g.name}</span>
                                        {session.currentGroupId === g.id ? (
                                            <button onClick={()=>updateSession({currentGroupId: null})} className="px-6 py-2 bg-white border border-red-200 text-red-600 rounded-lg font-bold hover:bg-red-50 shadow-sm">停止評分</button>
                                        ) : (
                                            <button onClick={()=>updateSession({currentGroupId: g.id, showResults: false})} disabled={!!session.currentGroupId} className={`px-6 py-2 rounded-lg font-bold shadow-sm transition ${session.currentGroupId ? 'bg-gray-100 text-gray-400' : 'bg-blue-600 text-white hover:bg-blue-700 transform hover:-translate-y-0.5'}`}>開放評分</button>
                                        )}
                                    </div>
                                ))}
                            </div>
                            <div className="pt-4 border-t mt-4">
                                <button onClick={()=>updateSession({showResults: !session.showResults})} className={`w-full py-4 rounded-xl font-bold text-lg shadow-md transition ${session.showResults ? 'bg-amber-100 text-amber-800 hover:bg-amber-200' : 'bg-gray-800 text-white hover:bg-gray-900'}`}>
                                    {session.showResults ? '隱藏排行榜' : '公佈排行榜 (學生可見)'}
                                </button>
                            </div>
                        </div>
                    )}

                    {activeTab === 'setup' && (
                        <div className="grid md:grid-cols-2 gap-6">
                            <div className="bg-white rounded-xl shadow p-6">
                                <h3 className="font-bold text-lg mb-4 flex items-center gap-2"><Icons.Users/> 學生名單管理</h3>
                                <p className="text-xs text-gray-500 mb-2">請貼上全班姓名，一行一個名字。建立後學生才能從下拉選單中選擇綁定。</p>
                                <textarea className="w-full h-32 border p-2 rounded-lg text-sm mb-2 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-400 outline-none" placeholder="王小明&#10;李大華..." value={batchStudents} onChange={e=>setBatchStudents(e.target.value)}></textarea>
                                <div className="flex gap-2">
                                    <button onClick={handleBatchStudents} className="flex-1 py-2 bg-blue-600 text-white rounded-lg font-bold shadow-sm hover:bg-blue-700">更新名單</button>
                                    <button onClick={handleClearStudents} className="px-4 py-2 bg-red-50 text-red-600 rounded-lg font-bold hover:bg-red-100 border border-red-100"><Icons.Trash /></button>
                                </div>
                                <div className="bg-gray-50 p-3 rounded-lg h-48 overflow-y-auto flex flex-wrap gap-2 mt-4 border border-gray-100 content-start">
                                    {(session.students||[]).length === 0 && <p className="text-gray-400 text-sm w-full text-center mt-8">尚無名單</p>}
                                    {(session.students||[]).map(s => {
                                        const isRegistered = Object.values(session.studentMappings||{}).includes(s);
                                        return (
                                            <span key={s} className={`text-sm px-2 py-1 rounded-md border flex items-center gap-1 shadow-sm ${isRegistered ? 'bg-green-100 text-green-800 border-green-200 font-bold' : 'bg-white text-gray-600 border-gray-200'}`}>
                                                {s} <button onClick={()=>handleRemoveStudent(s)} className="text-gray-400 hover:text-red-500" title={isRegistered ? "強制解除綁定" : "刪除此學生"}><Icons.X /></button>
                                            </span>
                                        );
                                    })}
                                </div>
                            </div>
                            <div className="bg-white rounded-xl shadow p-6">
                                <h3 className="font-bold text-lg mb-4 flex items-center gap-2"><Icons.Award/> 分組名單管理</h3>
                                <div className="mb-4 flex gap-2">
                                    <input type="text" value={newGroupName} onChange={e=>setNewGroupName(e.target.value)} className="border p-2 rounded-lg flex-1 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-400 outline-none" placeholder="單筆新增組名" />
                                    <button onClick={addSingleGroup} className="bg-gray-200 px-4 rounded-lg font-bold hover:bg-gray-300 text-gray-700">新增</button>
                                </div>
                                <p className="text-xs text-gray-500 mb-2">或 批次貼上組別名稱，一行一個</p>
                                <textarea className="w-full h-32 border p-2 rounded-lg text-sm mb-2 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-400 outline-none" placeholder="第一組...&#10;第二組..." value={batchGroups} onChange={e=>setBatchGroups(e.target.value)}></textarea>
                                <div className="flex gap-2">
                                    <button onClick={handleBatchGroups} className="flex-1 py-2 bg-blue-600 text-white rounded-lg font-bold shadow-sm hover:bg-blue-700">批次新增</button>
                                    <button onClick={handleClearGroups} className="px-4 py-2 bg-red-50 text-red-600 rounded-lg font-bold hover:bg-red-100 border border-red-100"><Icons.Trash /></button>
                                </div>
                                <div className="bg-gray-50 p-3 rounded-lg h-48 overflow-y-auto space-y-2 mt-4 border border-gray-100">
                                    {(groups||[]).length === 0 && <p className="text-gray-400 text-sm text-center mt-8">尚無組別</p>}
                                    {(groups||[]).map((g,i) => (
                                        <div key={g.id} className="text-sm bg-white p-2 rounded-lg border flex justify-between items-center shadow-sm">
                                            <span className="font-medium text-gray-800">{i+1}. {g.name}</span>
                                            <button onClick={async()=>{ if(confirm("刪除?")) await updateSession({ groups: session.groups.filter(x=>x.id!==g.id) }); }} className="text-red-400 hover:text-red-600 p-1 hover:bg-red-50 rounded"><Icons.Trash2 /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'criteria' && (
                        <div className="bg-white rounded-xl shadow p-6">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="font-bold text-lg">評分標準設定</h3>
                                <button onClick={handleResetVotes} className="bg-red-50 text-red-600 hover:bg-red-100 border border-red-100 px-4 py-2 rounded-lg font-bold transition-colors">
                                    清空所有評分
                                </button>
                            </div>
                            <div className="flex flex-col sm:flex-row gap-4 mb-6 items-end bg-blue-50 p-4 rounded-lg border border-blue-100">
                                <div className="flex-1 w-full">
                                    <label className="text-xs font-bold text-gray-500 mb-1 block">項目名稱</label>
                                    <input type="text" value={newCriName} onChange={e=>setNewCriName(e.target.value)} className="w-full border p-2 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none" />
                                </div>
                                <div className="w-full sm:w-24 shrink-0">
                                    <label className="text-xs font-bold text-gray-500 mb-1 block">最高分</label>
                                    <input type="number" value={newCriMax} onChange={e=>setNewCriMax(e.target.value)} className="w-full border p-2 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none" min="1" />
                                </div>
                                <button onClick={addCriteria} className="w-full sm:w-auto bg-blue-600 text-white px-6 py-2 rounded-lg font-bold h-[42px] hover:bg-blue-700 shadow-sm shrink-0">新增</button>
                            </div>
                            <div className="space-y-3">
                                {(session.criteria||[]).length === 0 && <p className="text-gray-400 text-center py-4 bg-gray-50 rounded-lg border border-dashed">尚未設定評分標準</p>}
                                {(session.criteria||[]).map(c => (
                                    <div key={c.id} className="flex justify-between items-center p-4 border rounded-lg bg-white shadow-sm hover:border-blue-200">
                                        <div className="flex items-center gap-4">
                                            <span className="font-bold text-lg text-gray-800">{c.name}</span>
                                            <span className="text-xs bg-gray-100 px-3 py-1 rounded-full text-gray-500 font-mono">0 ~ {c.max} 分</span>
                                        </div>
                                        <button onClick={()=>removeCriteria(c.id)} className="text-red-500 hover:bg-red-50 p-2 rounded-lg"><Icons.Trash2/></button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {activeTab === 'monitor' && (
                        <div className="space-y-6">
                            {!monitorGroupId ? (
                                <>
                                <div className="bg-white rounded-xl shadow p-6">
                                    <h3 className="font-bold text-lg mb-4 flex items-center gap-2"><Icons.Users/> 全班狀態監控</h3>
                                    <div className="overflow-x-auto max-h-96 border rounded-lg">
                                        <table className="w-full text-sm text-left">
                                            <thead className="bg-gray-50 text-gray-600 uppercase sticky top-0 shadow-sm">
                                                <tr>
                                                    <th className="p-4 font-bold">姓名</th>
                                                    <th className="p-4 font-bold">目前評分進度</th>
                                                    <th className="p-4 font-bold text-right">給出總分</th>
                                                    <th className="p-4 font-bold text-center">操作</th>
                                                    <th className="p-4 font-bold text-gray-400">累計已評</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-100">
                                                {(session.students||[]).length === 0 && <tr><td colSpan="5" className="p-8 text-center text-gray-400">尚未建立學生名單</td></tr>}
                                                {(session.students||[]).map(studentName => {
                                                    const isBound = Object.values(session.studentMappings||{}).includes(studentName);
                                                    const currentGroup = session.currentGroupId;
                                                    const currentVote = currentGroup ? votes.find(v => v.groupId === currentGroup && v.userName === studentName && !v.isDeleted) : null;
                                                    const totalVoted = votes.filter(v => v.userName === studentName && !v.isDeleted).length;
                                                    
                                                    let totalDisplay = "-";
                                                    let totalClass = "text-gray-400";
                                                    
                                                    if (currentVote) {
                                                        let sum = 0;
                                                        (session.criteria||[]).forEach(c => sum += (currentVote.scores[c.id]||0));
                                                        totalDisplay = sum;
                                                        totalClass = getScoreColor(sum); 
                                                    }

                                                    return (
                                                        <tr key={studentName} className="hover:bg-gray-50 transition">
                                                            <td className="p-4 font-medium text-gray-800">
                                                                {studentName}
                                                                {!isBound && <span className="ml-2 text-xs bg-red-50 text-red-500 px-2 py-0.5 rounded border border-red-100">未登入</span>}
                                                            </td>
                                                            <td className="p-4">
                                                                {!currentGroup ? <span className="text-gray-400">-</span> : 
                                                                 currentVote ? <span className="text-green-600 font-bold flex items-center gap-1"><Icons.CheckCircle/>已完成</span> : <span className="text-red-500 font-bold animate-pulse flex items-center gap-1"><span className="w-2 h-2 bg-red-500 rounded-full"></span>未評分</span>}
                                                            </td>
                                                            <td className={`p-4 text-right font-mono text-lg ${totalClass}`}>{totalDisplay}</td>
                                                            <td className="p-4 text-center">
                                                                {currentVote && (
                                                                    <button onClick={()=>deleteVote(currentVote.id)} className="text-red-400 hover:text-red-600 p-2 bg-red-50 rounded-lg hover:bg-red-100 transition" title="標記為不採計"><Icons.Trash2/></button>
                                                                )}
                                                            </td>
                                                            <td className="p-4 text-gray-400 font-mono">{totalVoted} 組</td>
                                                        </tr>
                                                    )
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                <div className="bg-white rounded-xl shadow p-6">
                                    <h3 className="font-bold text-lg mb-4">各組歷史紀錄 (點選查看)</h3>
                                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                                        {(groups||[]).length === 0 && <p className="col-span-full text-gray-400 py-2">無組別資料</p>}
                                        {(groups||[]).map(g => {
                                            const count = votes.filter(v => v.groupId === g.id && !v.isDeleted).length;
                                            return (
                                                <button key={g.id} onClick={()=>setMonitorGroupId(g.id)} className="p-4 border rounded-xl hover:border-blue-500 hover:bg-blue-50 text-left transition shadow-sm bg-gray-50">
                                                    <div className="font-bold text-gray-800 mb-1">{g.name}</div>
                                                    <div className="text-xs text-gray-500">有效評分: <span className="font-bold text-blue-600 text-sm">{count}</span> 筆</div>
                                                </button>
                                            )
                                        })}
                                    </div>
                                </div>
                                </>
                            ) : (
                                <div className="bg-white rounded-xl shadow p-6 animate-fade-in">
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 border-b pb-4">
                                        <div className="flex items-center gap-3">
                                            <button onClick={() => setMonitorGroupId(null)} className="text-gray-500 hover:bg-gray-100 p-2 rounded-lg transition">
                                                <Icons.ArrowLeft />
                                            </button>
                                            <h2 className="text-xl font-bold text-blue-800">
                                                {groups.find(g => g.id === monitorGroupId)?.name} <span className="text-gray-500 text-base font-normal ml-2">評分明細</span>
                                            </h2>
                                        </div>
                                    </div>
                                    
                                    <div className="overflow-x-auto border rounded-lg">
                                        <table className="w-full text-sm text-left">
                                            <thead className="bg-gray-50 text-gray-600 uppercase border-b">
                                                <tr>
                                                    <th className="p-4 font-bold">評分學生</th>
                                                    <th className="p-4 font-bold text-right text-blue-600">給出的總分</th>
                                                    {(session.criteria||[]).map(c => (
                                                        <th key={c.id} className="p-4 font-bold text-right text-gray-400 hidden md:table-cell">{c.name}</th>
                                                    ))}
                                                    <th className="p-4 font-bold text-center">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-100">
                                                {votes
                                                    .filter(v => v.groupId === monitorGroupId && !v.isDeleted) 
                                                    .map(v => {
                                                        let total = 0;
                                                        (session.criteria||[]).forEach(c => total += (v.scores[c.id] || 0));
                                                        return { ...v, total };
                                                    })
                                                    .sort((a, b) => b.total - a.total)
                                                    .map(v => (
                                                        <tr key={v.id} className="hover:bg-gray-50 transition bg-white">
                                                            <td className="p-4 font-bold text-gray-800">{v.userName}</td>
                                                            <td className="p-4 text-right font-black text-lg text-blue-600">{v.total}</td>
                                                            {(session.criteria||[]).map(c => (
                                                                <td key={c.id} className="p-4 text-right text-gray-500 hidden md:table-cell font-mono">{v.scores[c.id]}</td>
                                                            ))}
                                                            <td className="p-4 text-center">
                                                                <button onClick={() => deleteVote(v.id)} className="text-red-500 hover:bg-red-600 hover:text-white p-2 rounded-lg transition" title="標記為不採計 (剔除分數)">
                                                                    <Icons.Trash2 />
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                }
                                                {votes.filter(v => v.groupId === monitorGroupId && !v.isDeleted).length === 0 && (
                                                    <tr><td colSpan={(session.criteria||[]).length + 3} className="p-10 text-center text-gray-400 bg-gray-50">尚無有效評分紀錄</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {activeTab === 'results' && <ResultsBoard session={session} sessionId={sessionId} groups={groups} criteria={session.criteria || DEFAULT_CRITERIA} isAdmin={true} />}
                </div>
            );
        }

        // --- 7. 學生畫面 (下拉選單綁定) ---
        function StudentView({ session, sessionId, user }) {
            const [selectedName, setSelectedName] = React.useState('');
            const [scores, setScores] = React.useState({});
            const [submitting, setSubmitting] = React.useState(false);
            const [hasVoted, setHasVoted] = React.useState(false);

            const registeredName = session?.studentMappings?.[user.uid];

            // 監聽是否已對「正在報告的組別」評分
            React.useEffect(() => {
                if (registeredName && session?.currentGroupId) {
                    const unsub = db.collection('sessions').doc(sessionId).collection('votes')
                        .where('groupId', '==', session.currentGroupId)
                        .where('userId', '==', user.uid)
                        .onSnapshot(snap => setHasVoted(!snap.empty));
                    return () => unsub();
                } else {
                    setHasVoted(false);
                    setScores({}); // 換組時清空
                }
            }, [session?.currentGroupId, user.uid, registeredName, sessionId]);

            const handleRegister = async () => {
                if (!selectedName) return;
                const isTaken = Object.values(session.studentMappings || {}).includes(selectedName);
                if (isTaken) { alert("此姓名已經被其他同學的帳號綁定了！如果選錯請聯絡老師重置。"); return; }
                const update = {};
                update[`studentMappings.${user.uid}`] = selectedName;
                await db.collection('sessions').doc(sessionId).update(update);
            };

            const submitVote = async () => {
                if (session.criteria.some(c => scores[c.id] === undefined)) { alert("請拖曳所有滑桿完成評分！"); return; }
                setSubmitting(true);
                try {
                    await db.collection('sessions').doc(sessionId).collection('votes').add({
                        userId: user.uid, userName: registeredName, groupId: session.currentGroupId, scores, timestamp: firebase.firestore.FieldValue.serverTimestamp(), isDeleted: false
                    });
                    setHasVoted(true);
                } catch(e) { alert("送出失敗，請檢查網路"); } finally { setSubmitting(false); }
            };

            // 如果還沒綁定完成，顯示下拉選單讓學生挑選名字 (回歸你的要求)
            if (!registeredName) {
                const availableStudents = (session.students || []).filter(name => !Object.values(session.studentMappings || {}).includes(name));
                return (
                    <div className="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-8 text-center mt-10 animate-fade-in border-t-4 border-green-500">
                        <div className="flex justify-center text-green-500 mb-4"><Icons.User /></div>
                        <h2 className="text-2xl font-bold mt-2 mb-2 text-gray-800">請選擇您的真實姓名</h2>
                        <p className="text-gray-500 mb-6 text-sm">請從下方名單綁定您的身分</p>
                        
                        {(session.students||[]).length === 0 ? (
                            <div className="text-center text-red-500 bg-red-50 p-4 rounded-lg border border-red-200">
                                老師尚未建立名單，請稍後再試或通知老師。
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <select className="w-full p-4 border-2 border-gray-200 rounded-xl bg-gray-50 text-lg font-bold text-gray-700 focus:outline-none focus:border-green-500 transition" value={selectedName} onChange={e=>setSelectedName(e.target.value)}>
                                    <option value="">-- 點我選擇姓名 --</option>
                                    {availableStudents.map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                                <button onClick={handleRegister} disabled={!selectedName} className="w-full py-4 bg-green-500 text-white rounded-xl font-bold text-lg shadow-md hover:bg-green-600 transition disabled:bg-gray-300 transform active:scale-95">確認綁定並進入</button>
                            </div>
                        )}
                    </div>
                );
            }

            if (session.showResults) return <ResultsBoard session={session} sessionId={sessionId} groups={session.groups} criteria={session.criteria} isAdmin={false} />;

            if (!session.currentGroupId) return (
                <div className="text-center py-20 bg-white rounded-2xl shadow-lg mt-4 border border-gray-100 animate-fade-in">
                    <div className="text-gray-300 flex justify-center mb-6"><Icons.Lock /></div>
                    <h2 className="font-bold text-2xl text-gray-700">等待老師開放評分...</h2>
                    <p className="text-gray-400 mt-2">目前沒有正在報告的組別</p>
                </div>
            );

            if (hasVoted) return (
                <div className="text-center py-20 bg-green-50 rounded-2xl shadow-lg mt-4 border border-green-100 animate-fade-in">
                    <div className="text-green-500 flex justify-center mb-6 scale-150"><Icons.CheckCircle /></div>
                    <h2 className="font-bold text-3xl text-green-800">評分已送出！</h2>
                    <p className="text-green-600 mt-3 font-medium">請稍作休息，等待下一組開始。</p>
                </div>
            );

            const currentGroup = session.groups.find(g => g.id === session.currentGroupId);
            return (
                <div className="bg-white rounded-2xl shadow-xl p-6 sm:p-8 space-y-8 animate-fade-in border border-gray-100 mt-4">
                    <div className="border-b-2 border-blue-100 pb-4 flex flex-col sm:flex-row sm:items-end justify-between gap-2">
                        <div>
                            <div className="text-blue-500 text-sm font-bold mb-1 tracking-wide uppercase">目前評分對象</div>
                            <h2 className="text-3xl font-black text-blue-900">{currentGroup?.name}</h2>
                        </div>
                    </div>
                    
                    <div className="space-y-8">
                        {session.criteria.map(c => (
                            <div key={c.id} className="space-y-4 bg-gray-50 p-5 rounded-xl border border-gray-100 hover:border-blue-200 transition">
                                <div className="flex justify-between items-center">
                                    <label className="font-bold text-xl text-gray-800">{c.name}</label>
                                    <span className="text-sm bg-white px-3 py-1 rounded-full text-gray-500 border border-gray-200 shadow-sm font-mono">最高 {c.max} 分</span>
                                </div>
                                <div className="flex items-center gap-5">
                                    <input type="range" min="0" max={c.max} step="1" value={scores[c.id] || 0} onChange={e => setScores({...scores, [c.id]: parseInt(e.target.value)})} className="w-full h-4 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600 shadow-inner" />
                                    <div className="w-16 h-16 flex items-center justify-center bg-white text-blue-700 font-black text-2xl rounded-xl border-2 border-blue-100 shadow-md shrink-0">{scores[c.id] || 0}</div>
                                </div>
                            </div>
                        ))}
                    </div>
                    
                    <button onClick={submitVote} disabled={submitting} className="w-full py-5 bg-blue-600 text-white rounded-xl font-bold text-xl shadow-lg hover:bg-blue-700 hover:shadow-xl transition-all transform hover:-translate-y-1 active:scale-95 disabled:bg-gray-400 disabled:transform-none">
                        {submitting ? '資料傳送中...' : '✅ 確認送出分數'}
                    </button>
                </div>
            );
        }

        // --- 8. Results Board ---
        function ResultsBoard({ session, sessionId, groups, criteria, isAdmin }) {
            const [results, setResults] = React.useState([]);
            const [allVotes, setAllVotes] = React.useState([]);

            React.useEffect(() => {
                db.collection('sessions').doc(sessionId).collection('votes').get().then(snap => {
                    const votesData = [];
                    snap.forEach(d => votesData.push(d.data()));
                    setAllVotes(votesData);

                    const groupStats = {};
                    votesData.forEach(v => {
                        if (v.isDeleted) return;

                        if (!groupStats[v.groupId]) groupStats[v.groupId] = { total: 0, count: 0 };
                        let vTotal = 0;
                        (criteria||[]).forEach(c => vTotal += (v.scores[c.id] || 0));
                        groupStats[v.groupId].total += vTotal;
                        groupStats[v.groupId].count++;
                    });
                    const res = (groups||[]).map(g => ({
                        ...g, avg: groupStats[g.id]?.count ? (groupStats[g.id].total / groupStats[g.id].count).toFixed(2) : "0.00"
                    })).sort((a, b) => b.avg - a.avg);
                    setResults(res);
                });
            }, [session, sessionId, groups, criteria]);

            const handleExportExcel = () => {
                const wb = XLSX.utils.book_new();

                const borderStyle = {
                    top: { style: "thin", color: { rgb: "000000" } },
                    bottom: { style: "thin", color: { rgb: "000000" } },
                    left: { style: "thin", color: { rgb: "000000" } },
                    right: { style: "thin", color: { rgb: "000000" } }
                };

                const rankingHeaders = ["名次", "組名稱", "平均總分"];
                const rankingData = results.map((r, i) => [i + 1, r.name, r.avg]);
                
                const rankWsData = [
                    [`【${sessionId}】最終排行榜`, "", ""], 
                    rankingHeaders,         
                    ...rankingData          
                ];
                
                const rankWs = XLSX.utils.aoa_to_sheet(rankWsData);

                rankWs['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 2 } }];

                rankWs['!cols'] = [
                    { wch: 12 }, 
                    { wch: 30 }, 
                    { wch: 15 }  
                ];

                rankWs['!rows'] = [
                    { hpt: 30 }, 
                    { hpt: 18 }, 
                    ...rankingData.map(() => ({ hpt: 18 }))
                ];

                const rankRange = XLSX.utils.decode_range(rankWs['!ref']);
                for (let R = rankRange.s.r; R <= rankRange.e.r; ++R) {
                    for (let C = rankRange.s.c; C <= rankRange.e.c; ++C) {
                        const cell_address = XLSX.utils.encode_cell({ r: R, c: C });
                        if (!rankWs[cell_address]) continue;
                        if (!rankWs[cell_address].s) rankWs[cell_address].s = {};
                        
                        rankWs[cell_address].s.alignment = { horizontal: "center", vertical: "center", wrapText: true };
                        rankWs[cell_address].s.border = borderStyle;

                        if (R === 0) {
                            rankWs[cell_address].s.font = { bold: true, sz: 14 };
                        }
                    }
                }
                XLSX.utils.book_append_sheet(wb, rankWs, "最終排行榜");

                groups.forEach(group => {
                    const groupVotes = allVotes.filter(v => v.groupId === group.id);
                    const headers = ["評分學生", ...criteria.map(c => c.name), "總分", "備註"];
                    
                    const dataRows = groupVotes.map(v => {
                        const row = [v.userName];
                        let total = 0;
                        criteria.forEach(c => {
                            const score = v.scores[c.id] || 0;
                            row.push(score);
                            total += score;
                        });
                        row.push(total);
                        row.push(v.isDeleted ? "不採計" : "");
                        return row;
                    });

                    let validTotalSum = 0;
                    let validCount = 0;
                    
                    dataRows.forEach((row, index) => {
                        if (!groupVotes[index].isDeleted) {
                            validTotalSum += row[row.length - 2]; 
                            validCount++;
                        }
                    });
                    
                    const groupAvg = validCount > 0 ? (validTotalSum / validCount).toFixed(1) : "0.0";

                    const summaryRow = new Array(headers.length).fill("");
                    summaryRow[headers.length - 3] = "平均"; 
                    summaryRow[headers.length - 2] = groupAvg;

                    const allData = [headers, ...dataRows, summaryRow];
                    const ws = XLSX.utils.aoa_to_sheet(allData);

                    ws['!cols'] = headers.map(() => ({ wch: 12 }));
                    ws['!rows'] = allData.map(() => ({ hpt: 18 }));

                    const range = XLSX.utils.decode_range(ws['!ref']);
                    
                    for (let R = range.s.r; R <= range.e.r; ++R) {
                        for (let C = range.s.c; C <= range.e.c; ++C) {
                            const cell_address = XLSX.utils.encode_cell({ r: R, c: C });
                            if (!ws[cell_address]) continue;

                            if (!ws[cell_address].s) ws[cell_address].s = {};
                            ws[cell_address].s.alignment = { horizontal: "center", vertical: "center", wrapText: true };
                            ws[cell_address].s.border = borderStyle;

                            if (C === range.e.c) {
                                if (ws[cell_address].v === "不採計") {
                                    ws[cell_address].s.font = { color: { rgb: "FF0000" } };
                                }
                            }

                            if (R > 0 && R < range.e.r && C === range.e.c - 1) {
                                ws[cell_address].s.font = { color: { rgb: "0000FF" } };
                            }

                            if (R === range.e.r) {
                                if (C === range.e.c - 2) {
                                    ws[cell_address].s.font = { color: { rgb: "FF0000" }, bold: true };
                                }
                                if (C === range.e.c - 1) {
                                    ws[cell_address].s.font = { color: { rgb: "FF0000" } };
                                }
                            }
                        }
                    }

                    let sheetName = group.name.replace(/[\\/?*\[\]]/g, ""); 
                    if(sheetName.length > 30) sheetName = sheetName.substring(0,30);
                    if(!sheetName) sheetName = `Group ${group.id}`;
                    
                    XLSX.utils.book_append_sheet(wb, ws, sheetName);
                });

                XLSX.writeFile(wb, `評分結果_${sessionId}.xlsx`);
            };

            return (
                <div className="bg-white p-6 rounded-xl shadow-lg border border-gray-100 animate-fade-in mt-4">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 border-b pb-4 gap-4">
                        <h2 className="text-2xl font-bold flex items-center gap-2 text-blue-800"><Icons.BarChart3 /> 最終排行榜</h2>
                        {isAdmin && (
                            <button 
                                onClick={handleExportExcel}
                                className="w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-lg flex items-center justify-center gap-2 font-bold shadow-md transition-colors"
                            >
                                <Icons.Download /> 匯出 Excel 報表
                            </button>
                        )}
                    </div>

                    <div className="space-y-4">
                        {results.length === 0 && <p className="text-center text-gray-400 py-8">尚無任何評分資料</p>}
                        {results.map((g, i) => (
                            <div key={g.id} className={`flex justify-between items-center p-5 rounded-xl transition-all shadow-sm ${i === 0 && g.avg > 0 ? 'bg-yellow-50 border-2 border-yellow-400 transform scale-[1.02]' : 'border border-gray-200 bg-white hover:border-blue-300'}`}>
                                <div className="flex items-center gap-4">
                                    <div className={`w-12 h-12 rounded-full flex items-center justify-center font-black text-xl text-white shadow-md ${i===0 && g.avg > 0 ?'bg-gradient-to-br from-yellow-400 to-yellow-600':i===1 && g.avg > 0 ?'bg-gradient-to-br from-gray-300 to-gray-500':i===2 && g.avg > 0 ?'bg-gradient-to-br from-orange-300 to-orange-500':'bg-gray-200 text-gray-500'}`}>{i+1}</div>
                                    <span className={`text-xl ${i===0 && g.avg > 0 ? 'font-black text-gray-900' : 'font-bold text-gray-700'}`}>{g.name}</span>
                                </div>
                                <div className="text-right">
                                    <span className="text-4xl font-black text-blue-600 block leading-none mb-1">{g.avg}</span>
                                    <span className="text-xs text-gray-400 font-bold tracking-widest uppercase">平均總分</span>
                                </div>
                            </div>
                        ))}
                    </div>
                    {!isAdmin && <div className="mt-8 pt-4 border-t text-center text-gray-400 text-sm font-medium">🎉 感謝您的參與，所有評分皆已結算完畢 🎉</div>}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
