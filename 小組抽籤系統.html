<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小組抽籤系統 - 阿發老師設計</title>
    <style>
        :root {
            --bg-color: #050508; /* 深邃宇宙黑 */
            --panel-bg: rgba(20, 20, 28, 0.85);
            --neon-cyan: #00f2ff;
            --neon-pink: #ff00ea;
            --neon-green: #28a745;
            --neon-yellow: #ffcc00;
            --neon-purple: #9d00ff;
            --text-main: #e0e0e0;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            display: flex;
            height: 100vh;
        }

        /* 畫布全屏，但在層級上位於背景 */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }

        /* 左側控制面板 */
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 300px;
            max-height: 85vh;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(0, 242, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
            overflow-y: auto;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        /* 右側結果面板 - 寬度 480px */
        .result-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            bottom: 20px;
            width: 480px; 
            background: rgba(15, 15, 20, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 12px;
            border: 1px solid rgba(255, 0, 234, 0.3);
            box-shadow: -5px 0 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        .result-header {
            padding: 15px;
            background: linear-gradient(90deg, rgba(255,0,234,0.1), transparent);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: var(--neon-pink);
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 結果卡片動畫 */
        .result-card {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--neon-cyan);
            padding: 15px; 
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: all 0.3s;
        }

        .result-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-5px);
        }

        /* 序號放大 */
        .order-badge {
            background: var(--neon-cyan);
            color: #000;
            font-weight: bold;
            width: 36px;       
            height: 36px;       
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem; 
            margin-right: 15px;
        }

        /* 名字放大 1.5 倍且改為黃色 */
        .result-name {
            font-size: 1.8rem; 
            font-weight: bold;
            flex: 1;
            color: var(--neon-yellow); 
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* 通用元件樣式 */
        h2 { margin: 0 0 15px 0; color: var(--neon-cyan); font-size: 1.1rem; line-height: 1.4; text-shadow: 0 0 5px rgba(0, 242, 255, 0.5); }
        
        textarea {
            width: 100%;
            height: 120px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #444;
            color: var(--neon-cyan);
            border-radius: 6px;
            padding: 8px;
            box-sizing: border-box;
            resize: vertical;
        }

        .controls { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }

        button {
            cursor: pointer;
            padding: 12px;
            border-radius: 6px;
            border: none;
            background: linear-gradient(135deg, var(--neon-cyan), #0066ff);
            color: #000;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }
        
        button::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(45deg) translate(-100%, 0);
            transition: 0.5s;
        }
        
        button:hover::after { transform: rotate(45deg) translate(100%, 0); }
        button:hover { box-shadow: 0 0 20px var(--neon-cyan); transform: scale(1.02); color: white; }
        button:active { transform: scale(0.98); }

        button.reset-btn {
            background: transparent;
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
        }
        button.reset-btn:hover { background: var(--neon-pink); color: white; box-shadow: 0 0 15px var(--neon-pink); }

        /* 綠色匯出按鈕樣式 */
        button.btn-success {
            background: linear-gradient(135deg, #28a745, #1e7e34);
            color: white;
        }
        button.btn-success:hover {
            box-shadow: 0 0 20px var(--neon-green);
        }

        /* 紫色按鈕樣式 (一鍵完成 & 雲端) */
        button.btn-purple {
            background: linear-gradient(135deg, #a55eea, #7d3ac1);
            color: white;
        }
        button.btn-purple:hover {
            box-shadow: 0 0 20px var(--neon-purple);
        }

        /* 雲端面板樣式 */
        #cloud-panel {
            display: none;
            border: 1px solid var(--neon-purple);
            box-shadow: 0 0 20px rgba(165, 94, 234, 0.3);
        }
        .cloud-input {
            width: 100%;
            padding: 10px;
            font-size: 1.1rem;
            text-align: center;
            border-radius: 5px;
            border: 1px solid var(--neon-purple);
            background: rgba(0,0,0,0.5);
            color: var(--neon-cyan);
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .cloud-input:focus {
            outline: none;
            box-shadow: 0 0 10px var(--neon-purple);
        }

        /* 暫時顯示的獲勝者提示 (Toast) */
        .toast-overlay {
            position: absolute;
            top: 40%;
            left: 40%; 
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 20;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .toast-name {
            font-size: 4rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink);
            background: rgba(0,0,0,0.6);
            padding: 20px 40px;
            border-radius: 20px;
            border: 2px solid var(--neon-pink);
            backdrop-filter: blur(5px);
        }

        /* 卷軸美化 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-cyan); }

        .physics-label {
            font-size: 0.75rem;
            color: #888;
            margin-top: 5px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <!-- 左側設定面板 -->
    <div class="ui-overlay" id="settingPanel">
        <h2>🌀 小組抽籤系統<br>---阿發老師設計</h2>
        
        <label style="font-size: 0.9rem; color: #aaa;">輸入名單（每行一個，或逗點隔開）</label>
        <textarea id="nameInput" onchange="updateWheelData()">愛因斯坦, 牛頓, 居禮夫人, 費曼, 霍金, 薛丁格, 普朗克, 特斯拉</textarea>
        
        <div class="controls">
            <!-- 雲端按鈕 -->
            <button onclick="toggleCloudPanel()" class="btn-purple">☁️ 雲端存取 (存/取名單)</button>

            <div style="display: flex; gap: 8px;">
                <button onclick="updateWheelData()" style="flex:1; font-size: 0.9rem;">更新名單</button>
                <button onclick="shuffleNames()" style="flex:1; background: linear-gradient(135deg, #ffcc00, #ff9900); font-size: 0.9rem;">🔀 打散名單</button>
            </div>
            
            <button id="spinBtn" style="height: 50px; font-size: 1.2rem;">⚡ 旋轉輪盤 (開始抽籤)</button>
            
            <div style="margin-top: 10px;">
                <div class="physics-label">
                    <span>阻力係數：</span>
                    <span id="fricVal">0.985</span>
                </div>
                <input type="range" id="frictionSlider" min="950" max="995" value="985" style="width: 100%;">
            </div>

            <button onclick="autoComplete()" class="btn-purple" style="margin-top: 5px;">⚡ 一鍵完成排序</button>

            <button onclick="exportToExcel()" class="btn-success" style="margin-top: 5px;">📤 把抽籤結果匯出成Excel檔</button>
        </div>
    </div>

    <!-- 雲端控制面板 (隱藏) -->
    <div class="ui-overlay" id="cloud-panel">
        <h2 style="color: var(--neon-purple);">☁️ 雲端設定存取</h2>
        <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 15px;">輸入教室代碼（數字）以儲存或讀取設定。</p>
        
        <input type="text" id="cloud-code" class="cloud-input" placeholder="請輸入代碼 (例如: 8888)">
        
        <div class="controls">
            <button onclick="saveToCloud()" style="background: linear-gradient(135deg, #a55eea, #7d3ac1); color: white;">⬆️ 上傳設定 (儲存)</button>
            <button onclick="loadFromCloud()" style="background: linear-gradient(135deg, #00f2ff, #0066ff); color: black;">⬇️ 下載設定 (讀取)</button>
            <button onclick="toggleCloudPanel()" style="background: #444; color: #aaa;">關閉視窗</button>
        </div>
        <p id="cloud-status" style="font-size: 0.8rem; color: var(--neon-yellow); text-align: center; margin-top:10px; min-height: 1.2em;"></p>
    </div>

    <!-- 畫布 -->
    <canvas id="canvas"></canvas>

    <!-- 臨時獲勝者顯示 (Toast) -->
    <div class="toast-overlay" id="toast">
        <div style="color: var(--neon-cyan); font-size: 1.2rem; margin-bottom: 5px;">🏆 本日最幸運</div>
        <div class="toast-name" id="toastName">Name</div>
    </div>

    <!-- 右側結果面板 -->
    <div class="result-panel">
        <div class="result-header">
            <span>📋 抽籤順序結果</span>
            <button class="reset-btn" onclick="clearResults()" style="font-size: 0.8rem; padding: 5px 10px;">清空</button>
        </div>
        <div class="result-list" id="resultList">
            <!-- 結果會動態插入這裡 -->
            <div style="text-align: center; color: #555; margin-top: 20px; font-style: italic;">
                尚未產生數據<br>Waiting for experiment...
            </div>
        </div>
    </div>

    <!-- Firebase 模組 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // *** Firebase Config ***
        const firebaseConfig = {
          apiKey: "AIzaSyAY0leEwzJ5n085J9AqCt6vN7XEv-jqpXI",
          authDomain: "hahaha-c46df.firebaseapp.com",
          projectId: "hahaha-c46df",
          storageBucket: "hahaha-c46df.firebasestorage.app",
          messagingSenderId: "366156547809",
          appId: "1:366156547809:web:60f43df1d76d70080559a0",
          measurementId: "G-CP8Q172WD3"
        };

        let db, user;

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            db = getFirestore(app);

            signInAnonymously(auth).then((userCredential) => {
                user = userCredential.user;
                console.log("Firebase Connected");
                showStatus("雲端連線成功！");
            }).catch((error) => {
                console.error("Auth Error", error);
                showStatus("連線失敗");
            });
        } catch (e) {
            console.error("Firebase Init Error", e);
        }

        function showStatus(msg) {
            const el = document.getElementById('cloud-status');
            if(el) el.textContent = msg;
        }

        // 上傳功能
        window.saveToCloud = async function() {
            if (!db || !user) { alert("尚未連線到雲端資料庫。"); return; }
            
            const code = document.getElementById('cloud-code').value.trim();
            if (!code) { alert("請輸入教室代碼！"); return; }

            const names = document.getElementById('nameInput').value;

            showStatus("上傳中...");
            try {
                // 儲存到 'group_draw_settings' 集合
                await setDoc(doc(db, 'group_draw_settings', code), {
                    names: names,
                    updatedAt: new Date().toISOString()
                });
                showStatus("✅ 上傳成功！");
                alert(`名單已儲存！\n代碼：「${code}」`);
            } catch (e) {
                console.error(e);
                showStatus("❌ 上傳失敗");
            }
        };

        // 下載功能
        window.loadFromCloud = async function() {
            if (!db || !user) { alert("尚未連線到雲端資料庫。"); return; }

            const code = document.getElementById('cloud-code').value.trim();
            if (!code) { alert("請輸入教室代碼！"); return; }

            showStatus("讀取中...");
            try {
                const docSnap = await getDoc(doc(db, 'group_draw_settings', code));

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('nameInput').value = data.names;
                    
                    // 呼叫原本的更新函式
                    window.updateWheelData();
                    
                    showStatus("✅ 下載成功！");
                    window.toggleCloudPanel(); // 關閉面板
                    alert("名單已更新！");
                } else {
                    showStatus("⚠️ 找不到此代碼資料");
                    alert("找不到此代碼的資料。");
                }
            } catch (e) {
                console.error(e);
                showStatus("❌ 讀取失敗");
            }
        };
    </script>

<script>
    // --- 音效系統 ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playTick(freq = 400, type = 'sine', volume = 0.1, duration = 0.05) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // --- 變數初始化 ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const nameInput = document.getElementById('nameInput');
    const resultList = document.getElementById('resultList');
    const toast = document.getElementById('toast');
    const toastName = document.getElementById('toastName');

    let names = [];
    let colors = [];
    let results = []; 
    
    // 物理變數
    let angle = 0;
    let angularVel = 0;
    let isSpinning = false;
    let isStopping = false;
    let friction = 0.985;
    let lastTickIndex = -1;
    let autoSortInterval = null; // 用於一鍵排序的計時器
    
    // 佈局變數
    let centerX = 0;
    let centerY = 0;
    let radius = 0;

    let particles = []; 
    
    // 初始化尺寸
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        // 輪盤中心保持在 40%
        centerX = canvas.width * 0.4; 
        centerY = canvas.height * 0.5;
        
        let availableWidth = canvas.width - 320 - 500;
        if(availableWidth < 0) availableWidth = 300; 
        
        radius = Math.min(centerX * 0.85, canvas.height * 0.4);
    }
    window.addEventListener('resize', resize);
    resize();

    // --- 雲端面板切換 ---
    function toggleCloudPanel() {
        const settingPanel = document.getElementById('settingPanel');
        const cloudPanel = document.getElementById('cloud-panel');
        
        if (cloudPanel.style.display === 'block') {
            cloudPanel.style.display = 'none';
            settingPanel.style.opacity = '1';
            settingPanel.style.pointerEvents = 'auto';
        } else {
            cloudPanel.style.display = 'block';
            settingPanel.style.opacity = '0.3'; // 讓背景變暗
            settingPanel.style.pointerEvents = 'none'; // 暫時禁用背景點擊
        }
    }
    window.toggleCloudPanel = toggleCloudPanel;

    // --- 資料處理 ---
    function updateWheelData() {
        const raw = nameInput.value;
        names = raw.split(/[\n,]+/).map(n => n.trim()).filter(n => n !== "");
        colors = names.map((_, i) => {
            const hue = (i * 360 / names.length) % 360;
            return `hsl(${hue}, 80%, 60%)`;
        });
        angle = 0; 
    }
    window.updateWheelData = updateWheelData;
    updateWheelData();

    function shuffleNames() {
        if (isSpinning) return;
        for (let i = names.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [names[i], names[j]] = [names[j], names[i]];
        }
        nameInput.value = names.join(', ');
        updateWheelData();
        playTick(500, 'sine', 0.1, 0.2);
    }
    window.shuffleNames = shuffleNames;

    function clearResults() {
        results = [];
        resultList.innerHTML = '<div style="text-align: center; color: #555; margin-top: 20px; font-style: italic;">尚未產生數據<br>Waiting for experiment...</div>';
        if (autoSortInterval) clearInterval(autoSortInterval);
        isSpinning = false;
    }
    window.clearResults = clearResults;

    // 匯出 Excel
    function exportToExcel() {
        if (results.length === 0) {
            alert("目前沒有抽籤結果可以匯出喔！");
            return;
        }

        let xmlContent = `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:x="urn:schemas-microsoft-com:office:excel"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:html="http://www.w3.org/TR/REC-html40">
 <Styles>
  <Style ss:ID="Default" ss:Name="Normal">
   <Alignment ss:Vertical="Center"/>
   <Borders/>
   <Font ss:FontName="新細明體" x:CharSet="136" x:Family="Roman" ss:Size="12" ss:Color="#000000"/>
   <Interior/>
   <NumberFormat/>
   <Protection/>
  </Style>
  <Style ss:ID="sBorder">
   <Borders>
    <Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/>
    <Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/>
    <Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/>
    <Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/>
   </Borders>
   <Alignment ss:Horizontal="Center" ss:Vertical="Center"/>
  </Style>
 </Styles>
 <Worksheet ss:Name="抽籤結果">
  <Table ss:ExpandedColumnCount="2" ss:ExpandedRowCount="${results.length + 1}" x:FullColumns="1"
   x:FullRows="1" ss:DefaultRowHeight="30">
   <Column ss:AutoFitWidth="0" ss:Width="60"/> 
   <Column ss:AutoFitWidth="0" ss:Width="180"/> 
   <Row ss:Height="30">
    <Cell ss:StyleID="sBorder"><Data ss:Type="String">序號</Data></Cell>
    <Cell ss:StyleID="sBorder"><Data ss:Type="String">船艦名稱</Data></Cell>
   </Row>`;

        results.forEach((name, index) => {
            xmlContent += `
   <Row ss:Height="30">
    <Cell ss:StyleID="sBorder"><Data ss:Type="Number">${index + 1}</Data></Cell>
    <Cell ss:StyleID="sBorder"><Data ss:Type="String">${name}</Data></Cell>
   </Row>`;
        });

        xmlContent += `
  </Table>
 </Worksheet>
</Workbook>`;

        const blob = new Blob([xmlContent], { type: "application/vnd.ms-excel" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "抽籤結果.xls");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    window.exportToExcel = exportToExcel;

    // --- 核心邏輯：旋轉 ---
    spinBtn.addEventListener('click', () => {
        if (isSpinning || names.length === 0) return;
        
        isSpinning = true;
        isStopping = false; 
        angularVel = 0.35 + Math.random() * 0.45; 
        playTick(600, 'square', 0.15, 0.1);
    });

    // 一鍵完成排序邏輯
    function autoComplete() {
        if (isSpinning || names.length === 0) return;
        
        // 鎖定狀態
        isSpinning = true;
        
        autoSortInterval = setInterval(() => {
            if (names.length === 0) {
                clearInterval(autoSortInterval);
                isSpinning = false;
                createParticles(canvas.width/2, canvas.height/2, 200, '#ffffff'); // 結束煙火
                return;
            }

            // 隨機選一個
            const randomIndex = Math.floor(Math.random() * names.length);
            const winnerName = names[randomIndex];

            // 加入結果
            results.push(winnerName);
            addResultCard(results.length, winnerName);
            
            // 視覺特效
            playTick(800, 'triangle', 0.1, 0.1);
            createParticles(centerX, centerY - radius * 0.5, 10, '#a55eea');

            // 移除並更新 UI
            names.splice(randomIndex, 1);
            nameInput.value = names.join(', ');
            updateWheelData();

        }, 300); // 每 300 毫秒抽出一個
    }
    window.autoComplete = autoComplete;

    // 處理獲勝邏輯 (原本的旋轉抽籤)
    function handleWin(winnerIndex) {
        const winnerName = names[winnerIndex];
        
        toastName.innerText = winnerName;
        toast.style.opacity = 1;
        toast.style.transform = "translate(-50%, -50%) scale(1.1)";
        
        playTick(800, 'triangle', 0.2, 0.5);

        createParticles(centerX, centerY - radius, 50, colors[winnerIndex]);

        results.push(winnerName);
        addResultCard(results.length, winnerName);

        setTimeout(() => {
            toast.style.opacity = 0;
            toast.style.transform = "translate(-50%, -50%) scale(1)";

            names.splice(winnerIndex, 1);
            
            // 自動清空最後一支籤
            if (names.length === 1) {
                const lastName = names[0];
                results.push(lastName);
                addResultCard(results.length, lastName);
                names = []; 
            }

            nameInput.value = names.join(', ');
            updateWheelData(); 
            
            isSpinning = false; 
            
            if (names.length === 0) {
                createParticles(canvas.width/2, canvas.height/2, 200, '#ffffff');
            }
        }, 1000); 
    }

    function addResultCard(order, name) {
        if (results.length === 1) resultList.innerHTML = '';

        const card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = `
            <div class="order-badge">${order}</div>
            <div class="result-name">${name}</div>
        `;
        resultList.appendChild(card);
        resultList.scrollTop = resultList.scrollHeight;
    }

    // --- 繪圖與動畫循環 ---
    
    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            this.color = color;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5 + 2;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.life = 1.0;
            this.decay = Math.random() * 0.03 + 0.01;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.1; 
            this.life -= this.decay;
        }
        draw(ctx) {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    function createParticles(x, y, count, color) {
        for(let i=0; i<count; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function animate() {
        ctx.fillStyle = 'rgba(5, 5, 8, 0.2)'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const fSlider = document.getElementById('frictionSlider');
        friction = fSlider.value / 1000;
        document.getElementById('fricVal').innerText = friction.toFixed(3);

        if (isSpinning) {
            // 如果是一鍵排序模式，不執行旋轉物理
            if (!autoSortInterval) {
                angle += angularVel;
                angularVel *= friction;

                if (names.length > 0) {
                    const slice = (Math.PI * 2) / names.length;
                    const currentTickIndex = Math.floor(((angle % (Math.PI * 2)) + (Math.PI * 2)) % (Math.PI * 2) / slice);
                    if (currentTickIndex !== lastTickIndex && angularVel > 0.005) {
                        playTick(300 + angularVel * 200, 'sine', 0.05 + angularVel * 0.1);
                        lastTickIndex = currentTickIndex;
                    }
                }

                if (angularVel < 0.001) {
                    if (!isStopping) {
                        isStopping = true; 
                        angularVel = 0;
                        
                        const pointerAngle = 1.5 * Math.PI; 
                        const slice = (Math.PI * 2) / names.length;
                        let finalAngle = (pointerAngle - angle) % (Math.PI * 2);
                        if (finalAngle < 0) finalAngle += Math.PI * 2;
                        
                        const winnerIndex = Math.floor(finalAngle / slice);
                        
                        if (names[winnerIndex]) {
                            handleWin(winnerIndex);
                        } else {
                            isSpinning = false;
                        }
                    }
                }
            } else {
                // 自動排序時，輪盤慢速空轉裝飾
                angle += 0.02;
            }
        }

        // 繪製輪盤
        if (names.length > 0) {
            const slice = (Math.PI * 2) / names.length;
            
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(angle);

            names.forEach((name, i) => {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, i * slice, (i + 1) * slice);
                ctx.fillStyle = colors[i];
                ctx.fill();
                
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.rotate(i * slice + slice / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                const fontSize = Math.min(radius/6, 24); 
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.shadowColor = "rgba(0,0,0,0.8)";
                ctx.shadowBlur = 4;
                ctx.fillText(name, radius - 20, 8);
                ctx.restore();
            });
            ctx.restore();
            
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.beginPath();
            ctx.arc(0, 0, radius + 5, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(0, 242, 255, ${0.3 + angularVel * 2})`;
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.restore();
        } else {
            ctx.fillStyle = "#444";
            ctx.font = "30px Arial";
            ctx.textAlign = "center";
            ctx.fillText("EMPTY SYSTEM", centerX, centerY);
        }

        // 繪製指針
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.beginPath();
        ctx.moveTo(-15, -radius - 10);
        ctx.lineTo(15, -radius - 10);
        ctx.lineTo(0, -radius + 25);
        ctx.fillStyle = '#ff00ea';
        ctx.shadowColor = '#ff00ea';
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.restore();

        // 中心裝飾蓋
        ctx.beginPath();
        ctx.arc(centerX, centerY, 15, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();

        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw(ctx);
            if (particles[i].life <= 0) particles.splice(i, 1);
        }

        requestAnimationFrame(animate);
    }
    
    // [Removed] togglePanel function is no longer needed

    animate();

</script>
</body>
