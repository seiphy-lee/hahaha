<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課堂共同評分系統 - 老師後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #fffbeb; }
        ::-webkit-scrollbar-thumb { background: #fcd34d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #f59e0b; }
        #global-error-box { display: none; position: fixed; top: 0; left: 0; width: 100%; padding: 20px; background: #fee2e2; color: #b91c1c; z-index: 9999; border-bottom: 2px solid #ef4444; }
    </style>
</head>
<body class="bg-amber-50 text-gray-800">
    <div id="global-error-box">
        <h3 class="font-bold text-lg">⚠️ 發生錯誤</h3>
        <pre id="global-error-msg" class="mt-2 text-sm whitespace-pre-wrap"></pre>
        <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">重新整理</button>
    </div>
    <div id="root"></div>
    <script>
        window.onerror = function(msg, url, line, col, error) {
            document.getElementById('global-error-box').style.display = 'block';
            document.getElementById('global-error-msg').innerText = `錯誤: ${msg}\n位置: ${line}:${col}`;
            return false;
        };
    </script>

    <script type="text/babel" data-presets="env,react">

        // ── Firebase 設定 ──────────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyAmqdU3AimELr5sa9FIFd_eb5zbM0nCFkI",
            authDomain: "evaluate-each-other-5d4bf.firebaseapp.com",
            projectId: "evaluate-each-other-5d4bf",
            storageBucket: "evaluate-each-other-5d4bf.firebasestorage.app",
            messagingSenderId: "323924183931",
            appId: "1:323924183931:web:945c1feceaa4593d000bde",
            measurementId: "G-GBZKXN3H26"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ── 預設評分項目 ───────────────────────────────────────────────
        const DEFAULT_CRITERIA = [
            { id: 'c1', name: '內容深度',   max: 10 },
            { id: 'c2', name: '表達技巧',   max: 10 },
            { id: 'c3', name: '投影片設計', max: 10 },
            { id: 'c4', name: '團隊合作',   max: 10 },
            { id: 'c5', name: '時間控制',   max: 10 },
        ];

        // ── 心跳設定 ──────────────────────────────────────────────────
        const HEARTBEAT_INTERVAL_MS = 8000;
        const OFFLINE_THRESHOLD_MS  = 20000;

        function isStudentOnline(onlineStudents, studentName, nowMs) {
            if (!onlineStudents) return false;
            return Object.values(onlineStudents).some(entry => {
                if (!entry || typeof entry !== 'object') return false;
                if (entry.name !== studentName) return false;
                const ts = entry.lastSeen;
                if (!ts) return false;
                const lastSeenMs = typeof ts.toMillis === 'function' ? ts.toMillis() : (ts.seconds ? ts.seconds * 1000 : 0);
                return (nowMs - lastSeenMs) < OFFLINE_THRESHOLD_MS;
            });
        }
        function countOnlineStudents(onlineStudents, nowMs) {
            if (!onlineStudents) return 0;
            return Object.values(onlineStudents).filter(entry => {
                if (!entry || typeof entry !== 'object') return false;
                const ts = entry.lastSeen;
                if (!ts) return false;
                const lastSeenMs = typeof ts.toMillis === 'function' ? ts.toMillis() : (ts.seconds ? ts.seconds * 1000 : 0);
                return (nowMs - lastSeenMs) < OFFLINE_THRESHOLD_MS;
            }).length;
        }

        // ── Icons ──────────────────────────────────────────────────────
        const Icons = {
            Award:       () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>,
            User:        () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Users:       () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            BarChart3:   () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>,
            LogOut:      () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
            Key:         () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>,
            Trash2:      () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
            Trash:       () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
            X:           () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            ArrowLeft:   () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>,
            Download:    () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
            Link:        () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>,
            Google:      () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.6 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16.1 19 13 24 13c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.6 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.4 35.4 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-8H6.3C9.7 35.7 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.6l6.2 5.2C37.4 38.8 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>,
        };

        // ══════════════════════════════════════════════════════════════
        //  App 主元件
        // ══════════════════════════════════════════════════════════════
        function App() {
            const [user,        setUser]        = React.useState(null);
            const [loading,     setLoading]     = React.useState(true);
            const [currentRoom, setCurrentRoom] = React.useState(null);
            const [sessionData, setSessionData] = React.useState(null);
            const [inputRoom,   setInputRoom]   = React.useState('');
            const [errorMsg,    setErrorMsg]    = React.useState(null);
            const [isEntering,  setIsEntering]  = React.useState(false);

            // 監聽登入狀態
            React.useEffect(() => {
                return auth.onAuthStateChanged(u => {
                    setUser(u);
                    setLoading(false);
                });
            }, []);

            // 監聽當前房間資料
            React.useEffect(() => {
                if (!currentRoom) return;
                const unsub = db.collection('sessions').doc(currentRoom).onSnapshot(snap => {
                    if (snap.exists) setSessionData(snap.data());
                }, err => console.error("監聽失敗", err));
                return () => unsub();
            }, [currentRoom]);

            // Google 登入
            const handleGoogleLogin = async () => {
                try {
                    setErrorMsg(null);
                    await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
                } catch(e) {
                    if (e.code === 'auth/unauthorized-domain') {
                        setErrorMsg(`網域未授權！請至 Firebase Console 新增：${window.location.hostname}`);
                    } else {
                        setErrorMsg(`登入失敗：${e.message}`);
                    }
                }
            };

            // 登出
            const handleLogout = () => {
                auth.signOut();
                setCurrentRoom(null);
                setSessionData(null);
            };

            // 進入或建立教室
            const handleEnterRoom = async () => {
                const roomID = inputRoom.trim();
                if (!roomID) { setErrorMsg("請輸入教室名稱"); return; }
                setIsEntering(true);
                setErrorMsg(null);
                try {
                    const roomRef = db.collection('sessions').doc(roomID);
                    const snap    = await roomRef.get();

                    if (snap.exists) {
                        const data = snap.data();
                        const isOwner    = data.ownerUid === user.uid;
                        const isCoOwner  = (data.coOwners || []).includes(user.uid);
                        if (!isOwner && !isCoOwner) {
                            throw new Error("這間教室屬於其他老師，且您不在協同管理者名單內。請確認您使用正確的帳號登入，或請教室建立者將您加入協同管理者。");
                        }
                    } else {
                        // 教室不存在：自動建立，並記錄建立者 UID
                        await roomRef.set({
                            ownerUid:    user.uid,
                            ownerEmail:  user.email,
                            coOwners:    [], // 協同管理者 UID 陣列
                            status:      'setup',
                            currentGroupId: null,
                            showResults: false,
                            criteria:    DEFAULT_CRITERIA,
                            groups:      [],
                            students:    [],
                            studentMappings:  {},
                            onlineStudents:   {},
                            createdAt:   firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                    setCurrentRoom(roomID);
                } catch(e) {
                    setErrorMsg(e.message);
                } finally {
                    setIsEntering(false);
                }
            };

            // ── 載入畫面 ──
            if (loading) return <div className="h-screen flex items-center justify-center font-bold text-gray-500">載入系統中...</div>;

            // ── 未登入畫面 ──
            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-orange-50 to-amber-200 p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md animate-fade-in border-t-4 border-orange-500 text-center">
                            <div className="flex justify-center text-orange-500 mb-4"><Icons.Key /></div>
                            <h1 className="text-3xl font-black text-orange-600 mb-2">學生共同評分系統</h1>
                            <p className="text-orange-500 font-bold mb-1 text-lg">台中二中 阿發老師設計</p>
                            <p className="text-gray-400 text-sm mb-8">老師後台管理系統</p>
                            {errorMsg && (
                                <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 text-left border border-red-100 flex gap-2">
                                    <Icons.X /><span>{errorMsg}</span>
                                </div>
                            )}
                            <button onClick={handleGoogleLogin}
                                className="w-full py-4 bg-orange-500 text-white rounded-xl hover:bg-orange-600 flex items-center justify-center gap-3 font-bold transition shadow-lg active:scale-95 text-lg">
                                <Icons.Google /> 使用 Google 帳號登入
                            </button>
                            <p className="text-xs text-gray-400 mt-4">登入後即可建立或進入教室</p>
                        </div>
                    </div>
                );
            }

            // ── 已登入但未進入教室 ──
            if (!currentRoom) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-orange-50 to-amber-200 p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md animate-fade-in border-t-4 border-orange-500">
                            <div className="flex items-center gap-3 mb-6 pb-4 border-b border-orange-100">
                                <div className="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center text-orange-600">
                                    <Icons.User />
                                </div>
                                <div>
                                    <p className="font-bold text-gray-800">{user.displayName}</p>
                                    <p className="text-xs text-gray-400">{user.email}</p>
                                </div>
                                <button onClick={handleLogout} className="ml-auto text-red-400 hover:text-red-600 text-sm font-bold flex items-center gap-1 border border-red-100 px-2 py-1 rounded hover:bg-red-50 transition">
                                    <Icons.LogOut /> 登出
                                </button>
                            </div>
                            <h2 className="text-xl font-bold text-gray-700 mb-6">請輸入教室名稱</h2>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">教室名稱（建議使用班級代號）</label>
                                    <input type="text" value={inputRoom} onChange={e=>setInputRoom(e.target.value)}
                                        onKeyDown={e=>e.key==='Enter'&&handleEnterRoom()}
                                        className="w-full border-2 border-orange-200 p-3 rounded-lg focus:outline-none focus:border-orange-500 bg-orange-50/50 transition-colors"
                                        placeholder="例如：台中二中101甲" />
                                </div>
                                {errorMsg && (
                                    <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm flex gap-2 border border-red-100">
                                        <Icons.X /><span>{errorMsg}</span>
                                    </div>
                                )}
                                <button onClick={handleEnterRoom} disabled={isEntering}
                                    className="w-full py-4 bg-orange-500 text-white rounded-xl font-bold hover:bg-orange-600 flex items-center justify-center gap-2 transition disabled:opacity-50 shadow-lg active:scale-95">
                                    <Icons.Award /> {isEntering ? '處理中...' : '進入 / 建立教室'}
                                </button>
                                <p className="text-xs text-orange-400 text-center">首次輸入新名稱將自動建立教室；同名教室僅建立者或協同管理者可進入。</p>
                            </div>
                        </div>
                    </div>
                );
            }

            // ── 已進入教室：顯示後台 ──
            return (
                <div className="min-h-screen bg-amber-50 pb-10">
                    <header className="bg-white shadow px-4 py-3 sticky top-0 z-20 flex justify-between items-center">
                        <div className="flex items-center gap-2 text-orange-600 font-bold text-xl md:text-2xl truncate">
                            <Icons.Award /> 學生共同評分系統（老師後台）
                        </div>
                        <div className="flex items-center gap-3">
                            <span className="text-sm font-bold text-gray-500 bg-orange-50 px-3 py-1 rounded-full hidden md:inline-block border border-orange-100">
                                {user.displayName}
                            </span>
                            <span className="text-sm font-bold px-3 py-1 rounded-full hidden md:inline-block bg-orange-100 text-orange-800">
                                管理員
                            </span>
                            <button onClick={handleLogout} className="text-red-500 hover:bg-red-50 px-3 py-1 rounded flex items-center gap-1 font-bold text-sm transition border border-red-100">
                                <Icons.LogOut /> 登出
                            </button>
                        </div>
                    </header>
                    <main className="max-w-5xl mx-auto p-4">
                        {sessionData
                            ? <TeacherDashboard session={sessionData} roomName={currentRoom} teacherUid={user.uid} />
                            : <div className="p-10 text-center text-gray-400">正在讀取教室資料...</div>
                        }
                    </main>
                </div>
            );
        }

        // ══════════════════════════════════════════════════════════════
        //  TeacherDashboard（原版功能完整保留，僅移除密碼相關邏輯）
        // ══════════════════════════════════════════════════════════════
        function TeacherDashboard({ session, roomName, teacherUid }) {
            const [activeTab,              setActiveTab]              = React.useState('setup');
            const [votes,                  setVotes]                  = React.useState([]);
            const [groups,                 setGroups]                 = React.useState([]);
            const [batchGroups,            setBatchGroups]            = React.useState('');
            const [batchStudents,          setBatchStudents]          = React.useState('');
            const [newCriName,             setNewCriName]             = React.useState('');
            const [newCriMax,              setNewCriMax]              = React.useState(10);
            const [monitorGroupId,         setMonitorGroupId]         = React.useState(null);
            const [monitorStudentName,     setMonitorStudentName]     = React.useState(null);
            const [newGroupName,           setNewGroupName]           = React.useState('');
            const [showClearCriteriaConfirm, setShowClearCriteriaConfirm] = React.useState(false);
            const [nowTick,                setNowTick]                = React.useState(Date.now());
            const [newCoOwnerEmail,        setNewCoOwnerEmail]        = React.useState('');
            const [coOwnerLookupStatus,    setCoOwnerLookupStatus]    = React.useState(null); // null | 'loading' | 'success' | 'error'
            const [coOwnerLookupMsg,       setCoOwnerLookupMsg]       = React.useState('');

            React.useEffect(() => {
                const timer = setInterval(() => setNowTick(Date.now()), 3000);
                return () => clearInterval(timer);
            }, []);

            React.useEffect(() => {
                if (session) setGroups(session.groups || []);
            }, [session]);

            React.useEffect(() => {
                const unsub = db.collection('sessions').doc(roomName).collection('votes').onSnapshot(snap => {
                    const data = [];
                    snap.forEach(d => data.push({ id: d.id, ...d.data() }));
                    setVotes(data);
                });
                return () => unsub();
            }, [roomName]);

            const updateSession = (data) => db.collection('sessions').doc(roomName).set(data, { merge: true });

            if (!session) return <div className="p-10 text-center text-gray-500">正在讀取資料...</div>;

            const handleBatchGroups = async () => {
                const list = batchGroups.split('\n').map(s=>s.trim()).filter(s=>s);
                const newGroups = list.map(name => ({ id: `g${Date.now()}_${Math.random().toString(36).substr(2,5)}`, name }));
                await updateSession({ groups: [...(session.groups||[]), ...newGroups] });
                setBatchGroups('');
                alert(`已新增 ${newGroups.length} 個組別`);
            };

            const handleBatchStudents = async () => {
                const list = batchStudents.split('\n').map(s=>s.trim()).filter(s=>s);
                const currentSet = new Set(session.students || []);
                list.forEach(name => currentSet.add(name));
                await updateSession({ students: Array.from(currentSet) });
                setBatchStudents('');
                alert(`名單更新完成，目前共 ${currentSet.size} 人`);
            };

            const addSingleGroup = async () => {
                if (!newGroupName.trim()) return;
                const newGroup = { id: `g${Date.now()}_${Math.random().toString(36).substr(2,5)}`, name: newGroupName };
                await updateSession({ groups: [...(session.groups||[]), newGroup] });
                setNewGroupName('');
            };

            const addCriteria = async () => {
                if (!newCriName) return;
                const newC = { id: `c_${Date.now()}`, name: newCriName, max: parseInt(newCriMax) };
                await updateSession({ criteria: [...(session.criteria||[]), newC] });
                setNewCriName('');
            };

            const removeCriteria = async (id) => {
                if (!confirm("確定刪除此評分項目？")) return;
                await updateSession({ criteria: session.criteria.filter(c => c.id !== id) });
            };

            const deleteVote = async (voteId) => {
                if (!confirm("確定要將此評分標記為不採計嗎？(不會物理刪除，Excel 仍可匯出)")) return;
                await db.collection('sessions').doc(roomName).collection('votes').doc(voteId).update({ isDeleted: true });
            };

            const handleRemoveStudent = async (nameToRemove) => {
                if (!confirm(`確定要刪除學生 "${nameToRemove}" 嗎？`)) return;
                const newStudents = (session.students || []).filter(s => s !== nameToRemove);
                await updateSession({ students: newStudents });
            };

            const handleClearStudents = async () => {
                if (!confirm("警告：確定要清空所有學生名單嗎？這將導致所有學生需重新登入綁定。")) return;
                await updateSession({ students: [], studentMappings: {}, onlineStudents: {} });
            };

            const handleClearGroups = async () => {
                if (!confirm("警告：確定要清空所有組別嗎？相關的評分紀錄可能會失去關聯。")) return;
                await updateSession({ groups: [], currentGroupId: null });
            };

            const handleResetVotes = async () => {
                if (!confirm("警告：這將清除所有學生的評分紀錄，且無法復原！確定要重置嗎？")) return;
                try {
                    const votesRef = db.collection('sessions').doc(roomName).collection('votes');
                    const snapshot = await votesRef.get();
                    const batch = db.batch();
                    snapshot.docs.forEach(doc => batch.delete(doc.ref));
                    await batch.commit();
                    alert("所有評分紀錄已清除。");
                } catch(e) { alert("重置失敗，請稍後再試。"); }
            };

            // ── 協同管理者：透過 Email 查找 UID 並加入 ──
            // 注意：Firebase Authentication 不提供「用 Email 查 UID」的前端 API，
            // 因此改用「讓協同老師先自己登入一次，系統記錄其 UID」的方式。
            // 這裡改為直接輸入 UID 加入（請協同老師到 teacher.html 登入後，
            // 從瀏覽器 console 輸入 firebase.auth().currentUser.uid 取得）。
            // 或者：由主要老師在這裡輸入協同老師的 Email，
            // 系統用 Firestore 查詢「曾經登入過的老師」集合（需要先建立）。
            // 為了不增加後端複雜度，這裡採用最簡單的「直接輸入 UID」方式，
            // 並在 UI 上提示如何取得 UID。
            const isOwner = session.ownerUid === teacherUid;

            const handleAddCoOwner = async () => {
                const uid = newCoOwnerEmail.trim();
                if (!uid) return;
                if (!isOwner) { setCoOwnerLookupMsg("只有教室建立者才能管理協同管理者"); setCoOwnerLookupStatus('error'); return; }
                if (uid === session.ownerUid) { setCoOwnerLookupMsg("這是教室建立者本人的 UID，不需要加入"); setCoOwnerLookupStatus('error'); return; }
                const current = session.coOwners || [];
                if (current.includes(uid)) { setCoOwnerLookupMsg("此 UID 已在協同管理者名單中"); setCoOwnerLookupStatus('error'); return; }
                setCoOwnerLookupStatus('loading');
                try {
                    await updateSession({ coOwners: [...current, uid] });
                    setCoOwnerLookupMsg(`已成功加入！`);
                    setCoOwnerLookupStatus('success');
                    setNewCoOwnerEmail('');
                } catch(e) {
                    setCoOwnerLookupMsg("加入失敗：" + e.message);
                    setCoOwnerLookupStatus('error');
                }
            };

            const handleRemoveCoOwner = async (uid) => {
                if (!isOwner) { alert("只有教室建立者才能移除協同管理者"); return; }
                if (!confirm("確定移除此協同管理者？他將無法再進入後台。")) return;
                await updateSession({ coOwners: (session.coOwners || []).filter(u => u !== uid) });
            };

            // 學生用的邀請連結（指向同目錄下的 index.html）
            const studentPageUrl = `${window.location.origin}${window.location.pathname.replace('teacher.html','index.html')}?room=${encodeURIComponent(roomName)}`;
            const handleCopyLink = () => {
                const el = document.createElement('textarea');
                el.value = studentPageUrl;
                document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
                alert('學生連結已複製！請將此連結提供給學生進入教室。');
            };

            const loggedInCount    = countOnlineStudents(session.onlineStudents, nowTick);
            const currentGroupVotes = votes.filter(v => v.groupId === session.currentGroupId && !v.isDeleted);

            const allTotals = (session.students || []).map(studentName => {
                if (!session.currentGroupId) return null;
                const vote = votes.find(v => v.groupId === session.currentGroupId && v.userName === studentName && !v.isDeleted);
                if (!vote) return null;
                let sum = 0; (session.criteria || []).forEach(c => sum += (vote.scores[c.id] || 0));
                return sum;
            }).filter(s => s !== null).sort((a, b) => b - a);

            const getScoreColor = (score) => {
                if (allTotals.length === 0) return "text-gray-800";
                const rank = allTotals.indexOf(score);
                if (rank < 3) return "text-red-600 font-bold";
                const reverseRank = allTotals.lastIndexOf(score);
                if (reverseRank >= allTotals.length - 3 && allTotals.length >= 3) return "text-green-600 font-bold";
                return "text-gray-800";
            };

            let sortedStudentsForMonitor = [];
            if (session && session.students) {
                const studentStats = session.students.map(studentName => {
                    const isOnline    = isStudentOnline(session.onlineStudents, studentName, nowTick);
                    const currentGroup = session.currentGroupId;
                    const currentVote  = currentGroup ? votes.find(v => v.groupId === currentGroup && v.userName === studentName && !v.isDeleted) : null;
                    const totalVoted   = votes.filter(v => v.userName === studentName && !v.isDeleted).length;
                    let total = null;
                    if (currentVote) { total = 0; (session.criteria||[]).forEach(c => total += (currentVote.scores[c.id]||0)); }
                    return { studentName, isOnline, currentVote, totalVoted, total };
                });
                const votedStudents   = studentStats.filter(s => s.total !== null);
                const unvotedStudents = studentStats.filter(s => s.total === null).sort((a, b) => a.studentName.localeCompare(b.studentName));
                if (votedStudents.length > 0) {
                    votedStudents.sort((a, b) => b.total !== a.total ? b.total - a.total : a.studentName.localeCompare(b.studentName));
                    const n = votedStudents.length;
                    const topCount   = Math.min(3, n);
                    const top3       = votedStudents.slice(0, topCount);
                    const bottomCount = Math.min(3, n - topCount);
                    const bottom3    = bottomCount > 0 ? votedStudents.slice(n - bottomCount, n) : [];
                    const restCount  = n - topCount - bottomCount;
                    const middle     = restCount > 0 ? votedStudents.slice(topCount, n - bottomCount) : [];
                    middle.sort((a, b) => a.studentName.localeCompare(b.studentName));
                    sortedStudentsForMonitor = [...top3, ...bottom3, ...middle];
                }
                sortedStudentsForMonitor = [...sortedStudentsForMonitor, ...unvotedStudents];
            }

            // ── Excel 匯出（原版完整保留）──
            const handleExportExcel = () => {
                const wb = XLSX.utils.book_new();
                const criteria = session.criteria || DEFAULT_CRITERIA;
                const allVotes = votes.filter(v => !v.isDeleted);
                const borderStyle = { top:{style:"thin",color:{rgb:"CCCCCC"}}, bottom:{style:"thin",color:{rgb:"CCCCCC"}}, left:{style:"thin",color:{rgb:"CCCCCC"}}, right:{style:"thin",color:{rgb:"CCCCCC"}} };

                (groups||[]).forEach(group => {
                    const groupVotes = allVotes.filter(v => v.groupId === group.id);
                    const headers = ["評分學生", "總分", ...criteria.map(c => `${c.name}(${c.max}分)`), "備註"];
                    const dataRows = [];
                    const totalsForAvg = [];
                    (session.students||[]).sort((a,b)=>a.localeCompare(b)).forEach(studentName => {
                        const vote = groupVotes.find(v => v.userName === studentName);
                        if (vote) {
                            const row = [studentName];
                            let total = 0;
                            criteria.forEach(c => { const sc = vote.scores[c.id]||0; row.push(sc); total+=sc; });
                            row.splice(1,0,total);
                            row.push('');
                            totalsForAvg.push(total);
                            dataRows.push(row);
                        }
                    });
                    const avg = totalsForAvg.length ? (totalsForAvg.reduce((a,b)=>a+b,0)/totalsForAvg.length).toFixed(2) : 'N/A';
                    const validCount = totalsForAvg.length;
                    const wsData = [
                        [`${group.name} - 評分結果`, ...Array(headers.length-1).fill("")],
                        [`有效評分人數：${validCount}　　平均分數：${avg}`, ...Array(headers.length-1).fill("")],
                        headers,
                        ...dataRows
                    ];
                    const ws = XLSX.utils.aoa_to_sheet(wsData);
                    ws['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:headers.length-1} }, { s:{r:1,c:0}, e:{r:1,c:headers.length-1} }];
                    ws['!cols'] = headers.map((_,i) => ({ wch: i===0?15:12 }));
                    ws['!rows'] = wsData.map(() => ({ hpt: 18 }));
                    ws['!rows'][0] = { hpt: 30 };
                    const range = XLSX.utils.decode_range(ws['!ref']);
                    for (let R = range.s.r; R <= range.e.r; ++R) {
                        for (let C = range.s.c; C <= range.e.c; ++C) {
                            const addr = XLSX.utils.encode_cell({r:R,c:C});
                            if (!ws[addr]) continue;
                            if (!ws[addr].s) ws[addr].s = {};
                            ws[addr].s.alignment = { horizontal:"center", vertical:"center", wrapText:true };
                            ws[addr].s.border = borderStyle;
                            if (R===0) { ws[addr].s.font={bold:true,sz:14}; ws[addr].s.fill={fgColor:{rgb:"FF6600"}}; ws[addr].s.font={bold:true,sz:14,color:{rgb:"FFFFFF"}}; }
                            if (R===1) { ws[addr].s.fill={fgColor:{rgb:"FFE4CC"}}; ws[addr].s.font={bold:true}; }
                            if (R===2) { ws[addr].s.fill={fgColor:{rgb:"FFF3E0"}}; ws[addr].s.font={bold:true}; }
                            if (R>2 && C===1) ws[addr].s.font={ color:{rgb:"0000FF"}, bold:true };
                        }
                    }
                    let sheetName = group.name.replace(/[\\/?*\[\]]/g,"");
                    if (sheetName.length>30) sheetName = sheetName.substring(0,30);
                    if (!sheetName) sheetName = `Group ${group.id}`;
                    XLSX.utils.book_append_sheet(wb, ws, sheetName);
                });

                const studentHeaders = ["學生姓名", "評分組別", ...criteria.map(c=>c.name), "總分", "備註"];
                const studentDataRows = [];
                [...(session.students||[])].sort((a,b)=>a.localeCompare(b)).forEach(studentName => {
                    const studentVotes = allVotes.filter(v=>v.userName===studentName);
                    studentVotes.sort((a,b) => { const nA=groups.find(g=>g.id===a.groupId)?.name||''; const nB=groups.find(g=>g.id===b.groupId)?.name||''; return nA.localeCompare(nB); });
                    studentVotes.forEach(v => {
                        const groupName = groups.find(g=>g.id===v.groupId)?.name||'未知組別';
                        const row = [studentName, groupName];
                        let total = 0;
                        criteria.forEach(c => { const sc=v.scores[c.id]||0; row.push(sc); total+=sc; });
                        row.push(total); row.push(v.isDeleted?"不採計":"");
                        studentDataRows.push(row);
                    });
                });
                const studentWsData = [`學生評分明細表 - ${roomName}老師的教室`, ...Array(studentHeaders.length-1).fill("")];
                const studentWs = XLSX.utils.aoa_to_sheet([[...studentWsData], studentHeaders, ...studentDataRows]);
                studentWs['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:studentHeaders.length-1} }];
                studentWs['!cols'] = studentHeaders.map(() => ({ wch:15 }));
                XLSX.utils.book_append_sheet(wb, studentWs, "學生評分明細");
                XLSX.writeFile(wb, `評分結果_${roomName}.xlsx`);
            };

            return (
                <div className="space-y-6">
                    {/* ── 頁籤列 ── */}
                    <div className="grid grid-cols-4 md:flex md:flex-wrap bg-white rounded-lg p-1 shadow-sm gap-1 md:gap-2">
                        {[
                            {id:'setup',         label:'學生與小組名單設定', line1:'學生與小組', line2:'名單設定'},
                            {id:'criteria',      label:'評分標準設定',       line1:'評分標準',   line2:'設定'},
                            {id:'control',       label:'評分控制台',         line1:'評分',       line2:'控制台'},
                            {id:'monitor',       label:'監控評分與修正分數', line1:'監控評分與', line2:'修正分數'},
                            {id:'groupDetails',  label:'各組得分明細',       line1:'各組得分',   line2:'明細'},
                            {id:'studentDetails',label:'學生評分明細',       line1:'學生評分',   line2:'明細'},
                            {id:'results',       label:'結果統計',           line1:'結果',       line2:'統計'},
                        ].map(t => {
                            let bgStyle = {}; let textClass = "text-gray-700";
                            if (t.id==='control') {
                                bgStyle   = activeTab===t.id ? {backgroundColor:'#CC66FF'} : {backgroundColor:'#FFCCFF'};
                                textClass = activeTab===t.id ? "text-white" : "text-gray-800 hover:opacity-80";
                            } else {
                                bgStyle   = activeTab===t.id ? {backgroundColor:'#FFCC00'} : {backgroundColor:'#ffffff'};
                                textClass = activeTab===t.id ? "text-gray-900" : "text-gray-600 hover:bg-gray-100";
                            }
                            return (
                                <button key={t.id} onClick={()=>{ setActiveTab(t.id); setMonitorGroupId(null); setMonitorStudentName(null); }}
                                    className={`md:flex-1 py-1 md:py-3 px-1 md:px-4 font-bold rounded-lg border border-gray-200 transition-all shadow-sm flex flex-col md:block items-center justify-center aspect-square md:aspect-auto ${textClass}`}
                                    style={bgStyle}>
                                    <span className="hidden md:inline text-lg">{t.label}</span>
                                    <div className="md:hidden flex flex-col items-center justify-center w-full h-full leading-tight tracking-tighter" style={{fontSize:'clamp(11px,3.2vw,16px)'}}>
                                        <span>{t.line1}</span><span>{t.line2}</span>
                                    </div>
                                </button>
                            );
                        })}
                    </div>

                    {/* ── 評分控制台 ── */}
                    {activeTab==='control' && (
                        <div className="bg-white rounded-xl shadow p-6 space-y-6 animate-fade-in">
                            <div className="bg-[#FFCCFF]/30 border border-fuchsia-200 rounded-xl p-5 shadow-sm">
                                <h3 className="font-bold text-lg text-fuchsia-900 mb-2 flex items-center gap-2"><Icons.Link /> 邀請學生加入評分</h3>
                                <p className="text-sm text-fuchsia-700 mb-3 font-medium">請複製下方專屬連結提供給學生：</p>
                                <div className="flex flex-col sm:flex-row gap-2">
                                    <input type="text" readOnly value={studentPageUrl} className="flex-1 p-3 rounded-lg border border-fuchsia-200 bg-white text-gray-700 outline-none text-sm font-mono shadow-inner" />
                                    <button onClick={handleCopyLink} style={{backgroundColor:'#CC66FF'}} className="text-white px-6 py-3 rounded-lg font-bold hover:opacity-90 transition shadow whitespace-nowrap active:scale-95">複製連結</button>
                                </div>
                            </div>
                            <div className="flex justify-between items-center bg-fuchsia-50 p-4 rounded-xl border border-fuchsia-100">
                                <div>
                                    <p className="text-gray-500 text-xs font-bold uppercase">目前已上線學生</p>
                                    <p className="text-2xl font-bold text-gray-800">{loggedInCount} <span className="text-sm text-gray-400">/ {(session.students||[]).length}</span></p>
                                </div>
                                {session.currentGroupId && (
                                    <div>
                                        <p className="text-green-600 text-xs font-bold uppercase text-right">當前評分進度</p>
                                        <p className="text-2xl font-bold text-green-700 text-right">{currentGroupVotes.length} <span className="text-sm text-green-500">人已評</span></p>
                                    </div>
                                )}
                            </div>
                            <h3 className="font-bold text-lg border-b pb-2 text-gray-800">報告流程控制</h3>
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                                {(groups||[]).length===0 && <p className="text-gray-400 py-4 col-span-full text-center border-2 border-dashed rounded-lg bg-fuchsia-50">尚未設定組別，請前往「學生與小組名單設定」新增。</p>}
                                {(groups||[]).map(g => {
                                    const isCurrent = session.currentGroupId===g.id;
                                    const hasVotedG = votes.some(v=>v.groupId===g.id&&!v.isDeleted);
                                    let cardStyle = {backgroundColor:'#ffffff'};
                                    let borderClass = "border-gray-800";
                                    if (isCurrent) { borderClass="border-fuchsia-500 ring-2 ring-fuchsia-300"; cardStyle={backgroundColor:'#fdf4ff'}; }
                                    else if (hasVotedG) { cardStyle={backgroundColor:'#A6A6A6'}; borderClass="border-gray-600"; }
                                    return (
                                        <div key={g.id} className={`flex flex-col justify-between p-4 border-2 rounded-xl transition-all h-32 shadow-sm ${borderClass}`} style={cardStyle}>
                                            <div className="font-bold text-lg text-gray-800">{g.name}</div>
                                            <div className="mt-2">
                                                {isCurrent
                                                    ? <button onClick={()=>updateSession({currentGroupId:null})} className="px-4 py-1.5 bg-white border-2 border-red-200 text-red-600 rounded-lg font-bold hover:bg-red-50 transition-colors shadow-sm active:scale-95 text-sm">停止評分</button>
                                                    : <button onClick={()=>updateSession({currentGroupId:g.id,showResults:false})} disabled={!!session.currentGroupId} style={{backgroundColor:session.currentGroupId?'':'#CC66FF'}} className={`px-4 py-1.5 rounded-lg font-bold transition-colors shadow-sm active:scale-95 text-sm ${session.currentGroupId?'bg-gray-200 text-gray-400 cursor-not-allowed':'text-white hover:opacity-90'}`}>開始評分</button>
                                                }
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {/* ── 學生與小組名單設定 ── */}
                    {activeTab==='setup' && (
                        <div className="grid md:grid-cols-12 gap-6 animate-fade-in">
                            <div className="bg-white rounded-xl shadow p-6 md:col-span-7">
                                <h3 className="font-bold text-lg mb-4 flex items-center gap-2 text-gray-800"><Icons.Users/> 學生名單管理</h3>
                                <p className="text-xs text-gray-500 mb-2">請貼上全班姓名，一行一個名字</p>
                                <textarea className="w-full h-40 border-2 border-orange-100 p-3 rounded-lg text-sm mb-2 focus:border-orange-400 focus:outline-none transition-colors bg-orange-50/50" placeholder={"王小明\n李大華..."} value={batchStudents} onChange={e=>setBatchStudents(e.target.value)}></textarea>
                                <div className="flex gap-2">
                                    <button onClick={handleBatchStudents} className="flex-1 py-2 bg-orange-500 text-white rounded-lg font-bold hover:bg-orange-600 transition active:scale-95">更新名單</button>
                                    <button onClick={handleClearStudents} className="px-4 py-2 bg-red-50 text-red-600 border border-red-100 rounded-lg font-bold hover:bg-red-100 transition"><Icons.Trash /></button>
                                </div>
                                <div className="bg-orange-50/50 p-3 rounded-lg h-48 overflow-y-auto flex flex-wrap gap-2 mt-4 border border-orange-100 shadow-inner">
                                    {(session.students||[]).map(s => {
                                        const isOnline = isStudentOnline(session.onlineStudents, s, nowTick);
                                        return (
                                            <span key={s} className={`text-xs px-2 py-1.5 rounded-lg border flex items-center gap-1 font-bold ${isOnline?'bg-green-100 text-green-700 border-green-200 shadow-sm':'bg-white text-gray-500 border-orange-200'}`}>
                                                {s} <button onClick={()=>handleRemoveStudent(s)} className="text-gray-400 hover:text-red-500 ml-1"><Icons.X /></button>
                                            </span>
                                        );
                                    })}
                                </div>
                            </div>
                            <div className="bg-white rounded-xl shadow p-6 md:col-span-5">
                                <h3 className="font-bold text-lg mb-4 flex items-center gap-2 text-gray-800"><Icons.Award/> 分組名單管理</h3>
                                <div className="mb-4 flex gap-2">
                                    <input type="text" value={newGroupName} onChange={e=>setNewGroupName(e.target.value)} className="border-2 border-orange-100 p-2 rounded-lg flex-1 focus:border-orange-400 focus:outline-none bg-orange-50/50" placeholder="單筆新增組名" />
                                    <button onClick={addSingleGroup} className="bg-orange-100 text-orange-800 px-4 rounded-lg font-bold hover:bg-orange-200 transition active:scale-95 border border-orange-200">新增</button>
                                </div>
                                <p className="text-xs text-gray-500 mb-2">或 批次貼上組別名稱，一行一個</p>
                                <textarea className="w-full h-32 border-2 border-orange-100 p-3 rounded-lg text-sm mb-2 focus:border-orange-400 focus:outline-none transition-colors bg-orange-50/50" placeholder={"第一組...\n第二組..."} value={batchGroups} onChange={e=>setBatchGroups(e.target.value)}></textarea>
                                <div className="flex gap-2">
                                    <button onClick={handleBatchGroups} className="flex-1 py-2 bg-orange-500 text-white rounded-lg font-bold hover:bg-orange-600 transition active:scale-95">批次新增</button>
                                    <button onClick={handleClearGroups} className="px-4 py-2 bg-red-50 text-red-600 border border-red-100 rounded-lg font-bold hover:bg-red-100 transition"><Icons.Trash /></button>
                                </div>
                                <div className="bg-orange-50/50 p-3 rounded-lg h-48 overflow-y-auto space-y-2 mt-4 border border-orange-100 shadow-inner">
                                    {(groups||[]).map((g,i) => (
                                        <div key={g.id} className="text-sm bg-white p-3 rounded-lg border border-orange-200 flex justify-between items-center hover:border-orange-400 transition shadow-sm">
                                            <span className="font-bold text-gray-700 text-[25px]">{i+1}. {g.name}</span>
                                            <button onClick={async()=>{ if(confirm("刪除?")) await updateSession({groups:session.groups.filter(x=>x.id!==g.id)}); }} className="text-gray-400 hover:text-red-500 p-1"><Icons.Trash2 /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* ── 協同管理者設定（跨欄，放在兩個 col 下方）── */}
                            <div className={`bg-white rounded-xl shadow p-6 md:col-span-12 border-t-4 ${isOwner ? 'border-blue-400' : 'border-gray-200'}`}>
                                <h3 className="font-bold text-lg mb-1 flex items-center gap-2 text-gray-800">
                                    <Icons.Users /> 協同管理者設定
                                    {!isOwner && <span className="text-xs font-normal text-gray-400 ml-2">（只有教室建立者可以管理此名單）</span>}
                                </h3>
                                <p className="text-xs text-gray-400 mb-4">加入後，對方可用自己的 Google 帳號進入此教室後台共同操作。</p>

                                <div className="bg-blue-50 border border-blue-100 rounded-lg p-3 mb-4 text-xs text-blue-700">
                                    <p className="font-bold mb-1">📋 如何取得協同老師的 UID？</p>
                                    <p>請協同老師：① 打開 teacher.html 並用 Google 帳號登入 → ② 按 F12 開啟開發者工具 → ③ 點「Console」頁籤 → ④ 輸入 <code className="bg-white px-1 rounded border border-blue-200">firebase.auth().currentUser.uid</code> 並按 Enter → ⑤ 複製那串文字給你貼在這裡。</p>
                                </div>

                                {isOwner && (
                                    <div className="flex gap-2 mb-3">
                                        <input
                                            type="text"
                                            value={newCoOwnerEmail}
                                            onChange={e=>{ setNewCoOwnerEmail(e.target.value); setCoOwnerLookupStatus(null); setCoOwnerLookupMsg(''); }}
                                            placeholder="貼上協同老師的 UID"
                                            className="flex-1 border-2 border-blue-200 p-2.5 rounded-lg focus:border-blue-400 outline-none bg-blue-50/50 font-mono text-sm"
                                        />
                                        <button onClick={handleAddCoOwner} disabled={coOwnerLookupStatus==='loading'}
                                            className="bg-blue-500 text-white px-5 py-2.5 rounded-lg font-bold hover:bg-blue-600 transition active:scale-95 disabled:opacity-50 whitespace-nowrap">
                                            {coOwnerLookupStatus==='loading' ? '加入中...' : '加入'}
                                        </button>
                                    </div>
                                )}

                                {coOwnerLookupMsg && (
                                    <p className={`text-sm font-bold mb-3 px-3 py-2 rounded-lg ${coOwnerLookupStatus==='success' ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-600 border border-red-200'}`}>
                                        {coOwnerLookupStatus==='success' ? '✅ ' : '⚠️ '}{coOwnerLookupMsg}
                                    </p>
                                )}

                                <div className="space-y-2">
                                    <p className="text-xs font-bold text-gray-500 uppercase mb-1">目前協同管理者</p>
                                    {(session.coOwners||[]).length === 0 ? (
                                        <p className="text-gray-400 text-sm py-3 text-center bg-gray-50 rounded-lg border border-dashed">尚未設定協同管理者</p>
                                    ) : (
                                        (session.coOwners||[]).map(uid => (
                                            <div key={uid} className="flex items-center justify-between bg-blue-50 border border-blue-100 rounded-lg px-4 py-2.5">
                                                <span className="font-mono text-sm text-gray-700 truncate flex-1">{uid}</span>
                                                {isOwner && (
                                                    <button onClick={()=>handleRemoveCoOwner(uid)}
                                                        className="ml-3 text-gray-400 hover:text-red-500 hover:bg-red-50 p-1.5 rounded-lg transition flex-shrink-0">
                                                        <Icons.X />
                                                    </button>
                                                )}
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ── 評分標準設定 ── */}
                    {activeTab==='criteria' && (
                        <div className="bg-white rounded-xl shadow p-6 animate-fade-in relative">
                            {showClearCriteriaConfirm && (
                                <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[9999]">
                                    <div className="bg-white p-6 rounded-2xl w-full max-w-sm shadow-2xl animate-fade-in">
                                        <h3 className="text-xl font-bold mb-3 text-red-600 flex items-center gap-2"><Icons.Trash /> 刪除所有項目</h3>
                                        <p className="text-gray-600 mb-6 font-medium">確定要刪除所有評分項目嗎？刪除後無法復原。</p>
                                        <div className="flex gap-3">
                                            <button onClick={()=>setShowClearCriteriaConfirm(false)} className="flex-1 bg-gray-100 text-gray-700 py-3 rounded-xl font-bold hover:bg-gray-200 transition active:scale-95">取消</button>
                                            <button onClick={async()=>{ await updateSession({criteria:[]}); setShowClearCriteriaConfirm(false); }} className="flex-1 bg-red-600 text-white py-3 rounded-xl font-bold hover:bg-red-700 transition active:scale-95">確定刪除</button>
                                        </div>
                                    </div>
                                </div>
                            )}
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="font-bold text-lg text-gray-800">評分標準設定</h3>
                            </div>
                            <div className="flex flex-col sm:flex-row gap-4 mb-6 items-end bg-orange-50 border border-orange-100 p-4 rounded-xl">
                                <div className="flex-1 w-full">
                                    <label className="text-xs font-bold text-gray-600 mb-1 block">項目名稱</label>
                                    <input type="text" value={newCriName} onChange={e=>setNewCriName(e.target.value)} className="w-full border-2 border-orange-200 p-2.5 rounded-lg focus:border-orange-400 outline-none transition" placeholder="例如：創新程度" />
                                </div>
                                <div className="w-full sm:w-24">
                                    <label className="text-xs font-bold text-gray-600 mb-1 block">最高分</label>
                                    <input type="number" value={newCriMax} onChange={e=>setNewCriMax(e.target.value)} className="w-full border-2 border-orange-200 p-2.5 rounded-lg focus:border-orange-400 outline-none transition" />
                                </div>
                                <div className="flex gap-2 w-full sm:w-auto mt-2 sm:mt-0">
                                    <button onClick={addCriteria} className="flex-1 sm:flex-none bg-orange-500 text-white px-6 py-2.5 rounded-lg font-bold shadow-sm hover:bg-orange-600 transition active:scale-95 border border-orange-600 whitespace-nowrap">新增</button>
                                    <button onClick={()=>setShowClearCriteriaConfirm(true)} className="flex-1 sm:flex-none bg-red-50 text-red-600 px-4 py-2.5 rounded-lg font-bold shadow-sm hover:bg-red-100 transition active:scale-95 border border-red-200 whitespace-nowrap">刪除所有評分項目</button>
                                </div>
                            </div>
                            <div className="space-y-3">
                                {(session.criteria||[]).map(c => (
                                    <div key={c.id} className="flex justify-between items-center p-4 border-2 border-orange-100 rounded-xl bg-white shadow-sm hover:border-orange-300 transition">
                                        <div className="flex items-center gap-4">
                                            <span className="font-bold text-lg text-gray-800">{c.name}</span>
                                            <span className="text-xs bg-orange-50 text-orange-700 border border-orange-200 px-3 py-1 rounded-full font-bold">配分：0 ~ {c.max} 分</span>
                                        </div>
                                        <button onClick={()=>removeCriteria(c.id)} className="text-gray-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-lg transition"><Icons.Trash2/></button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* ── 全班狀態監控 ── */}
                    {activeTab==='monitor' && (
                        <div className="space-y-6 animate-fade-in">
                            <div className="bg-white rounded-xl shadow overflow-hidden border border-gray-100">
                                <div className="px-6 py-3 border-b bg-orange-50 flex justify-between items-center">
                                    <h3 className="font-bold text-lg flex items-center gap-2 text-gray-800"><Icons.Users/> 全班狀態監控</h3>
                                    <button onClick={handleResetVotes} className="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-lg font-bold shadow-sm transition-colors flex items-center gap-2 active:scale-95">
                                        <Icons.Trash /> 清空所有評分紀錄
                                    </button>
                                </div>
                                <div className="overflow-x-auto overflow-y-auto" style={{maxHeight:'690px'}}>
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-white text-gray-500 uppercase sticky top-0 z-10 shadow-sm">
                                            <tr>
                                                <th className="px-4 py-2 font-bold">姓名</th>
                                                <th className="px-4 py-2 font-bold">登入狀態</th>
                                                <th className="px-4 py-2 font-bold">目前評分進度</th>
                                                <th className="px-4 py-2 font-bold text-right">評分(總分)</th>
                                                <th className="px-4 py-2 font-bold text-center">操作</th>
                                                <th className="px-4 py-2 font-bold text-gray-400">累計已評</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-100">
                                            {sortedStudentsForMonitor.map(({ studentName, isOnline, currentVote, totalVoted, total }) => {
                                                const totalDisplay = currentVote ? total : "-";
                                                const totalClass   = currentVote ? getScoreColor(total) : "text-gray-400";
                                                return (
                                                    <tr key={studentName} className="hover:bg-orange-50/50 transition-colors">
                                                        <td className="px-4 py-2 font-bold text-gray-800">{studentName}</td>
                                                        <td className="px-4 py-2">{isOnline ? <span className="text-green-700 bg-green-100 px-3 py-1 rounded-full text-xs font-bold border border-green-200">線上</span> : <span className="text-gray-400 text-xs border border-gray-200 px-3 py-1 rounded-full">未登入</span>}</td>
                                                        <td className="px-4 py-2">{!session.currentGroupId ? <span className="text-gray-400">-</span> : currentVote ? <span className="text-green-600 font-bold flex items-center gap-1"><Icons.CheckCircle/>已完成</span> : <span className="text-red-500 font-bold animate-pulse">未評分</span>}</td>
                                                        <td className={`px-4 py-2 text-right font-mono text-lg ${totalClass}`}>{totalDisplay}</td>
                                                        <td className="px-4 py-2 text-center">{currentVote && <button onClick={()=>deleteVote(currentVote.id)} className="text-gray-400 hover:text-red-600 p-2 bg-gray-50 rounded-lg hover:bg-red-50 transition" title="標記為不採計"><Icons.Trash2/></button>}</td>
                                                        <td className="px-4 py-2 text-gray-400 font-mono font-medium">{totalVoted} 組</td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ── 各組得分明細 ── */}
                    {activeTab==='groupDetails' && (
                        <div className="space-y-6 animate-fade-in">
                            {!monitorGroupId ? (
                                <div className="bg-white rounded-xl shadow p-6 border border-gray-100">
                                    <h3 className="font-bold text-lg mb-4 text-gray-800">各組評分檢核 (點選查看明細)</h3>
                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                        {(groups||[]).map(g => {
                                            const count = votes.filter(v=>v.groupId===g.id&&!v.isDeleted).length;
                                            return (
                                                <button key={g.id} onClick={()=>setMonitorGroupId(g.id)} className="p-4 border-2 border-orange-100 rounded-xl hover:border-orange-400 hover:shadow-md transition text-left group bg-orange-50/50">
                                                    <div className="font-bold text-gray-800 text-lg group-hover:text-orange-700">{g.name}</div>
                                                    <div className="text-sm text-gray-500 mt-2 font-medium">有效評分: <span className="font-bold text-orange-800 bg-white px-2 py-1 rounded border shadow-sm ml-1">{count}</span></div>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            ) : (
                                <div className="bg-white rounded-xl shadow overflow-hidden animate-fade-in border border-gray-100">
                                    <div className="px-6 py-3 border-b flex items-center gap-4 bg-orange-50">
                                        <button onClick={()=>setMonitorGroupId(null)} className="text-orange-600 bg-white hover:bg-orange-100 border border-orange-200 p-2 px-4 rounded-lg flex items-center gap-2 font-bold transition shadow-sm active:scale-95"><Icons.ArrowLeft /> 返回清單</button>
                                        <h2 className="text-xl font-black text-gray-800">{groups.find(g=>g.id===monitorGroupId)?.name} - 評分明細</h2>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-sm text-left">
                                            <thead className="bg-white text-gray-500 uppercase border-b border-gray-200">
                                                <tr>
                                                    <th className="px-4 py-2 font-bold">評分學生</th>
                                                    <th className="px-4 py-2 text-right font-bold">總分</th>
                                                    {(session.criteria||[]).map(c=><th key={c.id} className="px-4 py-2 text-right hidden md:table-cell font-bold">{c.name}</th>)}
                                                    <th className="px-4 py-2 text-center font-bold">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-100">
                                                {votes.filter(v=>v.groupId===monitorGroupId&&!v.isDeleted).map(v=>{ let t=0; (session.criteria||[]).forEach(c=>t+=(v.scores[c.id]||0)); return {...v,total:t}; }).sort((a,b)=>b.total-a.total).map(v=>(
                                                    <tr key={v.id} className="hover:bg-orange-50/50 transition">
                                                        <td className="px-4 py-2 font-bold text-gray-800">{v.userName}</td>
                                                        <td className="px-4 py-2 text-right font-black text-orange-600 text-xl">{v.total}</td>
                                                        {(session.criteria||[]).map(c=><td key={c.id} className="px-4 py-2 text-right text-gray-500 hidden md:table-cell font-mono font-medium">{v.scores[c.id]}</td>)}
                                                        <td className="px-4 py-2 text-center"><button onClick={()=>deleteVote(v.id)} className="text-gray-400 hover:text-red-600 hover:bg-red-50 p-2 rounded-lg transition" title="標記為不採計"><Icons.Trash2 /></button></td>
                                                    </tr>
                                                ))}
                                                {votes.filter(v=>v.groupId===monitorGroupId&&!v.isDeleted).length===0 && <tr><td colSpan={(session.criteria||[]).length+3} className="p-8 text-center text-gray-400 font-bold">尚無有效評分紀錄</td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* ── 學生評分明細 ── */}
                    {activeTab==='studentDetails' && (
                        <div className="space-y-6 animate-fade-in">
                            {!monitorStudentName ? (
                                <div className="bg-white rounded-xl shadow p-6 border border-gray-100">
                                    <h3 className="font-bold text-lg mb-4 text-gray-800">學生評分檢核 (點選查看明細)</h3>
                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                        {(session.students||[]).sort((a,b)=>a.localeCompare(b)).map(studentName => {
                                            const count = votes.filter(v=>v.userName===studentName&&!v.isDeleted).length;
                                            return (
                                                <button key={studentName} onClick={()=>setMonitorStudentName(studentName)} className="p-4 border-2 border-orange-100 rounded-xl hover:border-orange-400 hover:shadow-md transition text-left group bg-orange-50/50">
                                                    <div className="font-bold text-gray-800 text-lg group-hover:text-orange-700">{studentName}</div>
                                                    <div className="text-sm text-gray-500 mt-2 font-medium">已評: <span className="font-bold text-orange-800 bg-white px-2 py-1 rounded border shadow-sm ml-1">{count}</span> 組</div>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            ) : (
                                <div className="bg-white rounded-xl shadow overflow-hidden animate-fade-in border border-gray-100">
                                    <div className="px-6 py-3 border-b flex items-center gap-4 bg-orange-50">
                                        <button onClick={()=>setMonitorStudentName(null)} className="text-orange-600 bg-white hover:bg-orange-100 border border-orange-200 p-2 px-4 rounded-lg flex items-center gap-2 font-bold transition shadow-sm active:scale-95"><Icons.ArrowLeft /> 返回清單</button>
                                        <h2 className="text-xl font-black text-gray-800">{monitorStudentName} - 評分明細</h2>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-sm text-left">
                                            <thead className="bg-white text-gray-500 uppercase border-b border-gray-200">
                                                <tr>
                                                    <th className="px-4 py-2 font-bold">評分組別</th>
                                                    <th className="px-4 py-2 text-right font-bold">總分</th>
                                                    {(session.criteria||[]).map(c=><th key={c.id} className="px-4 py-2 text-right hidden md:table-cell font-bold">{c.name}</th>)}
                                                    <th className="px-4 py-2 text-center font-bold">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-100">
                                                {votes.filter(v=>v.userName===monitorStudentName&&!v.isDeleted).map(v=>{ let t=0; (session.criteria||[]).forEach(c=>t+=(v.scores[c.id]||0)); const gName=groups.find(g=>g.id===v.groupId)?.name||'未知組別'; return {...v,total:t,groupName:gName}; }).sort((a,b)=>a.groupName.localeCompare(b.groupName)).map(v=>(
                                                    <tr key={v.id} className="hover:bg-orange-50/50 transition">
                                                        <td className="px-4 py-2 font-bold text-gray-800 text-lg">{v.groupName}</td>
                                                        <td className="px-4 py-2 text-right font-black text-orange-600 text-4xl">{v.total}</td>
                                                        {(session.criteria||[]).map(c=><td key={c.id} className="px-4 py-2 text-right text-gray-700 hidden md:table-cell font-mono font-bold text-2xl">{v.scores[c.id]}</td>)}
                                                        <td className="px-4 py-2 text-center"><button onClick={()=>deleteVote(v.id)} className="text-gray-400 hover:text-red-600 hover:bg-red-50 p-2 rounded-lg transition" title="標記為不採計"><Icons.Trash2 /></button></td>
                                                    </tr>
                                                ))}
                                                {votes.filter(v=>v.userName===monitorStudentName&&!v.isDeleted).length===0 && <tr><td colSpan={(session.criteria||[]).length+3} className="p-8 text-center text-gray-400 font-bold">該名學生尚無有效評分紀錄</td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* ── 結果統計 ── */}
                    {activeTab==='results' && (
                        <ResultsBoard
                            session={session} roomName={roomName} groups={groups}
                            criteria={session.criteria||DEFAULT_CRITERIA} isAdmin={true}
                            onToggleShowResults={()=>updateSession({showResults:!session.showResults})}
                            votes={votes} handleExportExcel={handleExportExcel}
                        />
                    )}
                </div>
            );
        }

        // ══════════════════════════════════════════════════════════════
        //  ResultsBoard
        // ══════════════════════════════════════════════════════════════
        function ResultsBoard({ session, roomName, groups, criteria, isAdmin, onToggleShowResults, votes, handleExportExcel }) {
            const allVotes = (votes||[]).filter(v=>!v.isDeleted);
            const results = (groups||[]).map(g => {
                const groupVotes = allVotes.filter(v=>v.groupId===g.id);
                if (!groupVotes.length) return { ...g, avg: 0, count: 0 };
                const totals = groupVotes.map(v => { let t=0; (criteria||[]).forEach(c=>t+=(v.scores[c.id]||0)); return t; });
                const avg = (totals.reduce((a,b)=>a+b,0)/totals.length).toFixed(2);
                return { ...g, avg: parseFloat(avg), count: groupVotes.length };
            }).sort((a,b)=>b.avg-a.avg);

            const Icons2 = {
                BarChart3: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>,
                Download:  () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
            };

            return (
                <div className="bg-white p-6 md:p-8 rounded-2xl shadow-lg border border-orange-100">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                        <h2 className="text-2xl font-black flex items-center gap-2 text-orange-900"><Icons2.BarChart3 /> 最終排行榜</h2>
                        {isAdmin && (
                            <div className="flex w-full md:w-auto gap-4 justify-end items-center">
                                <button onClick={onToggleShowResults}
                                    className={`w-1/3 min-w-[120px] max-w-[200px] py-3 rounded-xl font-bold shadow-md transition-colors active:scale-95 border-b-4 active:border-b-0 ${session?.showResults?'bg-amber-200 text-amber-900 border-amber-400 hover:bg-amber-300':'bg-yellow-400 text-yellow-900 border-yellow-600 hover:bg-yellow-500'}`}>
                                    {session?.showResults ? '隱藏排行榜' : '公佈排行榜'}
                                </button>
                                <button onClick={handleExportExcel}
                                    className="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl flex items-center justify-center gap-2 font-bold shadow-md transition-colors active:scale-95 border-b-4 border-green-800 active:border-b-0">
                                    <Icons2.Download /> 匯出 Excel 報表
                                </button>
                            </div>
                        )}
                    </div>
                    <div className="space-y-4">
                        {results.map((g,i) => (
                            <div key={g.id} className={`flex justify-between items-center p-5 rounded-2xl transition-all shadow-sm ${i===0?'bg-gradient-to-r from-amber-50 to-orange-100 border-2 border-orange-300 transform scale-105 shadow-md':'border border-orange-100 bg-white hover:border-orange-300 hover:shadow-md'}`}>
                                <div className="flex items-center gap-5">
                                    <div className={`w-12 h-12 rounded-full flex items-center justify-center font-black text-xl text-white shadow ${i===0?'bg-yellow-400':i===1?'bg-gray-400':i===2?'bg-amber-500':'bg-orange-200 text-orange-600'}`}>{i+1}</div>
                                    <span className={`text-xl ${i===0?'font-black text-gray-900':'font-bold text-gray-800'}`}>{g.name}</span>
                                </div>
                                <div className="text-right">
                                    <span className={`text-4xl font-black block ${i===0?'text-amber-600':'text-orange-600'}`}>{g.avg}</span>
                                    <span className="text-sm font-bold text-gray-400">平均總分</span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
