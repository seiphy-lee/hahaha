<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽籤回答系統(大富翁模式)</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0f4f8;
            overflow: hidden; /* Prevent scrolling during play */
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #888; 
            border-radius: 4px;
        }

        /* Setup Screen Styles */
        .setup-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
        }

        .board-container {
            display: grid;
            gap: 6px;
            width: 98vw;
            height: 96vh;
            margin: auto;
            padding: 10px;
        }

        .cell {
            border: 2px solid rgba(0,0,0,0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900; /* Extra Bold */
            /* Increased Font Size (approx 2x original 1.1rem) */
            font-size: 2.2rem; 
            position: relative;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
            transition: all 0.1s;
            overflow: hidden;
            line-height: 1.1;
            background-color: white; 
            z-index: 1;
        }

        /* Removed Cell Style */
        .cell-removed {
            background-color: #374151 !important; /* Gray-700 */
            color: #9ca3af !important; /* Gray-400 */
            border-color: #4b5563 !important;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* Vertical text for top/bottom rows */
        .cell-vertical {
            writing-mode: vertical-rl;
            text-orientation: upright;
            padding: 4px 0; 
            justify-content: center; 
            align-items: center;    
            letter-spacing: -2px; /* Tighter spacing for large text */
        }

        /* TCY: Text Combine Upright for numbers in vertical text */
        .tcy {
            text-combine-upright: all;
            margin: 4px 0; 
            font-size: 0.8em; /* Slightly smaller for 2-digit number */
        }

        /* Horizontal text for side columns */
        .cell-horizontal {
            flex-direction: row;
            padding: 0 4px;
            text-align: center;
            white-space: nowrap; 
        }

        /* Active Cell: RED BORDER instead of dot */
        .active-cell {
            transform: scale(1.05) !important;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.6) !important; /* Red glow */
            z-index: 50 !important;
            border-color: #ef4444 !important; /* Red-500 */
            border-width: 6px !important;
        }

        .center-panel {
            grid-column: 2 / -2;
            grid-row: 2 / -2;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            backdrop-filter: blur(5px);
            border: 1px solid #e2e8f0;
            z-index: 20;
        }

        .dice-cube {
            width: 80px;
            height: 80px;
            background: white;
            border: 3px solid #333;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            box-shadow: 0 8px 0px #333;
            margin: 12px;
            transition: transform 0.1s;
        }
        
        .dice-rolling {
            animation: shake 0.3s infinite;
        }

        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(-10deg); }
            100% { transform: rotate(0deg); }
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .popup-overlay {
            animation: fadeInOverlay 0.3s ease-out forwards;
        }
        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .popup-content {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Sound System (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const playTone = (freq, type, duration, vol = 0.1) => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        };

        const playSound = (type) => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            switch (type) {
                case 'roll':
                    const now = audioCtx.currentTime;
                    for(let i=0; i<5; i++) {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.frequency.value = 200 + Math.random() * 500;
                        gain.gain.setValueAtTime(0.05, now + i*0.05);
                        gain.gain.linearRampToValueAtTime(0, now + i*0.05 + 0.03);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + i*0.05);
                        osc.stop(now + i*0.05 + 0.05);
                    }
                    break;
                case 'step':
                    playTone(600, 'sine', 0.05, 0.1); 
                    break;
                case 'win':
                    // Fanfare
                    playTone(523.25, 'triangle', 0.6, 0.3); 
                    setTimeout(() => playTone(659.25, 'triangle', 0.6, 0.3), 100);
                    setTimeout(() => playTone(783.99, 'triangle', 0.6, 0.3), 200);
                    setTimeout(() => playTone(1046.50, 'triangle', 1.2, 0.4), 300);
                    break;
            }
        };

        // --- Data & Constants ---
        const DEFAULT_FUN_ITEMS = [
            "老師回答", "免死金牌", "指定左邊", "指定右邊", 
            "再來一次", "全班起立", "與老師擊掌", "物理之神附體",
            "下一輪倒轉", "休息一回", "幫老師擦黑板", "大笑三聲"
        ];

        const CELL_COLORS = [
            "#FFD1DC", "#FFDFD3", "#FFFFBA", "#D0F0C0", 
            "#BAE1FF", "#E6E6FA", "#F0E68C", "#FFB7B2"
        ];

        // --- Helper Functions ---
        const generateRingCoordinates = (totalCells) => {
            const semiPerimeter = (totalCells + 4) / 2;
            let h = Math.floor(semiPerimeter / 3.2); 
            if (h < 3) h = 3; 
            let w = Math.ceil(semiPerimeter - h);
            
            const calculatedTotal = 2*w + 2*h - 4;
            const diff = totalCells - calculatedTotal;
            w += Math.ceil(diff / 2);
            
            const coords = [];
            // Top Row
            for (let i = 0; i < w; i++) coords.push({ x: i + 1, y: 1, type: 'top' });
            // Right Column
            for (let i = 1; i < h; i++) coords.push({ x: w, y: i + 1, type: 'right' });
            // Bottom Row
            for (let i = w - 2; i >= 0; i--) coords.push({ x: i + 1, y: h, type: 'bottom' });
            // Left Column
            for (let i = h - 2; i > 0; i--) coords.push({ x: 1, y: i + 1, type: 'left' });

            return { w, h, coords: coords.slice(0, totalCells) };
        };

        // --- Main Component ---
        const App = () => {
            const [view, setView] = useState('setup');

            // Config State
            const [totalCells, setTotalCells] = useState(30);
            const [inputNames, setInputNames] = useState("01愛因斯坦\n02牛頓\n03波耳\n04海森堡\n05薛丁格\n06費曼\n07居里夫人\n08馬克斯威爾\n09法拉第\n10伽利略\n11特斯拉\n12普朗克\n13赫茲\n14焦耳\n15歐姆");
            const [numDice, setNumDice] = useState(2);
            
            // Game State
            // namesList now stores objects: { name: string, removed: boolean }
            const [namesList, setNamesList] = useState([]);
            const [boardConfig, setBoardConfig] = useState({ w: 10, h: 8, coords: [] });
            const [currentPos, setCurrentPos] = useState(0);
            const [isMoving, setIsMoving] = useState(false);
            const [lastRoll, setLastRoll] = useState([1, 1]); 
            const [gameMessage, setGameMessage] = useState("準備開始物理課抽籤！");
            
            // Winner Popup State
            const [showWinner, setShowWinner] = useState(false);
            const [winnerInfo, setWinnerInfo] = useState({ name: "", index: -1 });
            
            useEffect(() => {
                if(window.lucide) window.lucide.createIcons();
            }, [view, lastRoll]);

            // Find next valid index (skipping removed ones)
            const getNextValidPos = (startPos, direction = 1) => {
                let next = (startPos + direction + totalCells) % totalCells;
                let attempts = 0;
                // Keep moving if cell is removed
                while (namesList[next]?.removed && attempts < totalCells) {
                    next = (next + direction + totalCells) % totalCells;
                    attempts++;
                }
                if (attempts >= totalCells) return startPos; // All removed
                return next;
            };

            const handleStartGame = () => {
                let names = inputNames.split(/[\n,]+/).map(n => n.trim()).filter(n => n);
                let finalContentStrings = [...names];
                
                if (finalContentStrings.length < totalCells) {
                    let funIndex = 0;
                    while (finalContentStrings.length < totalCells) {
                        finalContentStrings.push(DEFAULT_FUN_ITEMS[funIndex % DEFAULT_FUN_ITEMS.length]);
                        funIndex++;
                    }
                } else {
                    finalContentStrings = finalContentStrings.slice(0, totalCells);
                }

                // Convert strings to objects for state tracking
                const finalList = finalContentStrings.map(name => ({ name, removed: false }));
                setNamesList(finalList);

                const config = generateRingCoordinates(totalCells);
                setBoardConfig(config);
                setCurrentPos(0);
                setGameMessage("地圖生成完畢，請投擲骰子！");
                
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                setView('play');
            };

            const handleCSVImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    setInputNames(event.target.result);
                };
                reader.readAsText(file);
            };

            // Common Logic for Ending a Move
            const handleWin = (finalIndex) => {
                setIsMoving(false);
                playSound('win');
                const landedObj = namesList[finalIndex];
                setGameMessage(`✨ 抽中：${landedObj.name || '未知'} ✨`);
                setWinnerInfo({ name: landedObj.name || "未知", index: finalIndex });
                setShowWinner(true); // Trigger Popup
            };

            // Mode 1: Dice Roll
            const rollDice = async () => {
                if (isMoving) return;
                if (namesList.every(item => item.removed)) {
                    alert("所有名單皆已移除！請重設名單。");
                    return;
                }

                setIsMoving(true);
                setShowWinner(false); // Close previous if open
                setGameMessage("🎲 骰子轉動中...");

                // Roll animation duration
                let rollDuration = 1200; 
                
                let rollInterval = setInterval(() => {
                    const tempRoll = Array.from({ length: numDice }, () => Math.floor(Math.random() * 6) + 1);
                    setLastRoll(tempRoll);
                    playSound('roll');
                }, 100);

                await new Promise(r => setTimeout(r, rollDuration));
                clearInterval(rollInterval);

                const finalRoll = Array.from({ length: numDice }, () => Math.floor(Math.random() * 6) + 1);
                setLastRoll(finalRoll);
                const steps = finalRoll.reduce((a, b) => a + b, 0);
                setGameMessage(`擲出了 ${steps} 點！準備移動...`);

                // Pause before moving
                await new Promise(r => setTimeout(r, 500));

                setGameMessage(`位移開始 (目標 ${steps} 步)...`);

                let currentStep = 0;
                let delay = 200;

                const moveStep = () => {
                    if (currentStep < steps) {
                        setCurrentPos(prev => getNextValidPos(prev));
                        currentStep++;
                        playSound('step');
                        
                        delay += 50; 
                        setTimeout(moveStep, delay);
                    } else {
                         setCurrentPos(finalPos => {
                             handleWin(finalPos);
                             return finalPos;
                         });
                    }
                };

                moveStep();
            };

            // Mode 2: Slot Machine (Rapid Spin)
            const startSlotMachine = () => {
                if (isMoving) return;
                if (namesList.every(item => item.removed)) {
                    alert("所有名單皆已移除！請重設名單。");
                    return;
                }

                setIsMoving(true);
                setShowWinner(false);
                setGameMessage("🎰 吃角子老虎模式啟動！");

                // Get all valid indices
                const validIndices = namesList.map((item, index) => item.removed ? -1 : index).filter(i => i !== -1);
                
                // Random target from valid list
                const targetIndex = validIndices[Math.floor(Math.random() * validIndices.length)];
                
                // Calculate hops needed
                // We want to simulate at least 3 full circles of VALID cells
                const validCount = validIndices.length;
                let currentValidIndexInList = validIndices.indexOf(currentPos);
                if(currentValidIndexInList === -1) currentValidIndexInList = 0; 
                
                const targetValidIndexInList = validIndices.indexOf(targetIndex);
                
                // Hops: Distance + Min Laps
                let hops = (targetValidIndexInList - currentValidIndexInList + validCount) % validCount;
                if (hops === 0) hops = validCount; 
                hops += validCount * 3; // 3 laps
                
                const totalSteps = hops;
                
                let currentStep = 0;
                let delay = 30; // Start very fast

                const moveSlotStep = () => {
                    if (currentStep < totalSteps) {
                        setCurrentPos(prev => getNextValidPos(prev));
                        currentStep++;
                        playSound('step');
                        
                        if (currentStep > totalSteps * 0.7) {
                            delay += 15; // Slow down
                        }

                        setTimeout(moveSlotStep, delay);
                    } else {
                        setCurrentPos(finalPos => {
                             handleWin(finalPos);
                             return finalPos;
                         });
                    }
                };

                moveSlotStep();
            };

            const shuffleNames = () => {
                // Shuffle the entire object list, so 'removed' status travels with name
                const shuffled = [...namesList].sort(() => Math.random() - 0.5);
                setNamesList(shuffled);
                setGameMessage("名單已打亂");
            };
            
            const handleKeepUser = () => {
                setShowWinner(false);
            };

            const handleRemoveUser = () => {
                if (winnerInfo.index !== -1) {
                    setNamesList(prev => {
                        const newList = [...prev];
                        // Mark the current item as removed
                        if (newList[winnerInfo.index]) {
                            newList[winnerInfo.index] = { ...newList[winnerInfo.index], removed: true };
                        }
                        return newList;
                    });
                    setGameMessage(`${winnerInfo.name} 已暫時移除`);
                }
                setShowWinner(false);
            };

            const renderName = (name, isVertical) => {
                if (!isVertical) return <span>{name}</span>;
                const match = name.match(/^(\d+)(.*)/);
                if (match) {
                    return (
                        <>
                            <span className="tcy">{match[1]}</span>
                            <span>{match[2]}</span>
                        </>
                    );
                }
                return <span>{name}</span>;
            };

            // Layout Constants for Locked Dimensions
            const ROW_HEIGHT = 'min(18vh, 160px)';
            const COL_WIDTH = 'min(14vw, 150px)';

            const gridColsStyle = `${COL_WIDTH} repeat(${boardConfig.w - 2}, 1fr) ${COL_WIDTH}`;
            const gridRowsStyle = `${ROW_HEIGHT} repeat(${boardConfig.h - 2}, 1fr) ${ROW_HEIGHT}`;

            if (view === 'setup') {
                return (
                    <div className="setup-container">
                        <div className="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-4xl fade-in border border-gray-100">
                            <div className="text-center mb-6">
                                <h1 className="text-3xl font-bold text-blue-600 flex items-center justify-center gap-3 mb-2 whitespace-nowrap">
                                    <i data-lucide="atom" className="w-10 h-10"></i>
                                    抽籤回答系統(大富翁模式)---阿發老師設計
                                </h1>
                                <p className="text-gray-500">請先設定名單與參數，準備開始今天的課程！</p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-2">總格子數 (Total Cells)</label>
                                        <input 
                                            type="number" 
                                            value={totalCells} 
                                            onChange={(e) => setTotalCells(parseInt(e.target.value) || 20)}
                                            className="w-full border-2 border-gray-200 rounded-lg px-4 py-2 focus:border-blue-500 focus:outline-none transition"
                                        />
                                        <p className="text-xs text-gray-400 mt-1">若名單不足，將自動填入趣味籤。</p>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-2">預設骰子數量</label>
                                        <div className="flex items-center gap-4 bg-gray-50 p-2 rounded-lg border">
                                            <input 
                                                type="range" min="1" max="3" value={numDice} 
                                                onChange={(e) => setNumDice(parseInt(e.target.value))}
                                                className="flex-1 h-2 bg-blue-200 rounded-lg appearance-none cursor-pointer"
                                            />
                                            <span className="font-bold text-blue-600 w-10 text-center">{numDice} 顆</span>
                                        </div>
                                    </div>

                                    <div className="pt-4">
                                        <button 
                                            onClick={handleStartGame}
                                            className="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl font-bold text-xl shadow-lg hover:shadow-xl hover:scale-[1.02] transition-all flex items-center justify-center gap-2"
                                        >
                                            <i data-lucide="play-circle"></i> 生成大富翁地圖並開始
                                        </button>
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    <label className="block text-sm font-bold text-gray-700">
                                        名單輸入 <span className="font-normal text-gray-400">(每行一人，可加座號)</span>
                                    </label>
                                    <textarea 
                                        className="w-full h-48 border-2 border-gray-200 rounded-xl p-3 text-sm focus:border-blue-500 focus:outline-none transition resize-none custom-scroll"
                                        value={inputNames}
                                        onChange={(e) => setInputNames(e.target.value)}
                                        placeholder="例如：&#10;01愛因斯坦&#10;02牛頓"
                                    ></textarea>
                                    <label className="cursor-pointer bg-green-500 border border-green-600 rounded-lg py-2 text-center hover:bg-green-600 transition block text-sm text-white font-bold shadow-sm">
                                        <i data-lucide="upload" className="w-4 h-4 inline mr-1"></i> 從 CSV 匯入名單
                                        <input type="file" accept=".csv" onChange={handleCSVImport} className="hidden" />
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="w-full h-full relative fade-in">
                    <div 
                        className="board-container"
                        style={{
                            gridTemplateColumns: gridColsStyle,
                            gridTemplateRows: gridRowsStyle
                        }}
                    >
                        {boardConfig.coords.map((coord, index) => {
                            const isTopBottom = coord.type === 'top' || coord.type === 'bottom';
                            const isActive = index === currentPos;
                            // Safe access in case of race condition render
                            const item = namesList[index] || { name: '', removed: false };
                            const isRemoved = item.removed;
                            const bgColor = isRemoved ? '#374151' : CELL_COLORS[index % CELL_COLORS.length];
                            
                            return (
                                <div 
                                    key={index}
                                    className={`cell ${isTopBottom ? 'cell-vertical' : 'cell-horizontal'} ${isActive ? 'active-cell' : ''} ${isRemoved ? 'cell-removed' : ''}`}
                                    style={{
                                        gridColumn: coord.x,
                                        gridRow: coord.y,
                                        backgroundColor: isActive ? 'white' : bgColor,
                                        color: isRemoved ? '#9ca3af' : '#1e293b'
                                    }}
                                >
                                    {renderName(item.name, isTopBottom)}
                                </div>
                            );
                        })}

                        <div className="center-panel">
                            {/* Header Area */}
                            <div className="flex justify-between items-center mb-4">
                                <h1 className="text-2xl font-bold text-gray-800 flex items-center gap-2">
                                    <i data-lucide="atom" className="text-blue-600"></i>
                                    課堂抽籤
                                </h1>
                                <button 
                                    onClick={() => setView('setup')}
                                    className="px-6 py-3 bg-green-500 text-white text-xl rounded-xl hover:bg-green-600 transition flex items-center gap-2 font-bold shadow-md"
                                >
                                    <i data-lucide="settings" className="w-6 h-6"></i> 重設名單
                                </button>
                            </div>
                            
                            {/* Message Board */}
                            <div className="bg-gradient-to-r from-blue-50 to-indigo-50 p-4 rounded-xl mb-6 border border-blue-100 text-center shadow-sm min-h-[80px] flex items-center justify-center">
                                <p className="text-2xl font-bold text-blue-900 animate-pulse">{gameMessage}</p>
                            </div>

                            {/* Dice Visuals */}
                            <div className="flex justify-center mb-6 min-h-[100px] items-center">
                                {lastRoll.map((val, idx) => (
                                    <div key={idx} className={`dice-cube ${isMoving ? 'dice-rolling' : ''}`}>
                                        {val}
                                    </div>
                                ))}
                            </div>

                            {/* Main Controls */}
                            <div className="space-y-4">
                                <div className="flex gap-4">
                                    <button 
                                        onClick={rollDice}
                                        disabled={isMoving}
                                        className={`flex-[2] py-6 text-2xl font-bold rounded-2xl shadow-lg transition-all transform active:scale-95 flex justify-center items-center gap-3
                                            ${isMoving ? 'bg-gray-300 cursor-not-allowed text-gray-500' : 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white hover:from-blue-700 hover:to-indigo-700 hover:shadow-xl'}`}
                                    >
                                        <i data-lucide="dices" className="w-8 h-8"></i> 擲骰子
                                    </button>
                                    
                                    <button 
                                        onClick={startSlotMachine}
                                        disabled={isMoving}
                                        className={`flex-[1] py-6 text-xl font-bold rounded-2xl shadow-lg transition-all transform active:scale-95 flex flex-col justify-center items-center gap-1
                                            ${isMoving ? 'bg-gray-300 cursor-not-allowed text-gray-500' : 'bg-gradient-to-r from-purple-500 to-fuchsia-600 text-white hover:from-purple-600 hover:to-fuchsia-700 hover:shadow-xl'}`}
                                        title="吃角子老虎模式"
                                    >
                                        <i data-lucide="zap" className="w-6 h-6"></i> 
                                        <span>機率模式</span>
                                    </button>
                                </div>

                                <div className="flex gap-4">
                                    <button onClick={shuffleNames} disabled={isMoving} className="flex-1 py-3 bg-amber-500 text-white rounded-xl shadow hover:bg-amber-600 transition flex justify-center items-center gap-2 font-bold">
                                        <i data-lucide="shuffle" className="w-5 h-5"></i> 打亂位置
                                    </button>
                                    <button onClick={() => setCurrentPos(0)} disabled={isMoving} className="flex-1 py-3 bg-slate-500 text-white rounded-xl shadow hover:bg-slate-600 transition flex justify-center items-center gap-2 font-bold">
                                        <i data-lucide="rotate-ccw" className="w-5 h-5"></i> 歸零
                                    </button>
                                </div>

                                {/* Dice Count Control */}
                                <div className="bg-white p-3 rounded-xl border border-gray-200 flex items-center justify-between">
                                    <span className="text-sm font-bold text-gray-600 flex items-center gap-2">
                                        <i data-lucide="cuboid" className="w-4 h-4"></i> 骰子數
                                    </span>
                                    <div className="flex items-center gap-3">
                                        <button onClick={() => setNumDice(Math.max(1, numDice - 1))} className="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 font-bold">-</button>
                                        <span className="font-bold text-lg w-4 text-center">{numDice}</span>
                                        <button onClick={() => setNumDice(Math.min(3, numDice + 1))} className="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 font-bold">+</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    {/* Winner Popup Overlay */}
                    {showWinner && (
                        <div 
                            className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center popup-overlay"
                        >
                            <div className="bg-white p-8 rounded-[2rem] shadow-2xl text-center popup-content border-8 border-yellow-400 relative overflow-hidden max-w-[90vw] min-w-[50vw]">
                                {/* Confetti Effect */}
                                <div className="absolute top-0 left-0 w-full h-full pointer-events-none opacity-20">
                                    <div className="absolute top-10 left-10 text-6xl rotate-12">🎉</div>
                                    <div className="absolute bottom-10 right-10 text-6xl -rotate-12">✨</div>
                                    <div className="absolute top-1/2 left-5 text-4xl rotate-45">🎈</div>
                                    <div className="absolute top-20 right-20 text-5xl rotate-180">🎊</div>
                                </div>
                                
                                <h2 className="text-4xl text-gray-600 mb-4 font-bold tracking-widest uppercase">
                                    CONGRATULATIONS
                                </h2>
                                <div className="py-6">
                                    <div className="text-[5rem] md:text-[7rem] font-black text-transparent bg-clip-text bg-gradient-to-br from-red-500 to-orange-600 drop-shadow-lg leading-tight break-keep" style={{ WebkitTextStroke: '2px white' }}>
                                        {winnerInfo.name}
                                    </div>
                                </div>

                                {/* Action Buttons */}
                                <div className="mt-6 flex justify-center gap-6 relative z-10">
                                    <button 
                                        onClick={handleKeepUser}
                                        className="px-8 py-4 bg-emerald-500 hover:bg-emerald-600 text-white text-2xl font-bold rounded-xl shadow-lg transition transform hover:scale-105 flex items-center gap-2"
                                    >
                                        <i data-lucide="check-circle" className="w-8 h-8"></i>
                                        保留名單
                                    </button>
                                    <button 
                                        onClick={handleRemoveUser}
                                        className="px-8 py-4 bg-gray-500 hover:bg-gray-600 text-white text-2xl font-bold rounded-xl shadow-lg transition transform hover:scale-105 flex items-center gap-2"
                                    >
                                        <i data-lucide="trash-2" className="w-8 h-8"></i>
                                        移除此人
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
