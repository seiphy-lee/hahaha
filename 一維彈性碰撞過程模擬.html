<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一維彈性碰撞過程分析</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        .canvas-container {
            aspect-ratio: 16 / 5;
            width: 100%;
            background-color: #f8fafc;
        }
        
        @media (max-width: 768px) {
            .canvas-container { aspect-ratio: 16 / 7; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- 標題與說明 -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2">一維彈性碰撞過程模擬</h1>
            <p class="text-gray-600 text-sm md:text-base leading-relaxed">
                本動畫以<b>靜止觀察者視角</b>演示。模擬總時間固定為 10 秒：碰撞前接近需 3 秒，彈簧壓縮接觸時間剛好為 4 秒，碰撞後分離演示 3 秒。質量與初始速度為固定參數以利於觀察彈簧壓縮期間的速度與距離變化。
            </p>
        </div>

        <!-- 兩欄式佈局：控制面板與圖表 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- 控制面板 -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 lg:col-span-1 space-y-6 flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xl font-bold text-gray-800">系統參數</h2>
                        <!-- 桌面版按鍵 -->
                        <div class="space-x-2 hidden md:block">
                            <button id="btnPlayPause" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow transition-colors w-24">
                                開始播放
                            </button>
                            <button id="btnReset" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded shadow transition-colors">
                                重置
                            </button>
                        </div>
                    </div>

                    <!-- 參數顯示 (固定值) -->
                    <div class="grid grid-cols-2 gap-4 text-center mt-6">
                        <div class="bg-green-50 p-4 rounded-lg border border-green-100 shadow-sm">
                            <div class="text-sm text-green-700 font-bold mb-1">甲物體 (m₁)</div>
                            <div class="text-2xl font-mono font-bold text-green-600">2.0 <span class="text-sm">kg</span></div>
                            <div class="text-sm text-green-700 mt-2">初速: 60 m/s</div>
                        </div>
                        <div class="bg-orange-50 p-4 rounded-lg border border-orange-100 shadow-sm">
                            <div class="text-sm text-orange-700 font-bold mb-1">乙物體 (m₂)</div>
                            <div class="text-2xl font-mono font-bold text-orange-500">1.0 <span class="text-sm">kg</span></div>
                            <div class="text-sm text-orange-700 mt-2">初速: 20 m/s</div>
                        </div>
                    </div>
                </div>

                <!-- 大尺寸計時器 -->
                <div class="bg-slate-100 p-4 rounded-lg text-center border border-slate-200 shadow-inner mt-4">
                    <div class="text-sm text-slate-500 font-bold mb-1 tracking-widest">模擬時間</div>
                    <div class="text-5xl font-mono font-bold text-slate-800" id="timeDisplay">0.00 <span class="text-2xl text-slate-500">s</span></div>
                    <div class="text-xs text-slate-400 mt-1">進度: <span id="progressText">0</span> 秒</div>
                </div>
            </div>

            <!-- v-t 圖表區 -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 lg:col-span-2">
                <h2 class="text-xl font-bold text-gray-800 mb-4">v-t 圖 (速度-時間)</h2>
                <!-- 放大鉛直方向的高度 -->
                <div class="w-full h-80 relative">
                    <canvas id="vtChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 動畫展示區 -->
        <div class="bg-white p-2 md:p-6 rounded-xl shadow-sm border border-gray-200 relative">
            
            <!-- 手機版專屬按鍵 (右上角) -->
            <div class="absolute top-4 right-4 z-20 flex md:hidden space-x-2">
                <button id="btnPlayPauseMobile" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg shadow-md transition-colors text-xl font-bold w-32">
                    開始播放
                </button>
                <button id="btnResetMobile" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-lg shadow-md transition-colors text-xl font-bold">
                    重置
                </button>
            </div>

            <!-- 狀態指示器 -->
            <div class="absolute top-4 left-4 md:top-8 md:left-8 z-20 text-white px-4 py-2 rounded shadow-md text-2xl md:text-base font-bold flex items-center transition-colors duration-300 pointer-events-none" id="phaseIndicatorBadge">
                <span id="phaseIndicator" class="tracking-widest">碰撞前</span>
            </div>

            <!-- 物理狀態文字說明 -->
            <div class="absolute top-4 md:top-8 right-4 md:right-8 z-10 text-right bg-white/90 backdrop-blur p-3 rounded-lg shadow-sm border border-gray-100 hidden md:block">
                <p id="descLine1" class="text-gray-800 font-medium">v₁ > v₂</p>
                <p id="descLine2" class="text-gray-600 text-sm">系統總動能最大，<br>總位能為零。</p>
            </div>

            <!-- 橫向滑動區塊 (手機版畫布放大 1.5倍) -->
            <div class="w-full overflow-x-auto overflow-y-hidden rounded mt-20 md:mt-0" style="-webkit-overflow-scrolling: touch;">
                <div class="canvas-container relative w-[150%] md:w-full max-w-none origin-top-left rounded-lg overflow-hidden md:mt-4" id="canvasWrapper">
                    <canvas id="simCanvas" class="absolute top-0 left-0 w-full h-full"></canvas>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ---------------------------------------------------------
        // 物理常數與狀態
        // ---------------------------------------------------------
        const PI = Math.PI;
        
        const PHYS = {
            k: (PI * PI) / 24, 
            L0: 120, 
            blockW: 80,
            blockH: 60
        };

        let state = {
            m1: 2.0,
            m2: 1.0,
            x1: 0,
            v1: 60,
            x2: 0,
            v2: 20,
            time: 0,
            running: false, 
            phase: 'before' 
        };

        const initialSetup = () => {
            state.x1 = 100; 
            state.x2 = 420; 
            state.v1 = 60;
            state.v2 = 20;
            state.time = 0;
            state.phase = 'before';
            
            // 重置圖表資料
            chartData.datasets[0].data = [];
            chartData.datasets[1].data = [];
            chartData.datasets[2].data = [];
            if(vtChart) vtChart.update();
            updateDescriptions();
            updateTimeDisplay();

            state.running = false;
            updatePlayButtons();
            lastTime = performance.now();
        };

        // ---------------------------------------------------------
        // DOM 元素與事件綁定
        // ---------------------------------------------------------
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvasWrapper');
        
        const logicalWidth = 1100;
        const logicalHeight = 350;

        const ui = {
            btnPlay: document.getElementById('btnPlayPause'),
            btnReset: document.getElementById('btnReset'),
            btnPlayMobile: document.getElementById('btnPlayPauseMobile'),
            btnResetMobile: document.getElementById('btnResetMobile'),
            phaseInd: document.getElementById('phaseIndicator'),
            badge: document.getElementById('phaseIndicatorBadge'),
            descL1: document.getElementById('descLine1'),
            descL2: document.getElementById('descLine2'),
            timeDisplay: document.getElementById('timeDisplay'),
            progressText: document.getElementById('progressText')
        };

        function updateTimeDisplay() {
            ui.timeDisplay.innerHTML = `${state.time.toFixed(2)} <span class="text-2xl text-slate-500">s</span>`;
            ui.progressText.innerText = Math.floor(state.time);
        }

        function updatePlayButtons() {
            let isEnd = state.x1 - PHYS.blockW/2 > logicalWidth + 150;
            let text = "";
            let baseClass = "";

            if (isEnd) {
                text = "重新播放";
                baseClass = "bg-green-600 hover:bg-green-700 text-white transition-colors";
            } else if (state.running) {
                text = "暫停";
                baseClass = "bg-blue-600 hover:bg-blue-700 text-white transition-colors";
            } else {
                text = state.time === 0 ? "開始播放" : "繼續播放";
                baseClass = "bg-green-600 hover:bg-green-700 text-white transition-colors";
            }

            // 更新桌面版按鈕
            ui.btnPlay.innerText = text;
            ui.btnPlay.className = `${baseClass} px-4 py-2 rounded shadow w-24`;

            // 更新手機版按鈕
            ui.btnPlayMobile.innerText = text;
            ui.btnPlayMobile.className = `${baseClass} px-4 py-2 rounded-lg shadow-md text-xl font-bold w-32`;
        }

        const handlePlayClick = () => {
            // 當兩物體完全移出畫面外時，點擊播放會自動重置並直接開始播放
            if (state.x1 - PHYS.blockW/2 > logicalWidth + 150) {
                initialSetup();
                state.running = true;
                updatePlayButtons();
                lastTime = performance.now();
            } else {
                state.running = !state.running;
                updatePlayButtons();
                if(state.running) lastTime = performance.now();
            }
        };

        const handleResetClick = () => {
            initialSetup();
            if(!state.running) draw();
        };

        // 綁定兩組按鈕事件
        ui.btnPlay.addEventListener('click', handlePlayClick);
        ui.btnPlayMobile.addEventListener('click', handlePlayClick);
        ui.btnReset.addEventListener('click', handleResetClick);
        ui.btnResetMobile.addEventListener('click', handleResetClick);

        // ---------------------------------------------------------
        // Chart.js 設定
        // ---------------------------------------------------------
        const chartCtx = document.getElementById('vtChart').getContext('2d');
        const chartData = {
            datasets: [
                {
                    label: '甲物體 (v₁)',
                    borderColor: '#16a34a', 
                    backgroundColor: 'transparent',
                    data: [],
                    borderWidth: 2.5,
                    pointRadius: 0,
                    tension: 0.2
                },
                {
                    label: '乙物體 (v₂)',
                    borderColor: '#f97316', 
                    backgroundColor: 'transparent',
                    data: [],
                    borderWidth: 2.5,
                    pointRadius: 0,
                    tension: 0.2
                },
                {
                    label: '質心速度 (v_C)',
                    borderColor: '#FF0000', // 質心速度虛線改為紅色
                    backgroundColor: 'transparent',
                    data: [],
                    borderWidth: 2,
                    borderDash: [6, 6],
                    pointRadius: 0,
                    tension: 0
                }
            ]
        };

        const vtChart = new Chart(chartCtx, {
            type: 'line',
            data: chartData,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                scales: {
                    x: {
                        type: 'linear', 
                        title: { 
                            display: true, 
                            text: '時間 (s)', 
                            padding: { top: 15 } 
                        },
                        min: 0,
                        max: 10,
                        ticks: { 
                            stepSize: 1, 
                            maxTicksLimit: 11
                        }
                    },
                    y: {
                        title: { display: true, text: '速度 (m/s)' },
                        min: 0,
                        max: 80 // 【調整】最大值調整為 80
                    }
                },
                plugins: {
                    legend: { 
                        position: 'top',
                        labels: {
                            usePointStyle: true, // 使用自訂圖例樣式
                            generateLabels: function(chart) {
                                // 呼叫預設標籤生成函式
                                const originalLabels = Chart.defaults.plugins.legend.labels.generateLabels(chart);
                                originalLabels.forEach(label => {
                                    // 強制設定圖例為直線形狀
                                    label.pointStyle = 'line';
                                    
                                    // 針對質心速度改變文字顏色
                                    if (label.text.includes('質心速度')) {
                                        label.fontColor = '#FF0000';
                                    }
                                });
                                return originalLabels;
                            }
                        }
                    }
                }
            }
        });

        // ---------------------------------------------------------
        // 核心物理引擎 (精確步長)
        // ---------------------------------------------------------
        function updatePhysics(dt) {
            const subSteps = 100; 
            const subDt = dt / subSteps;

            for (let i = 0; i < subSteps; i++) {
                let p1 = state.x1 + PHYS.blockW / 2;
                let p2 = state.x2 - PHYS.blockW / 2;
                let distance = p2 - p1;
                
                let force = 0;
                
                if (distance < PHYS.L0) {
                    let compression = PHYS.L0 - distance;
                    force = PHYS.k * compression; 
                    
                    if (state.phase === 'before') {
                        state.phase = 'during';
                        updateDescriptions();
                    }
                } else {
                    if (state.phase === 'during') {
                        state.phase = 'after';
                        updateDescriptions();
                    }
                }

                state.v1 += (-force / state.m1) * subDt;
                state.v2 += (force / state.m2) * subDt;
                state.x1 += state.v1 * subDt;
                state.x2 += state.v2 * subDt;
                
                state.time += subDt;
            }
        }

        // ---------------------------------------------------------
        // 動畫繪製邏輯
        // ---------------------------------------------------------
        function drawSpring(ctx, startX, endX, y) {
            ctx.beginPath();
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2.5;
            // 圓角讓端點接合更平滑
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            
            let width = endX - startX;
            let numCoils = 12; // 圈數
            let amplitude = 12; // 【固定高度】絕不突變
            let flatEnd = 20; 
            
            // 安全限制，避免錯誤
            if (width < 2) return;
            
            ctx.moveTo(startX, y);
            ctx.lineTo(startX + flatEnd, y);
            
            let springWidth = Math.max(0, width - flatEnd * 2);
            let segments = 200; // 使用高密度點位來描繪完美的正弦波連續曲線
            
            for (let i = 0; i <= segments; i++) {
                let t = i / segments;
                let cx = startX + flatEnd + t * springWidth;
                let cy = y - amplitude * Math.sin(t * numCoils * Math.PI * 2);
                ctx.lineTo(cx, cy);
            }
            
            ctx.lineTo(endX, y);
            ctx.stroke();
        }

        function drawArrow(ctx, fromx, fromy, tox, toy, color) {
            var headlen = 12; 
            var dx = tox - fromx;
            var dy = toy - fromy;
            var angle = Math.atan2(dy, dx);
            
            if (Math.abs(dx) < 2) return;

            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 4;
            ctx.moveTo(fromx, fromy);
            ctx.lineTo(tox, toy);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
            ctx.lineTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
            ctx.fill();
        }

        function drawBlock(ctx, x, y, label) {
            ctx.fillStyle = '#d4a373';
            ctx.fillRect(x - PHYS.blockW/2, y - PHYS.blockH/2, PHYS.blockW, PHYS.blockH);
            
            ctx.strokeStyle = '#b5835a';
            ctx.lineWidth = 3;
            ctx.strokeRect(x - PHYS.blockW/2, y - PHYS.blockH/2, PHYS.blockW, PHYS.blockH);

            ctx.fillStyle = '#333';
            ctx.font = 'bold 26px "Noto Serif TC", serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, x, y);
        }

        function draw() {
            const displayWidth = wrapper.clientWidth;
            const displayHeight = wrapper.clientHeight;
            
            if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
                canvas.width = displayWidth;
                canvas.height = displayHeight;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            
            const scaleX = canvas.width / logicalWidth;
            const scaleY = canvas.height / logicalHeight;
            const scale = Math.min(scaleX, scaleY); 
            
            const offsetX = (canvas.width - logicalWidth * scale) / 2;
            const offsetY = (canvas.height - logicalHeight * scale) / 2;
            
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            const groundY = logicalHeight / 2 + PHYS.blockH/2 + 2;

            ctx.fillStyle = '#cbd5e1'; 
            // 將地板向右與向左延伸，確保超出畫面範圍
            ctx.fillRect(-500, groundY, logicalWidth + 1000, 15);
            
            ctx.fillStyle = '#64748b';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            // 將座標軸刻度多繪製一段，配合延長的地板
            for (let i = 0; i <= logicalWidth + 300; i += 100) {
                ctx.beginPath();
                ctx.moveTo(i, groundY);
                ctx.lineTo(i, groundY + 15);
                ctx.strokeStyle = '#f8fafc';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillText(i + 'm', i, groundY + 30);
            }

            let rightOfM1 = state.x1 + PHYS.blockW/2;
            let leftOfM2 = state.x2 - PHYS.blockW/2;
            let actualSpringEndX = leftOfM2;
            let actualSpringStartX = (rightOfM1 > leftOfM2 - PHYS.L0) ? rightOfM1 : leftOfM2 - PHYS.L0;
            
            drawSpring(ctx, actualSpringStartX, actualSpringEndX, logicalHeight / 2);

            drawBlock(ctx, state.x1, logicalHeight / 2, '甲');
            drawBlock(ctx, state.x2, logicalHeight / 2, '乙');

            const arrowY = logicalHeight / 2 - PHYS.blockH/2 - 25;
            const vScale = 1.0; 
            
            drawArrow(ctx, state.x1, arrowY, state.x1 + state.v1 * vScale, arrowY, '#16a34a');
            ctx.fillStyle = '#16a34a';
            ctx.font = 'italic bold 22px "Times New Roman", serif';
            ctx.textAlign = 'center';
            ctx.fillText(state.phase === 'after' ? "v₁'" : "v₁", state.x1 + (state.v1 * vScale)/2, arrowY - 15);

            drawArrow(ctx, state.x2, arrowY, state.x2 + state.v2 * vScale, arrowY, '#f97316');
            ctx.fillStyle = '#f97316';
            ctx.fillText(state.phase === 'after' ? "v₂'" : "v₂", state.x2 + (state.v2 * vScale)/2, arrowY - 15);
            
            ctx.restore();
        }

        // ---------------------------------------------------------
        // 狀態文字更新
        // ---------------------------------------------------------
        function updateDescriptions() {
            let ind = ui.phaseInd;
            let badge = ui.badge;
            let l1 = ui.descL1;
            let l2 = ui.descL2;
            
            switch(state.phase) {
                case 'before':
                    ind.innerText = '碰撞前';
                    badge.className = 'absolute top-4 left-4 md:top-8 md:left-8 z-20 bg-sky-500 text-white px-4 py-2 rounded shadow-md text-2xl md:text-base font-bold flex items-center transition-colors duration-300 pointer-events-none';
                    l1.innerHTML = 'v<sub class="text-xs">1</sub> > v<sub class="text-xs">2</sub>';
                    l2.innerHTML = '距離縮短中<br>總位能為零。';
                    break;
                case 'during':
                    ind.innerText = '碰撞中';
                    badge.className = 'absolute top-4 left-4 md:top-8 md:left-8 z-20 bg-amber-500 text-white px-4 py-2 rounded shadow-md text-2xl md:text-base font-bold flex items-center transition-colors duration-300 pointer-events-none';
                    l1.innerHTML = '彈力作用中';
                    l2.innerHTML = '動能與位能劇烈轉換中...';
                    break;
                case 'after':
                    ind.innerText = '碰撞後';
                    badge.className = 'absolute top-4 left-4 md:top-8 md:left-8 z-20 bg-indigo-500 text-white px-4 py-2 rounded shadow-md text-2xl md:text-base font-bold flex items-center transition-colors duration-300 pointer-events-none';
                    l1.innerHTML = 'v<sub class="text-xs">2</sub>\' > v<sub class="text-xs">1</sub>\'';
                    l2.innerHTML = '系統總動能與碰撞前相等，<br>位能恢復為零，物體遠離。';
                    break;
            }
        }

        // ---------------------------------------------------------
        // 主迴圈
        // ---------------------------------------------------------
        let lastTime = performance.now();
        let chartUpdateTimer = 0;

        function loop(currentTime) {
            let dt = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            if (dt > 0.1) dt = 0.1;

            if (state.running) {
                let simDt = dt; 
                
                if (simDt > 0) {
                    updatePhysics(simDt);
                    updateTimeDisplay();

                    chartUpdateTimer += simDt;
                    // 【限制】確保圖表點位最多只畫到 10 秒
                    if (chartUpdateTimer >= 0.05 && state.time <= 10.05) {
                        chartUpdateTimer = 0;
                        
                        let vc = (state.m1 * state.v1 + state.m2 * state.v2) / (state.m1 + state.m2);
                        
                        chartData.datasets[0].data.push({ x: state.time, y: state.v1 });
                        chartData.datasets[1].data.push({ x: state.time, y: state.v2 });
                        chartData.datasets[2].data.push({ x: state.time, y: vc });
                        
                        vtChart.update();
                        
                        if(state.phase === 'during') updateDescriptions();
                    }
                    
                    // 【離場判斷】當甲物體(在左側的物體)完全離開右方界線時，才停止模擬
                    // 增加緩衝空間確保物體完全退場 (大於視窗邊界)
                    if (state.x1 - PHYS.blockW/2 > logicalWidth + 150) {
                        state.running = false;
                        updatePlayButtons();
                    }
                }
            }

            draw();
            requestAnimationFrame(loop);
        }

        initialSetup();
        requestAnimationFrame(loop);
        
        window.addEventListener('resize', draw);

    </script>
</body>
</html>
