<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一維彈性碰撞過程分析</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        .canvas-container {
            /* 桌機版維持較長寬比，去除天空後改為 5:1 */
            aspect-ratio: 5 / 1;
            width: 100%;
            background-color: #f8fafc;
        }
        
        @media (max-width: 768px) {
            /* 手機版直立設定，配合內部 w-[180%] 放大畫布 */
            .canvas-container { aspect-ratio: 5 / 1; }
        }

        /* ----- 手機橫向螢幕的特製版面 ----- */
        @media (max-width: 932px) and (orientation: landscape) {
            body { padding: 0.25rem !important; }
            .main-spacing > * + * { margin-top: 0.35rem !important; } /* 大幅縮減區塊間距 */
            
            .header-box { display: none !important; } /* 隱藏大標題以騰出空間 */
            
            .chart-box { padding: 0.5rem !important; }
            .chart-title { font-size: 1.1rem !important; margin-bottom: 0.25rem !important; padding: 0 0.5rem !important; }
            .chart-wrapper { height: 45vh !important; min-height: 120px; } /* 壓縮圖表高度 */
            
            .sim-box { padding: 0.5rem !important; }
            .controls-row { margin-bottom: 0.25rem !important; }
            .btn-mobile { padding: 0.15rem 0.5rem !important; font-size: 0.75rem !important; width: auto !important; min-width: 4rem; }
            
            /* 橫向模式夠寬，取消放大與滾動，讓畫面自適應全寬 */
            .sim-scroll-wrapper { overflow-x: hidden !important; }
            .sim-canvas-inner { width: 100% !important; margin-top: 0 !important; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans p-2 md:p-8">

    <div class="max-w-6xl mx-auto space-y-4 md:space-y-6 main-spacing">
        
        <!-- 標題與說明 -->
        <div class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-gray-200 header-box">
            <h1 class="text-xl md:text-3xl font-bold text-gray-900 mb-2">一維彈性碰撞過程模擬</h1>
            <p class="text-gray-600 text-xs md:text-base leading-relaxed hidden md:block">
                本動畫以<b>靜止觀察者視角</b>演示。模擬總時間固定為 10 秒：碰撞前接近需 3 秒，彈簧壓縮接觸時間剛好為 4 秒，碰撞後分離演示 3 秒。質量與初始速度為固定參數以利於觀察彈簧壓縮期間的速度與距離變化。
            </p>
        </div>

        <!-- 兩欄式佈局：控制面板與圖表 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6">
            
            <!-- 控制面板 -->
            <div class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-gray-200 lg:col-span-1 flex flex-col hidden md:flex h-full">
                <div>
                    <h2 class="text-xl font-bold text-gray-800 mb-6">系統參數</h2>

                    <!-- 參數顯示 (固定值) -->
                    <div class="grid grid-cols-2 gap-4 text-center">
                        <div class="bg-green-50 p-4 rounded-lg border border-green-100 shadow-sm">
                            <div class="text-sm text-green-700 font-bold mb-1">甲物體 (m₁)</div>
                            <div class="text-2xl font-mono font-bold text-green-600">2.0 <span class="text-sm">kg</span></div>
                            <div class="text-sm text-green-700 mt-2">初速: 60 m/s</div>
                        </div>
                        <div class="bg-orange-50 p-4 rounded-lg border border-orange-100 shadow-sm">
                            <div class="text-sm text-orange-700 font-bold mb-1">乙物體 (m₂)</div>
                            <div class="text-2xl font-mono font-bold text-orange-500">1.0 <span class="text-sm">kg</span></div>
                            <div class="text-sm text-orange-700 mt-2">初速: 20 m/s</div>
                        </div>
                    </div>
                </div>

                <!-- 桌面版按鍵 (移至底部) -->
                <div class="mt-auto pt-6 flex space-x-3 w-full">
                    <button id="btnPlayPause" class="bg-green-600 hover:bg-green-700 text-white px-4 py-3 rounded-lg shadow-md transition-colors text-lg font-bold flex-1">
                        開始播放
                    </button>
                    <button id="btnReset" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-3 rounded-lg shadow-md transition-colors text-lg font-bold flex-1">
                        重置
                    </button>
                </div>
            </div>

            <!-- v-t 圖表區 -->
            <div class="bg-white p-2 md:p-6 rounded-xl shadow-sm border border-gray-200 lg:col-span-2 chart-box">
                <h2 class="text-lg md:text-xl font-bold text-gray-800 mb-2 md:mb-4 px-2 pt-2 md:p-0 chart-title">v-t 圖 (速度-時間)</h2>
                <!-- 手機版直立高度 h-56，橫向由 CSS 壓縮，桌機版維持 h-80 -->
                <div class="w-full h-56 md:h-80 relative chart-wrapper">
                    <canvas id="vtChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 動畫展示區 -->
        <div class="bg-white p-3 md:p-6 rounded-xl shadow-sm border border-gray-200 relative flex flex-col sim-box">
            
            <!-- 手機版專屬控制列 (獨立一排，不重疊) -->
            <div class="flex md:hidden items-center justify-start space-x-2 mb-2 w-full controls-row">
                <div id="phaseIndicatorBadgeMobile" class="bg-sky-500 text-white px-3 py-1.5 rounded shadow-sm text-sm font-bold text-center btn-mobile">
                    碰撞前
                </div>
                <button id="btnPlayPauseMobile" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded shadow-sm transition-colors text-sm font-bold text-center w-20 btn-mobile">
                    開始播放
                </button>
                <button id="btnResetMobile" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-1.5 rounded shadow-sm transition-colors text-sm font-bold text-center btn-mobile">
                    重置
                </button>
            </div>

            <!-- 桌機版狀態指示器 -->
            <div class="hidden md:flex absolute top-8 left-8 z-20 text-white px-4 py-2 rounded shadow-md text-base font-bold items-center transition-colors duration-300 pointer-events-none" id="phaseIndicatorBadge">
                <span id="phaseIndicator" class="tracking-widest">碰撞前</span>
            </div>

            <!-- 橫向滑動區塊 (手機版直立時放大倍率 w-[180%]，橫向時自適應 100%) -->
            <div class="w-full overflow-x-auto overflow-y-hidden rounded md:mt-0 sim-scroll-wrapper" style="-webkit-overflow-scrolling: touch;">
                <div class="canvas-container relative w-[180%] md:w-full max-w-none origin-top-left rounded-lg overflow-hidden sim-canvas-inner" id="canvasWrapper">
                    <canvas id="simCanvas" class="absolute top-0 left-0 w-full h-full"></canvas>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ---------------------------------------------------------
        // 物理常數與狀態
        // ---------------------------------------------------------
        const PI = Math.PI;
        
        const PHYS = {
            k: (PI * PI) / 24, 
            L0: 120, 
            blockW: 80,
            blockH: 60
        };

        let state = {
            m1: 2.0,
            m2: 1.0,
            x1: 0,
            v1: 60,
            x2: 0,
            v2: 20,
            time: 0,
            running: false, 
            phase: 'before' 
        };

        const initialSetup = () => {
            // 判斷是否為手機版 (小於 768px 對應 Tailwind md 斷點)
            const isMobile = window.innerWidth < 768;
            
            if (isMobile) {
                // 手機版：將初始位置往左移，並縮短相對距離，讓碰撞能提早發生，確保全程接觸維持在視窗內
                state.x1 = 40;   // 恰好貼齊畫面左邊緣 (40 - blockW/2 = 0)
                state.x2 = 320;  // 距離縮短，第 2 秒發生碰撞
            } else {
                // 桌機版：維持原本設定，不更動
                state.x1 = 100; 
                state.x2 = 420;  // 維持第 3 秒發生碰撞
            }
            
            state.v1 = 60;
            state.v2 = 20;
            state.time = 0;
            state.phase = 'before';
            
            // 重置圖表資料
            chartData.datasets[0].data = [];
            chartData.datasets[1].data = [];
            chartData.datasets[2].data = [];
            if(vtChart) vtChart.update();
            updateDescriptions();
            updateTimeDisplay();

            state.running = false;
            updatePlayButtons();
            lastTime = performance.now();
        };

        // ---------------------------------------------------------
        // DOM 元素與事件綁定
        // ---------------------------------------------------------
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvasWrapper');
        
        const logicalWidth = 1100;
        // 將邏輯高度從 350 大幅縮減至 220，去除物體上方的無效灰色天空
        const logicalHeight = 220; 

        const ui = {
            btnPlay: document.getElementById('btnPlayPause'),
            btnReset: document.getElementById('btnReset'),
            btnPlayMobile: document.getElementById('btnPlayPauseMobile'),
            btnResetMobile: document.getElementById('btnResetMobile'),
            phaseInd: document.getElementById('phaseIndicator'),
            badge: document.getElementById('phaseIndicatorBadge'),
            badgeMobile: document.getElementById('phaseIndicatorBadgeMobile')
        };

        function updatePlayButtons() {
            let isEnd = state.x1 - PHYS.blockW/2 > logicalWidth + 150;
            let text = "";
            let baseClassDesk = "";
            let baseClassMob = "";

            if (isEnd) {
                text = "重新播放";
                baseClassDesk = "bg-green-600 hover:bg-green-700 text-white transition-colors";
                baseClassMob = "bg-green-600 hover:bg-green-700 text-white transition-colors";
            } else if (state.running) {
                text = "暫停";
                baseClassDesk = "bg-blue-600 hover:bg-blue-700 text-white transition-colors";
                baseClassMob = "bg-blue-600 hover:bg-blue-700 text-white transition-colors";
            } else {
                text = state.time === 0 ? "開始播放" : "繼續播放";
                baseClassDesk = "bg-green-600 hover:bg-green-700 text-white transition-colors";
                baseClassMob = "bg-green-600 hover:bg-green-700 text-white transition-colors";
            }

            // 更新桌面版按鈕
            if(ui.btnPlay) {
                ui.btnPlay.innerText = text;
                ui.btnPlay.className = `${baseClassDesk} px-4 py-3 rounded-lg shadow-md text-lg font-bold flex-1`;
            }

            // 更新手機版按鈕 (配合 CSS 橫向自動縮小)
            ui.btnPlayMobile.innerText = text;
            ui.btnPlayMobile.className = `${baseClassMob} px-3 py-1.5 rounded shadow-sm text-sm font-bold text-center w-20 btn-mobile`;
        }

        const handlePlayClick = () => {
            // 當兩物體完全移出畫面外時，點擊播放會自動重置並直接開始播放
            if (state.x1 - PHYS.blockW/2 > logicalWidth + 150) {
                initialSetup();
                state.running = true;
                updatePlayButtons();
                lastTime = performance.now();
            } else {
                state.running = !state.running;
                updatePlayButtons();
                if(state.running) lastTime = performance.now();
            }
        };

        const handleResetClick = () => {
            initialSetup();
            if(!state.running) draw();
        };

        // 綁定兩組按鈕事件
        if(ui.btnPlay) ui.btnPlay.addEventListener('click', handlePlayClick);
        ui.btnPlayMobile.addEventListener('click', handlePlayClick);
        if(ui.btnReset) ui.btnReset.addEventListener('click', handleResetClick);
        ui.btnResetMobile.addEventListener('click', handleResetClick);

        // ---------------------------------------------------------
        // Chart.js 設定
        // ---------------------------------------------------------
        const chartCtx = document.getElementById('vtChart').getContext('2d');
        const chartData = {
            datasets: [
                {
                    label: '甲物體 (v₁)',
                    borderColor: '#16a34a', 
                    backgroundColor: 'transparent',
                    data: [],
                    borderWidth: 2.5,
                    pointRadius: 0,
                    tension: 0.2
                },
                {
                    label: '乙物體 (v₂)',
                    borderColor: '#f97316', 
                    backgroundColor: 'transparent',
                    data: [],
                    borderWidth: 2.5,
                    pointRadius: 0,
                    tension: 0.2
                },
                {
                    label: '質心速度 (v_C)',
                    borderColor: '#FF0000',
                    backgroundColor: 'transparent',
                    data: [],
                    borderWidth: 2,
                    borderDash: [6, 6],
                    pointRadius: 0,
                    tension: 0
                }
            ]
        };

        const vtChart = new Chart(chartCtx, {
            type: 'line',
            data: chartData,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                layout: {
                    // 減少圖表周圍不必要的留白
                    padding: { left: 0, right: 0, top: 0, bottom: 0 }
                },
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                scales: {
                    x: {
                        type: 'linear', 
                        title: { 
                            display: true, 
                            text: '時間 (s)', 
                            // 去除 top padding，將字體往上拉近軸線
                            padding: { top: 2, bottom: 0 } 
                        },
                        min: 0,
                        max: 10,
                        ticks: { 
                            stepSize: 1, 
                            maxTicksLimit: 11
                        }
                    },
                    y: {
                        title: { display: true, text: '速度 (m/s)' },
                        min: 0,
                        max: 80 
                    }
                },
                plugins: {
                    legend: { 
                        position: 'top',
                        labels: {
                            usePointStyle: true,
                            boxWidth: 20,
                            generateLabels: function(chart) {
                                const originalLabels = Chart.defaults.plugins.legend.labels.generateLabels(chart);
                                originalLabels.forEach(label => {
                                    label.pointStyle = 'line';
                                    if (label.text.includes('質心速度')) {
                                        label.fontColor = '#FF0000';
                                    }
                                });
                                return originalLabels;
                            }
                        }
                    }
                }
            }
        });

        // ---------------------------------------------------------
        // 核心物理引擎 (精確步長)
        // ---------------------------------------------------------
        function updatePhysics(dt) {
            const subSteps = 100; 
            const subDt = dt / subSteps;

            for (let i = 0; i < subSteps; i++) {
                let p1 = state.x1 + PHYS.blockW / 2;
                let p2 = state.x2 - PHYS.blockW / 2;
                let distance = p2 - p1;
                
                let force = 0;
                
                if (distance < PHYS.L0) {
                    let compression = PHYS.L0 - distance;
                    force = PHYS.k * compression; 
                    
                    if (state.phase === 'before') {
                        state.phase = 'during';
                        updateDescriptions();
                    }
                } else {
                    if (state.phase === 'during') {
                        state.phase = 'after';
                        updateDescriptions();
                    }
                }

                state.v1 += (-force / state.m1) * subDt;
                state.v2 += (force / state.m2) * subDt;
                state.x1 += state.v1 * subDt;
                state.x2 += state.v2 * subDt;
                
                state.time += subDt;
            }
        }

        // ---------------------------------------------------------
        // 動畫繪製邏輯
        // ---------------------------------------------------------
        function drawSpring(ctx, startX, endX, y) {
            ctx.beginPath();
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2.5;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            
            let width = endX - startX;
            let numCoils = 12; 
            let amplitude = 12; 
            let flatEnd = 20; 
            
            if (width < 2) return;
            
            ctx.moveTo(startX, y);
            ctx.lineTo(startX + flatEnd, y);
            
            let springWidth = Math.max(0, width - flatEnd * 2);
            let segments = 200; 
            
            for (let i = 0; i <= segments; i++) {
                let t = i / segments;
                let cx = startX + flatEnd + t * springWidth;
                let cy = y - amplitude * Math.sin(t * numCoils * Math.PI * 2);
                ctx.lineTo(cx, cy);
            }
            
            ctx.lineTo(endX, y);
            ctx.stroke();
        }

        function drawArrow(ctx, fromx, fromy, tox, toy, color) {
            var headlen = 12; 
            var dx = tox - fromx;
            var dy = toy - fromy;
            var angle = Math.atan2(dy, dx);
            
            if (Math.abs(dx) < 2) return;

            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 4;
            ctx.moveTo(fromx, fromy);
            ctx.lineTo(tox, toy);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
            ctx.lineTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
            ctx.fill();
        }

        function drawBlock(ctx, x, y, label) {
            ctx.fillStyle = '#d4a373';
            ctx.fillRect(x - PHYS.blockW/2, y - PHYS.blockH/2, PHYS.blockW, PHYS.blockH);
            
            ctx.strokeStyle = '#b5835a';
            ctx.lineWidth = 3;
            ctx.strokeRect(x - PHYS.blockW/2, y - PHYS.blockH/2, PHYS.blockW, PHYS.blockH);

            ctx.fillStyle = '#333';
            ctx.font = 'bold 26px "Noto Serif TC", serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, x, y);
        }

        function draw() {
            const displayWidth = wrapper.clientWidth;
            const displayHeight = wrapper.clientHeight;
            
            if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
                canvas.width = displayWidth;
                canvas.height = displayHeight;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            
            const scaleX = canvas.width / logicalWidth;
            const scaleY = canvas.height / logicalHeight;
            const scale = Math.min(scaleX, scaleY); 
            
            const offsetX = (canvas.width - logicalWidth * scale) / 2;
            const offsetY = (canvas.height - logicalHeight * scale) / 2;
            
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            // 調整地板位置對應新的 logicalHeight (220)
            const groundY = logicalHeight / 2 + PHYS.blockH/2 + 2;

            ctx.fillStyle = '#cbd5e1'; 
            ctx.fillRect(-500, groundY, logicalWidth + 1000, 15);
            
            ctx.fillStyle = '#64748b';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            for (let i = 0; i <= logicalWidth + 300; i += 100) {
                ctx.beginPath();
                ctx.moveTo(i, groundY);
                ctx.lineTo(i, groundY + 15);
                ctx.strokeStyle = '#f8fafc';
                ctx.lineWidth = 2;
                ctx.stroke();
                // 移除水平位置參數 (ctx.fillText)
            }

            let rightOfM1 = state.x1 + PHYS.blockW/2;
            let leftOfM2 = state.x2 - PHYS.blockW/2;
            let actualSpringEndX = leftOfM2;
            let actualSpringStartX = (rightOfM1 > leftOfM2 - PHYS.L0) ? rightOfM1 : leftOfM2 - PHYS.L0;
            
            drawSpring(ctx, actualSpringStartX, actualSpringEndX, logicalHeight / 2);

            drawBlock(ctx, state.x1, logicalHeight / 2, '甲');
            drawBlock(ctx, state.x2, logicalHeight / 2, '乙');

            const arrowY = logicalHeight / 2 - PHYS.blockH/2 - 25;
            const vScale = 1.0; 
            
            drawArrow(ctx, state.x1, arrowY, state.x1 + state.v1 * vScale, arrowY, '#16a34a');
            ctx.fillStyle = '#16a34a';
            ctx.font = 'italic bold 22px "Times New Roman", serif';
            ctx.textAlign = 'center';
            ctx.fillText(state.phase === 'after' ? "v₁'" : "v₁", state.x1 + (state.v1 * vScale)/2, arrowY - 15);

            drawArrow(ctx, state.x2, arrowY, state.x2 + state.v2 * vScale, arrowY, '#f97316');
            ctx.fillStyle = '#f97316';
            ctx.fillText(state.phase === 'after' ? "v₂'" : "v₂", state.x2 + (state.v2 * vScale)/2, arrowY - 15);
            
            ctx.restore();
        }

        // ---------------------------------------------------------
        // 狀態文字更新
        // ---------------------------------------------------------
        function updateDescriptions() {
            let badge = ui.badge;
            let badgeMob = ui.badgeMobile;
            
            switch(state.phase) {
                case 'before':
                    if(badge) {
                        badge.innerHTML = '<span class="tracking-widest">碰撞前</span>';
                        badge.className = 'hidden md:flex absolute top-8 left-8 z-20 bg-sky-500 text-white px-4 py-2 rounded shadow-md text-base font-bold items-center transition-colors duration-300 pointer-events-none';
                    }
                    badgeMob.innerText = '碰撞前';
                    badgeMob.className = 'bg-sky-500 text-white px-3 py-1.5 rounded shadow-sm text-sm font-bold text-center transition-colors duration-300 btn-mobile';
                    break;
                case 'during':
                    if(badge) {
                        badge.innerHTML = '<span class="tracking-widest">碰撞中</span>';
                        badge.className = 'hidden md:flex absolute top-8 left-8 z-20 bg-amber-500 text-white px-4 py-2 rounded shadow-md text-base font-bold items-center transition-colors duration-300 pointer-events-none';
                    }
                    badgeMob.innerText = '碰撞中';
                    badgeMob.className = 'bg-amber-500 text-white px-3 py-1.5 rounded shadow-sm text-sm font-bold text-center transition-colors duration-300 btn-mobile';
                    break;
                case 'after':
                    if(badge) {
                        badge.innerHTML = '<span class="tracking-widest">碰撞後</span>';
                        badge.className = 'hidden md:flex absolute top-8 left-8 z-20 bg-indigo-500 text-white px-4 py-2 rounded shadow-md text-base font-bold items-center transition-colors duration-300 pointer-events-none';
                    }
                    badgeMob.innerText = '碰撞後';
                    badgeMob.className = 'bg-indigo-500 text-white px-3 py-1.5 rounded shadow-sm text-sm font-bold text-center transition-colors duration-300 btn-mobile';
                    break;
            }
        }

        // ---------------------------------------------------------
        // 主迴圈
        // ---------------------------------------------------------
        let lastTime = performance.now();
        let chartUpdateTimer = 0;

        function loop(currentTime) {
            let dt = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            if (dt > 0.1) dt = 0.1;

            if (state.running) {
                let simDt = dt; 
                
                if (simDt > 0) {
                    updatePhysics(simDt);
                    updateTimeDisplay();

                    chartUpdateTimer += simDt;
                    // 【限制】確保圖表點位最多只畫到 10 秒
                    if (chartUpdateTimer >= 0.05 && state.time <= 10.05) {
                        chartUpdateTimer = 0;
                        
                        let vc = (state.m1 * state.v1 + state.m2 * state.v2) / (state.m1 + state.m2);
                        
                        chartData.datasets[0].data.push({ x: state.time, y: state.v1 });
                        chartData.datasets[1].data.push({ x: state.time, y: state.v2 });
                        chartData.datasets[2].data.push({ x: state.time, y: vc });
                        
                        vtChart.update();
                        
                        if(state.phase === 'during') updateDescriptions();
                    }
                    
                    if (state.x1 - PHYS.blockW/2 > logicalWidth + 150) {
                        state.running = false;
                        updatePlayButtons();
                    }
                }
            }

            draw();
            requestAnimationFrame(loop);
        }

        initialSetup();
        requestAnimationFrame(loop);
        
        // 當視窗大小或方向改變時，重新初始化以應用新的設定與排版
        window.addEventListener('resize', () => {
            let wasRunning = state.running;
            initialSetup();
            if (wasRunning) {
                state.running = true;
                updatePlayButtons();
            }
            draw();
        });

    </script>
</body>
</html>
